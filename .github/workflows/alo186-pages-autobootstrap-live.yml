name: ALO186 çift modlu tam canlı yayın ve doğrulama

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo186-pages-autobootstrap-live.yml'
      - 'alo186/deployment/live-release-trigger.json'
      - 'alo186/deployment/verify_contextual_affiliate_live_v177.py'
      - 'alo186/tests/test_contextual_affiliate_live_v177.py'
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: alo186-pages-production
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      pages_ready: ${{ steps.pages_probe.outputs.pages_ready }}
      blocker: ${{ steps.pages_probe.outputs.blocker }}
      admin_token_present: ${{ steps.pages_probe.outputs.admin_token_present }}
      live_current: ${{ steps.live_probe.outputs.live_current }}
      sites_current: ${{ steps.sites_probe.outputs.sites_current }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tanı klasörünü hazırla
        run: mkdir -p /tmp/alo186-live-probe

      - name: Pages durumunu ve yönetici yetkisini fail-safe belirle
        id: pages_probe
        uses: actions/github-script@v7
        env:
          ADMIN_TOKEN_PRESENT: ${{ secrets.ALO186_PAGES_ADMIN_TOKEN != '' }}
        with:
          github-token: ${{ secrets.ALO186_PAGES_ADMIN_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const adminTokenPresent = process.env.ADMIN_TOKEN_PRESENT === 'true';
            let ready = false;
            let created = false;
            let blocker = '';
            let apiStatus = null;

            try {
              const response = await github.request('GET /repos/{owner}/{repo}/pages', {owner, repo});
              apiStatus = response.status;
              ready = response.status === 200;
            } catch (error) {
              apiStatus = error.status || null;
              if (error.status === 404) {
                if (!adminTokenPresent) {
                  blocker = 'ALO186_PAGES_ADMIN_TOKEN eksik; Pages oluşturmak için Pages write ve Administration write yetkileri birlikte gerekir.';
                } else {
                  try {
                    const createdResponse = await github.request('POST /repos/{owner}/{repo}/pages', {
                      owner,
                      repo,
                      build_type: 'workflow',
                    });
                    ready = createdResponse.status === 201;
                    created = ready;
                    apiStatus = createdResponse.status;
                  } catch (createError) {
                    apiStatus = createError.status || null;
                    blocker = `Pages oluşturulamadı: ${createError.message}`;
                  }
                }
              } else if (error.status === 403) {
                blocker = 'Pages API erişimi reddedildi; yönetici yetkili ALO186_PAGES_ADMIN_TOKEN gerekir.';
              } else {
                blocker = `Pages durumu okunamadı: ${error.message}`;
              }
            }

            if (ready && adminTokenPresent) {
              try {
                await github.request('PUT /repos/{owner}/{repo}/pages', {
                  owner,
                  repo,
                  build_type: 'workflow',
                  cname: 'alo186.com',
                });
              } catch (updateError) {
                apiStatus = updateError.status || apiStatus;
                blocker = `Pages bulundu fakat özel alan adı ayarlanamadı: ${updateError.message}`;
                ready = false;
              }
            }

            const receipt = {
              pagesReady: ready,
              pagesCreated: created,
              adminTokenPresent,
              apiStatus,
              blocker: blocker || null,
            };
            fs.writeFileSync('/tmp/alo186-live-probe/pages-probe.json', JSON.stringify(receipt, null, 2) + '\n');
            core.setOutput('pages_ready', String(ready));
            core.setOutput('admin_token_present', String(adminTokenPresent));
            core.setOutput('blocker', blocker);
            core.info(JSON.stringify(receipt));

      - name: GitHub Pages canlı commitini kontrol et
        id: live_probe
        if: steps.pages_probe.outputs.pages_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://alo186.com/pages-release.json?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true)
          live_commit=$(python -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); print(d.get("commit", ""))' <<<"$release" 2>/dev/null || true)
          if [ "$live_commit" = "$GITHUB_SHA" ]; then
            echo 'live_current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'live_current=false' >> "$GITHUB_OUTPUT"
          fi
          printf '{"liveCommit":"%s","targetCommit":"%s"}\n' "$live_commit" "$GITHUB_SHA" > /tmp/alo186-live-probe/pages-live-commit.json

      - name: Pages yoksa mevcut ChatGPT Sites canlılığını doğrula
        id: sites_probe
        if: steps.pages_probe.outputs.pages_ready != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python alo186/deployment/verify_live_origin.py \
            --origin https://alo186.com \
            --alias-origin https://www.alo186.com \
            --expected-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --github-token "$GITHUB_TOKEN" \
            --receipt /tmp/alo186-live-probe/live-origin.json \
            --diagnostics /tmp/alo186-live-probe/origin-diagnostics \
            --attempts 2 \
            --sleep-seconds 2
          origin_status=$?
          python alo186/deployment/verify_contextual_affiliate_live_v177.py \
            --origin https://alo186.com \
            --receipt /tmp/alo186-live-probe/live-v177.json \
            --diagnostics /tmp/alo186-live-probe/v177-diagnostics \
            --attempts 2 \
            --sleep-seconds 2
          v177_status=$?
          if [ "$origin_status" -eq 0 ] && [ "$v177_status" -eq 0 ]; then
            echo 'sites_current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'sites_current=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Probe makbuzlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-probe
          path: /tmp/alo186-live-probe
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Hazırlık özeti
        if: always()
        shell: bash
        env:
          READY: ${{ steps.pages_probe.outputs.pages_ready }}
          BLOCKER: ${{ steps.pages_probe.outputs.blocker }}
          ADMIN: ${{ steps.pages_probe.outputs.admin_token_present }}
          LIVE_CURRENT: ${{ steps.live_probe.outputs.live_current }}
          SITES_CURRENT: ${{ steps.sites_probe.outputs.sites_current }}
        run: |
          {
            echo '## ALO186 canlı yayın hazırlığı'
            echo
            echo "- GitHub Pages hazır: **${READY:-false}**"
            echo "- Yönetici tokenı mevcut: **${ADMIN:-false}**"
            echo "- Pages canlı commit güncel: **${LIVE_CURRENT:-false}**"
            echo "- ChatGPT Sites v177 canlı sözleşmesi: **${SITES_CURRENT:-false}**"
            if [ -n "${BLOCKER:-}" ]; then echo "- Pages blokajı: ${BLOCKER}"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  waiting_for_pages:
    needs: probe
    if: needs.probe.outputs.pages_ready != 'true' && needs.probe.outputs.sites_current != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alo186-live-probe
          path: /tmp/alo186-live-probe
      - name: Kesin blokajı P0 kaydında görünür kıl
        uses: actions/github-script@v7
        env:
          BLOCKER: ${{ needs.probe.outputs.blocker }}
          ADMIN_TOKEN_PRESENT: ${{ needs.probe.outputs.admin_token_present }}
        with:
          script: |
            const fs = require('fs');
            const read = (path) => { try { return JSON.parse(fs.readFileSync(path, 'utf8')); } catch (_) { return {}; } };
            const live = read('/tmp/alo186-live-probe/live-v177.json');
            const lastError = Array.isArray(live.errors) && live.errors.length ? live.errors[live.errors.length - 1].error : 'Canlı v177 rota doğrulanamadı.';
            const marker = '<!-- alo186-v177-live-blocker -->';
            const body = `${marker}
            ## ALO186 canlı yayın blokajı

            - Kaynak commit: \`${context.sha}\`
            - Yönetici tokenı mevcut: **${process.env.ADMIN_TOKEN_PRESENT}**
            - Pages blokajı: **${process.env.BLOCKER || 'GitHub Pages etkin değil.'}**
            - ChatGPT Sites son doğrulama: **${lastError}**
            - Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            Kaynak, custom/project artifact, v177 yerleşimleri ve ticari güvenlik kapıları hazırdır. Pages etkinleştirilirse periyodik workflow otomatik tam deploy yapacaktır; mevcut Sites yüzeyi v177 sözleşmesini sunmaya başladığında ayrıca canlı makbuz oluşturulur.`;
            async function upsert(issueNumber) {
              const {data: comments} = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100});
              const existing = comments.find(item => item.body && item.body.includes(marker));
              if (existing) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
              else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body});
            }
            await upsert(606);
            await upsert(21);
      - run: echo 'Workflow her 30 dakikada Pages ve ChatGPT Sites durumunu yeniden doğrulayacak.'

  already_live_on_sites:
    needs: probe
    if: needs.probe.outputs.pages_ready != 'true' && needs.probe.outputs.sites_current == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alo186-live-probe
          path: /tmp/alo186-live-probe
      - name: ChatGPT Sites canlı makbuzunu yayımla
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const origin = JSON.parse(fs.readFileSync('/tmp/alo186-live-probe/live-origin.json', 'utf8'));
            const live = JSON.parse(fs.readFileSync('/tmp/alo186-live-probe/live-v177.json', 'utf8'));
            const marker = '<!-- alo186-v177-live-receipt -->';
            const body = `${marker}
            ## ALO186 doğrulanmış canlı v177 makbuzu

            - Kaynak commit: \`${context.sha}\`
            - Canlı hosting modu: **${origin.mode}**
            - Platform imzası: \`${origin.platformSignature || 'github-pages'}\`
            - Canlı rota: \`${live.origin}${live.route}\`
            - Doğrulama denemesi: **${live.verifiedAttempt}**
            - Sayfa SHA-256: \`${live.pageSha256}\`
            - Ürün yerleşimi: **${live.placementCount}**
            - Ticari kapı: **${live.gateCount}**
            - Kapısız mağaza bağlantısı: **${live.staticStoreLinkCount}**
            - Affiliate etiketi: \`${live.affiliateTag}\`
            - Kişisel veri alanı: **yok**

            Canlı production origin ve v177 JavaScript güven sözleşmesi önbellek atlatan HTTP istekleriyle doğrulandı.`;
            async function upsert(issueNumber) {
              const {data: comments} = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100});
              const existing = comments.find(item => item.body && item.body.includes(marker));
              if (existing) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
              else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body});
            }
            await upsert(606);
            await upsert(21);


  dispatch_pages:
    needs: probe
    if: needs.probe.outputs.pages_ready == 'true' && needs.probe.outputs.live_current != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Tek GitHub Pages yayıncısını tetikle
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'alo186-github-pages.yml',
              ref: 'main',
            });
            core.info(`ALO186 ana Pages workflow dispatch status=${response.status}`);
      - run: echo 'Pages hazır ve canlı commit güncel değil; tek yayıncı workflow kuyruğa alındı.'

  already_current:
    needs: probe
    if: needs.probe.outputs.pages_ready == 'true' && needs.probe.outputs.live_current == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Güncel Pages yüzeyinde v177 sözleşmesini doğrula
        run: |
          set -euo pipefail
          python alo186/deployment/verify_contextual_affiliate_live_v177.py \
            --origin https://alo186.com \
            --receipt /tmp/alo186-v177-live-receipt.json \
            --diagnostics /tmp/alo186-v177-diagnostics \
            --attempts 3 \
            --sleep-seconds 5
      - run: echo 'Canlı Pages sitesi güncel commit ve v177 ürün sözleşmesini taşıyor.'
