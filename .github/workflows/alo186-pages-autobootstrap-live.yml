name: ALO186 Pages otomatik etkinleştirme ve tam canlı yayın

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo186-pages-autobootstrap-live.yml'
      - 'alo186/deployment/live-release-trigger.json'
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alo186-pages-autobootstrap-live
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      pages_ready: ${{ steps.pages_probe.outputs.pages_ready }}
      blocker: ${{ steps.pages_probe.outputs.blocker }}
      live_current: ${{ steps.live_probe.outputs.live_current }}
    steps:
      - name: Pages sitesini denetle ve yetki varsa otomatik etkinleştir
        id: pages_probe
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ALO186_PAGES_ADMIN_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let ready = false;
            let created = false;
            let blocker = '';
            try {
              await github.request('GET /repos/{owner}/{repo}/pages', { owner, repo });
              ready = true;
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.request('POST /repos/{owner}/{repo}/pages', {
                  owner,
                  repo,
                  build_type: 'workflow',
                });
                ready = true;
                created = true;
              } catch (createError) {
                if (createError.status === 403) {
                  blocker = 'GitHub Pages repository düzeyinde etkin değil; Pages write + Administration write yetkili token veya Settings > Pages > Source: GitHub Actions gerekiyor.';
                } else {
                  throw createError;
                }
              }
            }
            if (ready) {
              try {
                await github.request('PUT /repos/{owner}/{repo}/pages', {
                  owner,
                  repo,
                  build_type: 'workflow',
                  cname: 'alo186.com',
                });
              } catch (updateError) {
                if (updateError.status === 403) {
                  blocker = 'Pages sitesi okunabiliyor ancak workflow/custom-domain ayarını değiştirmek için Administration write yetkisi gerekiyor.';
                  ready = false;
                } else {
                  throw updateError;
                }
              }
            }
            core.setOutput('pages_ready', String(ready));
            core.setOutput('created', String(created));
            core.setOutput('blocker', blocker);
            core.info(`pages_ready=${ready}; created=${created}; blocker=${blocker || 'yok'}`);

      - name: Canlıdaki commit güncel mi?
        id: live_probe
        if: steps.pages_probe.outputs.pages_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://alo186.com/pages-release.json?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true)
          live_commit=$(python -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); print(d.get("commit", ""))' <<<"$release" 2>/dev/null || true)
          if [ "$live_commit" = "$GITHUB_SHA" ]; then
            echo 'live_current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'live_current=false' >> "$GITHUB_OUTPUT"
          fi
          echo "live_commit=$live_commit; target=$GITHUB_SHA"

      - name: Hazırlık özeti
        shell: bash
        env:
          READY: ${{ steps.pages_probe.outputs.pages_ready }}
          BLOCKER: ${{ steps.pages_probe.outputs.blocker }}
          LIVE_CURRENT: ${{ steps.live_probe.outputs.live_current }}
        run: |
          {
            echo '## ALO186 canlı yayın hazırlığı'
            echo
            echo "- GitHub Pages hazır: **${READY:-false}**"
            echo "- Canlı commit güncel: **${LIVE_CURRENT:-false}**"
            if [ -n "${BLOCKER:-}" ]; then
              echo "- Blokaj: ${BLOCKER}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  waiting_for_pages:
    needs: probe
    if: needs.probe.outputs.pages_ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Hesap düzeyi Pages ayarını bekle
        shell: bash
        env:
          BLOCKER: ${{ needs.probe.outputs.blocker }}
        run: |
          echo "Canlı artifact hazır; repository Pages ayarı bekleniyor: ${BLOCKER:-GitHub Pages etkin değil.}"
          echo 'Workflow her 30 dakikada yeniden deneyecek; Pages etkinleştiğinde ek rerun gerektirmeden tam deploy başlayacak.'

  deploy:
    needs: probe
    if: needs.probe.outputs.pages_ready == 'true' && needs.probe.outputs.live_current != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: GitHub Pages ayarlarını doğrula
        id: pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.ALO186_PAGES_ADMIN_TOKEN || github.token }}
          enablement: false

      - name: Kaynak ve güvenlik kalite kapıları
        shell: bash
        run: |
          set -euo pipefail
          node alo186/tests/test_portal_hardening.js
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_authority_content.js
          python alo186/tests/device_damage_deadline_guard.py
          python alo186/tests/test_github_pages_bootstrap.py
          python alo186/tests/test_live_quality_hardening.py
          python alo186/tests/test_live_domain_integration_manifest.py
          python alo186/tests/test_ga4_consent_integration.py
          python alo186/tests/test_contextual_affiliate_growth_v177.py

      - name: Bütün ALO186 çalışmalarını tek artifactta oluştur
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GA4: ${{ vars.ALO186_GA4_MEASUREMENT_ID || 'G-639TVHL0LC' }}
        shell: bash
        run: |
          set -euo pipefail
          SITE=/tmp/alo186-full-live
          python alo186/deployment/build_static_site.py --output "$SITE" --commit "$GITHUB_SHA"
          python alo186/deployment/prepare_github_pages.py --site "$SITE" --base-path "$BASE_PATH" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site "$SITE" --base-path "$BASE_PATH"
          python alo186/deployment/inject_shortlist_growth.py --site "$SITE" --base-path "$BASE_PATH"
          python alo186/deployment/smoke_github_pages.py --site "$SITE" --base-path "$BASE_PATH"
          python alo186/deployment/inject_contextual_affiliate_growth_v177.py --site "$SITE" --base-path "$BASE_PATH" | tee /tmp/alo186-contextual-v177.json
          python alo186/deployment/guard_commerce_routes_v3.py --site "$SITE" | tee /tmp/alo186-commerce-guard.json
          python alo186/deployment/inject_live_quality_hardening_v2.py --site "$SITE" --base-path "$BASE_PATH" | tee /tmp/alo186-live-quality.json
          python alo186/deployment/inject_ga4_consent.py --site "$SITE" --base-path "$BASE_PATH" --measurement-id "$GA4" | tee /tmp/alo186-ga4.json
          test -f "$SITE/pages-release.json"
          test -f "$SITE/amazon-elektrik-urunleri/konuya-gore-urun-haritasi/index.html"
          grep -q 'data-alo186-contextual-affiliate-v177' "$SITE/amazon-elektrik-urunleri/konuya-gore-urun-haritasi/index.html"
          grep -q 'alo186rehber-21' "$SITE/amazon-elektrik-urunleri/konuya-gore-urun-haritasi/index.html"

      - name: Pages artifactını yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/alo186-full-live

      - name: Canlı siteye yayınla
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production commit ve kritik rotaları doğrula
        shell: bash
        run: |
          set -euo pipefail
          base='https://alo186.com'
          receipt=/tmp/alo186-live-receipt.json
          success=0
          for attempt in $(seq 1 36); do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            release=$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$base/pages-release.json?cb=$nonce" || true)
            live_commit=$(python -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); print(d.get("commit", ""))' <<<"$release" 2>/dev/null || true)
            home=$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$base/?cb=$nonce" || true)
            portal=$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$base/elektrik-portali?cb=$nonce" || true)
            edas=$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$base/edas-bul?cb=$nonce" || true)
            products=$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$base/amazon-elektrik-urunleri/konuya-gore-urun-haritasi/?cb=$nonce" || true)
            if [ "$live_commit" = "$GITHUB_SHA" ] \
              && grep -qi '<h1' <<<"$home" \
              && grep -qi '<h1' <<<"$portal" \
              && grep -qi '<h1' <<<"$edas" \
              && grep -q 'data-alo186-contextual-affiliate-v177' <<<"$products" \
              && grep -q 'alo186rehber-21' <<<"$products"; then
              success=1
              python - <<PY > "$receipt"
          import json
          print(json.dumps({
            "status": "verified",
            "sourceCommit": "$GITHUB_SHA",
            "pagesUrl": "${{ steps.deployment.outputs.page_url }}",
            "productionOrigin": "$base",
            "verifiedAttempt": $attempt,
            "criticalRoutes": [
              "/",
              "/elektrik-portali",
              "/edas-bul",
              "/amazon-elektrik-urunleri/konuya-gore-urun-haritasi/"
            ],
            "contextualAffiliateV177": True,
            "affiliateTag": "alo186rehber-21"
          }, ensure_ascii=False, indent=2))
          PY
              break
            fi
            sleep 10
          done
          test "$success" -eq 1
          cat "$receipt"

      - name: Canlı yayın makbuzunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-full-live-receipt
          path: |
            /tmp/alo186-live-receipt.json
            /tmp/alo186-contextual-v177.json
            /tmp/alo186-commerce-guard.json
            /tmp/alo186-live-quality.json
            /tmp/alo186-ga4.json
          if-no-files-found: warn
          retention-days: 45

  already_current:
    needs: probe
    if: needs.probe.outputs.pages_ready == 'true' && needs.probe.outputs.live_current == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Canlı site zaten güncel main commitini taşıyor; yeniden deploy gerekmedi.'
