name: ALO186 çift modlu tam canlı yayın ve doğrulama

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo186-pages-autobootstrap-live.yml'
      - 'alo186/deployment/live-release-trigger.json'
      - 'alo186/deployment/verify_contextual_affiliate_live_v177.py'
      - 'alo186/deployment/verify_live_origin.py'
      - 'alo186/tests/test_contextual_affiliate_live_v177.py'
      - 'alo186/tests/test_pages_single_publisher.py'
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  deployments: read
  actions: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: alo186-pages-production
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      pages_ready: ${{ steps.pages_probe.outputs.pages_ready }}
      blocker: ${{ steps.pages_probe.outputs.blocker }}
      admin_token_present: ${{ steps.pages_probe.outputs.admin_token_present }}
      pages_deployment_succeeded: ${{ steps.pages_probe.outputs.pages_deployment_succeeded }}
      origin_probe_ok: ${{ steps.origin_state.outputs.origin_probe_ok }}
      live_current: ${{ steps.origin_state.outputs.live_current }}
      sites_current: ${{ steps.sites_probe.outputs.sites_current }}
      hosting_mode: ${{ steps.origin_state.outputs.hosting_mode }}
      dns_cutover_required: ${{ steps.origin_state.outputs.dns_cutover_required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tanı klasörünü hazırla
        run: mkdir -p /tmp/alo186-live-probe

      - name: Pages, yönetici yetkisi ve ilk artifact durumunu belirle
        id: pages_probe
        uses: actions/github-script@v7
        env:
          ADMIN_TOKEN_PRESENT: ${{ secrets.ALO186_PAGES_ADMIN_TOKEN != '' }}
        with:
          github-token: ${{ secrets.ALO186_PAGES_ADMIN_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const adminTokenPresent = process.env.ADMIN_TOKEN_PRESENT === 'true';
            let ready = false;
            let created = false;
            let blocker = '';
            let apiStatus = null;
            let pagesDeploymentSucceeded = false;

            try {
              const response = await github.request('GET /repos/{owner}/{repo}/pages', {owner, repo});
              apiStatus = response.status;
              ready = response.status === 200;
            } catch (error) {
              apiStatus = error.status || null;
              if (error.status === 404) {
                if (!adminTokenPresent) {
                  blocker = 'ALO186_PAGES_ADMIN_TOKEN eksik; Pages oluşturmak için Pages write ve Administration write yetkileri birlikte gerekir.';
                } else {
                  try {
                    const createdResponse = await github.request('POST /repos/{owner}/{repo}/pages', {
                      owner,
                      repo,
                      build_type: 'workflow',
                    });
                    ready = createdResponse.status === 201;
                    created = ready;
                    apiStatus = createdResponse.status;
                  } catch (createError) {
                    apiStatus = createError.status || null;
                    blocker = `Pages oluşturulamadı: ${createError.message}`;
                  }
                }
              } else if (error.status === 403) {
                blocker = 'Pages API erişimi reddedildi; yönetici yetkili ALO186_PAGES_ADMIN_TOKEN gerekir.';
              } else {
                blocker = `Pages durumu okunamadı: ${error.message}`;
              }
            }

            if (ready && adminTokenPresent) {
              try {
                await github.request('PUT /repos/{owner}/{repo}/pages', {
                  owner,
                  repo,
                  build_type: 'workflow',
                  cname: 'alo186.com',
                });
              } catch (updateError) {
                apiStatus = updateError.status || apiStatus;
                blocker = `Pages bulundu fakat özel alan adı ayarlanamadı: ${updateError.message}`;
                ready = false;
              }
            }

            try {
              const {data: deployments} = await github.rest.repos.listDeployments({
                owner,
                repo,
                environment: 'github-pages',
                per_page: 20,
              });
              for (const deployment of deployments) {
                const {data: statuses} = await github.rest.repos.listDeploymentStatuses({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  per_page: 10,
                });
                if (statuses.some(status => status.state === 'success')) {
                  pagesDeploymentSucceeded = true;
                  break;
                }
              }
            } catch (deploymentError) {
              core.warning(`GitHub Pages deployment geçmişi okunamadı: ${deploymentError.message}`);
            }

            const receipt = {
              pagesReady: ready,
              pagesCreated: created,
              pagesDeploymentSucceeded,
              adminTokenPresent,
              apiStatus,
              blocker: blocker || null,
            };
            fs.writeFileSync('/tmp/alo186-live-probe/pages-probe.json', JSON.stringify(receipt, null, 2) + '\n');
            core.setOutput('pages_ready', String(ready));
            core.setOutput('pages_deployment_succeeded', String(pagesDeploymentSucceeded));
            core.setOutput('admin_token_present', String(adminTokenPresent));
            core.setOutput('blocker', blocker);
            core.info(JSON.stringify(receipt));

      - name: Gerçek canlı origin hosting yetkisini ve exact commit durumunu ölç
        id: origin_probe
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python alo186/deployment/verify_live_origin.py \
            --origin https://alo186.com \
            --alias-origin https://www.alo186.com \
            --expected-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --github-token "$GITHUB_TOKEN" \
            --receipt /tmp/alo186-live-probe/live-origin.json \
            --diagnostics /tmp/alo186-live-probe/origin-diagnostics \
            --attempts 2 \
            --sleep-seconds 2
          echo "origin_probe_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Hosting state machine çıktısını oluştur
        id: origin_state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path('/tmp/alo186-live-probe/live-origin.json')
          try:
              payload = json.loads(path.read_text(encoding='utf-8'))
          except (FileNotFoundError, json.JSONDecodeError):
              payload = {}
          mode = str(payload.get('mode') or 'unknown')
          contains_expected = bool(payload.get('containsExpectedCommit'))
          receipt_available = bool(payload.get('exactCommitReceiptAvailable'))
          origin_probe_ok = bool(payload.get('ok'))
          live_current = (
              mode == 'github-pages'
              and contains_expected
              and receipt_available
              and origin_probe_ok
          )
          dns_cutover_required = origin_probe_ok and mode != 'github-pages'
          print(f'hosting_mode={mode}')
          print(f'origin_probe_ok={str(origin_probe_ok).lower()}')
          print(f'live_current={str(live_current).lower()}')
          print(f'dns_cutover_required={str(dns_cutover_required).lower()}')
          PY

      - name: Doğrulanmış dış hosting yüzeyinde canlı v177 sözleşmesini ölç
        id: sites_probe
        if: >-
          steps.origin_state.outputs.origin_probe_ok == 'true' &&
          steps.origin_state.outputs.hosting_mode != 'github-pages'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python alo186/deployment/verify_contextual_affiliate_live_v177.py \
            --origin https://alo186.com \
            --receipt /tmp/alo186-live-probe/live-v177.json \
            --diagnostics /tmp/alo186-live-probe/v177-diagnostics \
            --attempts 2 \
            --sleep-seconds 2
          v177_status=$?
          if [ "$v177_status" -eq 0 ]; then
            echo 'sites_current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'sites_current=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Probe makbuzlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-probe
          path: /tmp/alo186-live-probe
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Hazırlık özeti
        if: always()
        shell: bash
        env:
          READY: ${{ steps.pages_probe.outputs.pages_ready }}
          PAGES_DEPLOYED: ${{ steps.pages_probe.outputs.pages_deployment_succeeded }}
          ORIGIN_PROBE_OK: ${{ steps.origin_state.outputs.origin_probe_ok }}
          BLOCKER: ${{ steps.pages_probe.outputs.blocker }}
          ADMIN: ${{ steps.pages_probe.outputs.admin_token_present }}
          LIVE_CURRENT: ${{ steps.origin_state.outputs.live_current }}
          SITES_CURRENT: ${{ steps.sites_probe.outputs.sites_current }}
          HOSTING_MODE: ${{ steps.origin_state.outputs.hosting_mode }}
          DNS_CUTOVER: ${{ steps.origin_state.outputs.dns_cutover_required }}
        run: |
          {
            echo '## ALO186 canlı yayın hazırlığı'
            echo
            echo "- GitHub Pages hazır: **${READY:-false}**"
            echo "- Başarılı Pages deploymentı mevcut: **${PAGES_DEPLOYED:-false}**"
            echo "- Origin makbuzu geçerli: **${ORIGIN_PROBE_OK:-false}**"
            echo "- Yönetici tokenı mevcut: **${ADMIN:-false}**"
            echo "- Canlı hosting modu: **${HOSTING_MODE:-unknown}**"
            echo "- Pages exact commit güncel: **${LIVE_CURRENT:-false}**"
            echo "- ChatGPT Sites v177 canlı sözleşmesi: **${SITES_CURRENT:-false}**"
            echo "- DNS cutover gerekli: **${DNS_CUTOVER:-false}**"
            if [ -n "${BLOCKER:-}" ]; then echo "- Pages blokajı: ${BLOCKER}"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  waiting_for_pages:
    needs: probe
    if: needs.probe.outputs.pages_ready != 'true' && needs.probe.outputs.sites_current != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alo186-live-probe
          path: /tmp/alo186-live-probe
      - name: Pages blokajını P0 kaydında görünür kıl
        uses: actions/github-script@v7
        env:
          BLOCKER: ${{ needs.probe.outputs.blocker }}
          ADMIN_TOKEN_PRESENT: ${{ needs.probe.outputs.admin_token_present }}
          ORIGIN_PROBE_OK: ${{ needs.probe.outputs.origin_probe_ok }}
        with:
          script: |
            const marker = '<!-- alo186-v177-live-blocker -->';
            const body = `${marker}
            ## ALO186 canlı yayın blokajı

            - Kaynak commit: \`${context.sha}\`
            - Yönetici tokenı mevcut: **${process.env.ADMIN_TOKEN_PRESENT}**
            - Origin makbuzu geçerli: **${process.env.ORIGIN_PROBE_OK}**
            - Pages blokajı: **${process.env.BLOCKER || 'GitHub Pages etkin değil.'}**
            - Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            Kaynak ve artifact sözleşmeleri hazırdır. Pages etkinleştirilirse state machine ilk artifactı tek kez yayınlayacaktır.`;
            async function upsert(issueNumber) {
              const {data: comments} = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100});
              const existing = comments.find(item => item.body && item.body.includes(marker));
              if (existing) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
              else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body});
            }
            await upsert(400);
            await upsert(21);

  already_live_on_sites:
    needs: probe
    if: >-
      needs.probe.outputs.pages_ready != 'true' &&
      needs.probe.outputs.origin_probe_ok == 'true' &&
      needs.probe.outputs.sites_current == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alo186-live-probe
          path: /tmp/alo186-live-probe
      - name: ChatGPT Sites canlı makbuzunu yayımla
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const origin = JSON.parse(fs.readFileSync('/tmp/alo186-live-probe/live-origin.json', 'utf8'));
            const live = JSON.parse(fs.readFileSync('/tmp/alo186-live-probe/live-v177.json', 'utf8'));
            const marker = '<!-- alo186-v177-live-receipt -->';
            const body = `${marker}
            ## ALO186 doğrulanmış canlı v177 makbuzu

            - Kaynak commit: \`${context.sha}\`
            - Canlı hosting modu: **${origin.mode}**
            - Platform imzası: \`${origin.platformSignature || 'external'}\`
            - Canlı rota: \`${live.origin}${live.route}\`
            - Ürün yerleşimi: **${live.placementCount}**
            - Ticari kapı: **${live.gateCount}**
            - Kapısız mağaza bağlantısı: **${live.staticStoreLinkCount}**

            Canlı production origin ve v177 güven sözleşmesi doğrulanmıştır; exact GitHub commit makbuzu bu hosting modunda mevcut değildir.`;
            async function upsert(issueNumber) {
              const {data: comments} = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100});
              const existing = comments.find(item => item.body && item.body.includes(marker));
              if (existing) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
              else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body});
            }
            await upsert(400);
            await upsert(21);

  dispatch_pages:
    needs: probe
    if: >-
      needs.probe.outputs.pages_ready == 'true' &&
      needs.probe.outputs.live_current != 'true' &&
      (
        needs.probe.outputs.hosting_mode == 'github-pages' ||
        needs.probe.outputs.pages_deployment_succeeded != 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: İlk veya stale GitHub Pages artifactını tek yayıncıyla tetikle
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'alo186-github-pages.yml',
              ref: 'main',
            });
            core.info(`ALO186 ana Pages workflow dispatch status=${response.status}`);
      - run: echo 'İlk Pages artifactı veya stale Pages commit için tek yayıncı workflow kuyruğa alındı.'

  waiting_for_dns_cutover:
    needs: probe
    if: >-
      needs.probe.outputs.pages_ready == 'true' &&
      needs.probe.outputs.pages_deployment_succeeded == 'true' &&
      needs.probe.outputs.origin_probe_ok == 'true' &&
      needs.probe.outputs.hosting_mode != 'github-pages'
    runs-on: ubuntu-latest
    steps:
      - name: DNS cutover blokajını tekilleştir
        uses: actions/github-script@v7
        env:
          HOSTING_MODE: ${{ needs.probe.outputs.hosting_mode }}
          SITES_CURRENT: ${{ needs.probe.outputs.sites_current }}
        with:
          script: |
            const marker = '<!-- alo186-dns-cutover-required -->';
            const body = `${marker}
            ## ALO186 GitHub Pages hazır — DNS cutover bekleniyor

            - Kaynak commit: \`${context.sha}\`
            - Başarılı GitHub Pages deploymentı: **var**
            - \`alo186.com\` canlı hosting modu: **${process.env.HOSTING_MODE || 'unknown'}**
            - Mevcut dış hosting v177 sözleşmesi: **${process.env.SITES_CURRENT || 'false'}**
            - Otomatik Pages yeniden-dispatch: **durduruldu**
            - Runbook: \`alo186/deployment/GITHUB_PAGES_CUTOVER.md\`

            Aynı artifactı yeniden yayınlamak DNS yetkisini değiştirmez. Apex ve www kayıtları GitHub Pages'e taşındığında state machine exact-commit doğrulamasına otomatik geçecektir. MX, SPF, DKIM, DMARC ve doğrulama TXT kayıtları korunmalıdır.`;
            async function upsert(issueNumber) {
              const {data: comments} = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100});
              const existing = comments.find(item => item.body && item.body.includes(marker));
              if (existing) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
              else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body});
            }
            await upsert(400);
            await upsert(21);

  origin_probe_failed:
    needs: probe
    if: >-
      needs.probe.outputs.pages_ready == 'true' &&
      needs.probe.outputs.pages_deployment_succeeded == 'true' &&
      needs.probe.outputs.origin_probe_ok != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Origin makbuzu eksikliğini görünür kıl
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- alo186-origin-probe-invalid -->';
            const body = `${marker}
            ## ALO186 origin makbuzu doğrulanamadı

            GitHub Pages deployment geçmişinde başarılı bir yayın var; ancak \`alo186.com\` hosting makbuzu okunamadığı için Sites güncel veya DNS cutover hazır kabul edilmedi. Yeni deploy döngüsü başlatılmadı. Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: comments} = await github.rest.issues.listComments({owner: context.repo.owner, repo: context.repo.repo, issue_number: 400, per_page: 100});
            const existing = comments.find(item => item.body && item.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 400, body});

  already_current:
    needs: probe
    if: >-
      needs.probe.outputs.pages_ready == 'true' &&
      needs.probe.outputs.hosting_mode == 'github-pages' &&
      needs.probe.outputs.live_current == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Güncel Pages yüzeyinde v177 sözleşmesini doğrula
        run: |
          set -euo pipefail
          python alo186/deployment/verify_contextual_affiliate_live_v177.py \
            --origin https://alo186.com \
            --receipt /tmp/alo186-v177-live-receipt.json \
            --diagnostics /tmp/alo186-v177-diagnostics \
            --attempts 3 \
            --sleep-seconds 5
      - run: echo 'Canlı Pages sitesi güncel commit ve v177 ürün sözleşmesini taşıyor.'
