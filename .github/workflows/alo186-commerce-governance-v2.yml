name: ALO186 ticari yönetişim ve canlı yayın tazeliği

on:
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/**'
      - 'alo186/hizmetler/**'
      - 'alo186/kurumsal-on-degerlendirme/**'
      - 'alo186/urun-eslestirme/catalog.js'
      - 'alo186/deployment/guard_commerce_routes_v2.py'
      - 'alo186/deployment/verify_live_origin.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/tests/test_commerce_governance_v2.py'
      - 'alo186/tests/test_live_freshness_workflow.py'
      - 'alo186/tests/test_live_origin_verifier.py'
      - '.github/workflows/alo186-commerce-governance-v2.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/**'
      - 'alo186/hizmetler/**'
      - 'alo186/kurumsal-on-degerlendirme/**'
      - 'alo186/urun-eslestirme/catalog.js'
      - 'alo186/deployment/guard_commerce_routes_v2.py'
      - 'alo186/deployment/verify_live_origin.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/tests/test_commerce_governance_v2.py'
      - 'alo186/tests/test_live_freshness_workflow.py'
      - 'alo186/tests/test_live_origin_verifier.py'
      - '.github/workflows/alo186-commerce-governance-v2.yml'
  workflow_run:
    workflows: ['ALO186 GitHub Pages — sunucusuz canlı yayın']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-commerce-governance-${{ github.event_name }}-${{ github.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  artifact_guard:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kaynak ticari yönetişim ve canlı origin sözleşmeleri
        shell: bash
        run: |
          set -euo pipefail
          python alo186/tests/test_commerce_governance_v2.py
          python alo186/tests/test_live_freshness_workflow.py
          python alo186/tests/test_live_origin_verifier.py
          python -m py_compile alo186/deployment/guard_commerce_routes_v2.py
          python -m py_compile alo186/deployment/verify_live_origin.py
          node --check alo186/amazon-elektrik-urunleri/commercial.js
          node --check alo186/urun-eslestirme/catalog.js

      - name: Mevcut güven ve yayın regresyonları
        shell: bash
        run: |
          set -euo pipefail
          python alo186/tests/test_commercial_service_pages.py
          python alo186/tests/test_commercial_category_pages.py
          python alo186/tests/test_content_intent_consolidation.py
          python alo186/tests/test_private_technical_search.py
          python alo186/tests/device_damage_deadline_guard.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js

      - name: Canonical üretim paketini oluştur
        shell: bash
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-commerce-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-commerce-canonical

      - name: Custom-domain ve project-path artifactlarını doğrula
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'custom|' 'project|/chatgpt'; do
            name="${spec%%|*}"
            base="${spec#*|}"
            target="/tmp/alo186-commerce-${name}"
            cp -a /tmp/alo186-commerce-canonical "$target"
            python alo186/deployment/prepare_github_pages.py \
              --site "$target" \
              --base-path "$base" \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA"
            python alo186/deployment/inject_outcome_runtime.py \
              --site "$target" \
              --base-path "$base"
            python alo186/deployment/inject_shortlist_growth.py \
              --site "$target" \
              --base-path "$base" \
              > "/tmp/alo186-commerce-${name}-growth.json"
            python alo186/deployment/smoke_github_pages.py \
              --site "$target" \
              --base-path "$base"
            python alo186/deployment/guard_commerce_routes_v2.py \
              --site "$target" \
              | tee "/tmp/alo186-commerce-${name}-guard.json"
          done

      - name: Ticari rota, arama, sitemap ve base-path kabulü
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          commercial = [
              '/amazon-elektrik-urunleri',
              '/amazon-elektrik-urunleri/powerbank-usb-c-secimi',
              '/amazon-elektrik-urunleri/akim-korumali-grup-priz-secimi',
              '/amazon-elektrik-urunleri/modem-mini-ups-secimi',
              '/amazon-elektrik-urunleri/acil-aydinlatma-duman-alarmi',
          ]
          services = [
              '/hizmetler/otel-elektrik-surekliligi-denetimi/',
              '/hizmetler/elektrik-teklif-teknik-inceleme/',
              '/hizmetler/ges-batarya-ev-sarj-fizibilitesi/',
          ]
          for root, prefix in [
              (Path('/tmp/alo186-commerce-custom'), ''),
              (Path('/tmp/alo186-commerce-project'), '/chatgpt'),
          ]:
              release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
              pages=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
              search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
              sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
              entries={item['canonicalPath']: item for item in search['entries']}
              canonical_host=release['canonicalHost'].rstrip('/')
              assert pages['canonicalHost'] == release['canonicalHost']
              assert release['routeCount'] == len(release['routes'])
              assert pages['routeCount'] == release['routeCount']
              assert release['routingVersion'] >= 41
              for route in commercial + services:
                  path=root/route.strip('/')/'index.html'
                  assert path.is_file(), path
                  assert f'<loc>{canonical_host}{route}</loc>' in sitemap
                  assert route in entries, route
                  expected=(prefix+route) if prefix else route
                  assert entries[route]['url'] == expected, (entries[route]['url'], expected)
                  for field in ('price','stock','rating','seller','warranty','affiliateCommission'):
                      assert field not in entries[route]
              hub=(root/'amazon-elektrik-urunleri/index.html').read_text(encoding='utf-8').lower()
              assert 'satış ortaklığı' in hub
              assert 'href="https://www.amazon.com.tr' not in hub
              assert "href='https://www.amazon.com.tr" not in hub
              power=(root/'amazon-elektrik-urunleri/powerbank-usb-c-secimi/index.html').read_text(encoding='utf-8')
              assert 'data-fresh-products' in power
              for route in commercial[2:]:
                  html=(root/route.strip('/')/'index.html').read_text(encoding='utf-8')
                  assert 'data-fresh-products' not in html
              guard=json.loads((Path(f'/tmp/alo186-commerce-{root.name.rsplit("-",1)[-1]}-guard.json')).read_text(encoding='utf-8'))
              assert guard['ok'] is True and guard['errorCount'] == 0
              assert guard['commercialPolicy']['highRiskDirectAffiliate'] is False
              assert guard['commercialPolicy']['professionalOnlyDirectAffiliate'] is False
          PY

      - name: Doğrulanmış ticari yönetişim artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-commerce-governance-pages
          path: |
            /tmp/alo186-commerce-custom
            /tmp/alo186-commerce-custom-guard.json
            /tmp/alo186-commerce-project-guard.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  live_freshness:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIVE_ORIGIN: https://alo186.com
      LIVE_ALIAS_ORIGIN: https://www.alo186.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canlı origin modunu ve kullanıcı sözleşmesini doğrula
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python alo186/deployment/verify_live_origin.py \
            --origin "$LIVE_ORIGIN" \
            --alias-origin "$LIVE_ALIAS_ORIGIN" \
            --expected-commit "$EXPECTED_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --github-token "$GITHUB_TOKEN" \
            --receipt /tmp/alo186-live-origin-receipt.json \
            --diagnostics /tmp/alo186-live-origin-diagnostics \
            --attempts 24 \
            --sleep-seconds 10

      - name: Canlı origin özeti
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/alo186-live-origin-receipt.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/alo186-live-origin-receipt.json').read_text(encoding='utf-8'))
          print('## ALO186 canlı origin makbuzu')
          print()
          print(f"- Mod: **{data.get('mode')}**")
          print(f"- Canonical origin: `{data.get('canonicalOrigin')}`")
          print(f"- Beklenen kaynak commit: `{data.get('expectedCommit')}`")
          print(f"- Sunulan commit: `{data.get('servedCommit') or 'platform tarafından açıklanmıyor'}`")
          print(f"- Tam commit makbuzu: **{data.get('exactCommitReceiptAvailable')}**")
          print(f"- Canlı kullanıcı sözleşmesi: **{data.get('liveContentContractVerified', True)}**")
          PY
          else
            echo '## ALO186 canlı origin makbuzu' >> "$GITHUB_STEP_SUMMARY"
            echo '- Doğrulama makbuzu üretilemedi.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Canlı origin makbuzunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-origin-receipt
          path: |
            /tmp/alo186-live-origin-receipt.json
            /tmp/alo186-live-origin-diagnostics
          if-no-files-found: warn
          retention-days: 30
