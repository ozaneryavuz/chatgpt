name: ALO186 ürün güveni, belge pasaportu ve kesinti kiti kalite kontrolü

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/urun-guvenlik-duyurusu-kontrolu/**'
      - 'alo186/hesaplama/urun-teknik-belge-pasaportu/**'
      - 'alo186/hesaplama/kesinti-kiti-donemsel-kontrolu/**'
      - 'alo186/deployment/inject_growth_run18.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-overlays/growth-trust-retention-run18.json'
      - 'alo186/tests/test_growth_run18.py'
      - '.github/workflows/alo186-growth-run18.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-growth-run18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Routing, güven, affiliate ve tekrar ziyaret sözleşmeleri
        run: python alo186/tests/test_growth_run18.py

      - name: Inline JavaScript ve Python sözdizimi
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          paths=[
            Path('alo186/hesaplama/urun-guvenlik-duyurusu-kontrolu/index.html'),
            Path('alo186/hesaplama/urun-teknik-belge-pasaportu/index.html'),
            Path('alo186/hesaplama/kesinti-kiti-donemsel-kontrolu/index.html'),
          ]
          for index,path in enumerate(paths):
            text=path.read_text(encoding='utf-8')
            scripts=re.findall(r'<script(?![^>]+type=["\']application/ld\+json["\'])[^>]*>(.*?)</script>',text,re.I|re.S)
            assert len(scripts)==1,(path,len(scripts))
            Path(f'/tmp/run18-{index}.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/run18-0.js
          node --check /tmp/run18-1.js
          node --check /tmp/run18-2.js
          python -m py_compile alo186/deployment/inject_growth_run18.py
          python -m py_compile alo186/deployment/inject_shortlist_growth.py

      - name: Affiliate, içerik ve cihaz hasarı regresyonları
        run: |
          node alo186/tests/test_affiliate_knowledge_graph.js
          node alo186/tests/test_product_matcher.js
          python alo186/tests/test_content_intent_consolidation.py
          python alo186/tests/device_damage_deadline_guard.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js

      - name: Canonical üretim paketini oluştur
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-run18-canonical --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-run18-canonical

      - name: Custom-domain ve project-path artifactlarını hazırla
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'custom|' 'project|/chatgpt'; do
            name="${spec%%|*}"
            base="${spec#*|}"
            target="/tmp/alo186-run18-${name}"
            cp -a /tmp/alo186-run18-canonical "$target"
            python alo186/deployment/prepare_github_pages.py --site "$target" --base-path "$base" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
            python alo186/deployment/inject_outcome_runtime.py --site "$target" --base-path "$base"
            python alo186/deployment/inject_shortlist_growth.py --site "$target" --base-path "$base" > "/tmp/alo186-run18-${name}-result.json"
            python alo186/deployment/smoke_github_pages.py --site "$target" --base-path "$base"
          done

      - name: Artifact keşif, base-path, güven ve retention kabulü
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          routes=[
            '/hesaplama/urun-guvenlik-duyurusu-kontrolu/',
            '/hesaplama/urun-teknik-belge-pasaportu/',
            '/hesaplama/kesinti-kiti-donemsel-kontrolu/',
          ]
          entry_targets=[
            'hesaplama/index.html','elektrik-portali/index.html','akilli-urun-secimi/index.html',
            'amazon-elektrik-urunleri/index.html','hesaplama/urun-sonrasi-guvenlik-kontrolu/index.html',
            'kesintiye-hazirlik-atolyesi/index.html',
          ]
          for root,prefix in [(Path('/tmp/alo186-run18-custom'),''),(Path('/tmp/alo186-run18-project'),'/chatgpt')]:
            for route in routes: assert (root/route.strip('/')/'index.html').is_file(),route
            release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
            pages=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
            canonical_origin=str(release.get('canonicalHost') or '').rstrip('/')
            assert canonical_origin in {'https://alo186.com','https://www.alo186.com'},canonical_origin
            assert str(pages.get('canonicalHost') or '').rstrip('/')==canonical_origin
            meta=release['growthRun18']
            assert meta['rawPersonalDataCollected'] is False
            assert meta['directAffiliateLinksAdded']==0
            assert meta['hazardCommerceClosed'] is True
            assert meta['firstFailureCommerceClosed'] is True
            assert meta['noBuyOutcomePreserved'] is True
            assert meta['unverifiedCommercialFieldsUsed']==[]
            assert meta['productSafetyWatchTtlDays']==365
            assert meta['evidencePassportTtlDays']==30
            assert meta['outageKitRecordTtlDays']==730
            assert meta['outageKitReviewDays']==90
            assert pages['growthRun18']['routes']==meta['routes']
            expected=[prefix+route if prefix else route for route in routes]
            assert meta['routes']==expected
            for relative in entry_targets:
              text=(root/relative).read_text(encoding='utf-8')
              assert 'data-alo186-growth-run18-entry="true"' in text,relative
              for route in expected: assert route in text,(relative,route)
            search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
            entries={item['canonicalPath']:item for item in search['entries']}
            for route,url in zip(routes,expected): assert entries[route]['url']==url
            sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
            for route in routes: assert f'<loc>{canonical_origin}{route}</loc>' in sitemap
            sw=(root/'sw.js').read_text(encoding='utf-8')
            for url in expected: assert url in sw
            manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
            shortcuts={item.get('url') for item in manifest.get('shortcuts',[]) if isinstance(item,dict)}
            assert set(expected).issubset(shortcuts)
            safety=(root/routes[0].strip('/')/'index.html').read_text(encoding='utf-8')
            passport=(root/routes[1].strip('/')/'index.html').read_text(encoding='utf-8')
            kit=(root/routes[2].strip('/')/'index.html').read_text(encoding='utf-8')
            assert 'guvensizurun.ticaret.gov.tr/Bildirim/DetaySorgu' in safety
            assert 'safety-gate-alerts' in safety
            assert 'commerceReady:commerce' in passport
            assert "replace=ids.filter(id=>values[id]==='fail2')" in kit
            assert all('amazon.com' not in text.casefold() for text in [safety,passport,kit])
          PY

      - name: Doğrulanmış run18 artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-trust-retention-run18-pages
          path: /tmp/alo186-run18-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
