name: ALO186 affiliate USB Wi-Fi adaptörleri v228

on:
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/bilgisayar-usb-wifi-adaptor-secimi/**'
      - 'alo186/deployment/routing-overlays/228-affiliate-usb-wifi.json'
      - 'alo186/tests/test_affiliate_usb_wifi_v228.js'
      - '.github/workflows/alo186-affiliate-usb-wifi-v228.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/bilgisayar-usb-wifi-adaptor-secimi/**'
      - 'alo186/deployment/routing-overlays/228-affiliate-usb-wifi.json'
      - 'alo186/tests/test_affiliate_usb_wifi_v228.js'
      - '.github/workflows/alo186-affiliate-usb-wifi-v228.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-usb-wifi-v228-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Exact ASIN, Knowledge Graph and stale gate
        shell: bash
        run: |
          set -euo pipefail
          node --check alo186/amazon-elektrik-urunleri/bilgisayar-usb-wifi-adaptor-secimi/catalog-v228.js
          node --check alo186/amazon-elektrik-urunleri/bilgisayar-usb-wifi-adaptor-secimi/app-v228.js
          node alo186/tests/test_affiliate_usb_wifi_v228.js

      - name: Existing affiliate and legal safety regressions
        shell: bash
        run: |
          set -euo pipefail
          python alo186/tests/test_commerce_governance_v2.py
          python alo186/tests/test_commerce_governance_v3.py
          python alo186/tests/device_damage_deadline_guard.py
          node alo186/tests/test_release_manifest.js

      - name: Canonical production bundle
        shell: bash
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-usb-wifi-v228 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-usb-wifi-v228
          route=/tmp/alo186-usb-wifi-v228/amazon-elektrik-urunleri/bilgisayar-usb-wifi-adaptor-secimi
          test -f "$route/index.html"
          test -f "$route/catalog-v228.js"
          test -f "$route/app-v228.js"
          grep -Fq 'B0859M539M' "$route/index.html"
          grep -Fq 'B07P5PRK7J' "$route/index.html"
          grep -Fq 'B09KTDXPY3' "$route/index.html"
          grep -Fq 'alo186rehber-21' "$route/catalog-v228.js"
          ! grep -Eq 'href="https://www\.amazon\.com\.tr/(dp|s\?k=)' "$route/index.html"

      - name: Custom-domain and project-path commerce acceptance
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'custom|' 'project|/chatgpt'; do
            name="${spec%%|*}"
            base="${spec#*|}"
            target="/tmp/alo186-usb-wifi-v228-${name}"
            cp -a /tmp/alo186-usb-wifi-v228 "$target"
            python alo186/deployment/prepare_github_pages.py \
              --site "$target" \
              --base-path "$base" \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA"
            python alo186/deployment/inject_outcome_runtime.py \
              --site "$target" \
              --base-path "$base"
            python alo186/deployment/inject_shortlist_growth.py \
              --site "$target" \
              --base-path "$base" \
              > "/tmp/alo186-usb-wifi-v228-${name}-growth.json"
            python alo186/deployment/smoke_github_pages.py \
              --site "$target" \
              --base-path "$base"
            python alo186/deployment/guard_commerce_routes_v3.py \
              --site "$target" \
              | tee "/tmp/alo186-usb-wifi-v228-${name}-guard.json"
          done

      - name: Verified artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: alo186-affiliate-usb-wifi-v228
          path: /tmp/alo186-usb-wifi-v228-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
