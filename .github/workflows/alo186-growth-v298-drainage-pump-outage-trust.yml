name: ALO186 drenaj pompası kesinti güveni v298

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-bodrum-drenaj-pompasi-calisir-mi/**'
      - 'alo186/hesaplama/bodrum-drenaj-pompasi-elektrik-kesintisi-su-baskini-plani/**'
      - 'alo186/sektor-rehberi/apartman-otel-bodrum-drenaj-pompasi-kesinti-surekliligi/**'
      - 'alo186/deployment/affiliate-category-decisions/drainage-pump-outage-v298.json'
      - 'alo186/deployment/routing-overlays/growth-v298-drainage-pump-outage-trust.json'
      - 'alo186/tests/test_growth_v298_drainage_pump_outage_trust.py'
      - '.github/workflows/alo186-growth-v298-drainage-pump-outage-trust.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-bodrum-drenaj-pompasi-calisir-mi/**'
      - 'alo186/hesaplama/bodrum-drenaj-pompasi-elektrik-kesintisi-su-baskini-plani/**'
      - 'alo186/sektor-rehberi/apartman-otel-bodrum-drenaj-pompasi-kesinti-surekliligi/**'
      - 'alo186/deployment/affiliate-category-decisions/drainage-pump-outage-v298.json'
      - 'alo186/deployment/routing-overlays/growth-v298-drainage-pump-outage-trust.json'
      - 'alo186/tests/test_growth_v298_drainage_pump_outage_trust.py'
      - '.github/workflows/alo186-growth-v298-drainage-pump-outage-trust.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v298-drainage-pump-outage-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Drenaj pompası güven ve dönüşüm sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/tests/test_growth_v298_drainage_pump_outage_trust.py \
            alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v298_drainage_pump_outage_trust.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/affiliate-category-decisions/drainage-pump-outage-v298.json >/dev/null
          python -m json.tool alo186/deployment/routing-overlays/growth-v298-drainage-pump-outage-trust.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v298
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v298 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v298
          test -f /tmp/alo186-v298/haberler/elektrik-kesilince-bodrum-drenaj-pompasi-calisir-mi/index.html
          test -f /tmp/alo186-v298/hesaplama/bodrum-drenaj-pompasi-elektrik-kesintisi-su-baskini-plani/index.html
          test -f /tmp/alo186-v298/sektor-rehberi/apartman-otel-bodrum-drenaj-pompasi-kesinti-surekliligi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v298
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v298 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-sites-v298')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-bodrum-drenaj-pompasi-calisir-mi/',
              '/hesaplama/bodrum-drenaj-pompasi-elektrik-kesintisi-su-baskini-plani/',
              '/sektor-rehberi/apartman-otel-bodrum-drenaj-pompasi-kesinti-surekliligi/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for route in expected:
              page = pages[route]
              assert page['affiliate']['hasAffiliateLinks'] is False
              assert not page['affiliate']['unsafeStaticLinks']
          print(json.dumps({'ok': True, 'routes': sorted(expected)}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v298 drenaj pompası kesinti güven paketi

          - Elektrik kesilince bodrum drenaj pompası niyeti: kaynak doğrulamalı canonical rehber
          - Aktif su-elektrik tehlikesi: test ve ticari yol kapalı
          - Pompa + seviye + alarm + çekvalf + tahliye + yedek enerji: kişisel verisiz ücretsiz plan
          - Apartman, site, otel, otopark ve pis su sistemleri: professional-only
          - Mevcut gerçek test yeterliyse: yeni ürün almayın
          - Yeni Amazon veya başka mağaza bağlantısı: 0
          - Fiyat, stok, puan, yorum ve garanti: 0
          - 7/30/180 günlük işlevsel tekrar ziyaret döngüsü
          EOF
