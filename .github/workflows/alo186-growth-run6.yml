name: ALO186 konu takibi, kanıt ve şartname büyümesi

on:
  pull_request:
    paths:
      - 'alo186/konu-takip-merkezi/**'
      - 'alo186/hesaplama/elektrik-kanit-envanteri/**'
      - 'alo186/hesaplama/teknik-sartname-talep-paketi/**'
      - 'alo186/deployment/inject_growth_run6.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-overlays/growth-topic-evidence-spec-run6.json'
      - 'alo186/tests/test_growth_run6.py'
      - '.github/workflows/alo186-growth-run6.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/konu-takip-merkezi/**'
      - 'alo186/hesaplama/elektrik-kanit-envanteri/**'
      - 'alo186/hesaplama/teknik-sartname-talep-paketi/**'
      - 'alo186/deployment/inject_growth_run6.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-overlays/growth-topic-evidence-spec-run6.json'
      - 'alo186/tests/test_growth_run6.py'
      - '.github/workflows/alo186-growth-run6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-growth-run6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kaynak, gizlilik, no-buy ve routing sözleşmeleri
        run: python alo186/tests/test_growth_run6.py

      - name: Python sözdizimi
        run: |
          python -m py_compile alo186/deployment/inject_growth_run6.py
          python -m py_compile alo186/deployment/inject_shortlist_growth.py

      - name: Mevcut içerik, ticaret ve cihaz hasarı regresyonları
        run: |
          python alo186/tests/test_content_intent_consolidation.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical üretim paketini oluştur
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-growth6-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-growth6-canonical

      - name: Custom-domain artifactı
        run: |
          cp -a /tmp/alo186-growth6-canonical /tmp/alo186-growth6-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-growth6-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-growth6-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-growth6-custom --base-path '' > /tmp/growth6-custom.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-growth6-custom --base-path ''

      - name: Project-path artifactı
        run: |
          cp -a /tmp/alo186-growth6-canonical /tmp/alo186-growth6-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-growth6-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-growth6-project --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-growth6-project --base-path '/chatgpt' > /tmp/growth6-project.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-growth6-project --base-path '/chatgpt'

      - name: Artifact, arama, PWA ve giriş noktaları
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          routes = [
              '/konu-takip-merkezi/',
              '/hesaplama/elektrik-kanit-envanteri/',
              '/hesaplama/teknik-sartname-talep-paketi/',
          ]
          expected_buckets = {
              routes[0]: 'tool',
              routes[1]: 'calculator',
              routes[2]: 'business',
          }
          for root, prefix in [
              (Path('/tmp/alo186-growth6-custom'), ''),
              (Path('/tmp/alo186-growth6-project'), '/chatgpt'),
          ]:
              release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
              pages=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
              search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
              index={item['canonicalPath']:item for item in search['entries']}
              assert release['growthRun6']['rawPersonalDataCollected'] is False
              assert release['growthRun6']['directAffiliateLinksAdded']==0
              assert release['growthRun6']['noBuyOutcomePreserved'] is True
              assert release['growthRun6']['topicComparisonLocalOnly'] is True
              assert release['growthRun6']['evidenceFilesUploaded'] is False
              assert pages['growthRun6']['rawPersonalDataCollected'] is False
              for route in routes:
                  page=root/route.strip('/')/'index.html'
                  assert page.is_file(), page
                  html=page.read_text(encoding='utf-8')
                  assert 'application/ld+json' in html
                  assert 'amazon.' not in html.lower() and 'amzn.' not in html.lower()
                  assert f'https://www.alo186.com{route}' in (root/'sitemap.xml').read_text(encoding='utf-8')
                  assert route in index
                  assert index[route]['bucket']==expected_buckets[route]
                  assert index[route]['url']==(prefix+route if prefix else route)
                  assert not any(field in index[route] for field in ['price','stock','rating','seller','warranty','asin'])
                  assert (prefix+route if prefix else route) in (root/'sw.js').read_text(encoding='utf-8')
              topic=(root/'konu-takip-merkezi/index.html').read_text(encoding='utf-8')
              assert (prefix+'/arama/search-index.json' if prefix else '/arama/search-index.json') in topic or '../arama/search-index.json' in topic
              hub=(root/'hesaplama/index.html').read_text(encoding='utf-8')
              portal=(root/'elektrik-portali/index.html').read_text(encoding='utf-8')
              gateway=(root/'index.html').read_text(encoding='utf-8')
              corporate=(root/'kurumsal-elektrik-surekliligi-on-degerlendirme/index.html').read_text(encoding='utf-8')
              assert 'data-alo186-growth-run6-tools="true"' in hub
              assert 'data-alo186-growth-run6-retention="true"' in portal
              assert 'data-alo186-growth-run6-gateway="true"' in gateway
              assert 'data-alo186-growth-run6-spec="true"' in corporate
              manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
              urls={item.get('url') for item in manifest.get('shortcuts',[]) if isinstance(item,dict)}
              assert (prefix+routes[0] if prefix else routes[0]) in urls
              assert (prefix+routes[1] if prefix else routes[1]) in urls
          PY

      - name: Doğrulanmış büyüme artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-topic-evidence-spec-growth
          path: /tmp/alo186-growth6-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
