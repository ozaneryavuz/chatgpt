name: ALO186 canlı alan adı tam entegrasyon kabulü

on:
  push:
    branches: [main]
    paths:
      - 'alo186/**'
      - '.github/workflows/alo186-live-domain-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-live-domain-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live_acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kabul bağımlılıkları
        run: python -m pip install --disable-pip-version-check requests

      - name: Canlı dağıtımın tamamlanmasını bekle
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl --silent --show-error --location --max-time 20 --output /tmp/alo186-release.body --write-out '%{http_code}' https://alo186.com/pages-release.json || true)
            if [[ "$code" == "200" ]]; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo 'Canlı alan adı güncel pages-release.json dosyasını dağıtım süresi içinde sunmadı.' >&2
              exit 1
            fi
            sleep 20
          done

      - name: Release kimliği, domain birleşimi, rotalar ve güven sözleşmeleri
        run: |
          python alo186/tests/live_release_identity_guard.py \
            --manifest alo186/deployment/live-domain-integration.json

      - name: Canlı mobil/masaüstü audit kaynağı ve regresyonlar
        run: |
          python -m py_compile alo186/tests/live_site_technical_audit.py
          python -m py_compile alo186/tests/live_site_technical_audit_v2.py
          python -m py_compile alo186/tests/live_release_identity_guard.py
          python alo186/tests/test_live_domain_integration_manifest.py
          python alo186/tests/device_damage_deadline_guard.py

      - name: Kabul özeti
        run: |
          echo 'ALO186 canlı serving origin, canonical origin, Pages release kimliği, 10 iş günü koruması, zorunlu rotalar, sitemap ve robots tek sözleşmede doğrulandı.'
