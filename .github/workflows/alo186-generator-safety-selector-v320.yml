name: ALO186 jeneratör CO, yerleşim ve bağlantı güvenlik testi

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/jenerator-guvenli-kullanim-testi/**'
      - 'alo186/hesaplama/common.js'
      - 'alo186/deployment/routing-overlays/generator-safety-selector-v320.json'
      - 'alo186/tests/test_generator_safety_selector_v320.py'
      - '.github/workflows/alo186-generator-safety-selector-v320.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/jenerator-guvenli-kullanim-testi/**'
      - 'alo186/hesaplama/common.js'
      - 'alo186/deployment/routing-overlays/generator-safety-selector-v320.json'
      - 'alo186/tests/test_generator_safety_selector_v320.py'
      - '.github/workflows/alo186-generator-safety-selector-v320.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-generator-safety-selector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Karar mantığı ve kaynak sözleşmesi
        run: |
          set -euo pipefail
          node alo186/hesaplama/jenerator-guvenli-kullanim-testi/app.test.js
          python alo186/tests/test_generator_safety_selector_v320.py

      - name: JavaScript ve Python sözdizimi
        run: |
          set -euo pipefail
          node --check alo186/hesaplama/jenerator-guvenli-kullanim-testi/app.js
          node --check alo186/hesaplama/common.js
          python -m py_compile alo186/tests/test_generator_safety_selector_v320.py

      - name: Mevcut güven ve routing regresyonları
        run: |
          set -euo pipefail
          python alo186/tests/test_content_intent_consolidation.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical üretim paketi
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-generator-safety-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-generator-safety-canonical

      - name: Custom-domain ve project-path artifactları
        run: |
          set -euo pipefail
          cp -a /tmp/alo186-generator-safety-canonical /tmp/alo186-generator-safety-custom
          cp -a /tmp/alo186-generator-safety-canonical /tmp/alo186-generator-safety-project

          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-generator-safety-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-generator-safety-custom \
            --base-path ''
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-generator-safety-custom \
            --base-path '' > /tmp/alo186-generator-safety-custom.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-generator-safety-custom \
            --base-path ''

          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-generator-safety-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-generator-safety-project \
            --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-generator-safety-project \
            --base-path '/chatgpt' > /tmp/alo186-generator-safety-project.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-generator-safety-project \
            --base-path '/chatgpt'

      - name: Final artifact kabulü
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          route='/hesaplama/jenerator-guvenli-kullanim-testi/'
          for root,prefix in [
              (Path('/tmp/alo186-generator-safety-custom'),''),
              (Path('/tmp/alo186-generator-safety-project'),'/chatgpt'),
          ]:
              page=root/route.strip('/')/'index.html'
              app=page.with_name('app.js')
              styles=page.with_name('styles.css')
              assert page.is_file() and app.is_file() and styles.is_file()
              html=page.read_text(encoding='utf-8')
              js=app.read_text(encoding='utf-8')
              assert html.count('<h1')==1
              assert 'Jeneratör CO, Yerleşim ve Bağlantı Güvenlik Testi' in html
              assert '6,1 m' in html and '20 feet' in html
              assert 'Satış ortaklığı açıklaması' in html
              assert 'amazon.com.tr' not in html.lower()
              assert 'localStorage' not in js and 'sessionStorage' not in js
              assert 'fetch(' not in js and 'XMLHttpRequest' not in js
              assert "connection==='backfeed'" in js
              assert "baseResult('no_buy'" in js
              assert "baseResult('conditional_purchase'" in js
              assert "112’yi arayın" in js
              assert 'type="email"' not in html and 'type="tel"' not in html

              blocks=re.findall(r'<script[^>]+type="application/ld\+json"[^>]*>(.*?)</script>',html,re.S|re.I)
              types=set()
              for block in blocks:
                  payload=json.loads(block)
                  for node in payload.get('@graph',[payload]):
                      value=node.get('@type') if isinstance(node,dict) else None
                      if isinstance(value,str):types.add(value)
              assert {'WebApplication','DefinedTermSet','FAQPage','BreadcrumbList'}<=types

              expected=prefix+route if prefix else route
              search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
              entry=next(item for item in search['entries'] if item['canonicalPath']==route)
              assert entry['url']==expected
              sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
              assert f'<loc>https://alo186.com{route}</loc>' in sitemap

              common=(root/'hesaplama/common.js').read_text(encoding='utf-8')
              assert 'data-alo186-generator-safety-card' in common
              assert '/hesaplama/jenerator-guvenli-kullanim-testi/' in common
              counts=[int(value) for value in re.findall(r'(\d+) çekirdek araç',common)]
              assert counts and max(counts)>=36
          PY

      - name: Doğrulanmış jeneratör güvenlik artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-generator-safety-selector-pages
          path: /tmp/alo186-generator-safety-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
