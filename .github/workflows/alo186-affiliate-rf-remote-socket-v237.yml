name: ALO186 güvenli RF uzaktan kumandalı priz affiliate v237

on:
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/**'
      - 'alo186/deployment/routing-overlays/237-affiliate-rf-remote-socket.json'
      - 'alo186/tests/test_affiliate_rf_remote_socket_v237.js'
      - '.github/workflows/alo186-affiliate-rf-remote-socket-v237.yml'
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/**'
      - 'alo186/deployment/routing-overlays/237-affiliate-rf-remote-socket.json'
      - 'alo186/tests/test_affiliate_rf_remote_socket_v237.js'
      - '.github/workflows/alo186-affiliate-rf-remote-socket-v237.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-rf-remote-socket-v237-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ürün, Knowledge Graph ve affiliate güven regresyonu
        run: |
          node --check alo186/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/catalog-v237.js
          node --check alo186/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/app-v237.js
          node alo186/tests/test_affiliate_rf_remote_socket_v237.js
      - name: Affiliate kapsam ve ticari yönetişim
        run: |
          printf '%s\n' \
            'alo186/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/index.html' \
            'alo186/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/catalog-v237.js' \
            'alo186/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/app-v237.js' \
            > /tmp/changed-affiliate-v237.txt
          python alo186/tests/test_affiliate_scope_policy_v229.py --changed-files /tmp/changed-affiliate-v237.txt
          node alo186/tests/test_release_manifest.js
      - name: Canonical production paketi
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-affiliate-v237 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-affiliate-v237
          test -f /tmp/alo186-affiliate-v237/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/index.html
          grep -Fq 'https://alo186.com/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/' /tmp/alo186-affiliate-v237/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/index.html
          grep -Fq 'rel="sponsored nofollow noopener"' /tmp/alo186-affiliate-v237/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/index.html
          ! grep -Eqi '"@type"[[:space:]]*:[[:space:]]*"Offer"|priceCurrency|aggregateRating' /tmp/alo186-affiliate-v237/amazon-elektrik-urunleri/elektrik-yuku-uzaktan-kumandali-priz-secimi/index.html
