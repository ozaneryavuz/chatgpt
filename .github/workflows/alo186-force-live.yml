name: ALO186 Force Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo186-force-live.yml'
      - 'alo186/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alo186-force-live.yml'
      - 'alo186/**'

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: alo186-production-pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build canonical production bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and validate production site
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-live
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-live \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-live
          printf 'alo186.com\n' > /tmp/alo186-live/CNAME
          touch /tmp/alo186-live/.nojekyll
          test -f /tmp/alo186-live/index.html
          test -f /tmp/alo186-live/haberler/elektrik-kesilince-duman-dedektoru-calisir-mi/index.html
          test -f /tmp/alo186-live/hesaplama/duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu/index.html
          test -f /tmp/alo186-live/amazon-elektrik-urunleri/duman-alarmi-pil-yedegi-kesinti-hazirligi/index.html
          grep -q 'elektrik-kesilince-duman-dedektoru-calisir-mi' /tmp/alo186-live/haberler/elektrik-kesilince-duman-dedektoru-calisir-mi/index.html
          grep -q 'duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu' /tmp/alo186-live/hesaplama/duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu/index.html
          grep -q 'duman-alarmi-pil-yedegi-kesinti-hazirligi' /tmp/alo186-live/amazon-elektrik-urunleri/duman-alarmi-pil-yedegi-kesinti-hazirligi/index.html

      - name: Publish canonical bundle to gh-pages fallback branch
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/alo186-live
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          full_commit_message: 'deploy: ALO186 production ${{ github.sha }}'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/alo186-live

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify canonical live routes
        env:
          CANONICAL_ORIGIN: https://alo186.com
        run: |
          set -euo pipefail
          verify_route() {
            local path="$1"
            local marker="$2"
            local body
            for attempt in $(seq 1 24); do
              body="$(mktemp)"
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                "${CANONICAL_ORIGIN}${path}" -o "$body" \
                && grep -q "$marker" "$body"; then
                rm -f "$body"
                echo "Verified ${CANONICAL_ORIGIN}${path}"
                return 0
              fi
              rm -f "$body"
              sleep 10
            done
            echo "Live verification failed for ${CANONICAL_ORIGIN}${path}" >&2
            return 1
          }
          verify_route '/haberler/elektrik-kesilince-duman-dedektoru-calisir-mi/' 'elektrik-kesilince-duman-dedektoru-calisir-mi'
          verify_route '/hesaplama/duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu/' 'duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu'
          verify_route '/amazon-elektrik-urunleri/duman-alarmi-pil-yedegi-kesinti-hazirligi/' 'duman-alarmi-pil-yedegi-kesinti-hazirligi'

      - name: Checkout main for deployment receipt
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record verified live deployment receipt
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .github/deploy-receipts
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "status": "deployed-and-live-verified",
              "environment": "github-pages",
              "canonicalOrigin": "https://alo186.com",
              "pageUrl": os.environ["PAGE_URL"],
              "sourceSha": os.environ["SOURCE_SHA"],
              "workflowRunId": int(os.environ["RUN_ID"]),
              "workflowRunAttempt": int(os.environ["RUN_ATTEMPT"]),
              "workflowRunUrl": f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
              "deployedAt": datetime.now(timezone.utc).isoformat(),
              "verifiedRoutes": [
                  "https://alo186.com/haberler/elektrik-kesilince-duman-dedektoru-calisir-mi/",
                  "https://alo186.com/hesaplama/duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu/",
                  "https://alo186.com/amazon-elektrik-urunleri/duman-alarmi-pil-yedegi-kesinti-hazirligi/"
              ]
          }
          Path('.github/deploy-receipts/alo186-live.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deploy-receipts/alo186-live.json
          git commit -m "deploy: record verified ALO186 live receipt ${SOURCE_SHA}" || exit 0
          git push origin HEAD:main
