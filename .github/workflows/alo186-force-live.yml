name: ALO186 Force Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo186-force-live.yml'
      - 'alo186/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alo186-force-live.yml'
      - 'alo186/**'

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: alo186-production-pages-${{ github.event_name }}
  cancel-in-progress: true

env:
  CANONICAL_ORIGIN: https://alo186.com

jobs:
  publish:
    name: Publish canonical production to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build production site
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-live
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-live \
            --commit "$GITHUB_SHA"

      - name: Run production smoke test
        continue-on-error: true
        run: |
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-live

      - name: Prepare canonical Pages branch
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/alo186-live/index.html ]]; then
            cp /tmp/alo186-live/elektrik-portali/index.html /tmp/alo186-live/index.html
          fi
          printf 'alo186.com\n' > /tmp/alo186-live/CNAME
          touch /tmp/alo186-live/.nojekyll
          required=(
            '/tmp/alo186-live/index.html'
            '/tmp/alo186-live/haberler/elektrik-kesilince-duman-dedektoru-calisir-mi/index.html'
            '/tmp/alo186-live/hesaplama/duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu/index.html'
            '/tmp/alo186-live/amazon-elektrik-urunleri/duman-alarmi-pil-yedegi-kesinti-hazirligi/index.html'
            '/tmp/alo186-live/haberler/elektrik-kesilince-bodrum-drenaj-pompasi-calisir-mi/index.html'
            '/tmp/alo186-live/hesaplama/bodrum-drenaj-pompasi-elektrik-kesintisi-su-baskini-plani/index.html'
            '/tmp/alo186-live/sektor-rehberi/apartman-otel-bodrum-drenaj-pompasi-kesinti-surekliligi/index.html'
          )
          for file in "${required[@]}"; do
            [[ -s "$file" ]] || { echo "Missing production file: $file" >&2; exit 1; }
          done
          echo "Canonical production bundle is complete."

      - name: Publish bundle to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/alo186-live
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          full_commit_message: 'deploy: ALO186 production ${{ github.sha }}'

      - name: Bind GitHub Pages to gh-pages and alo186.com
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/pages"
          cat > /tmp/pages-create.json <<'JSON'
          {
            "build_type": "legacy",
            "source": {"branch": "gh-pages", "path": "/"}
          }
          JSON
          cat > /tmp/pages-update.json <<'JSON'
          {
            "cname": "alo186.com",
            "build_type": "legacy",
            "source": {"branch": "gh-pages", "path": "/"}
          }
          JSON

          if gh api -H 'X-GitHub-Api-Version: 2022-11-28' "$api" > /tmp/pages-before.json 2> /tmp/pages-get.err; then
            gh api --method PUT \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" --input /tmp/pages-update.json
          else
            cat /tmp/pages-get.err >&2 || true
            gh api --method POST \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" --input /tmp/pages-create.json
            gh api --method PUT \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" --input /tmp/pages-update.json
          fi

          gh api --method POST \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/builds" >/tmp/pages-build.json || true
          gh api -H 'X-GitHub-Api-Version: 2022-11-28' "$api" | tee /tmp/pages-after.json

      - name: Verify canonical live routes
        run: |
          set -euo pipefail
          verify_route() {
            local path="$1"
            local marker="$2"
            local body
            for attempt in $(seq 1 36); do
              body="$(mktemp)"
              if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                "${CANONICAL_ORIGIN}${path}" -o "$body" \
                && grep -q "$marker" "$body"; then
                rm -f "$body"
                echo "Verified ${CANONICAL_ORIGIN}${path}"
                return 0
              fi
              rm -f "$body"
              sleep 10
            done
            echo "Live verification failed for ${CANONICAL_ORIGIN}${path}" >&2
            return 1
          }
          verify_route '/haberler/elektrik-kesilince-duman-dedektoru-calisir-mi/' 'elektrik-kesilince-duman-dedektoru-calisir-mi'
          verify_route '/hesaplama/duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu/' 'duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu'
          verify_route '/amazon-elektrik-urunleri/duman-alarmi-pil-yedegi-kesinti-hazirligi/' 'duman-alarmi-pil-yedegi-kesinti-hazirligi'

      - name: Write verified deployment receipt artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "status": "deployed-and-live-verified",
              "canonicalOrigin": os.environ["CANONICAL_ORIGIN"],
              "sourceSha": os.environ["GITHUB_SHA"],
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "deployedAt": datetime.now(timezone.utc).isoformat(),
              "source": {"branch": "gh-pages", "path": "/"},
              "verifiedRoutes": [
                  "https://alo186.com/haberler/elektrik-kesilince-duman-dedektoru-calisir-mi/",
                  "https://alo186.com/hesaplama/duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu/",
                  "https://alo186.com/amazon-elektrik-urunleri/duman-alarmi-pil-yedegi-kesinti-hazirligi/"
              ]
          }
          Path('/tmp/alo186-live-receipt.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Upload live verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-verification-${{ github.run_id }}
          path: /tmp/alo186-live-receipt.json
          retention-days: 30
