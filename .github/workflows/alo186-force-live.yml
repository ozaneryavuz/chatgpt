name: ALO186 Force Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo186-force-live.yml'
      - 'alo186/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alo186-production-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build canonical production bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build production site
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-live
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-live \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-live
          printf 'alo186.com\n' > /tmp/alo186-live/CNAME
          touch /tmp/alo186-live/.nojekyll
          test -f /tmp/alo186-live/index.html
          test -f /tmp/alo186-live/haberler/elektrik-kesilince-duman-dedektoru-calisir-mi/index.html
          test -f /tmp/alo186-live/hesaplama/duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu/index.html
          test -f /tmp/alo186-live/amazon-elektrik-urunleri/duman-alarmi-pil-yedegi-kesinti-hazirligi/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/alo186-live

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
