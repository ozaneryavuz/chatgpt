name: ALO186 AI CMS — insan onayı ve canonical hazırlık

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: alo186-ai-cms-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/cms approve ')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Yetki ve komut doğrulaması
        id: request
        shell: bash
        run: |
          set -euo pipefail
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) echo "Yalnız repository yetkilisi AI CMS içeriğini onaylayabilir." >&2; exit 1 ;;
          esac
          slug=$(python - <<'PY'
          import os,re
          body=os.environ['COMMENT_BODY'].strip()
          match=re.fullmatch(r'/cms approve ([a-z0-9]+(?:-[a-z0-9]+)*)', body)
          if not match:
              raise SystemExit('Komut tam olarak /cms approve <slug> biçiminde olmalıdır.')
          print(match.group(1))
          PY
          )
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          state=$(jq -r '.state' <<<"$metadata")
          head_repo=$(jq -r '.head.repo.full_name' <<<"$metadata")
          head_ref=$(jq -r '.head.ref' <<<"$metadata")
          test "$state" = 'open' || { echo 'PR açık değil.' >&2; exit 1; }
          test "$head_repo" = "$GITHUB_REPOSITORY" || { echo 'Fork PR üzerinde write-token onayı kapalıdır.' >&2; exit 1; }
          [[ "$head_ref" == ai-cms/* ]] || { echo 'PR branch adı ai-cms/ ile başlamıyor.' >&2; exit 1; }
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: PR branch checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.head_ref }}
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kayıt ve branch bütünlüğü
        id: state
        shell: bash
        env:
          CMS_SLUG: ${{ steps.request.outputs.slug }}
        run: |
          set -euo pipefail
          test -f "alo186/ai-cms/content/$CMS_SLUG.json" || { echo 'CMS içerik kaydı PR branchinde yok.' >&2; exit 1; }
          record_slug=$(jq -r '.slug' "alo186/ai-cms/content/$CMS_SLUG.json")
          record_state=$(jq -r '.state' "alo186/ai-cms/content/$CMS_SLUG.json")
          test "$record_slug" = "$CMS_SLUG" || { echo 'Komut slugı ile içerik kaydı uyuşmuyor.' >&2; exit 1; }
          case "$record_state" in
            review|approved) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            published) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Onaylanabilir state bekleniyordu; görülen: $record_state" >&2; exit 1 ;;
          esac
          echo "record_state=$record_state" >> "$GITHUB_OUTPUT"

      - name: AI CMS birim testleri
        if: steps.state.outputs.changed == 'true'
        run: python -m unittest discover -s alo186/ai-cms/tests -p 'test_*.py' -v

      - name: İnsan onayı ve canonical dosyaları
        if: steps.state.outputs.changed == 'true'
        shell: bash
        env:
          CMS_SLUG: ${{ steps.request.outputs.slug }}
        run: |
          set -euo pipefail
          state=$(jq -r '.state' "alo186/ai-cms/content/$CMS_SLUG.json")
          if [ "$state" = 'review' ]; then
            python alo186/ai-cms/cms.py approve \
              --slug "$CMS_SLUG" \
              --reviewer "$GITHUB_ACTOR" \
              --pr "$PR_NUMBER"
          fi
          python alo186/ai-cms/cms.py publish --slug "$CMS_SLUG"
          python alo186/ai-cms/cms.py validate --slug "$CMS_SLUG" --write
          python alo186/ai-cms/cms.py dashboard --output /tmp/alo186-ai-cms-dashboard.html
          test -f "alo186/haberler/$CMS_SLUG/index.html"
          test -f "alo186/deployment/routing-overlays/ai-cms-$CMS_SLUG.json"
          grep -q "data-ai-cms-id" "alo186/haberler/$CMS_SLUG/index.html"
          grep -q '"humanApproved": true' "alo186/deployment/routing-overlays/ai-cms-$CMS_SLUG.json"

      - name: Canonical production build ve smoke
        if: steps.state.outputs.changed == 'true'
        shell: bash
        env:
          CMS_SLUG: ${{ steps.request.outputs.slug }}
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-ai-cms-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-ai-cms-canonical
          test -f "/tmp/alo186-ai-cms-canonical/haberler/$CMS_SLUG/index.html"
          grep -q "data-ai-cms-id" "/tmp/alo186-ai-cms-canonical/haberler/$CMS_SLUG/index.html"
          grep -q "https://alo186.com/haberler/$CMS_SLUG" /tmp/alo186-ai-cms-canonical/sitemap.xml

      - name: Onaylı dosyaları aynı PR branchine gönder
        if: steps.state.outputs.changed == 'true'
        shell: bash
        env:
          CMS_SLUG: ${{ steps.request.outputs.slug }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "alo186/ai-cms/content/$CMS_SLUG.json" \
            "alo186/ai-cms/reviews/$CMS_SLUG.md" \
            "alo186/haberler/$CMS_SLUG/index.html" \
            "alo186/deployment/routing-overlays/ai-cms-$CMS_SLUG.json"
          git add -u "alo186/ai-cms/previews/$CMS_SLUG.html" || true
          git commit -m "cms(alo186): $CMS_SLUG için insan onaylı canonical yayın"
          git push origin "HEAD:${{ steps.request.outputs.head_ref }}"

      - name: Dashboard artifactı
        if: steps.state.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alo186-ai-cms-approved-${{ steps.request.outputs.slug }}-${{ github.run_id }}
          path: |
            /tmp/alo186-ai-cms-dashboard.html
            /tmp/alo186-ai-cms-canonical/alo186-release.json
            /tmp/alo186-ai-cms-canonical/haberler/${{ steps.request.outputs.slug }}/index.html
          if-no-files-found: error
          retention-days: 30

      - name: PR sonucunu bildir
        shell: bash
        env:
          CMS_SLUG: ${{ steps.request.outputs.slug }}
          CHANGED: ${{ steps.state.outputs.changed }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" = 'true' ]; then
            gh pr comment "$PR_NUMBER" --body "✅ **AI CMS insan onayı kaydedildi.** \`$CMS_SLUG\` için canonical HTML ve routing overlay aynı PR branchine eklendi. Yeni commit üzerindeki zorunlu kontroller başarılı olmadan merge etmeyin. AI CMS otomatik merge yapmaz."
          else
            gh pr comment "$PR_NUMBER" --body "ℹ️ \`$CMS_SLUG\` zaten published durumda; duplicate onay işlemi yapılmadı."
          fi
