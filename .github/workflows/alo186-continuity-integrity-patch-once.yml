name: ALO186 süreklilik API bütünlük düzeltmesi

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo186-continuity-integrity-patch-once.yml'
      - 'alo186/sureklilik-api/PATCH_INTEGRITY.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-continuity-api-integrity
          fetch-depth: 0

      - name: API guardlarını uygula
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('alo186/sureklilik-api/app/main.py')
          text = main_path.read_text(encoding='utf-8')
          replacements = [
              ('from sqlalchemy import select', 'from sqlalchemy import func, select'),
              (
                  '''    if membership:\n        membership.role = payload.role\n    else:\n''',
                  '''    if membership:\n        if membership.role == Role.admin and payload.role != Role.admin:\n            admin_count = db.scalar(\n                select(func.count(Membership.id)).where(\n                    Membership.organization_id == organization_id,\n                    Membership.role == Role.admin,\n                )\n            ) or 0\n            if admin_count <= 1:\n                raise HTTPException(\n                    status_code=409,\n                    detail="Kuruluşun son yöneticisinin rolü düşürülemez.",\n                )\n        membership.role = payload.role\n    else:\n''',
              ),
              (
                  '    asset.last_test_at = tested_at\n',
                  '    if asset.last_test_at is None or tested_at > asset.last_test_at:\n        asset.last_test_at = tested_at\n',
              ),
              (
                  '''    if not incident:\n        raise HTTPException(status_code=404, detail="Olay bulunamadı.")\n    missing = [task.title for task in incident.tasks if task.is_required and task.status != TaskStatus.completed]\n''',
                  '''    if not incident:\n        raise HTTPException(status_code=404, detail="Olay bulunamadı.")\n    if incident.status == IncidentStatus.closed:\n        return incident\n    missing = [task.title for task in incident.tasks if task.is_required and task.status != TaskStatus.completed]\n''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  if new in text:
                      continue
                  raise SystemExit(f'Beklenen kod parçası bulunamadı:\n{old}')
              text = text.replace(old, new, 1)
          main_path.write_text(text, encoding='utf-8')
          PY

      - name: Python sözdizimi ön kontrolü
        run: python -m compileall -q alo186/sureklilik-api/app alo186/sureklilik-api/tests

      - name: Değişiklikleri düzeltme dalına kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alo186/sureklilik-api/app/main.py
          if git diff --cached --quiet; then
            echo 'Değişiklik bulunmadı.'
          else
            git commit -m 'fix(alo186): süreklilik API veri bütünlüğü guardlarını ekle'
            git push origin HEAD:fix/alo186-continuity-api-integrity
          fi
