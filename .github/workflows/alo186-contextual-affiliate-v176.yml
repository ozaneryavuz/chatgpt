name: ALO186 bağlamsal affiliate ürün haritası v176 — canlı entegrasyon

on:
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/konuya-gore-urun-haritasi/**'
      - 'alo186/deployment/contextual-affiliate-v176-payload/**'
      - 'alo186/deployment/routing-overlays/176-contextual-affiliate-product-map.json'
      - 'alo186/deployment/inject_contextual_affiliate_v176.py'
      - 'alo186/tests/test_contextual_affiliate_v176.py'
      - '.github/workflows/alo186-contextual-affiliate-v176.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/konuya-gore-urun-haritasi/**'
      - 'alo186/deployment/contextual-affiliate-v176-payload/**'
      - 'alo186/deployment/routing-overlays/176-contextual-affiliate-product-map.json'
      - 'alo186/deployment/inject_contextual_affiliate_v176.py'
      - 'alo186/tests/test_contextual_affiliate_v176.py'
      - '.github/workflows/alo186-contextual-affiliate-v176.yml'
  workflow_run:
    workflows: ['ALO186 GitHub Pages — sunucusuz canlı yayın']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: contextual-affiliate-v176-${{ github.event_name == 'workflow_run' && 'live' || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kaynak ve custom/project artifact kabulü
        run: |
          set -euo pipefail
          python -m py_compile alo186/deployment/inject_contextual_affiliate_v176.py alo186/tests/test_contextual_affiliate_v176.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('alo186/deployment').resolve()))
          import inject_contextual_affiliate_v176 as module
          catalog = module.embedded_catalog()
          assert catalog['version'] == 176
          assert catalog['affiliateTag'] == 'alo186rehber-21'
          assert len(catalog['groups']) == 13
          assert sum(len(group['products']) for group in catalog['groups']) == 86
          assert catalog['policy']['toolFirst']
          assert catalog['policy']['existingProductSufficientNoBuy']
          assert catalog['policy']['activeHazardCommercialPathClosed']
          PY
          python alo186/tests/test_contextual_affiliate_v176.py
      - uses: actions/upload-artifact@v4
        with:
          name: alo186-contextual-affiliate-v176
          path: /tmp/alo186-contextual-affiliate-v176
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  deploy_after_pages:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: pages
        uses: actions/configure-pages@v5
      - name: Geliştirilmiş canlı artifactı oluştur
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BASE: ${{ steps.pages.outputs.base_path }}
          GA4: ${{ vars.ALO186_GA4_MEASUREMENT_ID || 'G-639TVHL0LC' }}
        run: |
          set -euo pipefail
          SITE=/tmp/alo186-contextual-live
          python alo186/deployment/build_static_site.py --output "$SITE" --commit "$TARGET_SHA"
          python alo186/deployment/prepare_github_pages.py --site "$SITE" --base-path "$BASE" --repository "$GITHUB_REPOSITORY" --commit "$TARGET_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site "$SITE" --base-path "$BASE"
          python alo186/deployment/inject_shortlist_growth.py --site "$SITE" --base-path "$BASE"
          python alo186/deployment/inject_contextual_affiliate_v176.py --site "$SITE" --base-path "$BASE" | tee /tmp/contextual-v176.json
          python alo186/deployment/smoke_github_pages.py --site "$SITE" --base-path "$BASE"
          python alo186/deployment/guard_commerce_routes_v3.py --site "$SITE" | tee /tmp/contextual-guard.json
          python alo186/deployment/inject_live_quality_hardening_v2.py --site "$SITE" --base-path "$BASE"
          python alo186/deployment/inject_ga4_consent.py --site "$SITE" --base-path "$BASE" --measurement-id "$GA4"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/alo186-contextual-live
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Canlı rota makbuzu
        id: live_receipt
        run: |
          set -euo pipefail
          url='https://alo186.com/amazon-elektrik-urunleri/konuya-gore-urun-haritasi/'
          ok=0
          verified_attempt=0
          for attempt in $(seq 1 24); do
            body=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${url}?v=${GITHUB_RUN_ID}-${attempt}" || true)
            if grep -q 'data-alo186-product-map-v176="true"' <<<"$body" && grep -q 'alo186rehber-21' <<<"$body"; then
              ok=1
              verified_attempt=$attempt
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
          echo "verified_attempt=$verified_attempt" >> "$GITHUB_OUTPUT"
          echo "verified_url=$url" >> "$GITHUB_OUTPUT"
      - name: Doğrulanmış canlı makbuzu PR üzerinde yayımla
        uses: actions/github-script@v7
        env:
          VERIFIED_URL: ${{ steps.live_receipt.outputs.verified_url }}
          VERIFIED_ATTEMPT: ${{ steps.live_receipt.outputs.verified_attempt }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- alo186-contextual-v176-live-receipt -->';
            const contextual = JSON.parse(fs.readFileSync('/tmp/contextual-v176.json', 'utf8'));
            const guard = JSON.parse(fs.readFileSync('/tmp/contextual-guard.json', 'utf8'));
            const body = `${marker}
            ## ALO186 v176 canlı yayın makbuzu

            - Kaynak commit: \`${process.env.TARGET_SHA}\`
            - GitHub Pages çıktısı: \`${process.env.PAGE_URL}\`
            - Canlı rota: \`${process.env.VERIFIED_URL}\`
            - Cache-bypass doğrulama denemesi: **${process.env.VERIFIED_ATTEMPT}**
            - v176 ürün haritası işareti: **doğrulandı**
            - Amazon satış ortaklığı etiketi \`alo186rehber-21\`: **doğrulandı**
            - Ürün sınıfı: **${contextual.catalogProductClassCount}**
            - İhtiyaç grubu: **${contextual.groupCount}**
            - Bağlamsal sayfa: **${contextual.contextualPageCount}**
            - Bağlamsal kart: **${contextual.contextualCardCount}**
            - Kullanılan farklı ürün sınıfı: **${contextual.uniqueProductsPlaced}**
            - Commerce guard hatası: **${guard.errorCount}**
            - Kişisel veri alanı eklendi: **hayır**
            - Resmî kurum iddiası: **hayır**

            Bu makbuz gerçek production origin üzerinde, dağıtımdan sonra ve önbellek atlatan HTTP istekleriyle oluşturuldu.`;
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 606,
              per_page: 100,
            });
            const existing = comments.find(item => item.body && item.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 606,
                body,
              });
            }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-contextual-affiliate-v176-live-receipt
          path: |
            /tmp/contextual-v176.json
            /tmp/contextual-guard.json
          if-no-files-found: warn
          retention-days: 30
