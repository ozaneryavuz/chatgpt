name: ALO186 bağlamsal affiliate ürün haritası v176 — canlı entegrasyon

on:
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/konuya-gore-urun-haritasi/**'
      - 'alo186/deployment/contextual-affiliate-v176-payload/**'
      - 'alo186/deployment/routing-overlays/176-contextual-affiliate-product-map.json'
      - 'alo186/deployment/inject_contextual_affiliate_v176.py'
      - 'alo186/deployment/verify_contextual_affiliate_live_v176.py'
      - 'alo186/tests/test_contextual_affiliate_v176.py'
      - 'alo186/tests/test_contextual_affiliate_live_v176.py'
      - '.github/workflows/alo186-contextual-affiliate-v176.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/konuya-gore-urun-haritasi/**'
      - 'alo186/deployment/contextual-affiliate-v176-payload/**'
      - 'alo186/deployment/routing-overlays/176-contextual-affiliate-product-map.json'
      - 'alo186/deployment/inject_contextual_affiliate_v176.py'
      - 'alo186/deployment/verify_contextual_affiliate_live_v176.py'
      - 'alo186/tests/test_contextual_affiliate_v176.py'
      - 'alo186/tests/test_contextual_affiliate_live_v176.py'
      - '.github/workflows/alo186-contextual-affiliate-v176.yml'
  workflow_run:
    workflows: ['ALO186 GitHub Pages — sunucusuz canlı yayın']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: contextual-affiliate-v176-${{ github.event_name == 'workflow_run' && 'live' || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kaynak ve custom/project artifact kabulü
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/deployment/inject_contextual_affiliate_v176.py \
            alo186/deployment/verify_contextual_affiliate_live_v176.py \
            alo186/tests/test_contextual_affiliate_v176.py \
            alo186/tests/test_contextual_affiliate_live_v176.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('alo186/deployment').resolve()))
          import inject_contextual_affiliate_v176 as module
          catalog = module.embedded_catalog()
          assert catalog['version'] == 176
          assert catalog['affiliateTag'] == 'alo186rehber-21'
          assert len(catalog['groups']) == 13
          assert sum(len(group['products']) for group in catalog['groups']) == 86
          assert catalog['policy']['toolFirst']
          assert catalog['policy']['existingProductSufficientNoBuy']
          assert catalog['policy']['activeHazardCommercialPathClosed']
          PY
          python alo186/tests/test_contextual_affiliate_live_v176.py
          python alo186/tests/test_contextual_affiliate_v176.py
      - uses: actions/upload-artifact@v4
        with:
          name: alo186-contextual-affiliate-v176
          path: /tmp/alo186-contextual-affiliate-v176
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  verify_live_after_publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LIVE_ORIGIN: https://alo186.com
      LIVE_ALIAS_ORIGIN: https://www.alo186.com
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aynı commit için doğrulanmış referans artifactı oluştur
        run: |
          set -euo pipefail
          SITE=/tmp/alo186-contextual-reference
          python alo186/deployment/build_static_site.py --output "$SITE" --commit "$TARGET_SHA"
          python alo186/deployment/prepare_github_pages.py \
            --site "$SITE" \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$TARGET_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_contextual_affiliate_v176.py \
            --site "$SITE" \
            --base-path '' \
            | tee /tmp/contextual-v176.json
          python alo186/deployment/smoke_github_pages.py --site "$SITE" --base-path ''
          python alo186/deployment/guard_commerce_routes_v3.py \
            --site "$SITE" \
            | tee /tmp/contextual-guard.json

      - name: Gerçek canlı hosting modunu doğrula
        id: live_origin
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python alo186/deployment/verify_live_origin.py \
            --origin "$LIVE_ORIGIN" \
            --alias-origin "$LIVE_ALIAS_ORIGIN" \
            --expected-commit "$TARGET_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --github-token "$GITHUB_TOKEN" \
            --receipt /tmp/alo186-live-origin-receipt.json \
            --diagnostics /tmp/alo186-live-origin-diagnostics \
            --attempts 3 \
            --sleep-seconds 5

      - name: v176 ürün haritasını gerçek production origin üzerinde doğrula
        id: live_v176
        continue-on-error: true
        run: |
          set -euo pipefail
          python alo186/deployment/verify_contextual_affiliate_live_v176.py \
            --origin "$LIVE_ORIGIN" \
            --receipt /tmp/alo186-v176-live-receipt.json \
            --diagnostics /tmp/alo186-v176-live-diagnostics \
            --attempts 24 \
            --sleep-seconds 10

      - name: Doğrulanmış canlı makbuzu PR #606 üzerinde yayımla
        if: >-
          always() &&
          steps.live_origin.outcome == 'success' &&
          steps.live_v176.outcome == 'success'
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        with:
          script: |
            const fs = require('fs');
            const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
            const contextual = read('/tmp/contextual-v176.json');
            const guard = read('/tmp/contextual-guard.json');
            const origin = read('/tmp/alo186-live-origin-receipt.json');
            const live = read('/tmp/alo186-v176-live-receipt.json');
            const marker = '<!-- alo186-contextual-v176-live-receipt -->';
            const body = `${marker}
            ## ALO186 v176 canlı yayın makbuzu

            - Kaynak commit: \`${process.env.TARGET_SHA}\`
            - Canlı hosting modu: **${origin.mode}**
            - Platform imzası: \`${origin.platformSignature || 'github-pages'}\`
            - Canlı rota: \`${live.origin}${live.route}\`
            - Cache-bypass doğrulama denemesi: **${live.verifiedAttempt}**
            - HTML SHA-256: \`${live.htmlSha256}\`
            - v176 ürün haritası işareti: **doğrulandı**
            - Amazon etiketi \`${live.affiliateTag}\`: **doğrulandı**
            - Ürün sınıfı: **${live.productClassCount}**
            - İhtiyaç grubu: **${contextual.groupCount}**
            - Bağlamsal sayfa: **${contextual.contextualPageCount}**
            - Bağlamsal kart: **${contextual.contextualCardCount}**
            - Kullanılan farklı ürün sınıfı: **${contextual.uniqueProductsPlaced}**
            - Commerce guard hatası: **${guard.errorCount}**
            - Kişisel veri alanı eklendi: **hayır**
            - Resmî kurum iddiası: **hayır**

            Makbuz, gerçek production origin üzerinde ve önbellek atlatan HTTP istekleriyle oluşturuldu.`;
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 606,
              per_page: 100,
            });
            const existing = comments.find(item => item.body && item.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 606,
                body,
              });
            }

      - name: Canlı blokajı PR #606 ve P0 issue #21 üzerinde görünür kıl
        if: >-
          always() &&
          (steps.live_origin.outcome != 'success' || steps.live_v176.outcome != 'success')
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
          ORIGIN_OUTCOME: ${{ steps.live_origin.outcome }}
          V176_OUTCOME: ${{ steps.live_v176.outcome }}
        with:
          script: |
            const fs = require('fs');
            const safeRead = (path) => {
              try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
              catch (_) { return {}; }
            };
            const origin = safeRead('/tmp/alo186-live-origin-receipt.json');
            const live = safeRead('/tmp/alo186-v176-live-receipt.json');
            const lastError = Array.isArray(live.errors) && live.errors.length
              ? live.errors[live.errors.length - 1].error
              : 'Canlı rota makbuzu üretilemedi.';
            const marker = '<!-- alo186-v176-live-blocker -->';
            const body = `${marker}
            ## ALO186 v176 canlı yayın blokajı

            - Kaynak commit: \`${process.env.TARGET_SHA}\`
            - Hosting doğrulaması: **${process.env.ORIGIN_OUTCOME}**
            - v176 rota doğrulaması: **${process.env.V176_OUTCOME}**
            - Algılanan canlı mod: **${origin.mode || 'doğrulanamadı'}**
            - Platform imzası: \`${origin.platformSignature || 'yok'}\`
            - Son hata: **${lastError}**
            - Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            Kaynak ve custom/project artifact kontrolleri başarılıdır; bu kayıt gerçek production origin ile kaynak arasındaki yayın farkını fail-closed biçimde görünür kılar. Başarı makbuzu yalnız v176 DOM işareti, 86 ürün kartı, affiliate etiketi ve bağlantı güvenliği canlı rotada birlikte doğrulanırsa oluşturulur.`;
            async function upsert(issueNumber) {
              const {data: comments} = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const existing = comments.find(item => item.body && item.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body,
                });
              }
            }
            await upsert(606);
            await upsert(21);

      - name: Canlı doğrulama raporlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-contextual-affiliate-v176-live-receipt
          path: |
            /tmp/contextual-v176.json
            /tmp/contextual-guard.json
            /tmp/alo186-live-origin-receipt.json
            /tmp/alo186-v176-live-receipt.json
            /tmp/alo186-live-origin-diagnostics
            /tmp/alo186-v176-live-diagnostics
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Fail-closed canlı kabul sonucu
        if: always()
        env:
          ORIGIN_OUTCOME: ${{ steps.live_origin.outcome }}
          V176_OUTCOME: ${{ steps.live_v176.outcome }}
        run: |
          set -euo pipefail
          test "$ORIGIN_OUTCOME" = success
          test "$V176_OUTCOME" = success
