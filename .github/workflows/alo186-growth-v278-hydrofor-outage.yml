name: ALO186 hidrofor kesinti güvenliği v278

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-hidrofor-calisir-mi/**'
      - 'alo186/hesaplama/hidrofor-elektrik-kesintisi-su-surekliligi-plani/**'
      - 'alo186/deployment/routing-overlays/growth-v278-hydrofor-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/hydrofor-outage-v278.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v278_hydrofor_outage.py'
      - '.github/workflows/alo186-growth-v278-hydrofor-outage.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-hidrofor-calisir-mi/**'
      - 'alo186/hesaplama/hidrofor-elektrik-kesintisi-su-surekliligi-plani/**'
      - 'alo186/deployment/routing-overlays/growth-v278-hydrofor-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/hydrofor-outage-v278.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v278_hydrofor_outage.py'
      - '.github/workflows/alo186-growth-v278-hydrofor-outage.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v278-hydrofor-outage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Hidrofor güvenlik, gizlilik ve ticari sınır
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v278_hydrofor_outage.py
          python alo186/tests/test_growth_v278_hydrofor_outage.py
          python -m json.tool alo186/deployment/routing-overlays/growth-v278-hydrofor-outage.json >/dev/null
          python -m json.tool alo186/deployment/affiliate-category-decisions/hydrofor-outage-v278.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v278
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v278 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v278
          test -f /tmp/alo186-v278/haberler/elektrik-kesilince-hidrofor-calisir-mi/index.html
          test -f /tmp/alo186-v278/hesaplama/hidrofor-elektrik-kesintisi-su-surekliligi-plani/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v278
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v278 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-sites-v278')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-hidrofor-calisir-mi/',
              '/hesaplama/hidrofor-elektrik-kesintisi-su-surekliligi-plani/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for path in expected:
              assert not pages[path]['affiliate']['unsafeStaticLinks']
              assert pages[path]['affiliate']['hasAffiliateLinks'] is False
          print(json.dumps({'ok': True, 'routes': sorted(expected), 'directAffiliateLinks': 0}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v278 hidrofor kesinti güvenliği

          - Arama niyeti: elektrik kesilince hidrofor çalışır mı / apartmanda su akar mı / hidrofor için UPS
          - Ücretsiz araç: sistem, depo, kuru çalışma, gerçek test ve profesyonel kapsam
          - Mevcut çözüm yeterliyse: yeni ürün almayın
          - Hidrofor/UPS/jeneratör/transfer: consumer affiliate değil, professional-only
          - Fiyat, stok, puan, yorum, teslimat, garanti, Offer ve AggregateRating: yok
          - 30/90/365 günlük tekrar ziyaret: yerel takvim dosyası
          EOF
