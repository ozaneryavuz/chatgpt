name: ALO186 v211 sync main

on:
  push:
    branches:
      - agent/affiliate-measurement-v211
    paths:
      - '.github/workflows/alo186-v211-sync-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alo186-v211-sync-main
  cancel-in-progress: false

jobs:
  merge-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/affiliate-measurement-v211
          fetch-depth: 0
      - name: Ana dalı birleştir ve doğrulanmış 30 günlük içeriği koru
        run: |
          set -euo pipefail
          HEAD_REF='agent/affiliate-measurement-v211'
          TARGET='alo186/haberler/elektrik-kesintisi-gerilim-dalgalanmasi-cihaz-hasari-edas-tazminat-basvurusu/index.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main "$HEAD_REF"
          set +e
          git merge --no-ff --no-commit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "$TARGET"
            git checkout --ours -- "$TARGET"
            git add "$TARGET"
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          grep -q 'zararın ortaya çıktığı tarihten itibaren 30 gün içinde' "$TARGET"
          ! grep -Eqi '10 iş günlük|on iş günü içinde dağıtım şirketine talep|Ten Business Days' "$TARGET"
          git commit -m 'Merge main into ALO186 affiliate measurement v211'
          git push origin HEAD:"$HEAD_REF"
