name: ALO186 run9 canonical gelir altyapısı tek seferlik uygulama

on:
  push:
    branches: [main]
    paths:
      - '.github/alo186-run9-canonical-revenue-foundation.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alo186-run9-canonical-revenue-foundation
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Canonical niyet birleştirmelerini sabit committen al
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/alo186-content-canonical-ci-hotfix
          expected='399366f3c8128ba6fd9a4dd33ccf9b0f400254da'
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          git checkout "$expected" -- \
            alo186/deployment/content-consolidations.json \
            .github/workflows/alo186-content-intent-consolidation.yml

      - name: Aktif release rotalarını sitemap ile son aşamada uzlaştır
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('alo186/deployment/inject_shortlist_growth.py')
          text = path.read_text(encoding='utf-8')

          if 'import xml.etree.ElementTree as ET' not in text:
              text = text.replace('import re\n', 'import re\nimport xml.etree.ElementTree as ET\n', 1)
          if 'from urllib.parse import urlsplit' not in text:
              text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nfrom urllib.parse import urlsplit\n', 1)

          helper = '''\n\ndef reconcile_sitemap_with_release(site: Path) -> dict:\n    sitemap_path = site / "sitemap.xml"\n    release_path = site / "alo186-release.json"\n    if not sitemap_path.is_file() or not release_path.is_file():\n        raise FileNotFoundError("Sitemap veya release envanteri bulunamadı")\n\n    tree = ET.parse(sitemap_path)\n    root = tree.getroot()\n    namespace = root.tag.split("}")[0].strip("{") if "}" in root.tag else ""\n    ns = f"{{{namespace}}}" if namespace else ""\n    release = json.loads(release_path.read_text(encoding="utf-8"))\n\n    def normalized_path(value: str) -> str:\n        path = urlsplit(str(value or "")).path or "/"\n        return path.rstrip("/") or "/"\n\n    present: set[str] = set()\n    for node in root.findall(f"{ns}url"):\n        loc = node.find(f"{ns}loc")\n        if loc is not None and loc.text:\n            present.add(normalized_path(loc.text))\n\n    added: list[str] = []\n    for route in release.get("routes", []):\n        canonical_path = str(route.get("canonicalPath") or "").strip()\n        if not canonical_path:\n            continue\n        route_path = normalized_path(canonical_path)\n        if route_path in present:\n            continue\n        url = ET.SubElement(root, f"{ns}url")\n        loc = ET.SubElement(url, f"{ns}loc")\n        loc.text = f"https://www.alo186.com{canonical_path}"\n        present.add(route_path)\n        added.append(canonical_path)\n\n    ET.register_namespace("", namespace)\n    ET.indent(tree, space="  ")\n    tree.write(sitemap_path, encoding="utf-8", xml_declaration=True)\n    return {\n        "activeRouteCount": len(release.get("routes", [])),\n        "addedCount": len(added),\n        "added": added,\n        "policy": "active-release-routes-must-exist-in-sitemap",\n    }\n'''
          if 'def reconcile_sitemap_with_release(' not in text:
              marker = '\n\ndef recompute(site: Path) -> None:\n'
              if marker not in text:
                  raise SystemExit('recompute ekleme noktası bulunamadı')
              text = text.replace(marker, helper + marker, 1)

          old = '    growth_run21 = run_growth_run21(site, base_path)\n    return {'
          new = '    growth_run21 = run_growth_run21(site, base_path)\n    sitemap_reconciliation = reconcile_sitemap_with_release(site)\n    recompute(site)\n    return {'
          if 'sitemap_reconciliation = reconcile_sitemap_with_release(site)' not in text:
              if old not in text:
                  raise SystemExit('growth run21 dönüş noktası bulunamadı')
              text = text.replace(old, new, 1)

          old_return = '        "growthRun21": growth_run21,\n'
          if '"sitemapReconciliation": sitemap_reconciliation' not in text:
              if old_return not in text:
                  raise SystemExit('return sözleşmesi ekleme noktası bulunamadı')
              text = text.replace(old_return, old_return + '        "sitemapReconciliation": sitemap_reconciliation,\n', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Kalıcı sitemap uzlaştırma regresyonunu ekle
        shell: bash
        run: |
          set -euo pipefail
          cat > alo186/tests/test_release_sitemap_reconciliation.py <<'PY'
          from __future__ import annotations

          import json
          import sys
          import tempfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit

          ROOT = Path(__file__).resolve().parents[2]
          sys.path.insert(0, str(ROOT / 'alo186' / 'deployment'))

          from inject_shortlist_growth import reconcile_sitemap_with_release


          def main() -> None:
              with tempfile.TemporaryDirectory() as directory:
                  site = Path(directory)
                  site.joinpath('sitemap.xml').write_text(
                      '<?xml version="1.0" encoding="utf-8"?>\n'
                      '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
                      '<url><loc>https://alo186.com/existing</loc></url>'
                      '</urlset>',
                      encoding='utf-8',
                  )
                  routes = [
                      {'canonicalPath': '/existing', 'source': 'alo186/existing/index.html', 'type': 'article'},
                      {
                          'canonicalPath': '/haberler/elektrik-ark-hatasi-afdd-rcd-sigorta-farki',
                          'source': 'alo186/haberler/elektrik-ark-hatasi-afdd-rcd-sigorta-farki/index.html',
                          'type': 'article',
                      },
                  ]
                  site.joinpath('alo186-release.json').write_text(
                      json.dumps({'routes': routes}, ensure_ascii=False), encoding='utf-8'
                  )

                  result = reconcile_sitemap_with_release(site)
                  assert result['addedCount'] == 1, result
                  assert result['activeRouteCount'] == 2, result
                  tree = ET.parse(site / 'sitemap.xml')
                  paths = {
                      (urlsplit(node.text or '').path.rstrip('/') or '/')
                      for node in tree.getroot().iter()
                      if node.tag.endswith('loc')
                  }
                  assert '/existing' in paths
                  assert '/haberler/elektrik-ark-hatasi-afdd-rcd-sigorta-farki' in paths
              print({'ok': True, 'policy': 'active release routes reconciled after growth injectors'})


          if __name__ == '__main__':
              main()
          PY

      - name: Canonical workflow'a bütün aktif rota kontrolünü ekle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/alo186-content-intent-consolidation.yml')
          text = path.read_text(encoding='utf-8')
          anchor = "              assert release['routeCount']==len(release['routes'])\n"
          addition = '''              from urllib.parse import urlsplit\n              import xml.etree.ElementTree as ET\n              sitemap_paths={\n                  (urlsplit(node.text or '').path.rstrip('/') or '/')\n                  for node in ET.fromstring(sitemap).iter()\n                  if node.tag.endswith('loc')\n              }\n              active_paths={\n                  (urlsplit(str(item.get('canonicalPath') or '')).path.rstrip('/') or '/')\n                  for item in release['routes']\n              }\n              assert active_paths <= sitemap_paths, ('release-routes-missing-from-sitemap', sorted(active_paths-sitemap_paths))\n'''
          if 'release-routes-missing-from-sitemap' not in text:
              if anchor not in text:
                  raise SystemExit('workflow release rota doğrulama noktası bulunamadı')
              text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Regresyon, canonical paket ve GitHub Pages kabulü
        shell: bash
        run: |
          set -euo pipefail
          python alo186/tests/test_release_sitemap_reconciliation.py
          python alo186/tests/test_content_intent_consolidation.py
          python -m py_compile alo186/deployment/inject_shortlist_growth.py
          node alo186/tests/test_release_manifest.js
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-run9-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-run9-canonical
          cp -a /tmp/alo186-run9-canonical /tmp/alo186-run9-pages
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-run9-pages \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-run9-pages \
            --base-path ''
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-run9-pages \
            --base-path '' \
            > /tmp/alo186-run9-result.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-run9-pages \
            --base-path ''
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path('/tmp/alo186-run9-pages')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          result = json.loads(Path('/tmp/alo186-run9-result.json').read_text(encoding='utf-8'))
          sitemap = ET.parse(root / 'sitemap.xml')
          paths = {
              (urlsplit(node.text or '').path.rstrip('/') or '/')
              for node in sitemap.getroot().iter()
              if node.tag.endswith('loc')
          }
          active = {
              (urlsplit(str(item.get('canonicalPath') or '')).path.rstrip('/') or '/')
              for item in release['routes']
          }
          assert release['contentConsolidation']['aliasCount'] == 7
          assert active <= paths, sorted(active - paths)
          assert result['sitemapReconciliation']['activeRouteCount'] == len(release['routes'])
          assert '/haberler/elektrik-ark-hatasi-afdd-rcd-sigorta-farki' in paths
          print({'ok': True, 'routes': len(active), 'aliases': 7, 'added': result['sitemapReconciliation']['addedCount']})
          PY

      - name: Geçici workflow'u kaldır ve ana dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/alo186-run9-canonical-revenue-foundation-once.yml \
            .github/alo186-run9-canonical-revenue-foundation.trigger
          git add \
            .github/workflows/alo186-content-intent-consolidation.yml \
            alo186/deployment/content-consolidations.json \
            alo186/deployment/inject_shortlist_growth.py \
            alo186/tests/test_release_sitemap_reconciliation.py
          git commit -m 'fix(alo186): canonical niyetleri ve aktif sitemap envanterini uzlaştır'
          git push origin HEAD:main
