name: ALO186 affiliate ürün Knowledge Graph v102

on:
  pull_request:
    paths:
      - 'alo186/affiliate-knowledge-graph/**'
      - 'alo186/deployment/routing-overlays/102-affiliate-knowledge-graph.json'
      - 'alo186/tests/test_affiliate_knowledge_graph_v102.py'
      - 'alo186/tests/test_affiliate_verified_products_v103.py'
      - '.github/workflows/alo186-affiliate-knowledge-graph-v102.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/affiliate-knowledge-graph/**'
      - 'alo186/deployment/routing-overlays/102-affiliate-knowledge-graph.json'
      - 'alo186/tests/test_affiliate_knowledge_graph_v102.py'
      - 'alo186/tests/test_affiliate_verified_products_v103.py'
      - '.github/workflows/alo186-affiliate-knowledge-graph-v102.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-kg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Knowledge Graph veri, AEO, güven ve affiliate sözleşmesi
        run: |
          set -euo pipefail
          python alo186/tests/test_affiliate_knowledge_graph_v102.py
          python alo186/tests/test_affiliate_verified_products_v103.py
          python -m py_compile alo186/tests/test_affiliate_knowledge_graph_v102.py alo186/tests/test_affiliate_verified_products_v103.py
          node --check alo186/affiliate-knowledge-graph/app.js

      - name: Mevcut yayın ve güven regresyonları
        run: |
          set -euo pipefail
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical üretim paketi
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-affiliate-kg-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-affiliate-kg-canonical

      - name: Custom-domain ve project-path Pages kabulü
        run: |
          set -euo pipefail
          for target in custom project; do
            cp -a /tmp/alo186-affiliate-kg-canonical "/tmp/alo186-affiliate-kg-$target"
          done
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-affiliate-kg-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-affiliate-kg-custom \
            --base-path ''
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-affiliate-kg-custom \
            --base-path '' > /tmp/alo186-affiliate-kg-custom.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-affiliate-kg-custom \
            --base-path ''

          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-affiliate-kg-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-affiliate-kg-project \
            --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-affiliate-kg-project \
            --base-path '/chatgpt' > /tmp/alo186-affiliate-kg-project.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-affiliate-kg-project \
            --base-path '/chatgpt'

      - name: Sitemap, Teknik Arama ve yayın artifactı kabulü
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          canonical='/affiliate-knowledge-graph/'
          relative='affiliate-knowledge-graph'
          for root,prefix in [
              (Path('/tmp/alo186-affiliate-kg-custom'),''),
              (Path('/tmp/alo186-affiliate-kg-project'),'/chatgpt'),
          ]:
              for name in ['index.html','app.js','styles.css','catalog.json','catalog-extension-v103.json','verified-products.json']:
                  assert (root/relative/name).is_file(), (root,name)
              assert canonical in (root/'sitemap.xml').read_text(encoding='utf-8')
              search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
              entry=next(item for item in search['entries'] if item['canonicalPath']==canonical)
              expected=f'{prefix}{canonical}' if prefix else canonical
              assert entry['url'] in {canonical,expected}
              catalog=json.loads((root/relative/'catalog.json').read_text(encoding='utf-8'))
              extension=json.loads((root/relative/'catalog-extension-v103.json').read_text(encoding='utf-8'))
              verified=json.loads((root/relative/'verified-products.json').read_text(encoding='utf-8'))
              assert len(catalog['intents'])>=12
              assert len(catalog['productClasses'])>=23
              assert len(extension['productClasses'])>=17
              assert len(verified['products'])==3
          print(json.dumps({'ok':True,'route':canonical,'verifiedProducts':3,'searchIndexed':True}))
          PY

      - name: Doğrulanmış site artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-affiliate-knowledge-graph-v103-pages
          path: /tmp/alo186-affiliate-kg-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
