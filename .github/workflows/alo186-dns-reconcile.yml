name: ALO186 production DNS reconcile

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Cloudflare DNS değişikliklerini gerçekten uygula
        required: true
        type: boolean
        default: false
      proxy_api:
        description: api.alo186.com için Cloudflare proxy kullan
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: alo186-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ALO186_RENDER_API_HOSTNAME: ${{ vars.ALO186_RENDER_API_HOSTNAME }}
      ALO186_CLOUDFLARE_PROXY: ${{ inputs.proxy_api }}
      POSTMARK_DKIM_HOST: ${{ vars.POSTMARK_DKIM_HOST }}
      POSTMARK_DKIM_VALUE: ${{ secrets.POSTMARK_DKIM_VALUE }}
      POSTMARK_RETURN_PATH_HOST: ${{ vars.POSTMARK_RETURN_PATH_HOST }}
      POSTMARK_RETURN_PATH_VALUE: ${{ vars.POSTMARK_RETURN_PATH_VALUE }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerekli değerleri doğrula
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ZONE_ID"
          test -n "$ALO186_RENDER_API_HOSTNAME"
      - name: DNS dry-run veya apply
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            args+=(--apply)
          fi
          python alo186/infra/cloudflare/reconcile_dns.py "${args[@]}"
      - name: Uygulama sonrası DNS yayılımını doğrula
        if: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils
          for attempt in {1..18}; do
            cname="$(dig +short CNAME api.alo186.com | tr -d '\n')"
            if [[ -n "$cname" ]]; then
              echo "api.alo186.com → $cname"
              exit 0
            fi
            sleep 10
          done
          echo 'CNAME yayılımı 3 dakika içinde doğrulanamadı.' >&2
          exit 1
