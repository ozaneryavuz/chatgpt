name: ALO186 production DNS reconcile

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Cloudflare DNS değişikliklerini gerçekten uygula
        required: true
        type: boolean
        default: false
      proxy_api:
        description: api.alo186.com için Cloudflare proxy kullan
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: alo186-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ALO186_RENDER_API_HOSTNAME: ${{ vars.ALO186_RENDER_API_HOSTNAME }}
      ALO186_CLOUDFLARE_PROXY: ${{ inputs.proxy_api }}
      POSTMARK_DKIM_HOST: ${{ vars.POSTMARK_DKIM_HOST }}
      POSTMARK_DKIM_VALUE: ${{ secrets.POSTMARK_DKIM_VALUE }}
      POSTMARK_RETURN_PATH_HOST: ${{ vars.POSTMARK_RETURN_PATH_HOST }}
      POSTMARK_RETURN_PATH_VALUE: ${{ secrets.POSTMARK_RETURN_PATH_VALUE }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerekli değerleri doğrula
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ZONE_ID"
          test -n "$ALO186_RENDER_API_HOSTNAME"
      - name: DNS dry-run veya apply
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            args+=(--apply)
          fi
          python alo186/infra/cloudflare/reconcile_dns.py "${args[@]}"
      - name: Uygulama sonrası DNS yayılımını doğrula
        if: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils

          expected="$(printf '%s' "$ALO186_RENDER_API_HOSTNAME" | sed 's/\.$//' | tr '[:upper:]' '[:lower:]')"
          for attempt in {1..18}; do
            if [[ "${{ inputs.proxy_api }}" == "true" ]]; then
              a_records="$(dig +short A api.alo186.com | sed '/^$/d')"
              aaaa_records="$(dig +short AAAA api.alo186.com | sed '/^$/d')"
              if [[ -n "$a_records$aaaa_records" ]]; then
                echo "api.alo186.com Cloudflare edge adresleriyle çözümleniyor:"
                printf '%s\n%s\n' "$a_records" "$aaaa_records" | sed '/^$/d'
                exit 0
              fi
            else
              cname="$(dig +short CNAME api.alo186.com | head -n1 | sed 's/\.$//' | tr '[:upper:]' '[:lower:]')"
              if [[ "$cname" == "$expected" ]]; then
                echo "api.alo186.com → $cname (beklenen Render hedefi)"
                exit 0
              fi
              if [[ -n "$cname" ]]; then
                echo "CNAME henüz beklenen hedefte değil: mevcut=$cname beklenen=$expected"
              else
                echo "CNAME henüz çözümlenmiyor: beklenen=$expected"
              fi
            fi
            sleep 10
          done

          if [[ "${{ inputs.proxy_api }}" == "true" ]]; then
            echo 'Cloudflare proxied A/AAAA yayılımı 3 dakika içinde doğrulanamadı.' >&2
          else
            echo "CNAME 3 dakika içinde beklenen Render hedefine ulaşmadı: $expected" >&2
          fi
          exit 1
