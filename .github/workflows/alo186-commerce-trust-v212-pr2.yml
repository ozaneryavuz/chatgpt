name: ALO186 commerce trust v212 PR migration retry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alo186-commerce-trust-v212-pr2.yml'

permissions:
  contents: write

concurrency:
  group: alo186-commerce-trust-v212-pr2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Migration yardımcı sözdizimini düzelt ve uygula
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('alo186/deployment/apply_commerce_trust_v212_migration.py')
          text = path.read_text(encoding='utf-8')
          old_open = "    path.write_text(r'''from __future__ import annotations"
          new_open = '    path.write_text(r"""from __future__ import annotations'
          old_close = "    print(\"ALO186 commerce trust v212: PASS\")\n''', encoding=\"utf-8\")"
          new_close = '    print("ALO186 commerce trust v212: PASS")\n""", encoding="utf-8")'
          if old_open not in text or old_close not in text:
              raise SystemExit('Migration sözdizimi düzeltme işaretleri bulunamadı')
          path.write_text(text.replace(old_open, new_open, 1).replace(old_close, new_close, 1), encoding='utf-8')
          PY
          python -m py_compile alo186/deployment/apply_commerce_trust_v212_migration.py
          python alo186/deployment/apply_commerce_trust_v212_migration.py
          python -m py_compile alo186/deployment/guard_commerce_routes_v3.py alo186/tests/test_commerce_trust_v212.py
          python alo186/tests/test_commerce_trust_v212.py
          python alo186/tests/test_affiliate_measurement_v211.py
      - name: Tam üretim artifactı ve commerce guard
        env:
          GA4: G-639TVHL0LC
        run: |
          set -euo pipefail
          SITE=/tmp/alo186-commerce-trust-v212
          rm -rf "$SITE"
          python alo186/deployment/build_static_site.py --output "$SITE" --commit "$GITHUB_SHA"
          python alo186/deployment/prepare_github_pages.py --site "$SITE" --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_contextual_affiliate_v176.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_home_affiliate_banner_v209.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_affiliate_intent_router_v210.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_ga4_consent.py --site "$SITE" --base-path '' --measurement-id "$GA4"
          python alo186/deployment/inject_affiliate_measurement_v211.py --site "$SITE" --base-path ''
          node --check "$SITE/assets/affiliate-measurement-v211.js"
          python alo186/deployment/smoke_github_pages.py --site "$SITE" --base-path ''
          python alo186/deployment/guard_commerce_routes_v3.py --site "$SITE"
      - name: Doğrulanmış düzeltmeleri PR dalına kaydet
        run: |
          set -euo pipefail
          rm -f .github/workflows/alo186-commerce-trust-v212-migration.yml
          rm -f .github/workflows/alo186-commerce-trust-v212-pr.yml
          rm -f .github/workflows/alo186-commerce-trust-v212-pr2.yml
          rm -f alo186/deployment/apply_commerce_trust_v212_migration.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'ALO186 ticari güven kapılarını v212 ile sağlamlaştır'
          git push origin HEAD:${{ github.head_ref }}
