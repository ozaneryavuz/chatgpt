name: ALO186 mikromobilite şarj cihazı uygunluk testi

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/elektrikli-bisiklet-scooter-sarj-cihazi-uygunluk/**'
      - 'alo186/deployment/routing-overlays/090-micromobility-charger-safety.json'
      - 'alo186/tests/test_micromobility_charger_v327.py'
      - '.github/workflows/alo186-micromobility-charger-v327.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/elektrikli-bisiklet-scooter-sarj-cihazi-uygunluk/**'
      - 'alo186/deployment/routing-overlays/090-micromobility-charger-safety.json'
      - 'alo186/tests/test_micromobility_charger_v327.py'
      - '.github/workflows/alo186-micromobility-charger-v327.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-micromobility-charger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Karar motoru ve entegrasyon
        run: |
          set -euo pipefail
          node alo186/hesaplama/elektrikli-bisiklet-scooter-sarj-cihazi-uygunluk/app.test.js
          python alo186/tests/test_micromobility_charger_v327.py
          node --check alo186/hesaplama/elektrikli-bisiklet-scooter-sarj-cihazi-uygunluk/app.js
      - name: Canonical üretim paketi
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py --output /tmp/alo186-micro --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-micro
      - name: Yayın artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-micromobility-charger-pages
          path: /tmp/alo186-micro
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
