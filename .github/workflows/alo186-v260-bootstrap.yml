name: ALO186 v260 materialize payload

on:
  push:
    branches: [alo186/competitor-gap-aeo-affiliate-v260]
    paths:
      - '.github/workflows/alo186-v260-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: alo186-v260-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: alo186/competitor-gap-aeo-affiliate-v260
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Payloadı gerçek kaynak dosyalarına dönüştür
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v260-payload/part* > /tmp/alo186-v260-payload.json
          python - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/alo186-v260-payload.json').read_text(encoding='utf-8'))
          expected = {
              'alo186/deployment/inject_competitor_gap_affiliate_v260.py',
              'alo186/deployment/aeo_control_plane_v219_sitemap_compat.py',
              'alo186/tests/test_competitor_gap_affiliate_v260.py',
              'alo186/robots.txt',
              '.github/workflows/alo186-competitor-gap-affiliate-v260.yml',
              'alo186/audits/competitor-gap-affiliate-v260-2026-08-03.md',
          }
          if set(payload) != expected:
              raise SystemExit(f'Payload dosya sözleşmesi yanlış: {sorted(payload)}')
          for name, encoded in payload.items():
              content = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
              print(f'{name}: {len(content)} karakter')
          PY
          rm -rf .github/v260-payload
          rm -f alo186/deployment/.competitor-gap-v260-branch-seed
          rm -f .github/workflows/alo186-v260-bootstrap.yml
          python -m py_compile \
            alo186/deployment/inject_competitor_gap_affiliate_v260.py \
            alo186/deployment/aeo_control_plane_v219_sitemap_compat.py \
            alo186/tests/test_competitor_gap_affiliate_v260.py
          python alo186/tests/test_competitor_gap_affiliate_v260.py
      - name: Tamamlanmış v260 kaynaklarını dala gönder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(alo186): competitor-gap AEO ve güvenli affiliate v260'
          git push origin HEAD:alo186/competitor-gap-aeo-affiliate-v260
