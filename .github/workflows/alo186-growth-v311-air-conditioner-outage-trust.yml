name: ALO186 growth v311 air-conditioner outage trust

on:
  push:
    branches: [main, "automation/growth-v311-air-conditioner-outage-trust"]
    paths:
      - "alo186/haberler/elektrik-kesilince-klima-calisir-mi/index.html"
      - "alo186/hesaplama/klima-elektrik-kesintisi-guvenli-yeniden-baslatma-plani/index.html"
      - "alo186/amazon-elektrik-urunleri/yaz-kesintisi-serinleme-olcum-secimi/index.html"
      - "alo186/deployment/affiliate-category-decisions/air-conditioner-outage-trust-v311.json"
      - "alo186/deployment/routing-overlays/growth-v311-air-conditioner-outage-trust.json"
      - "alo186/sitemap-growth-v311.xml"
      - "alo186/robots.txt"
      - "alo186/tests/test_growth_v311_air_conditioner_outage_trust.py"
      - ".github/workflows/alo186-growth-v311-air-conditioner-outage-trust.yml"
  pull_request:
    branches: [main]
    paths:
      - "alo186/haberler/elektrik-kesilince-klima-calisir-mi/index.html"
      - "alo186/hesaplama/klima-elektrik-kesintisi-guvenli-yeniden-baslatma-plani/index.html"
      - "alo186/amazon-elektrik-urunleri/yaz-kesintisi-serinleme-olcum-secimi/index.html"
      - "alo186/deployment/affiliate-category-decisions/air-conditioner-outage-trust-v311.json"
      - "alo186/deployment/routing-overlays/growth-v311-air-conditioner-outage-trust.json"
      - "alo186/sitemap-growth-v311.xml"
      - "alo186/robots.txt"
      - "alo186/tests/test_growth_v311_air_conditioner_outage_trust.py"
      - ".github/workflows/alo186-growth-v311-air-conditioner-outage-trust.yml"

permissions:
  contents: read

jobs:
  trust-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate v311 trust, privacy, affiliate and discovery boundaries
        run: python alo186/tests/test_growth_v311_air_conditioner_outage_trust.py
