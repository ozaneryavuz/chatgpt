name: ALO186 teknik kısa liste büyüme kalite kontrolü

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/teknik-urun-karsilastirma/**'
      - 'alo186/hesaplama/common.js'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/tests/test_technical_shortlist_growth.js'
      - '.github/workflows/alo186-technical-shortlist-growth.yml'
      - '.github/workflows/alo186-github-pages.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/teknik-urun-karsilastirma/**'
      - 'alo186/hesaplama/common.js'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/tests/test_technical_shortlist_growth.js'
      - '.github/workflows/alo186-technical-shortlist-growth.yml'
      - '.github/workflows/alo186-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-technical-shortlist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Teknik kısa liste senaryoları
        run: node alo186/hesaplama/teknik-urun-karsilastirma/test.js

      - name: Büyüme ve güven entegrasyonu
        run: node alo186/tests/test_technical_shortlist_growth.js

      - name: Sözdizimi
        run: |
          node --check alo186/hesaplama/teknik-urun-karsilastirma/core.js
          node --check alo186/hesaplama/teknik-urun-karsilastirma/app.js
          node --check alo186/hesaplama/common.js
          python -m py_compile alo186/deployment/inject_shortlist_growth.py

      - name: Mevcut güvenlik regresyonları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical production bundle
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-shortlist-canonical --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-shortlist-canonical
          test -f /tmp/alo186-shortlist-canonical/hesaplama/teknik-urun-karsilastirma/index.html
          test -f /tmp/alo186-shortlist-canonical/hesaplama/teknik-urun-karsilastirma/core.js
          test -f /tmp/alo186-shortlist-canonical/hesaplama/teknik-urun-karsilastirma/app.js
          test ! -f /tmp/alo186-shortlist-canonical/hesaplama/teknik-urun-karsilastirma/test.js

      - name: Custom-domain Pages artifactı
        run: |
          cp -a /tmp/alo186-shortlist-canonical /tmp/alo186-shortlist-custom
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-shortlist-custom --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-shortlist-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-shortlist-custom --base-path ''
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-shortlist-custom --base-path ''

      - name: Project-path Pages artifactı
        run: |
          cp -a /tmp/alo186-shortlist-canonical /tmp/alo186-shortlist-project
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-shortlist-project --base-path '/chatgpt' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-shortlist-project --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-shortlist-project --base-path '/chatgpt'
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-shortlist-project --base-path '/chatgpt'

      - name: Artifact sözleşmeleri
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for root,prefix in [(Path('/tmp/alo186-shortlist-custom'),''),(Path('/tmp/alo186-shortlist-project'),'/chatgpt')]:
              route=root/'hesaplama/teknik-urun-karsilastirma'
              assert (route/'index.html').is_file()
              html=(route/'index.html').read_text(encoding='utf-8')
              assert 'Teknik Ürün Karşılaştırma ve Satın Almama Testi' in html
              assert 'Şimdilik satın alma' in html
              assert 'amazon.com.tr/' not in html.lower()
              assert '<loc>https://alo186.com/hesaplama/teknik-urun-karsilastirma/</loc>' in (root/'sitemap.xml').read_text(encoding='utf-8')
              release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
              assert any(x['canonicalPath']=='/hesaplama/teknik-urun-karsilastirma/' for x in release['routes'])
              assert release['technicalShortlist']['candidateLimit']==3
              pages=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
              assert pages['technicalShortlist']['reviewDays']==14
              assert pages['technicalShortlist']['route']==f'{prefix}/hesaplama/teknik-urun-karsilastirma/'
              assert 'data-alo186-shortlist-hub-card="true"' in (root/'hesaplama/index.html').read_text(encoding='utf-8')
              assert 'data-alo186-shortlist-entry-card="true"' in (root/'elektrik-portali/index.html').read_text(encoding='utf-8')
              assert 'data-alo186-shortlist-product-card="true"' in (root/'akilli-urun-secimi/index.html').read_text(encoding='utf-8')
              assert pages['technicalShortlist']['route'] in (root/'sw.js').read_text(encoding='utf-8')
          PY

      - name: Doğrulanmış Pages artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-technical-shortlist-pages
          path: /tmp/alo186-shortlist-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
