name: ALO186 protection trip growth v347

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/kacak-akim-rolesi-neden-atar/**'
      - 'alo186/hesaplama/sigorta-kacak-akim-belirti-ayirici/**'
      - 'alo186/ev-elektrik-guvenlik-kontrol-merkezi/**'
      - 'alo186/deployment/routing-overlays/protection-trip-growth-v347.json'
      - 'alo186/deployment/affiliate-category-decisions/protection-trip-growth-v347.json'
      - 'alo186/tests/test_protection_trip_growth_v347.py'
      - '.github/workflows/alo186-protection-trip-v347.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/kacak-akim-rolesi-neden-atar/**'
      - 'alo186/hesaplama/sigorta-kacak-akim-belirti-ayirici/**'
      - 'alo186/ev-elektrik-guvenlik-kontrol-merkezi/**'
      - 'alo186/deployment/routing-overlays/protection-trip-growth-v347.json'
      - 'alo186/deployment/affiliate-category-decisions/protection-trip-growth-v347.json'
      - 'alo186/tests/test_protection_trip_growth_v347.py'
      - '.github/workflows/alo186-protection-trip-v347.yml'

permissions:
  contents: read

concurrency:
  group: alo186-protection-trip-v347-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Protection trip trust, privacy and no-commerce checks
        run: python alo186/tests/test_protection_trip_growth_v347.py
      - name: Global content intent collision guard
        run: python alo186/tests/test_content_intent_consolidation.py
      - name: Canonical production build and smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-protection-trip-v347
          python alo186/deployment/build_static_site.py --output /tmp/alo186-protection-trip-v347 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-protection-trip-v347
      - name: Verify production routes, sitemap, hub and commercial closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-protection-trip-v347')
          routes = [
              '/haberler/kacak-akim-rolesi-neden-atar/',
              '/hesaplama/sigorta-kacak-akim-belirti-ayirici/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 347
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              html = page.read_text(encoding='utf-8')
              assert f'https://alo186.com{route}' in sitemap
              assert f'<link rel="canonical" href="https://alo186.com{route}">' in html
              assert 'amazon.com.tr' not in html.lower()
          hub = (root / 'ev-elektrik-guvenlik-kontrol-merkezi' / 'index.html').read_text(encoding='utf-8')
          assert '/hesaplama/sigorta-kacak-akim-belirti-ayirici/' in hub
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes, 'merchantLinks': 0})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-protection-trip-v347-${{ github.sha }}
          path: /tmp/alo186-protection-trip-v347
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
