name: ALO186 production infrastructure CI

on:
  push:
    branches: [main, infra/alo186-production-stack]
    paths:
      - 'alo186/infrastructure/**'
      - 'alo186/sureklilik-api/infra/**'
      - 'alo186/sureklilik-api/app/config.py'
      - 'alo186/sureklilik-api/app/application.py'
      - 'alo186/sureklilik-api/app/observability.py'
      - 'alo186/sureklilik-api/app/worker.py'
      - 'alo186/sureklilik-api/requirements.txt'
      - 'alo186/sureklilik-api/.env.example'
      - 'alo186/tests/test_production_infra.py'
      - '.github/workflows/alo186-infrastructure-ci.yml'
      - '.github/workflows/alo186-production-synthetic.yml'
      - '.github/workflows/alo186-dns-sync.yml'
  pull_request:
    paths:
      - 'alo186/infrastructure/**'
      - 'alo186/sureklilik-api/infra/**'
      - 'alo186/sureklilik-api/app/**'
      - 'alo186/sureklilik-api/requirements.txt'
      - 'alo186/tests/test_production_infra.py'
      - '.github/workflows/alo186-*.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: alo186/sureklilik-api/requirements.txt
      - name: Python ve doğrulama bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          pip install -r alo186/sureklilik-api/requirements.txt
          pip install PyYAML check-jsonschema yamllint
      - name: Render Blueprint resmi şema doğrulaması
        run: >-
          check-jsonschema
          --schemafile https://render.com/schema/render.yaml.json
          alo186/infrastructure/render/production.yaml
      - name: YAML stil ve parse kontrolü
        run: |
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable}}' \
            alo186/infrastructure/render/production.yaml \
            alo186/infrastructure/secrets/secret-inventory.yaml
      - name: Üretim altyapısı sözleşme testleri
        run: pytest -q alo186/tests/test_production_infra.py
      - name: API testleri ve compile
        working-directory: alo186/sureklilik-api
        env:
          PYTHONPATH: .
          ALO186_ENV: test
          ALO186_TOKEN_SECRET: test-secret-at-least-32-characters-long
          ALO186_AUTO_CREATE_SCHEMA: 'true'
          ALO186_EXPOSE_TEST_TOKENS: 'true'
        run: |
          pytest -q
          python -m compileall -q app
      - name: Shell script syntax ve ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          find alo186 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          shellcheck \
            alo186/sureklilik-api/infra/backup/run_backup.sh \
            alo186/sureklilik-api/infra/backup/restore_verify.sh \
            alo186/infrastructure/smtp/check_email_dns.sh
      - name: API, backup ve Alloy Docker build
        run: |
          docker build -t alo186-api-ci -f alo186/sureklilik-api/Dockerfile alo186/sureklilik-api
          docker build -t alo186-backup-ci -f alo186/sureklilik-api/infra/backup/Dockerfile alo186/sureklilik-api
          docker build -t alo186-alloy-ci -f alo186/sureklilik-api/infra/monitoring/Dockerfile alo186/sureklilik-api
      - name: Alloy config validate
        run: |
          docker run --rm \
            -e ALO186_API_PRIVATE_HOSTPORT=api:8000 \
            -e ALO186_METRICS_TOKEN=test-token \
            -e GRAFANA_CLOUD_PROMETHEUS_URL=https://prometheus.example.invalid/api/prom/push \
            -e GRAFANA_CLOUD_PROMETHEUS_USER=123 \
            -e GRAFANA_CLOUD_API_KEY=test-key \
            alo186-alloy-ci validate /etc/alloy/config.alloy
      - name: Caddyfile validate
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/alo186/sureklilik-api/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Portable Compose ve Caddy config
        working-directory: alo186/sureklilik-api
        env:
          ALO186_SMTP_HOST: smtp.postmarkapp.com
          ALO186_SMTP_USERNAME: test
          ALO186_SMTP_FROM_EMAIL: noreply@alo186.com
        run: |
          mkdir -p secrets
          for name in postgres_password database_url token_secret data_encryption_key smtp_password metrics_token; do
            printf 'ci-placeholder-not-a-secret\n' > "secrets/${name}.txt"
          done
          docker compose -f docker-compose.production.yml -f infra/caddy/docker-compose.edge.yml config >/dev/null
          rm -rf secrets
      - name: Operasyon araçları smoke test
        run: |
          python alo186/infrastructure/secrets/generate_secrets.py --output /tmp/alo186-secrets.env
          test "$(stat -c '%a' /tmp/alo186-secrets.env)" = '600'
          grep -q '^ALO186_VAULT_ENCRYPTION_KEY=' /tmp/alo186-secrets.env
          python alo186/infrastructure/dns/sync_cloudflare_dns.py --help
          python alo186/infrastructure/smtp/smtp_probe.py --help
          python alo186/infrastructure/monitoring/production_probe.py --help
      - name: Repository secret pattern guard
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'sk[_]live_[A-Za-z0-9]+'
            'A[K]IA[0-9A-Z]{16}'
            '[B]EGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          )
          for pattern in "${patterns[@]}"; do
            if git grep -n -E "$pattern" -- ':!*.md'; then
              echo "Muhtemel secret pattern bulundu: $pattern" >&2
              exit 1
            fi
          done
