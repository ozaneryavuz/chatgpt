name: ALO186 scheduled monitor contract CI

on:
  pull_request:
    paths:
      - ".github/workflows/alo186-production-synthetic.yml"
      - ".github/workflows/alo186-scheduled-monitor-ci.yml"
      - "alo186/tests/test_scheduled_monitor_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/alo186-production-synthetic.yml"
      - ".github/workflows/alo186-scheduled-monitor-ci.yml"
      - "alo186/tests/test_scheduled_monitor_contract.py"

permissions:
  contents: read

jobs:
  monitor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scheduled monitor dedupe ve fail-closed sözleşmesi
        run: python alo186/tests/test_scheduled_monitor_contract.py
      - name: Workflow yardımcı Python dosyalarını derle
        run: |
          python -m py_compile \
            alo186/infra/observability/synthetic_check.py \
            alo186/deployment/verify_live_release.py
