name: ALO186 yangın alarmı acil aydınlatma kesinti güvenliği v288
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-yangin-alarmi-calisir-mi/**'
      - 'alo186/hesaplama/yangin-alarmi-elektrik-kesintisi-test-plani/**'
      - 'alo186/sektor-rehberi/otel-isletme-yangin-alarmi-acil-aydinlatma-kesinti-surekliligi/**'
      - 'alo186/deployment/routing-overlays/growth-v288-fire-alarm-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/fire-alarm-outage-v288.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v288_fire_alarm_outage.py'
      - '.github/workflows/alo186-growth-v288-fire-alarm-outage.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-yangin-alarmi-calisir-mi/**'
      - 'alo186/hesaplama/yangin-alarmi-elektrik-kesintisi-test-plani/**'
      - 'alo186/sektor-rehberi/otel-isletme-yangin-alarmi-acil-aydinlatma-kesinti-surekliligi/**'
      - 'alo186/deployment/routing-overlays/growth-v288-fire-alarm-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/fire-alarm-outage-v288.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v288_fire_alarm_outage.py'
      - '.github/workflows/alo186-growth-v288-fire-alarm-outage.yml'
permissions:
  contents: read
concurrency:
  group: alo186-growth-v288-fire-alarm-outage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Yangın alarmı arama niyeti gizlilik ve professional-only sınır
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v288_fire_alarm_outage.py alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v288_fire_alarm_outage.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/routing-overlays/growth-v288-fire-alarm-outage.json >/dev/null
          python -m json.tool alo186/deployment/affiliate-category-decisions/fire-alarm-outage-v288.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null
      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v288
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v288 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v288
          test -f /tmp/alo186-v288/haberler/elektrik-kesilince-yangin-alarmi-calisir-mi/index.html
          test -f /tmp/alo186-v288/hesaplama/yangin-alarmi-elektrik-kesintisi-test-plani/index.html
          test -f /tmp/alo186-v288/sektor-rehberi/otel-isletme-yangin-alarmi-acil-aydinlatma-kesinti-surekliligi/index.html
      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v288
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v288 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/alo186-sites-v288')
          manifest=json.loads((root/'sites-import.json').read_text(encoding='utf-8'))
          pages={item['canonicalPath']:item for item in manifest['pages']}
          expected={'/haberler/elektrik-kesilince-yangin-alarmi-calisir-mi/','/hesaplama/yangin-alarmi-elektrik-kesintisi-test-plani/','/sektor-rehberi/otel-isletme-yangin-alarmi-acil-aydinlatma-kesinti-surekliligi/'}
          assert expected.issubset(pages),expected-set(pages)
          for path in expected:
              assert pages[path]['affiliate']['hasAffiliateLinks'] is False
              assert not pages[path]['affiliate']['unsafeStaticLinks']
          print(json.dumps({'ok':True,'routes':sorted(expected),'affiliateLinks':0,'unsafeStaticLinks':0},ensure_ascii=False))
          PY
      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v288 yangın alarmı ve acil aydınlatma kesinti sürekliliği
          - Arama niyeti: elektrik kesilince yangın alarmı ve acil aydınlatma çalışır mı
          - Ücretsiz araç: panel, algılama, uyarı, izleme, bina senaryosu ve kayıtlı test
          - Mevcut sistem yeterliyse: yeni ürün almayın
          - Yangın paneli, akü, acil aydınlatma ve sesli tahliye: professional-only
          - Amazon veya başka mağaza bağlantısı: yok
          - Fiyat, stok, puan, yorum, teslimat, garanti, Offer ve AggregateRating: yok
          - 30/90/365 günlük tekrar ziyaret: yerel takvim dosyası; mevzuat sıklığı yerine geçmez
          EOF
