name: ALO186 elektrik faturası kWh anomali ve sayaç kontrolü

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/**'
      - 'alo186/tests/test_elektrik_faturasi_kwh_anomali_v350.py'
      - 'alo186/deployment/routing-overlays/114-elektrik-faturasi-kwh-anomali-sayac-kontrolu.json'
      - '.github/workflows/alo186-elektrik-faturasi-kwh-anomali-v350.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/**'
      - 'alo186/tests/test_elektrik_faturasi_kwh_anomali_v350.py'
      - 'alo186/deployment/routing-overlays/114-elektrik-faturasi-kwh-anomali-sayac-kontrolu.json'
      - '.github/workflows/alo186-elektrik-faturasi-kwh-anomali-v350.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-kwh-anomali-v350-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Karar, güvenlik, satın almama ve affiliate senaryoları
        run: |
          set -euo pipefail
          node alo186/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/app.test.js
          python alo186/tests/test_elektrik_faturasi_kwh_anomali_v350.py

      - name: Sözdizimi ve yasak ticari alan kontrolü
        run: |
          set -euo pipefail
          node --check alo186/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/app.js
          python -m py_compile alo186/tests/test_elektrik_faturasi_kwh_anomali_v350.py
          python - <<'PY'
          from pathlib import Path
          root=Path('alo186/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu')
          for path in root.glob('*'):
              if not path.is_file():
                  continue
              text=path.read_text(encoding='utf-8')
              for token in ['priceCurrency','aggregateRating','availability','"@type":"Offer"','"@type":"Product"']:
                  assert token not in text, (path,token)
          PY

      - name: Canonical üretim ve statik smoke
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-kwh-anomali-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-kwh-anomali-canonical
          test -f /tmp/alo186-kwh-anomali-canonical/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/index.html
          test -f /tmp/alo186-kwh-anomali-canonical/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/app.js
          grep -q 'kWh/gün' /tmp/alo186-kwh-anomali-canonical/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/index.html
          grep -q 'alo186rehber-21' /tmp/alo186-kwh-anomali-canonical/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/app.js

      - name: Custom-domain ve project-path Pages kabulü
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'custom|' 'project|/chatgpt'; do
            name="${spec%%|*}"
            base="${spec#*|}"
            target="/tmp/alo186-kwh-anomali-${name}"
            cp -a /tmp/alo186-kwh-anomali-canonical "$target"
            python alo186/deployment/prepare_github_pages.py \
              --site "$target" \
              --base-path "$base" \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA"
            python alo186/deployment/inject_outcome_runtime.py --site "$target" --base-path "$base"
            python alo186/deployment/inject_shortlist_growth.py --site "$target" --base-path "$base" > "/tmp/alo186-kwh-anomali-${name}.json"
            python alo186/deployment/smoke_github_pages.py --site "$target" --base-path "$base"
            test -f "$target/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/index.html"
            test -f "$target/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/styles.css"
            grep -q 'Amazon satış ortaklığı açıklaması' "$target/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/index.html"
            ! grep -Eqi 'priceCurrency|aggregateRating|availability|"@type":"Offer"' "$target/hesaplama/elektrik-faturasi-kwh-anomali-sayac-kontrolu/index.html"
          done

      - name: Doğrulanmış üretim artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-elektrik-faturasi-kwh-anomali-v350-production
          path: /tmp/alo186-kwh-anomali-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 45
