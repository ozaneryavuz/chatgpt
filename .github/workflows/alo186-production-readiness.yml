name: ALO186 production readiness gate

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: SMTP doğrulamasına gerçek test mesajı dahil et
        required: true
        type: boolean
        default: false

permissions:
  contents: read

environment: alo186-production

jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ALO186_RENDER_API_HOSTNAME: ${{ vars.ALO186_RENDER_API_HOSTNAME }}
      ALO186_CLOUDFLARE_PROXY: 'false'
      ALO186_SMTP_HOST: smtp.postmarkapp.com
      ALO186_SMTP_PORT: '587'
      ALO186_SMTP_USERNAME: ${{ secrets.POSTMARK_SMTP_USERNAME }}
      ALO186_SMTP_PASSWORD: ${{ secrets.POSTMARK_SMTP_PASSWORD }}
      ALO186_SMTP_FROM_EMAIL: noreply@alo186.com
      ALO186_SMTP_TEST_RECIPIENT: ${{ vars.ALO186_SMTP_TEST_RECIPIENT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ALO186_R2_ENDPOINT: ${{ vars.ALO186_R2_ENDPOINT }}
      ALO186_R2_RESTIC_BUCKET: ${{ vars.ALO186_R2_RESTIC_BUCKET }}
      ALO186_R2_VAULT_BUCKET: ${{ vars.ALO186_R2_VAULT_BUCKET }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      POSTMARK_DKIM_HOST: ${{ vars.POSTMARK_DKIM_HOST }}
      POSTMARK_RETURN_PATH_HOST: ${{ vars.POSTMARK_RETURN_PATH_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerekli araçlar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic dnsutils
      - name: Cloudflare DNS dry-run
        run: python alo186/infrastructure/dns/sync_cloudflare_dns.py
      - name: SMTP TLS ve auth
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.send_test_email }}" == "true" ]]; then
            test -n "$ALO186_SMTP_TEST_RECIPIENT"
            args+=(--send)
          fi
          python alo186/infrastructure/smtp/smtp_probe.py "${args[@]}"
      - name: SPF, DMARC, DKIM ve Return-Path
        run: bash alo186/infrastructure/smtp/check_email_dns.sh alo186.com
      - name: R2 bucket ve Restic repo
        shell: bash
        run: |
          set -euo pipefail
          aws --endpoint-url "$ALO186_R2_ENDPOINT" --region auto s3api head-bucket --bucket "$ALO186_R2_RESTIC_BUCKET"
          aws --endpoint-url "$ALO186_R2_ENDPOINT" --region auto s3api head-bucket --bucket "$ALO186_R2_VAULT_BUCKET"
          export RESTIC_REPOSITORY="s3:${ALO186_R2_ENDPOINT%/}/${ALO186_R2_RESTIC_BUCKET}"
          restic snapshots --compact
          restic check
      - name: API DNS, TLS ve health
        run: >-
          python alo186/infrastructure/monitoring/production_probe.py
          --base-url https://api.alo186.com
          --minimum-tls-days 21
          --check-email-dns
          --json-out readiness/production-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alo186-production-readiness-${{ github.run_id }}
          path: readiness/
          retention-days: 90
      - name: Readiness özeti
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## ALO186 production readiness başarılı

          - Cloudflare DNS dry-run: başarılı
          - SMTP TLS/auth: başarılı
          - E-posta DNS: başarılı
          - R2 Restic/vault erişimi: başarılı
          - Restic repository check: başarılı
          - API DNS/TLS/live/ready: başarılı
          EOF
