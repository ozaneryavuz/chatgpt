name: ALO186 seyahat ve elektronik koruma kanıtı v132

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/powerbank-ucak-wh-kabin-bagaji-uygunluk/**'
      - 'alo186/hesaplama/akim-korumali-priz-koruma-gostergesi-omur-testi/**'
      - 'alo186/sektor-rehberi/elektronik-cihaz-guc-seyahat-koruma-merkezi/**'
      - 'alo186/deployment/routing-overlays/132-travel-surge-electronics.json'
      - 'alo186/tests/test_travel_surge_evidence_v132.js'
      - '.github/workflows/alo186-travel-surge-evidence-v132.yml'
      - 'alo186/audits/growth-travel-surge-evidence-v132.md'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/powerbank-ucak-wh-kabin-bagaji-uygunluk/**'
      - 'alo186/hesaplama/akim-korumali-priz-koruma-gostergesi-omur-testi/**'
      - 'alo186/sektor-rehberi/elektronik-cihaz-guc-seyahat-koruma-merkezi/**'
      - 'alo186/deployment/routing-overlays/132-travel-surge-electronics.json'
      - 'alo186/tests/test_travel_surge_evidence_v132.js'
      - '.github/workflows/alo186-travel-surge-evidence-v132.yml'
      - 'alo186/audits/growth-travel-surge-evidence-v132.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-travel-surge-evidence-v132-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Arama niyeti, karar, güven, affiliate ve dual Pages kabulü
        run: node alo186/tests/test_travel_surge_evidence_v132.js

      - name: Mevcut yayın ve kullanıcı güveni regresyonları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py
