name: ALO186 run153 VPP direct-answer hotfix

on:
  push:
    branches:
      - automation/content-authority-run153
    paths:
      - '.github/workflows/alo186-run153-vpp-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/content-authority-run153
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: VPP doğrudan cevabını doğrulayıcı sınırına indir
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('alo186/ai-cms/content/vpp-telemetri-setpoint-feedback-veri-boslugu-kabul.json')
          record = json.loads(path.read_text(encoding='utf-8'))
          record['directAnswer'] = (
              "VPP'de bir komutun 'gönderildi' görünmesi, kaynağın komutu kabul edip fiziksel olarak uyguladığını kanıtlamaz. "
              "Uçtan uca kabul; kaynak kimliği ve yetkisi, komut kimliği ve zaman damgası, kabul/red cevabı, uygulanan setpoint geri bildirimi, "
              "bağlantı noktasında ölçülen P–Q–SoC tepkisi, rampa ve süre, kesici/çalışma modu, eksik-gecikmiş-yinelenen veri sınıfları ile haberleşme kaybındaki güvenli yerel davranışı birlikte doğrulamalıdır. "
              "Gerçek müşteri kimliği, açık adres, özel anahtar veya canlı kontrol parolası test dosyasına yüklenmemelidir. Teknik kabul, piyasa katılımı veya gelir garantisi değildir."
          )
          length = len(record['directAnswer'])
          if not 80 <= length <= 650:
              raise SystemExit(f'directAnswer uzunluğu geçersiz: {length}')
          path.write_text(json.dumps(record, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          print({'slug': record['slug'], 'directAnswerLength': length})
          PY
          python alo186/ai-cms/cms.py validate --slug vpp-telemetri-setpoint-feedback-veri-boslugu-kabul --write
      - name: Düzeltmeyi gönder ve geçici workflow'u kaldır
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alo186/ai-cms/content/vpp-telemetri-setpoint-feedback-veri-boslugu-kabul.json
          git rm .github/workflows/alo186-run153-vpp-hotfix.yml
          git commit -m 'fix(alo186): run153 VPP doğrudan cevabını kalite sınırına indir'
          git push origin HEAD:automation/content-authority-run153
