name: ALO186 summer HVAC outage v335

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesintisi-sonrasi-klima-neden-calismiyor/**'
      - 'alo186/hesaplama/klima-elektrik-kesintisi-yeniden-baslatma-plani/**'
      - 'alo186/sektor-rehberi/otel-vrf-klima-elektrik-kesintisi-surekliligi/**'
      - 'alo186/deployment/routing-overlays/summer-hvac-outage-v335.json'
      - 'alo186/tests/test_summer_hvac_outage_v335.py'
      - '.github/workflows/alo186-summer-hvac-outage-v335.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesintisi-sonrasi-klima-neden-calismiyor/**'
      - 'alo186/hesaplama/klima-elektrik-kesintisi-yeniden-baslatma-plani/**'
      - 'alo186/sektor-rehberi/otel-vrf-klima-elektrik-kesintisi-surekliligi/**'
      - 'alo186/deployment/routing-overlays/summer-hvac-outage-v335.json'
      - 'alo186/tests/test_summer_hvac_outage_v335.py'
      - '.github/workflows/alo186-summer-hvac-outage-v335.yml'

permissions:
  contents: read

concurrency:
  group: alo186-summer-hvac-v335-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Trust privacy professional-only and no-buy checks
        run: python alo186/tests/test_summer_hvac_outage_v335.py
      - name: Build canonical site bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-hvac-v335
          python alo186/deployment/build_static_site.py --output /tmp/alo186-hvac-v335 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-hvac-v335
      - name: Verify production routes sitemap and zero merchant links
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-hvac-v335')
          routes = [
            '/haberler/elektrik-kesintisi-sonrasi-klima-neden-calismiyor/',
            '/hesaplama/klima-elektrik-kesintisi-yeniden-baslatma-plani/',
            '/sektor-rehberi/otel-vrf-klima-elektrik-kesintisi-surekliligi/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 335
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              assert f'https://alo186.com{route}' in sitemap
              html = page.read_text(encoding='utf-8').casefold()
              assert 'amazon.com.tr' not in html
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes, 'newAffiliateClasses': 0, 'merchantLinks': 0})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-hvac-v335-${{ github.sha }}
          path: /tmp/alo186-hvac-v335
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
