name: ALO186 heatwave cooling growth v164

on:
  pull_request:
    paths:
      - "alo186/hesaplama/elektrik-kesintisi-asiri-sicak-isi-stresi-guvenligi/**"
      - "alo186/hesaplama/sarjli-vantilator-usb-fan-wh-sure-uygunlugu/**"
      - "alo186/sektor-rehberi/sicak-hava-elektrik-kesintisi-serinleme-test-merkezi/**"
      - "alo186/deployment/routing-overlays/164-heatwave-cooling-growth.json"
      - "alo186/audits/heatwave-cooling-growth-v164-2026-08-01.md"
      - "alo186/tests/test_heatwave_cooling_growth_v164.py"
      - ".github/workflows/alo186-heatwave-cooling-growth-v164.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/elektrik-kesintisi-asiri-sicak-isi-stresi-guvenligi/**"
      - "alo186/hesaplama/sarjli-vantilator-usb-fan-wh-sure-uygunlugu/**"
      - "alo186/sektor-rehberi/sicak-hava-elektrik-kesintisi-serinleme-test-merkezi/**"
      - "alo186/deployment/routing-overlays/164-heatwave-cooling-growth.json"
      - "alo186/tests/test_heatwave_cooling_growth_v164.py"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python alo186/tests/test_heatwave_cooling_growth_v164.py
