name: ALO186 affiliate Knowledge Graph v106

on:
  pull_request:
    paths:
      - 'alo186/affiliate-knowledge-graph/**'
      - 'alo186/tests/test_affiliate_knowledge_graph_v106.py'
      - '.github/workflows/alo186-affiliate-knowledge-graph-v106.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/affiliate-knowledge-graph/**'
      - 'alo186/tests/test_affiliate_knowledge_graph_v106.py'
      - '.github/workflows/alo186-affiliate-knowledge-graph-v106.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-kg-v106-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: V106 veri ve kullanıcı güven sözleşmesi
        run: |
          set -euo pipefail
          python -m json.tool alo186/affiliate-knowledge-graph/catalog-v106-extension.json >/dev/null
          node --check alo186/affiliate-knowledge-graph/app.js
          python alo186/tests/test_affiliate_knowledge_graph_v106.py
          python -m py_compile alo186/tests/test_affiliate_knowledge_graph_v106.py

      - name: Canonical üretim ve smoke testi
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py --output /tmp/alo186-kg-v106 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-kg-v106
          test -f /tmp/alo186-kg-v106/affiliate-knowledge-graph/catalog-v106-extension.json

      - name: Custom-domain ve project-path kabulü
        run: |
          set -euo pipefail
          cp -a /tmp/alo186-kg-v106 /tmp/alo186-kg-v106-custom
          cp -a /tmp/alo186-kg-v106 /tmp/alo186-kg-v106-project
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-kg-v106-custom --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-kg-v106-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-kg-v106-custom --base-path '' >/tmp/alo186-kg-v106-custom.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-kg-v106-custom --base-path ''
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-kg-v106-project --base-path '/chatgpt' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-kg-v106-project --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-kg-v106-project --base-path '/chatgpt' >/tmp/alo186-kg-v106-project.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-kg-v106-project --base-path '/chatgpt'

      - name: Sitemap, Teknik Arama ve artifact kabulü
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          route='/affiliate-knowledge-graph/'
          for root in [Path('/tmp/alo186-kg-v106-custom'),Path('/tmp/alo186-kg-v106-project')]:
              page=root/'affiliate-knowledge-graph'
              for name in ['index.html','app.js','styles.css','catalog-v105-extension.json','catalog-v106-extension.json']:
                  assert (page/name).is_file(), (root,name)
              assert route in (root/'sitemap.xml').read_text(encoding='utf-8')
              search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
              assert any(item['canonicalPath']==route for item in search['entries'])
              html=(page/'index.html').read_text(encoding='utf-8')
              assert '91 ürün sınıfı' in html and '8 karar paketi' in html
              assert '"@type":"Product"' not in html and '"@type":"Offer"' not in html
          print(json.dumps({'ok':True,'route':route,'intents':41,'productClasses':91,'journeys':8}))
          PY

      - name: Mevcut yayın ve güven regresyonları
        run: |
          set -euo pipefail
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Doğrulanmış site artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-affiliate-knowledge-graph-v106-pages
          path: /tmp/alo186-kg-v106-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
