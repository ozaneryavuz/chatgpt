name: ALO186 standby load trust growth v354

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/kapali-cihaz-elektrik-harcar-mi-bekleme-modu-standby-tuketimi/**'
      - 'alo186/hesaplama/bekleme-modu-standby-kwh-hesaplama/**'
      - 'alo186/deployment/routing-overlays/standby-load-growth-v354.json'
      - 'alo186/tests/test_standby_load_growth_v354.py'
      - '.github/workflows/alo186-standby-load-growth-v354.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/kapali-cihaz-elektrik-harcar-mi-bekleme-modu-standby-tuketimi/**'
      - 'alo186/hesaplama/bekleme-modu-standby-kwh-hesaplama/**'
      - 'alo186/deployment/routing-overlays/standby-load-growth-v354.json'
      - 'alo186/tests/test_standby_load_growth_v354.py'
      - '.github/workflows/alo186-standby-load-growth-v354.yml'

permissions:
  contents: read

concurrency:
  group: alo186-standby-v354-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Standby trust privacy and no-commerce checks
        run: python alo186/tests/test_standby_load_growth_v354.py
      - name: Global content intent collision guard
        run: python alo186/tests/test_content_intent_consolidation.py
      - name: Canonical production build and smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-standby-v354
          python alo186/deployment/build_static_site.py --output /tmp/alo186-standby-v354 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-standby-v354
      - name: Verify routes sitemap schemas and commercial closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-standby-v354')
          routes = [
              ('/haberler/kapali-cihaz-elektrik-harcar-mi-bekleme-modu-standby-tuketimi/', 'Article'),
              ('/hesaplama/bekleme-modu-standby-kwh-hesaplama/', 'WebApplication'),
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 354
          for route, schema in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              html = page.read_text(encoding='utf-8')
              assert f'https://alo186.com{route}' in sitemap
              assert f'<link rel="canonical" href="https://alo186.com{route}">' in html
              assert f'"@type":"{schema}"' in html
              assert '"@type":"BreadcrumbList"' in html
              assert 'amazon.com.tr' not in html.lower()
              assert '"@type":"Product"' not in html
              assert '"@type":"Offer"' not in html
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': [r[0] for r in routes], 'merchantLinks': 0})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-standby-v354-${{ github.sha }}
          path: /tmp/alo186-standby-v354
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
