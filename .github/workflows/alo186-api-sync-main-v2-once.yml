name: ALO186 API hardening v0.3 dalını main ile senkronize et v2

on:
  push:
    branches: [feat/alo186-api-hardening-v03]
    paths:
      - 'alo186/sureklilik-api/.sync-main-v2-trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alo186-api-hardening-v03
          fetch-depth: 0
      - name: Main değişikliklerini feature dalına birleştir
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge origin/main --no-edit
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Çakışan dosyalar:"
            echo "$conflicts"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                alo186/sureklilik-api/*|.github/workflows/alo186-continuity-api-ci.yml)
                  git checkout --ours "$file"
                  git add "$file"
                  ;;
              esac
            done <<EOF
          $conflicts
          EOF
            remaining=$(git diff --name-only --diff-filter=U)
            if [ -n "$remaining" ]; then
              echo "Otomatik çözülemeyen çakışmalar:"
              echo "$remaining"
              exit 1
            fi
            git commit --no-edit
          fi
          git push origin HEAD:feat/alo186-api-hardening-v03
