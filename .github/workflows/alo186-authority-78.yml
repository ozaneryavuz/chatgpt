name: ALO186 içerik otoritesi 78+ rehber tabanı

on:
  pull_request:
    paths:
      - 'alo186/haberler/ups-eco-modu-acik-olmali-mi/**'
      - 'alo186/haberler/ges-inverter-mppt-giris-akimi-isc-nasil-kontrol-edilir/**'
      - 'alo186/haberler/jenerator-start-akusu-neden-bosalir-sarj-olmaz/**'
      - 'alo186/deployment/routing-overlays/**'
      - 'alo186/deployment/build_static_site.py'
      - 'alo186/tests/test_authority_overlay_78.js'
      - '.github/workflows/alo186-authority-78.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/ups-eco-modu-acik-olmali-mi/**'
      - 'alo186/haberler/ges-inverter-mppt-giris-akimi-isc-nasil-kontrol-edilir/**'
      - 'alo186/haberler/jenerator-start-akusu-neden-bosalir-sarj-olmaz/**'
      - 'alo186/deployment/routing-overlays/**'
      - 'alo186/deployment/build_static_site.py'
      - 'alo186/tests/test_authority_overlay_78.js'
      - '.github/workflows/alo186-authority-78.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-authority-78-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Mevcut 75 rehber regresyonu
        run: node alo186/tests/test_authority_content.js

      - name: 78 rehberlik authority tabanı
        run: node alo186/tests/test_authority_overlay_78.js

      - name: JSON XML ve Python sözdizimi
        shell: bash
        run: |
          python -m py_compile alo186/deployment/build_static_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          json.loads(Path('alo186/deployment/routing-overlays/content-authority-78.json').read_text(encoding='utf-8'))
          ET.parse('alo186/sitemap.xml')
          PY

      - name: Canonical ve cihaz hasarı güvenlik regresyonları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Etkili production bundle ve sitemap
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-authority-78 \
            --commit "$GITHUB_SHA" \
            > /tmp/alo186-authority-78-release.json
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-authority-78
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/alo186-authority-78')
          release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
          canonical_origin=release['canonicalHost'].rstrip('/')
          assert canonical_origin=='https://alo186.com'
          sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
          assert release['routingVersion']>=35
          assert release['articleCount']>=78
          assert release['routeCount']>=119
          assert 'content-authority-78.json' in release['routingOverlays']
          for slug in (
              'ups-eco-modu-acik-olmali-mi',
              'ges-inverter-mppt-giris-akimi-isc-nasil-kontrol-edilir',
              'jenerator-start-akusu-neden-bosalir-sarj-olmaz',
          ):
              assert (root/'haberler'/slug/'index.html').is_file(), slug
              expected=f'{canonical_origin}/haberler/{slug}'
              assert expected in sitemap, (slug, expected)
          PY

      - name: GitHub Pages custom-domain testi
        run: |
          cp -a /tmp/alo186-authority-78 /tmp/alo186-authority-78-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-authority-78-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-authority-78-custom \
            --base-path ''
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-authority-78-custom \
            --base-path ''

      - name: GitHub Pages project-path testi
        run: |
          cp -a /tmp/alo186-authority-78 /tmp/alo186-authority-78-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-authority-78-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-authority-78-project \
            --base-path '/chatgpt'
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-authority-78-project \
            --base-path '/chatgpt'

      - name: Doğrulanmış 78+ rehber taban artifactı
        uses: actions/upload-artifact@v5
        with:
          name: alo186-authority-78-baseline-pages
          path: /tmp/alo186-authority-78-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
