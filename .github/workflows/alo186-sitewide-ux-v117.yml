name: ALO186 iki dilli bağlama duyarlı site geneli UX v119

on:
  pull_request:
    paths:
      - 'alo186/assets/alo186-ux.css'
      - 'alo186/assets/alo186-ux.js'
      - 'alo186/deployment/prepare_github_pages.py'
      - 'alo186/tests/test_sitewide_ux_v117.py'
      - 'alo186/tests/test_sitewide_ux_v119.py'
      - 'alo186/docs/user-centered-audit-2026-07-31.md'
      - '.github/workflows/alo186-sitewide-ux-v117.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/assets/alo186-ux.css'
      - 'alo186/assets/alo186-ux.js'
      - 'alo186/deployment/prepare_github_pages.py'
      - 'alo186/tests/test_sitewide_ux_v117.py'
      - 'alo186/tests/test_sitewide_ux_v119.py'
      - 'alo186/docs/user-centered-audit-2026-07-31.md'
      - '.github/workflows/alo186-sitewide-ux-v117.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-sitewide-ux-v119-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mevcut site geneli UX regresyonu
        run: python alo186/tests/test_sitewide_ux_v117.py

      - name: Tüm canonical ve Pages rotalarında v119 UX denetimi
        run: |
          set -euo pipefail
          python alo186/tests/test_sitewide_ux_v119.py | tee /tmp/alo186-sitewide-ux-v119-audit.log

      - name: Mevcut yayın ve güven regresyonları
        run: |
          set -euo pipefail
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Site geneli kullanıcı deneyimi denetim kaydı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-sitewide-ux-v119-audit
          path: /tmp/alo186-sitewide-ux-v119-audit.log
          if-no-files-found: error
          retention-days: 45
