name: ALO186 site geneli kullanıcı deneyimi v121

on:
  pull_request:
    paths:
      - 'alo186/index.html'
      - 'alo186/styles.css'
      - 'alo186/assets/alo186-ux.css'
      - 'alo186/assets/alo186-ux.js'
      - 'alo186/deployment/finalize_user_experience.py'
      - 'alo186/deployment/finalize_user_entrypoints.py'
      - 'alo186/deployment/inject_live_quality_hardening_v2.py'
      - 'alo186/deployment/prepare_github_pages.py'
      - 'alo186/tests/test_portal_hardening.js'
      - 'alo186/tests/test_portal_inventory_claims.js'
      - 'alo186/tests/test_sitewide_ux_v117.py'
      - 'alo186/tests/test_sitewide_user_experience_v120.py'
      - 'alo186/tests/test_contextual_journeys_v120.py'
      - 'alo186/tests/test_final_user_entrypoints_v121.py'
      - '.github/workflows/alo186-sitewide-ux-v117.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/index.html'
      - 'alo186/styles.css'
      - 'alo186/assets/alo186-ux.css'
      - 'alo186/assets/alo186-ux.js'
      - 'alo186/deployment/finalize_user_experience.py'
      - 'alo186/deployment/finalize_user_entrypoints.py'
      - 'alo186/deployment/inject_live_quality_hardening_v2.py'
      - 'alo186/deployment/prepare_github_pages.py'
      - 'alo186/tests/test_portal_hardening.js'
      - 'alo186/tests/test_portal_inventory_claims.js'
      - 'alo186/tests/test_sitewide_ux_v117.py'
      - 'alo186/tests/test_sitewide_user_experience_v120.py'
      - 'alo186/tests/test_contextual_journeys_v120.py'
      - 'alo186/tests/test_final_user_entrypoints_v121.py'
      - '.github/workflows/alo186-sitewide-ux-v117.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-sitewide-ux-v121-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ortak mobil, erişilebilirlik ve project-path UX sözleşmesi
        run: python alo186/tests/test_sitewide_ux_v117.py

      - name: Tüm HTML sayfaları, rota bütünlüğü ve kullanıcı öncelikli portal
        run: python alo186/tests/test_sitewide_user_experience_v120.py

      - name: İki dilli devam rotaları ve dinamik affiliate şeffaflığı
        run: python alo186/tests/test_contextual_journeys_v120.py

      - name: Final giriş sadeliği ve iç jargon kalite kapısı
        run: python alo186/tests/test_final_user_entrypoints_v121.py

      - name: Mevcut yayın ve güven regresyonları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          node alo186/tests/test_portal_inventory_claims.js
          python alo186/tests/device_damage_deadline_guard.py
