name: ALO186 elektrik kesintisi tatbikatı kalite kontrolü

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/elektrik-kesintisi-tatbikati/**'
      - 'alo186/sureklilik-paneli/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - 'alo186/tests/test_outage_drill*.js'
      - 'alo186/tests/test_drill_panel_handoff.js'
      - 'alo186/tests/test_continuity_store.js'
      - '.github/workflows/alo186-outage-drill.yml'
  push:
    branches: [main, fix/alo186-drill-panel-handoff-20260728]
    paths:
      - 'alo186/hesaplama/elektrik-kesintisi-tatbikati/**'
      - 'alo186/sureklilik-paneli/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - 'alo186/tests/test_outage_drill*.js'
      - 'alo186/tests/test_drill-panel-handoff.js'
      - 'alo186/tests/test_continuity_store.js'
      - '.github/workflows/alo186-outage-drill.yml'

permissions:
  contents: read

concurrency:
  group: alo186-outage-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tatbikat motoru, panel importer ve entegrasyon testleri
        run: |
          node alo186/tests/test_outage_drill.js
          node alo186/tests/test_outage_drill_integrity.js
          node alo186/tests/test_drill_panel_handoff.js
          node alo186/tests/test_continuity_store.js
          node alo186/tests/test_release_manifest.js
      - name: JSON ve Python sözdizimi
        run: |
          python -m json.tool alo186/hesaplama/elektrik-kesintisi-tatbikati/drill.schema.json >/dev/null
          python -m json.tool alo186/deployment/routing-manifest.json >/dev/null
          node --check alo186/sureklilik-paneli/store.js
          node --check alo186/sureklilik-paneli/drill-handoff-bridge.js
          node --check alo186/hesaplama/elektrik-kesintisi-tatbikati/app.js
      - name: Production bundle ve smoke test
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-outage-drill-site --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-outage-drill-site
          test -f /tmp/alo186-outage-drill-site/hesaplama/elektrik-kesintisi-tatbikati/index.html
          test -f /tmp/alo186-outage-drill-site/hesaplama/elektrik-kesintisi-tatbikati/core.js
          test -f /tmp/alo186-outage-drill-site/hesaplama/elektrik-kesintisi-tatbikati/drill.schema.json
          test -f /tmp/alo186-outage-drill-site/isletme-surekliligi/drill-handoff-bridge.js
      - name: Güven ve kişisel veri kapıları
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('alo186/hesaplama/elektrik-kesintisi-tatbikati')
          html = (root / 'index.html').read_text(encoding='utf-8')
          core = (root / 'core.js').read_text(encoding='utf-8')
          bridge = Path('alo186/sureklilik-paneli/drill-handoff-bridge.js').read_text(encoding='utf-8')
          assert not re.search(r'<input[^>]+type=["\'](?:text|email|tel)["\']', html, re.I), 'PII input alanı bulundu'
          assert '<textarea' not in html.lower(), 'Serbest metin alanı bulundu'
          assert not re.search(r'amazon\.|amzn\.', html, re.I), 'Affiliate host bulundu'
          assert '112’yi ara' in html, '112 güvenlik CTA eksik'
          assert 'alo186.continuity-drill-handoff.v1' in core, 'Panel handoff sözleşmesi eksik'
          assert 'lifeSupport' not in re.search(r'function exportPayload\(result\).*?\n  }', core, re.S).group(0), 'Yaşam destek seçimi export içinde'
          assert 'store.validateDrillHandoff' in bridge and 'store.importDrillHandoff' in bridge, 'Panel drill importer köprüsü eksik'
          assert 'localStorage.removeItem(DRILL_KEY)' in bridge, 'Tek kullanımlı drill handoff temizliği eksik'
          print('Güven, veri minimizasyonu ve panel handoff kapıları başarılı.')
          PY
