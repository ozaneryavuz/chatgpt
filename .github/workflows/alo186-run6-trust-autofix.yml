name: ALO186 run6 trust and repeat visit autofix

on:
  push:
    branches: [growth/alo186-trust-repeat-visit-run6-20260803]
    paths:
      - '.github/workflows/alo186-run6-trust-autofix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: growth/alo186-trust-repeat-visit-run6-20260803
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Remove brittle counts and expose repeat-visit card
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          home_path = Path('alo186/index.html')
          hub_path = Path('alo186/amazon-elektrik-urunleri/index.html')
          test_path = Path('alo186/tests/test_trust_repeat_visit_run6.py')

          home = home_path.read_text(encoding='utf-8')
          hub = hub_path.read_text(encoding='utf-8')

          hub = hub.replace('<strong>18+ karar rotası</strong>', '<strong>Güncel karar rotaları</strong>')
          home = home.replace('25 rehberin tamamını gör', 'Tüm ürün rehberlerini gör')
          home = home.replace('152 modeli doğrulanmış ürün için seçim kartları', 'Teknik olarak doğrulanmış ürün seçim kartları')

          route = '/elektrik-dayaniklilik-karti/'
          if route not in home:
              anchor = (
                  '        <a class="card" href="/hesaplama/"><span class="tag">Kişisel veri istemeyen araçlar</span>'
                  '<h2>Elektrik Hesaplama Merkezi</h2><p>Olgunluk, pasaport, tatbikat, akıllı priz, güneş paneli, '
                  'gerilim koruma, UPS, jeneratör, inverter, EV, kablo ve fatura araçlarını tek merkezden kullanın.</p>'
                  '<b>Hesaplayıcıları aç →</b></a>\n'
              )
              if anchor not in home:
                  raise SystemExit('Ana sayfa hesaplama kartı enjeksiyon noktası bulunamadı')
              card = (
                  '        <a class="card" href="/elektrik-dayaniklilik-karti/" data-alo186-resilience-card-entry="true">'
                  '<span class="tag">2 dakika · paylaşılabilir · kişisel verisiz</span>'
                  '<h2>Elektrik Dayanıklılık Kartı</h2>'
                  '<p>Ev, yakın evi, villa, site veya küçük işletme için hazırlık puanı alın; ilk üç aksiyonu görün, '
                  'kartı paylaşın ve değişiklik olduğunda yeniden kontrol edin.</p>'
                  '<b>Dayanıklılık kartını oluştur →</b></a>\n'
              )
              home = home.replace(anchor, anchor + card, 1)

          home_path.write_text(home, encoding='utf-8')
          hub_path.write_text(hub, encoding='utf-8')

          test_path.write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nhome = (ROOT / "alo186/index.html").read_text(encoding="utf-8")\nhub = (ROOT / "alo186/amazon-elektrik-urunleri/index.html").read_text(encoding="utf-8")\n\nassert 'href="/elektrik-dayaniklilik-karti/"' in home\nassert 'data-alo186-resilience-card-entry="true"' in home\nassert 'kişisel verisiz' in home\nassert 'kartı paylaşın' in home\nassert '18+ karar rotası' not in hub\nassert 'Güncel karar rotaları' in hub\nassert '25 rehberin tamamını gör' not in home\nassert '152 modeli doğrulanmış ürün için seçim kartları' not in home\nassert 'Amazon Gelir Ortağı' in hub\nassert 'Mevcut sistem yeterliyse satın alma yok' in hub\nassert 'www.amazon.com.tr' not in home[home.index('data-alo186-resilience-card-entry'):home.index('data-alo186-resilience-card-entry') + 700]\nprint('ALO186 run6 trust and repeat visit: PASS')\n''', encoding='utf-8')
          PY
          python alo186/tests/test_trust_repeat_visit_run6.py
          rm .github/workflows/alo186-run6-trust-autofix.yml
          git config user.name 'alo186-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add alo186/index.html alo186/amazon-elektrik-urunleri/index.html alo186/tests/test_trust_repeat_visit_run6.py .github/workflows/alo186-run6-trust-autofix.yml
          git commit -m 'feat(alo186): strengthen trust and repeat visits'
          git push origin HEAD:growth/alo186-trust-repeat-visit-run6-20260803
