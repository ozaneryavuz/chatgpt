name: ALO186 bina su ve hidrofor kesinti güveni v292

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-apartmanda-su-kesilir-mi-hidrofor-calisir-mi/**'
      - 'alo186/hesaplama/apartman-hidrofor-elektrik-kesintisi-su-plani/**'
      - 'alo186/sektor-rehberi/apartman-site-otel-hidrofor-su-surekliligi/**'
      - 'alo186/deployment/affiliate-category-decisions/building-water-outage-v292.json'
      - 'alo186/deployment/routing-overlays/growth-v292-building-water-outage.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v292_building_water_outage.py'
      - '.github/workflows/alo186-growth-v292-building-water-outage.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-apartmanda-su-kesilir-mi-hidrofor-calisir-mi/**'
      - 'alo186/hesaplama/apartman-hidrofor-elektrik-kesintisi-su-plani/**'
      - 'alo186/sektor-rehberi/apartman-site-otel-hidrofor-su-surekliligi/**'
      - 'alo186/deployment/affiliate-category-decisions/building-water-outage-v292.json'
      - 'alo186/deployment/routing-overlays/growth-v292-building-water-outage.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v292_building_water_outage.py'
      - '.github/workflows/alo186-growth-v292-building-water-outage.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v292-building-water-outage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Bina su sürekliliği ve affiliate yönetişimi
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/tests/test_growth_v292_building_water_outage.py \
            alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v292_building_water_outage.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/affiliate-category-decisions/building-water-outage-v292.json >/dev/null
          python -m json.tool alo186/deployment/routing-overlays/growth-v292-building-water-outage.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v292
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v292 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-v292
          test -f /tmp/alo186-v292/haberler/elektrik-kesilince-apartmanda-su-kesilir-mi-hidrofor-calisir-mi/index.html
          test -f /tmp/alo186-v292/hesaplama/apartman-hidrofor-elektrik-kesintisi-su-plani/index.html
          test -f /tmp/alo186-v292/sektor-rehberi/apartman-site-otel-hidrofor-su-surekliligi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v292
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py \
            --output /tmp/alo186-sites-v292 \
            --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-sites-v292')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-apartmanda-su-kesilir-mi-hidrofor-calisir-mi/',
              '/hesaplama/apartman-hidrofor-elektrik-kesintisi-su-plani/',
              '/sektor-rehberi/apartman-site-otel-hidrofor-su-surekliligi/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for route in expected:
              page = pages[route]
              assert page['affiliate']['hasAffiliateLinks'] is False
              assert not page['affiliate']['unsafeStaticLinks']
          print(json.dumps({'ok': True, 'routes': sorted(expected), 'merchantLinks': 0}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v292 bina su ve hidrofor kesinti paketi

          - “Elektrik kesilince apartmanda su kesilir mi?” niyeti: kaynak doğrulamalı canonical rehber
          - Şebeke suyu + depo + hidrofor + üst kat basıncı ayrımı: kişisel verisiz ücretsiz planlayıcı
          - Apartman, site ve oteller: professional-only süreklilik matrisi
          - Hidrofor, pompa, sabit UPS, jeneratör ve transfer sistemi: consumer affiliate kapalı
          - Aktif taşkın, su-elektrik riski ve kuru çalışma şüphesi: ticari yol kapalı
          - Mevcut sistem kayıtlı testte yeterliyse: yeni ürün almayın
          - 30/90/365 günlük kaçak, görev testi ve bakım döngüsü: doğrulandı
          - Fiyat, stok, puan, yorum, garanti, Offer ve AggregateRating: yok
          - Canonical build, static smoke ve ChatGPT Sites import kabulü: başarılı
          EOF
