name: ALO186 garage door continuity growth v159

on:
  pull_request:
    paths:
      - "alo186/hesaplama/garaj-kapisi-elektrik-kesintisi-manuel-acma-guvenligi/**"
      - "alo186/hesaplama/garaj-kapisi-motoru-ups-batarya-w-wh-uygunluk/**"
      - "alo186/sektor-rehberi/garaj-kapisi-elektrik-kesintisi-guvenlik-test-merkezi/**"
      - "alo186/deployment/routing-overlays/159-garage-door-continuity-growth.json"
      - "alo186/audits/garage-door-continuity-growth-v159-2026-08-01.md"
      - "alo186/tests/test_garage_door_continuity_growth_v159.py"
      - ".github/workflows/alo186-garage-door-continuity-growth-v159.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/garaj-kapisi-elektrik-kesintisi-manuel-acma-guvenligi/**"
      - "alo186/hesaplama/garaj-kapisi-motoru-ups-batarya-w-wh-uygunluk/**"
      - "alo186/sektor-rehberi/garaj-kapisi-elektrik-kesintisi-guvenlik-test-merkezi/**"
      - "alo186/deployment/routing-overlays/159-garage-door-continuity-growth.json"
      - "alo186/tests/test_garage_door_continuity_growth_v159.py"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python alo186/tests/test_garage_door_continuity_growth_v159.py
