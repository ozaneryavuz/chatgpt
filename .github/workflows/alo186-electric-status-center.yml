name: ALO186 Elektrik Durum Merkezi kalite kontrolü

on:
  pull_request:
    paths:
      - 'alo186/elektrik-durum-merkezi/**'
      - 'alo186/deployment/routing-overlays/electric-status-center-run23.json'
      - 'alo186/tests/test_electric_status_center.py'
      - '.github/workflows/alo186-electric-status-center.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/elektrik-durum-merkezi/**'
      - 'alo186/deployment/routing-overlays/electric-status-center-run23.json'
      - 'alo186/tests/test_electric_status_center.py'
      - '.github/workflows/alo186-electric-status-center.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kaynak kalite ve güven sözleşmeleri
        run: python alo186/tests/test_electric_status_center.py
      - name: JavaScript sözdizimi
        run: node --check alo186/elektrik-durum-merkezi/app.js
      - name: Canonical üretim paketi
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-status-center --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-status-center
      - name: Custom-domain yayın katmanını hazırla
        run: |
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-status-center --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-status-center --base-path ''
      - name: Canonical rota kabulü
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/alo186-status-center')
          route='/elektrik-durum-merkezi'
          assert (root/route.strip('/')/'index.html').is_file()
          sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
          assert f'https://www.alo186.com{route}' in sitemap
          release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
          active={item.get('canonicalPath','').rstrip('/') for item in release['routes']}
          assert route in active
          assert release['routingVersion'] >= 75
          print({'route':route,'routingVersion':release['routingVersion'],'routeCount':len(active)})
          PY
