name: ALO186 portal envanter drift tek seferlik düzeltme

on:
  push:
    branches: [fix/alo186-portal-inventory-drift]
    paths:
      - '.github/alo186-portal-inventory-autofix.trigger'
      - '.github/workflows/alo186-portal-inventory-autofix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-portal-inventory-drift
          fetch-depth: 0

      - name: Hızla değişen sayısal envanter iddialarını kaldır
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('alo186/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '26 kişisel veri istemeyen araç': 'kişisel veri istemeyen araçlar',
              '26 kişisel veri istemeyen hesaplama ve karar aracı': 'kişisel veri istemeyen hesaplama ve karar araçları',
              '45 kaynak doğrulamalı teknik rehber': 'kaynak doğrulamalı teknik rehberler',
              '45 kaynak doğrulamalı rehber': 'kaynak doğrulamalı rehberler',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed = True
          if not changed:
              raise SystemExit('Beklenen eski portal envanter iddiaları bulunamadı; manuel inceleme gerekir.')
          path.write_text(text, encoding='utf-8')
          PY
          node alo186/tests/test_portal_inventory_claims.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Tek seferlik yardımcıları kaldır ve dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/alo186-portal-inventory-autofix-once.yml .github/alo186-portal-inventory-autofix.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alo186/index.html
          git commit -m 'fix(alo186): portal araç ve rehber envanteri sayısal driftini kaldır'
          git push origin HEAD:fix/alo186-portal-inventory-drift
