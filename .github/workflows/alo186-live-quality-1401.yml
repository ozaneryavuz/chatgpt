name: ALO186 Live Quality Audit 1401

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit tools
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2 lighthouse@12.8.2
          npx playwright install --with-deps chromium

      - name: Static crawl, redirects, headers, sitemap and schema
        shell: bash
        run: |
          mkdir -p artifacts/screenshots artifacts/lighthouse
          cat > /tmp/static_audit.py <<'PY'
          import json, re, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urljoin, urlparse, urldefrag
          import requests
          from bs4 import BeautifulSoup
          from lxml import etree

          ORIGIN='https://www.alo186.com'
          session=requests.Session()
          session.headers.update({'User-Agent':'ALO186-Live-Quality-Audit/2026-07-28-1401'})
          TIMEOUT=30

          def req(url, allow=True, stream=False):
              try:
                  r=session.get(url, timeout=TIMEOUT, allow_redirects=allow, stream=stream)
                  return r, None
              except Exception as e:
                  return None, repr(e)

          def host_probe(url):
              first,e1=req(url,False,True); final,e2=req(url,True,True)
              return {'url':url,'first_status':getattr(first,'status_code',None),'location':first.headers.get('location') if first else None,'final_status':getattr(final,'status_code',None),'final_url':getattr(final,'url',None),'error':e1 or e2}

          def simple_check(url):
              r,e=req(url,False,True)
              return {'url':url,'status':getattr(r,'status_code',None),'location':r.headers.get('location') if r else None,'content_type':r.headers.get('content-type') if r else None,'cache_control':r.headers.get('cache-control') if r else None,'error':e}

          def parse_sitemap(url, seen=None):
              seen=seen or set()
              if url in seen:return []
              seen.add(url); r,e=req(url)
              if not r or r.status_code>=400:return []
              try:root=etree.fromstring(r.content)
              except Exception:return []
              locs=[str(x).strip() for x in root.xpath('//*[local-name()="loc"]/text()')]
              if etree.QName(root).localname=='sitemapindex':
                  out=[]
                  for loc in locs:out.extend(parse_sitemap(loc,seen))
                  return out
              return locs

          def absurl(v,base):
              try:return urldefrag(urljoin(base,v))[0]
              except Exception:return None

          def internal(u):
              try:return urlparse(u).hostname in ('alo186.com','www.alo186.com')
              except Exception:return False

          def page_audit(url):
              first,e0=req(url,False,True); r,e=req(url)
              if not r:return {'url':url,'error':e}
              headers={k:r.headers.get(k) for k in ['strict-transport-security','x-content-type-options','content-security-policy','referrer-policy','permissions-policy','cache-control','x-robots-tag']}
              out={'url':url,'first_status':getattr(first,'status_code',None),'first_location':first.headers.get('location') if first else None,'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'headers':headers}
              if 'text/html' not in out['content_type']:return out
              s=BeautifulSoup(r.text,'lxml')
              can=[absurl(x.get('href',''),r.url) for x in s.select('link[rel~=canonical]') if x.get('href')]
              h1=[x.get_text(' ',strip=True) for x in s.find_all('h1')]
              robots_tag=s.find('meta',attrs={'name':re.compile('^robots$',re.I)})
              robots=robots_tag.get('content','') if robots_tag else ''
              jerr=[]; jcount=0
              for x in s.select('script[type="application/ld+json"]'):
                  raw=x.get_text(strip=True)
                  if not raw:continue
                  try:json.loads(raw);jcount+=1
                  except Exception as ex:jerr.append(str(ex))
              imgs=[]
              for x in s.find_all('img'):
                  imgs.append({'src':absurl(x.get('src',''),r.url),'alt':x.get('alt'),'width':x.get('width'),'height':x.get('height'),'loading':x.get('loading')})
              links=[]
              for x in s.find_all('a',href=True):
                  u=absurl(x['href'],r.url)
                  if u and internal(u):links.append(u)
              ids=[x.get('id') for x in s.find_all(attrs={'id':True})]
              dup=sorted({x for x in ids if ids.count(x)>1})
              text=' '.join(s.get_text(' ',strip=True).split())
              pii=[]
              for x in s.select('input,textarea,select'):
                  blob=' '.join([str(x.get('name','')),str(x.get('placeholder','')),str(x.get('autocomplete','')),str(x.get('aria-label',''))])
                  if re.search(r'tc|kimlik|adres|abon|telefon|phone|email|e-posta|plaka',blob,re.I):pii.append(blob)
              out['parsed']={'canonicals':can,'h1':h1,'robots':robots,'jsonld_count':jcount,'jsonld_errors':jerr,'images':imgs,'internal_links':sorted(set(links)),'duplicate_ids':dup,'pii_inputs':pii,'suspicious_official':bool(re.search(r'ALO186.{0,80}(başvuru|ihbar|hasar kaydı)\s*(alır|oluşturur|iletir)|resm[iî]\s+(başvuru|kayıt)\s+(oluştur|al)',text,re.I)),'has_10_business_days':bool(re.search(r'10\s*(iş|is)\s*gün',text,re.I)),'has_30_day_damage_claim':bool(re.search(r'(cihaz|teçhizat|hasar).{0,220}30\s*gün|30\s*gün.{0,220}(cihaz|teçhizat|hasar)',text,re.I)),'noindex':bool(re.search(r'noindex',robots,re.I) or re.search(r'noindex',headers.get('x-robots-tag') or '',re.I))}
              return out

          report={'generated_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'host_probes':[host_probe(x) for x in ['https://alo186.com/','https://www.alo186.com/','http://alo186.com/','http://www.alo186.com/']]}
          report['robots']=simple_check(ORIGIN+'/robots.txt')
          report['sitemap']=simple_check(ORIGIN+'/sitemap.xml')
          report['release']=simple_check(ORIGIN+'/alo186-release.json')
          report['checksums']=simple_check(ORIGIN+'/checksums.sha256')
          urls=sorted(set(parse_sitemap(ORIGIN+'/sitemap.xml')))
          report['sitemap_url_count']=len(urls)
          pages=[]
          with ThreadPoolExecutor(max_workers=10) as ex:
              fut={ex.submit(page_audit,u):u for u in urls}
              for f in as_completed(fut):
                  try:pages.append(f.result())
                  except Exception as e:pages.append({'url':fut[f],'error':repr(e)})
          report['pages']=sorted(pages,key=lambda x:x.get('url',''))
          links=sorted({u for p in pages for u in p.get('parsed',{}).get('internal_links',[])})
          imgs=sorted({i.get('src') for p in pages for i in p.get('parsed',{}).get('images',[]) if i.get('src') and not i.get('src','').startswith('data:')})
          report['internal_link_count']=len(links);report['image_url_count']=len(imgs)
          with ThreadPoolExecutor(max_workers=12) as ex:report['links']=list(ex.map(simple_check,links))
          with ThreadPoolExecutor(max_workers=12) as ex:report['images']=list(ex.map(simple_check,imgs))
          with open('artifacts/static-audit.json','w') as f:json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps({'sitemap_urls':len(urls),'internal_links':len(links),'images':len(imgs),'release':report['release'],'checksums':report['checksums']},ensure_ascii=False))
          PY
          python /tmp/static_audit.py | tee artifacts/static-audit.log

      - name: Browser, mobile, desktop, overflow, clipping and axe audit
        shell: bash
        run: |
          cat > browser_audit_1401.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          const routes=['/','/elektrik-portali','/elektrik-kesintisi','/haberler','/hesaplama/','/akilli-urun-secimi'];
          const views=[
            {name:'mobile360',width:360,height:800,isMobile:true,hasTouch:true},
            {name:'mobile390',width:390,height:844,isMobile:true,hasTouch:true},
            {name:'desktop1440',width:1440,height:1000,isMobile:false,hasTouch:false}
          ];
          const out=[];
          const browser=await chromium.launch({headless:true});
          try{
            for(const v of views){
              const ctx=await browser.newContext({viewport:{width:v.width,height:v.height},isMobile:v.isMobile,hasTouch:v.hasTouch});
              for(const route of routes){
                const page=await ctx.newPage();const consoleErrors=[];const pageErrors=[];const failedRequests=[];
                page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
                page.on('pageerror',e=>pageErrors.push(String(e)));
                page.on('requestfailed',r=>failedRequests.push({url:r.url(),error:r.failure()?.errorText||''}));
                try{
                  const response=await page.goto('https://www.alo186.com'+route,{waitUntil:'networkidle',timeout:60000});
                  await page.waitForTimeout(1500);
                  const metrics=await page.evaluate(()=>{
                    const vis=el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'&&Number(s.opacity)!==0};
                    const label=el=>(el.innerText||el.getAttribute('aria-label')||el.getAttribute('name')||el.tagName).trim().replace(/\s+/g,' ').slice(0,100);
                    const targets=[...document.querySelectorAll('a,button,input,select,textarea,[role="button"]')].filter(vis).map(el=>{const r=el.getBoundingClientRect();return{tag:el.tagName,text:label(el),width:Math.round(r.width),height:Math.round(r.height)}}).filter(x=>x.width<44||x.height<44).slice(0,250);
                    const clipped=[...document.querySelectorAll('p,h1,h2,h3,h4,li,a,button,span')].filter(vis).map(el=>({text:label(el),tag:el.tagName,clientW:el.clientWidth,scrollW:el.scrollWidth,clientH:el.clientHeight,scrollH:el.scrollHeight,overflow:getComputedStyle(el).overflow,overflowX:getComputedStyle(el).overflowX,overflowY:getComputedStyle(el).overflowY})).filter(x=>(x.scrollW>x.clientW+2&&x.clientW>0)||(x.scrollH>x.clientH+3&&x.clientH>0&&['hidden','clip'].includes(x.overflowY||x.overflow))).slice(0,250);
                    const interactives=[...document.querySelectorAll('a,button,input,select,textarea,[role="button"]')].filter(vis).map((el,i)=>{const r=el.getBoundingClientRect();return{i,text:label(el),left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height,el}}).filter(x=>x.width>0&&x.height>0);
                    const overlaps=[];
                    for(let i=0;i<interactives.length;i++)for(let j=i+1;j<interactives.length;j++){
                      const a=interactives[i],b=interactives[j];
                      if(a.el.contains(b.el)||b.el.contains(a.el))continue;
                      const w=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left));
                      const h=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
                      const area=w*h;if(area<=0)continue;
                      const ratio=area/Math.min(a.width*a.height,b.width*b.height);
                      if(ratio>.25)overlaps.push({a:a.text,b:b.text,ratio:Number(ratio.toFixed(2))});
                      if(overlaps.length>=100)break;
                    }
                    const ids=[...document.querySelectorAll('[id]')].map(x=>x.id);
                    return{url:location.href,title:document.title,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,overflowPx:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),failedImages:[...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.currentSrc||i.src),pendingImages:[...document.images].filter(i=>!i.complete).map(i=>i.currentSrc||i.src),duplicateIds:[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))],h1Count:document.querySelectorAll('h1').length,smallTargets:targets,clipped,overlaps};
                  });
                  let violations=[];try{const a=await new AxeBuilder({page}).analyze();violations=a.violations.map(x=>({id:x.id,impact:x.impact,description:x.description,nodes:x.nodes.length,helpUrl:x.helpUrl}))}catch(e){violations=[{id:'axe-error',impact:'unknown',description:String(e),nodes:0}]}
                  const name=route==='/'?'home':route.replace(/^\//,'').replaceAll('/','-')||'home';const shot=`artifacts/screenshots/${v.name}-${name}.png`;
                  await page.screenshot({path:shot,fullPage:true});
                  out.push({viewport:v.name,route,status:response?.status()??null,metrics,consoleErrors,pageErrors,failedRequests,axeViolations:violations,screenshot:shot});
                }catch(e){out.push({viewport:v.name,route,error:String(e),consoleErrors,pageErrors,failedRequests})}
                await page.close();
              }
              await ctx.close();
            }
          }finally{await browser.close()}
          fs.writeFileSync('artifacts/browser-audit.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({scenarios:out.length}));
          NODE
          node browser_audit_1401.mjs | tee artifacts/browser-audit.log

      - name: Lighthouse repeated home and key pages
        shell: bash
        run: |
          set +e
          for n in 1 2 3; do
            npx lighthouse https://www.alo186.com/ --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="artifacts/lighthouse/mobile-home-${n}.json" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --throttling-method=simulate --quiet
          done
          npx lighthouse https://www.alo186.com/ --preset=desktop --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=artifacts/lighthouse/desktop-home.json --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --throttling-method=simulate --quiet
          for p in elektrik-portali elektrik-kesintisi haberler; do
            npx lighthouse "https://www.alo186.com/${p}" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="artifacts/lighthouse/mobile-${p}.json" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --throttling-method=simulate --quiet
          done
          exit 0

      - name: Summarize current live quality
        if: always()
        shell: bash
        run: |
          cat > /tmp/summary.py <<'PY'
          import json,os,glob,statistics
          def load(p,d):
              try:return json.load(open(p))
              except:return d
          s=load('artifacts/static-audit.json',{});b=load('artifacts/browser-audit.json',[]);l=[]
          for p in sorted(glob.glob('artifacts/lighthouse/*.json')):
              try:
                  r=json.load(open(p));a=r.get('audits',{});c=r.get('categories',{});n=lambda x:a.get(x,{}).get('numericValue')
                  l.append({'file':os.path.basename(p),'url':r.get('finalUrl'),'scores':{k:round(c.get(k,{}).get('score',0)*100) for k in ['performance','accessibility','best-practices','seo']},'metrics':{'fcp_ms':n('first-contentful-paint'),'lcp_ms':n('largest-contentful-paint'),'tbt_ms':n('total-blocking-time'),'cls':n('cumulative-layout-shift'),'speed_index_ms':n('speed-index')},'opportunities':[{ 'id':x.get('id'),'title':x.get('title'),'savings_ms':x.get('details',{}).get('overallSavingsMs'),'savings_bytes':x.get('details',{}).get('overallSavingsBytes')} for x in a.values() if isinstance(x,dict) and x.get('details',{}).get('type')=='opportunity']})
              except Exception as e:l.append({'file':os.path.basename(p),'error':repr(e)})
          pages=s.get('pages',[]);links=s.get('links',[]);imgs=s.get('images',[])
          summary={'generated_at':s.get('generated_at'),'scope':{'sitemap_urls':s.get('sitemap_url_count',0),'internal_links':s.get('internal_link_count',0),'images':s.get('image_url_count',0),'browser_scenarios':len(b)},'host_probes':s.get('host_probes',[]),'robots':s.get('robots'),'sitemap':s.get('sitemap'),'release':s.get('release'),'checksums':s.get('checksums'),'counts':{'bad_pages':sum(1 for x in pages if x.get('error') or (x.get('status') or 0)>=400),'broken_links':sum(1 for x in links if x.get('error') or (x.get('status') or 0)>=400),'bad_images':sum(1 for x in imgs if x.get('error') or (x.get('status') or 0)>=400 or not (x.get('content_type') or '').startswith('image/')),'canonical_not_one':sum(1 for x in pages if x.get('parsed') is not None and len(x['parsed'].get('canonicals',[]))!=1),'h1_not_one':sum(1 for x in pages if x.get('parsed') is not None and len(x['parsed'].get('h1',[]))!=1),'jsonld_errors':sum(1 for x in pages if x.get('parsed',{}).get('jsonld_errors')),'noindex_pages':sum(1 for x in pages if x.get('parsed',{}).get('noindex')),'damage_30_day_pages':sum(1 for x in pages if x.get('parsed',{}).get('has_30_day_damage_claim')),'suspicious_official_pages':sum(1 for x in pages if x.get('parsed',{}).get('suspicious_official')),'pii_input_pages':sum(1 for x in pages if x.get('parsed',{}).get('pii_inputs')),'overflow_scenarios':sum(1 for x in b if x.get('metrics',{}).get('overflowPx',0)>2),'browser_image_failures':sum(1 for x in b if x.get('metrics',{}).get('failedImages') or x.get('metrics',{}).get('pendingImages')),'browser_console_errors':sum(len(x.get('consoleErrors',[])) for x in b),'failed_requests':sum(len(x.get('failedRequests',[])) for x in b),'axe_violation_records':sum(len(x.get('axeViolations',[])) for x in b),'mobile_small_targets':sum(len(x.get('metrics',{}).get('smallTargets',[])) for x in b if x.get('viewport','').startswith('mobile')),'clipped_records':sum(len(x.get('metrics',{}).get('clipped',[])) for x in b),'overlap_records':sum(len(x.get('metrics',{}).get('overlaps',[])) for x in b)},'missing_headers':{h:sum(1 for x in pages if not x.get('headers',{}).get(h)) for h in ['strict-transport-security','x-content-type-options','content-security-policy','referrer-policy','permissions-policy']},'damage_30_day_urls':[x.get('final_url') for x in pages if x.get('parsed',{}).get('has_30_day_damage_claim')],'broken_link_items':[x for x in links if x.get('error') or (x.get('status') or 0)>=400][:100],'bad_image_items':[x for x in imgs if x.get('error') or (x.get('status') or 0)>=400 or not (x.get('content_type') or '').startswith('image/')][:100],'browser':b,'lighthouse':l}
          homes=[x for x in l if x.get('file','').startswith('mobile-home-') and 'scores' in x]
          if homes:summary['home_mobile_medians']={'performance':statistics.median(x['scores']['performance'] for x in homes),'lcp_ms':statistics.median(x['metrics']['lcp_ms'] or 0 for x in homes),'tbt_ms':statistics.median(x['metrics']['tbt_ms'] or 0 for x in homes),'cls':statistics.median(x['metrics']['cls'] or 0 for x in homes)}
          json.dump(summary,open('artifacts/summary.json','w'),ensure_ascii=False,indent=2)
          lines=['# ALO186 canlı kalite özeti','',f"Sitemap: {summary['scope']['sitemap_urls']} · İç link: {summary['scope']['internal_links']} · Görsel: {summary['scope']['images']} · Tarayıcı: {summary['scope']['browser_scenarios']}",'','## Hata sayıları','']
          lines += [f'- {k}: {v}' for k,v in summary['counts'].items()]
          lines += ['','## Eksik güvenlik başlıkları','']+[f'- {k}: {v}' for k,v in summary['missing_headers'].items()]
          lines += ['','## Lighthouse','','| Dosya | Perf | Eriş | En iyi | SEO | LCP | TBT | CLS |','|---|---:|---:|---:|---:|---:|---:|---:|']
          for x in l:
              if 'scores' in x:lines.append(f"| {x['file']} | {x['scores']['performance']} | {x['scores']['accessibility']} | {x['scores']['best-practices']} | {x['scores']['seo']} | {round(x['metrics']['lcp_ms'] or 0)} ms | {round(x['metrics']['tbt_ms'] or 0)} ms | {x['metrics']['cls']} |")
          lines += ['','## Host yönlendirmeleri','']+[f"- {x.get('url')} → {x.get('first_status')} {x.get('location') or ''}; final {x.get('final_status')} {x.get('final_url') or ''}" for x in summary['host_probes']]
          if summary['damage_30_day_urls']:lines += ['','## Eski cihaz hasarı süreli URL’ler','']+[f'- {x}' for x in summary['damage_30_day_urls']]
          open('artifacts/summary.md','w').write('\n'.join(lines)+'\n');print('\n'.join(lines))
          PY
          python /tmp/summary.py

      - name: Upload live audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-quality-1401
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
