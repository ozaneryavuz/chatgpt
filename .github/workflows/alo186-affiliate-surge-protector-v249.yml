name: ALO186 güvenli akım korumalı priz affiliate v249

on:
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/**'
      - 'alo186/deployment/routing-overlays/249-affiliate-surge-protector.json'
      - 'alo186/tests/test_affiliate_surge_protector_v249.js'
      - '.github/workflows/alo186-affiliate-surge-protector-v249.yml'
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/**'
      - 'alo186/deployment/routing-overlays/249-affiliate-surge-protector.json'
      - 'alo186/tests/test_affiliate_surge_protector_v249.js'
      - '.github/workflows/alo186-affiliate-surge-protector-v249.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-surge-protector-v249-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ürün, Knowledge Graph ve affiliate güven regresyonu
        run: |
          node --check alo186/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/catalog-v249.js
          node --check alo186/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/app-v249.js
          node alo186/tests/test_affiliate_surge_protector_v249.js
      - name: Affiliate kapsam ve ticari yönetişim
        run: |
          printf '%s\n' \
            'alo186/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/index.html' \
            'alo186/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/catalog-v249.js' \
            'alo186/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/app-v249.js' \
            > /tmp/changed-affiliate-v249.txt
          python alo186/tests/test_affiliate_scope_policy_v229.py --changed-files /tmp/changed-affiliate-v249.txt
          node alo186/tests/test_release_manifest.js
      - name: Canonical production paketi
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-affiliate-v249 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-affiliate-v249
          test -f /tmp/alo186-affiliate-v249/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/index.html
          grep -Fq 'https://alo186.com/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/' /tmp/alo186-affiliate-v249/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/index.html
          grep -Fq 'rel="sponsored nofollow noopener"' /tmp/alo186-affiliate-v249/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/index.html
          ! grep -Eqi '"@type"[[:space:]]*:[[:space:]]*"Offer"|priceCurrency|aggregateRating|ratingValue' /tmp/alo186-affiliate-v249/amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/index.html
