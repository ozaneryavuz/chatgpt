name: ALO186 power station solar input v356

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/power-station-gunes-paneli-uygunluk-sarj-suresi/**'
      - 'alo186/deployment/routing-overlays/356-power-station-solar-input.json'
      - 'alo186/deployment/affiliate-category-decisions/power-station-solar-input-v356.json'
      - 'alo186/tests/test_power_station_solar_input_v356.py'
      - '.github/workflows/alo186-power-station-solar-input-v356.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/power-station-gunes-paneli-uygunluk-sarj-suresi/**'
      - 'alo186/deployment/routing-overlays/356-power-station-solar-input.json'
      - 'alo186/deployment/affiliate-category-decisions/power-station-solar-input-v356.json'
      - 'alo186/tests/test_power_station_solar_input_v356.py'
      - '.github/workflows/alo186-power-station-solar-input-v356.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-power-station-solar-v356-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Karar motoru, güvenlik, gizlilik ve affiliate sözleşmesi
        run: |
          set -euo pipefail
          node alo186/hesaplama/power-station-gunes-paneli-uygunluk-sarj-suresi/test.js
          python alo186/tests/test_power_station_solar_input_v356.py
          node --check alo186/hesaplama/power-station-gunes-paneli-uygunluk-sarj-suresi/core.js
          node --check alo186/hesaplama/power-station-gunes-paneli-uygunluk-sarj-suresi/app.js

      - name: Canonical üretim build ve static smoke
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-power-station-solar-v356 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-power-station-solar-v356

      - name: Final artifact rota, sitemap ve client asset kabulü
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/alo186-power-station-solar-v356')
          route='hesaplama/power-station-gunes-paneli-uygunluk-sarj-suresi'
          for name in ('index.html','styles.css','core.js','app.js'):
              assert (root/route/name).is_file(), name
          html=(root/route/'index.html').read_text(encoding='utf-8')
          sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
          canonical='https://alo186.com/hesaplama/power-station-gunes-paneli-uygunluk-sarj-suresi/'
          assert f'<link rel="canonical" href="{canonical}">' in html
          assert canonical in sitemap
          assert 'amazon.com.tr' not in html.lower()
          app=(root/route/'app.js').read_text(encoding='utf-8')
          assert 'alo186rehber-21' in app and 'sponsored nofollow noopener' in app
          release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
          assert release
          print({'ok':True,'canonical':canonical,'affiliate':'dynamic+3 confirmations','privacy':'no PII/storage/fetch'})
          PY

      - name: Mevcut release ve portal regresyonları
        run: |
          set -euo pipefail
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Doğrulanmış üretim artifactı
        uses: actions/upload-artifact@v7
        with:
          name: alo186-power-station-solar-v356-pages
          path: /tmp/alo186-power-station-solar-v356
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
