name: ALO186 kombi yedek enerji büyümesi v191

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/kombi-elektrik-kesintisi-ups-guc-istasyonu-uygunlugu/**'
      - 'alo186/amazon-elektrik-urunleri/kombi-yedek-enerji-urun-secici/**'
      - 'alo186/sektor-rehberi/kombi-elektrik-kesintisi-30-90-gun-test-merkezi/**'
      - 'alo186/deployment/routing-overlays/191-kombi-yedek-enerji-growth.json'
      - 'alo186/audits/kombi-yedek-enerji-growth-v191-2026-08-02.md'
      - 'alo186/tests/test_kombi_yedek_enerji_growth_v191.py'
      - '.github/workflows/alo186-kombi-yedek-enerji-v191.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/kombi-elektrik-kesintisi-ups-guc-istasyonu-uygunlugu/**'
      - 'alo186/amazon-elektrik-urunleri/kombi-yedek-enerji-urun-secici/**'
      - 'alo186/sektor-rehberi/kombi-elektrik-kesintisi-30-90-gun-test-merkezi/**'
      - 'alo186/deployment/routing-overlays/191-kombi-yedek-enerji-growth.json'
      - 'alo186/audits/kombi-yedek-enerji-growth-v191-2026-08-02.md'
      - 'alo186/tests/test_kombi_yedek_enerji_growth_v191.py'
      - '.github/workflows/alo186-kombi-yedek-enerji-v191.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed güven, routing ve affiliate sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_kombi_yedek_enerji_growth_v191.py
          python alo186/tests/test_kombi_yedek_enerji_growth_v191.py
          python - <<'PY'
          import re
          from pathlib import Path
          files = [
              Path('alo186/hesaplama/kombi-elektrik-kesintisi-ups-guc-istasyonu-uygunlugu/index.html'),
              Path('alo186/amazon-elektrik-urunleri/kombi-yedek-enerji-urun-secici/index.html'),
              Path('alo186/sektor-rehberi/kombi-elektrik-kesintisi-30-90-gun-test-merkezi/index.html'),
          ]
          for i, path in enumerate(files, 1):
              text = path.read_text(encoding='utf-8')
              scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
              assert scripts, path
              Path(f'/tmp/alo186-kombi-v191-{i}.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/alo186-kombi-v191-1.js
          node --check /tmp/alo186-kombi-v191-2.js
          node --check /tmp/alo186-kombi-v191-3.js
