name: ALO186 buzdolabı ve dondurucu yedek güç uygunluk testi

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/buzdolabi-dondurucu-yedek-guc-uygunluk/**'
      - 'alo186/hesaplama/common.js'
      - 'alo186/deployment/routing-overlays/084-fridge-freezer-backup-selector.json'
      - 'alo186/tests/test_fridge_freezer_backup_selector_v323.py'
      - 'alo186/tests/test_technical_shortlist_growth.js'
      - '.github/workflows/alo186-fridge-freezer-backup-selector-v323.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/buzdolabi-dondurucu-yedek-guc-uygunluk/**'
      - 'alo186/hesaplama/common.js'
      - 'alo186/deployment/routing-overlays/084-fridge-freezer-backup-selector.json'
      - 'alo186/tests/test_fridge_freezer_backup_selector_v323.py'
      - 'alo186/tests/test_technical_shortlist_growth.js'
      - '.github/workflows/alo186-fridge-freezer-backup-selector-v323.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-fridge-freezer-backup-selector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Karar motoru ve modül sözleşmesi
        run: |
          set -euo pipefail
          node alo186/hesaplama/buzdolabi-dondurucu-yedek-guc-uygunluk/app.test.js
          python alo186/tests/test_fridge_freezer_backup_selector_v323.py

      - name: Sözdizimi ve mevcut güvenlik regresyonları
        run: |
          set -euo pipefail
          node --check alo186/hesaplama/buzdolabi-dondurucu-yedek-guc-uygunluk/app.js
          node --check alo186/hesaplama/common.js
          python -m py_compile alo186/tests/test_fridge_freezer_backup_selector_v323.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_technical_shortlist_growth.js
          python alo186/tests/test_content_intent_consolidation.py
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical statik site üretimi
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-fridge-freezer-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-fridge-freezer-canonical
          test -f /tmp/alo186-fridge-freezer-canonical/hesaplama/buzdolabi-dondurucu-yedek-guc-uygunluk/index.html
          grep -q 'Buzdolabı ve Dondurucu Yedek Güç Uygunluk Testi' /tmp/alo186-fridge-freezer-canonical/hesaplama/buzdolabi-dondurucu-yedek-guc-uygunluk/index.html

      - name: Custom-domain ve project-path paketleri
        run: |
          set -euo pipefail
          cp -a /tmp/alo186-fridge-freezer-canonical /tmp/alo186-fridge-freezer-custom
          cp -a /tmp/alo186-fridge-freezer-canonical /tmp/alo186-fridge-freezer-project

          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-fridge-freezer-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-fridge-freezer-custom \
            --base-path ''
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-fridge-freezer-custom \
            --base-path '' > /tmp/alo186-fridge-freezer-custom.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-fridge-freezer-custom \
            --base-path ''

          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-fridge-freezer-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-fridge-freezer-project \
            --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-fridge-freezer-project \
            --base-path '/chatgpt' > /tmp/alo186-fridge-freezer-project.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-fridge-freezer-project \
            --base-path '/chatgpt'

      - name: Affiliate, gizlilik ve yayın kabulü
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          route_path = 'hesaplama/buzdolabi-dondurucu-yedek-guc-uygunluk'
          canonical_path = '/hesaplama/buzdolabi-dondurucu-yedek-guc-uygunluk/'
          for root, prefix in [
              (Path('/tmp/alo186-fridge-freezer-custom'), ''),
              (Path('/tmp/alo186-fridge-freezer-project'), '/chatgpt'),
          ]:
              route = root / route_path
              for name in ('index.html', 'styles.css', 'app.js'):
                  assert (route / name).is_file(), (root, name)
              html = (route / 'index.html').read_text(encoding='utf-8')
              app = (route / 'app.js').read_text(encoding='utf-8')
              assert 'Satış ortaklığı açıklaması' in html
              assert 'doğrudan mağaza bağlantısı açmaz' in html
              assert 'yaklaşık 4 saat' in html and 'yaklaşık 48 saat' in html and 'yaklaşık 24 saat' in html
              assert 'amazon.com' not in html.casefold()
              assert 'amazon.' not in app.casefold()
              for forbidden in ('localStorage', 'sessionStorage', 'fetch(', 'XMLHttpRequest', 'navigator.geolocation'):
                  assert forbidden not in app
              assert 'actualNeed' in app and 'technicalCheck' in app and 'affiliateCheck' in app
              assert 'medicalStorage' in app and 'active_event' in app and 'no_buy' in app
              expected = f'{prefix}{canonical_path}' if prefix else canonical_path
              sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
              assert f'<loc>https://alo186.com{canonical_path}</loc>' in sitemap
              search_file = root / 'arama/search-index.json'
              assert search_file.is_file()
              search = json.loads(search_file.read_text(encoding='utf-8'))
              entry = next(item for item in search['entries'] if item['canonicalPath'] == canonical_path)
              assert entry['url'] == expected
              common = (root / 'hesaplama/common.js').read_text(encoding='utf-8')
              assert canonical_path in common
              assert 'data-alo186-fridge-freezer-backup-card' in common
              counts = [int(value) for value in re.findall(r'(\d+) çekirdek araç', common)]
              assert counts and max(counts) >= 38
          PY

      - name: Doğrulanmış artifact
        uses: actions/upload-artifact@v4
        with:
          name: alo186-fridge-freezer-backup-selector-pages
          path: /tmp/alo186-fridge-freezer-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
