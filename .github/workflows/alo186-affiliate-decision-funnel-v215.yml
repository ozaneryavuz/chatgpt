name: ALO186 affiliate decision funnel v215

on:
  pull_request:
    paths:
      - 'alo186/deployment/inject_affiliate_decision_funnel_v215.py'
      - 'alo186/deployment/affiliate_decision_funnel_v215_config.py'
      - 'alo186/deployment/affiliate_decision_funnel_v215_markup.py'
      - 'alo186/deployment/affiliate_decision_funnel_v215.js'
      - 'alo186/deployment/affiliate_decision_funnel_v215.css'
      - 'alo186/deployment/guard_commerce_routes_v3.py'
      - 'alo186/tests/test_affiliate_decision_funnel_v215.py'
      - 'alo186/audits/affiliate-event-contract-v215.json'
      - 'alo186/audits/affiliate-decision-funnel-v215-2026-08-02.md'
      - '.github/workflows/alo186-affiliate-decision-funnel-v215.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/deployment/inject_affiliate_decision_funnel_v215.py'
      - 'alo186/deployment/affiliate_decision_funnel_v215_config.py'
      - 'alo186/deployment/affiliate_decision_funnel_v215_markup.py'
      - 'alo186/deployment/affiliate_decision_funnel_v215.js'
      - 'alo186/deployment/affiliate_decision_funnel_v215.css'
      - 'alo186/deployment/guard_commerce_routes_v3.py'
      - 'alo186/tests/test_affiliate_decision_funnel_v215.py'
      - 'alo186/audits/affiliate-event-contract-v215.json'
      - 'alo186/audits/affiliate-decision-funnel-v215-2026-08-02.md'
      - '.github/workflows/alo186-affiliate-decision-funnel-v215.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-decision-funnel-v215-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Sözleşme ve birim testleri
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/deployment/inject_affiliate_decision_funnel_v215.py \
            alo186/deployment/affiliate_decision_funnel_v215_config.py \
            alo186/deployment/affiliate_decision_funnel_v215_markup.py \
            alo186/deployment/guard_commerce_routes_v3.py \
            alo186/tests/test_affiliate_decision_funnel_v215.py
          python alo186/tests/test_affiliate_decision_funnel_v215.py
          grep -q 'import inject_affiliate_decision_funnel_v215 as affiliate_decision' alo186/deployment/guard_commerce_routes_v3.py
          grep -q 'affiliate_decision.inject' alo186/deployment/guard_commerce_routes_v3.py
          ! grep -Eq 'actions/(upload-pages-artifact|deploy-pages)' .github/workflows/alo186-affiliate-decision-funnel-v215.yml

      - name: Canonical siteyi oluştur
        shell: bash
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v215-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-v215-canonical

      - name: Custom domain ve project path sözleşmesi
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'custom|' 'project|/chatgpt'; do
            name=${spec%%|*}
            base=${spec#*|}
            site="/tmp/alo186-v215-${name}"
            rm -rf "$site"
            cp -a /tmp/alo186-v215-canonical "$site"
            python alo186/deployment/prepare_github_pages.py \
              --site "$site" \
              --base-path "$base" \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA"
            python alo186/deployment/inject_outcome_runtime.py --site "$site" --base-path "$base"
            python alo186/deployment/inject_contextual_affiliate_growth_v177.py --site "$site" --base-path "$base"
            python alo186/deployment/inject_live_quality_hardening_v2.py --site "$site" --base-path "$base"
            python alo186/deployment/inject_home_affiliate_banner_v209.py --site "$site" --base-path "$base"
            python alo186/deployment/inject_affiliate_intent_router_v210.py --site "$site" --base-path "$base"
            python alo186/deployment/inject_ga4_consent.py --site "$site" --base-path "$base" --measurement-id ""
            python alo186/deployment/inject_affiliate_measurement_v211.py --site "$site" --base-path "$base"
            python alo186/deployment/guard_commerce_routes_v3.py --site "$site" | tee "/tmp/alo186-v215-${name}-guard.json"
            node --check "$site/assets/affiliate-decision-funnel-v215.js"
            python alo186/deployment/smoke_github_pages.py --site "$site" --base-path "$base"
            python - "$site" "$base" <<'PY'
          import json
          import sys
          from pathlib import Path

          site = Path(sys.argv[1])
          base = sys.argv[2]
          release = json.loads((site / 'pages-release.json').read_text(encoding='utf-8'))
          funnel = release.get('affiliateDecisionFunnel') or {}
          assert funnel.get('version') == 215, funnel
          assert funnel.get('flows') == ['mini_ups', 'ups_runtime', 'power_station']
          assert funnel.get('directAmazonLinksAdded') == 0
          assert funnel.get('rawDestinationUrlStored') is False
          assert funnel.get('numericElectricalInputsStored') is False
          assert funnel.get('userOrDeviceIdentifierStored') is False
          contract = json.loads((site / 'affiliate-event-contract-v215.json').read_text(encoding='utf-8'))
          assert contract.get('version') == 215
          assert contract.get('privacy', {}).get('requiresAnalyticsConsentForGa4') is True
          assert contract.get('privacy', {}).get('rawDestinationUrlAllowed') is False
          targets = [
              site / 'amazon-elektrik-urunleri/modem-mini-ups-secimi/index.html',
              site / 'hesaplama/ups-suresi/index.html',
              site / 'hesaplama/power-station-kapasite-eps-uygunluk/index.html',
          ]
          for path in targets:
              html = path.read_text(encoding='utf-8')
              assert html.count('data-alo186-affiliate-decision-v215="true"') == 1, path
              assert html.count('data-decision-tier-card=') == 3, path
              assert 'amazon.com.tr/' not in html.lower(), path
              expected_asset = f'{base}/assets/affiliate-decision-funnel-v215.js' if base else '/assets/affiliate-decision-funnel-v215.js'
              assert expected_asset in html, (path, expected_asset)
          print(json.dumps({'ok': True, 'basePath': base, 'version': 215}, ensure_ascii=False))
          PY
          done
