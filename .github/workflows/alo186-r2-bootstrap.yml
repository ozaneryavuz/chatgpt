name: ALO186 R2 backup repository bootstrap

on:
  workflow_dispatch:
    inputs:
      apply:
        description: R2 bucket ve Restic deposunu gerçekten oluştur
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: alo186-production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ALO186_R2_ENDPOINT: ${{ vars.ALO186_R2_ENDPOINT }}
      ALO186_R2_BUCKET: ${{ vars.ALO186_R2_BUCKET }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
    steps:
      - name: Değerleri doğrula
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$ALO186_R2_ENDPOINT"
          test -n "$ALO186_R2_BUCKET"
          test -n "$RESTIC_PASSWORD"
      - name: Restic kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic
      - name: Bucket erişimini sınıflandır ve dry-run veya oluştur
        id: bucket
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bucket_error="$(aws --endpoint-url "$ALO186_R2_ENDPOINT" --region auto \
            s3api head-bucket --bucket "$ALO186_R2_BUCKET" 2>&1 >/dev/null)"
          bucket_status=$?
          set -e

          if [[ "$bucket_status" -eq 0 ]]; then
            echo "SAME   $ALO186_R2_BUCKET"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Eqi '(\(404\)|NoSuchBucket|Not Found)' <<<"$bucket_error"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.apply }}" == "true" ]]; then
              aws --endpoint-url "$ALO186_R2_ENDPOINT" --region auto \
                s3api create-bucket --bucket "$ALO186_R2_BUCKET"
              aws --endpoint-url "$ALO186_R2_ENDPOINT" --region auto \
                s3api head-bucket --bucket "$ALO186_R2_BUCKET"
              echo "CREATE $ALO186_R2_BUCKET"
              echo 'created=true' >> "$GITHUB_OUTPUT"
            else
              echo "WOULD CREATE $ALO186_R2_BUCKET"
              echo 'created=false' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo 'R2 bucket yokluğu doğrulanamadı; credential, yetki veya endpoint hatası olabilir.' >&2
          printf '%s\n' "$bucket_error" | head -c 2000 >&2
          exit 1
      - name: Restic repository dry-run veya init
        shell: bash
        run: |
          set -euo pipefail
          export RESTIC_REPOSITORY="s3:${ALO186_R2_ENDPOINT%/}/${ALO186_R2_BUCKET}"

          if [[ "${{ steps.bucket.outputs.exists }}" != "true" && "${{ inputs.apply }}" != "true" ]]; then
            echo 'WOULD INIT Restic repository after bucket creation.'
            exit 0
          fi

          set +e
          config_error="$(aws --endpoint-url "$ALO186_R2_ENDPOINT" --region auto \
            s3api head-object --bucket "$ALO186_R2_BUCKET" --key config 2>&1 >/dev/null)"
          config_status=$?
          set -e

          if [[ "$config_status" -eq 0 ]]; then
            restic snapshots --compact
            restic check
            echo 'SAME   Restic repository mevcut ve erişilebilir.'
            exit 0
          fi

          if grep -Eqi '(\(404\)|NoSuchKey|Not Found)' <<<"$config_error"; then
            if [[ "${{ inputs.apply }}" == "true" ]]; then
              restic init
              restic snapshots --compact
              restic check
              echo 'CREATE Restic repository.'
            else
              echo 'WOULD INIT Restic repository.'
            fi
            exit 0
          fi

          echo 'Restic config nesnesinin yokluğu doğrulanamadı; R2 erişim veya yetki hatası olabilir.' >&2
          printf '%s\n' "$config_error" | head -c 2000 >&2
          exit 1
      - name: Uygulama sonrası erişimi doğrula
        if: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          export RESTIC_REPOSITORY="s3:${ALO186_R2_ENDPOINT%/}/${ALO186_R2_BUCKET}"
          aws --endpoint-url "$ALO186_R2_ENDPOINT" --region auto s3api head-bucket --bucket "$ALO186_R2_BUCKET"
          aws --endpoint-url "$ALO186_R2_ENDPOINT" --region auto s3api head-object --bucket "$ALO186_R2_BUCKET" --key config
          restic snapshots --compact
          restic check
