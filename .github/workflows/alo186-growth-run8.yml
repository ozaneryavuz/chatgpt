name: ALO186 VPP, ortak EV şarj ve runtime büyümesi

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/vpp-esnek-yuk-hazirlik/**'
      - 'alo186/hesaplama/apartman-site-ev-sarj-karar-paketi/**'
      - 'alo186/hesaplama/yedek-guc-runtime-saglik-gunlugu/**'
      - 'alo186/deployment/inject_growth_run8.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-overlays/growth-vpp-ev-runtime-run8.json'
      - 'alo186/tests/test_growth_run8.py'
      - 'alo186/tests/test_growth_run8_review_fixes.js'
      - '.github/workflows/alo186-growth-run8.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/vpp-esnek-yuk-hazirlik/**'
      - 'alo186/hesaplama/apartman-site-ev-sarj-karar-paketi/**'
      - 'alo186/hesaplama/yedek-guc-runtime-saglik-gunlugu/**'
      - 'alo186/deployment/inject_growth_run8.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-overlays/growth-vpp-ev-runtime-run8.json'
      - 'alo186/tests/test_growth_run8.py'
      - 'alo186/tests/test_growth_run8_review_fixes.js'
      - '.github/workflows/alo186-growth-run8.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-growth-run8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kaynak, gizlilik, no-buy ve Codex review davranış sözleşmeleri
        run: |
          python alo186/tests/test_growth_run8.py
          node alo186/tests/test_growth_run8_review_fixes.js

      - name: Python ve tarayıcı betiği sözdizimi
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile alo186/deployment/inject_growth_run8.py
          python -m py_compile alo186/deployment/inject_shortlist_growth.py
          for file in \
            alo186/hesaplama/vpp-esnek-yuk-hazirlik/core.js \
            alo186/hesaplama/vpp-esnek-yuk-hazirlik/app.js \
            alo186/hesaplama/apartman-site-ev-sarj-karar-paketi/core.js \
            alo186/hesaplama/apartman-site-ev-sarj-karar-paketi/app.js \
            alo186/hesaplama/yedek-guc-runtime-saglik-gunlugu/core.js \
            alo186/hesaplama/yedek-guc-runtime-saglik-gunlugu/app.js; do
            node --check "$file"
          done

      - name: Mevcut içerik, ticaret ve cihaz hasarı regresyonları
        run: |
          python alo186/tests/test_content_intent_consolidation.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical üretim paketini oluştur
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-growth8-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-growth8-canonical

      - name: Custom-domain artifactı
        run: |
          cp -a /tmp/alo186-growth8-canonical /tmp/alo186-growth8-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-growth8-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-growth8-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-growth8-custom --base-path '' > /tmp/growth8-custom.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-growth8-custom --base-path ''

      - name: Project-path artifactı
        run: |
          cp -a /tmp/alo186-growth8-canonical /tmp/alo186-growth8-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-growth8-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-growth8-project --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-growth8-project --base-path '/chatgpt' > /tmp/growth8-project.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-growth8-project --base-path '/chatgpt'

      - name: Artifact, arama, PWA ve giriş noktaları
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          routes = [
              '/hesaplama/vpp-esnek-yuk-hazirlik/',
              '/hesaplama/apartman-site-ev-sarj-karar-paketi/',
              '/hesaplama/yedek-guc-runtime-saglik-gunlugu/',
          ]
          expected_buckets = {
              routes[0]: 'business',
              routes[1]: 'business',
              routes[2]: 'calculator',
          }
          canonical_feasibility='/hizmetler/ges-batarya-ev-sarj-fizibilitesi/'
          legacy_feasibility='/hizmetler/ges-batarya-ev-fizibilitesi/'
          for root, prefix in [
              (Path('/tmp/alo186-growth8-custom'), ''),
              (Path('/tmp/alo186-growth8-project'), '/chatgpt'),
          ]:
              release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
              pages=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
              search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
              index={item['canonicalPath']:item for item in search['entries']}
              contract=release['growthRun8']
              assert contract['rawPersonalDataCollected'] is False
              assert contract['directAffiliateLinksAdded']==0
              assert contract['unverifiedCommercialFieldsUsed']==[]
              assert contract['noBuyOutcomePreserved'] is True
              assert contract['aggregatorRanking'] is False
              assert contract['incomeEstimatePublished'] is False
              assert contract['officialApprovalClaimed'] is False
              assert contract['runtimeJournalLocalOnly'] is True
              assert contract['runtimeJournalTtlDays']==540
              assert contract['fixedInstallationDirectAffiliate'] is False
              assert pages['growthRun8']['rawPersonalDataCollected'] is False
              assert pages['growthRun8']['directAffiliateLinksAdded']==0
              sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
              sw=(root/'sw.js').read_text(encoding='utf-8')
              for route in routes:
                  directory=root/route.strip('/')
                  page=directory/'index.html'
                  assert page.is_file(), page
                  html=page.read_text(encoding='utf-8')
                  assert (directory/'core.js').is_file(), directory/'core.js'
                  assert (directory/'app.js').is_file(), directory/'app.js'
                  assert 'application/ld+json' in html
                  assert 'amazon.com' not in html.lower() and 'amzn.' not in html.lower()
                  assert f'https://www.alo186.com{route}' in sitemap
                  assert route in index
                  assert index[route]['bucket']==expected_buckets[route]
                  assert index[route]['url']==(prefix+route if prefix else route)
                  assert not any(field in index[route] for field in ['price','stock','rating','seller','warranty','asin'])
                  assert (prefix+route if prefix else route) in sw

              runtime_dir=root/routes[2].strip('/')
              runtime_html=(runtime_dir/'index.html').read_text(encoding='utf-8')
              runtime_core=(runtime_dir/'core.js').read_text(encoding='utf-8')
              runtime_app=(runtime_dir/'app.js').read_text(encoding='utf-8')
              assert 'alo186.backupRuntimeJournal.v1' in runtime_core+runtime_app
              assert 'TTL_MS=540*86400000' in runtime_core
              assert "retentionMode:'per-record'" in runtime_core
              assert 'repeatedSignificantDrop' in runtime_core
              assert 'Reklam / satış ortaklığı açıklaması' in runtime_html

              vpp_dir=root/routes[0].strip('/')
              ev_dir=root/routes[1].strip('/')
              vpp_html=(vpp_dir/'index.html').read_text(encoding='utf-8')
              ev_html=(ev_dir/'index.html').read_text(encoding='utf-8')
              assert canonical_feasibility in vpp_html and canonical_feasibility in ev_html
              assert legacy_feasibility not in vpp_html and legacy_feasibility not in ev_html
              assert 'assetRequired' in (vpp_dir/'core.js').read_text(encoding='utf-8')
              assert 'MAX_SCORE=11' in (ev_dir/'core.js').read_text(encoding='utf-8')

              hub=(root/'hesaplama/index.html').read_text(encoding='utf-8')
              portal=(root/'elektrik-portali/index.html').read_text(encoding='utf-8')
              product=(root/'amazon-elektrik-urunleri/index.html').read_text(encoding='utf-8')
              assert 'data-alo186-growth-run8-tools="true"' in hub
              assert 'data-alo186-growth-run8-journey="true"' in portal
              assert 'data-alo186-growth-run8-affiliate="true"' in product
              manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
              urls={item.get('url') for item in manifest.get('shortcuts',[]) if isinstance(item,dict)}
              assert (prefix+routes[0] if prefix else routes[0]) in urls
              assert (prefix+routes[2] if prefix else routes[2]) in urls
          PY

      - name: Doğrulanmış büyüme artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-vpp-ev-runtime-growth
          path: /tmp/alo186-growth8-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
