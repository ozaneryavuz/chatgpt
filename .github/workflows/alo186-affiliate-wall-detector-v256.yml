name: ALO186 güvenli duvar kablo dedektörü affiliate v256

on:
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/**'
      - 'alo186/deployment/routing-overlays/256-affiliate-wall-detector.json'
      - 'alo186/tests/test_affiliate_wall_detector_v256.js'
      - '.github/workflows/alo186-affiliate-wall-detector-v256.yml'
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/**'
      - 'alo186/deployment/routing-overlays/256-affiliate-wall-detector.json'
      - 'alo186/tests/test_affiliate_wall_detector_v256.js'
      - '.github/workflows/alo186-affiliate-wall-detector-v256.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-wall-detector-v256-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ürün, Knowledge Graph ve affiliate güven regresyonu
        run: |
          node --check alo186/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/catalog-v256.js
          node --check alo186/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/app-v256.js
          node alo186/tests/test_affiliate_wall_detector_v256.js
      - name: Affiliate kapsam ve ticari yönetişim
        run: |
          printf '%s\n' \
            'alo186/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/index.html' \
            'alo186/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/catalog-v256.js' \
            'alo186/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/app-v256.js' \
            > /tmp/changed-affiliate-v256.txt
          python alo186/tests/test_affiliate_scope_policy_v229.py --changed-files /tmp/changed-affiliate-v256.txt
          node alo186/tests/test_release_manifest.js
      - name: Canonical production paketi
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-affiliate-v256 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-affiliate-v256
          test -f /tmp/alo186-affiliate-v256/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/index.html
          grep -Fq 'https://alo186.com/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/' /tmp/alo186-affiliate-v256/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/index.html
          grep -Fq 'rel="sponsored nofollow noopener"' /tmp/alo186-affiliate-v256/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/index.html
          ! grep -Eqi '"@type"[[:space:]]*:[[:space:]]*"Offer"|priceCurrency|aggregateRating|ratingValue|reviewCount' /tmp/alo186-affiliate-v256/amazon-elektrik-urunleri/duvar-kablo-metal-dedektoru-guvenli-delme-secimi/index.html
