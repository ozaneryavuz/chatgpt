name: ALO186 smart lock continuity growth v161

on:
  pull_request:
    paths:
      - "alo186/hesaplama/akilli-kilit-elektrik-kesintisi-pil-bitti-erisim-guvenligi/**"
      - "alo186/hesaplama/akilli-kilit-pil-yedek-guc-siber-guvenlik-uygunlugu/**"
      - "alo186/sektor-rehberi/akilli-kilit-erisim-surekliligi-test-merkezi/**"
      - "alo186/deployment/routing-overlays/161-smart-lock-continuity-growth.json"
      - "alo186/audits/smart-lock-continuity-growth-v161-2026-08-01.md"
      - "alo186/tests/test_smart_lock_continuity_growth_v161.py"
      - ".github/workflows/alo186-smart-lock-continuity-growth-v161.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/akilli-kilit-elektrik-kesintisi-pil-bitti-erisim-guvenligi/**"
      - "alo186/hesaplama/akilli-kilit-pil-yedek-guc-siber-guvenlik-uygunlugu/**"
      - "alo186/sektor-rehberi/akilli-kilit-erisim-surekliligi-test-merkezi/**"
      - "alo186/deployment/routing-overlays/161-smart-lock-continuity-growth.json"
      - "alo186/tests/test_smart_lock_continuity_growth_v161.py"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python alo186/tests/test_smart_lock_continuity_growth_v161.py
