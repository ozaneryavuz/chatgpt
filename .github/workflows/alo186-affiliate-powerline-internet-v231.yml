name: ALO186 affiliate powerline internet ölçümü v231

on:
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/priz-hatti-powerline-internet-olcum-secimi/**'
      - 'alo186/deployment/routing-overlays/231-affiliate-powerline-internet.json'
      - 'alo186/tests/test_affiliate_powerline_internet_v231.js'
      - '.github/workflows/alo186-affiliate-powerline-internet-v231.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/priz-hatti-powerline-internet-olcum-secimi/**'
      - 'alo186/deployment/routing-overlays/231-affiliate-powerline-internet.json'
      - 'alo186/tests/test_affiliate_powerline_internet_v231.js'
      - '.github/workflows/alo186-affiliate-powerline-internet-v231.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-powerline-internet-v231-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Exact ASIN, Knowledge Graph and stale gate
        run: |
          set -euo pipefail
          node --check alo186/amazon-elektrik-urunleri/priz-hatti-powerline-internet-olcum-secimi/catalog-v231.js
          node --check alo186/amazon-elektrik-urunleri/priz-hatti-powerline-internet-olcum-secimi/app-v231.js
          node alo186/tests/test_affiliate_powerline_internet_v231.js
      - name: Affiliate scope, existing safety and legal regressions
        run: |
          set -euo pipefail
          printf '%s\n' \
            alo186/amazon-elektrik-urunleri/priz-hatti-powerline-internet-olcum-secimi/index.html \
            alo186/amazon-elektrik-urunleri/priz-hatti-powerline-internet-olcum-secimi/catalog-v231.js \
            alo186/amazon-elektrik-urunleri/priz-hatti-powerline-internet-olcum-secimi/app-v231.js \
            > /tmp/alo186-powerline-v231-changed-files.txt
          python alo186/tests/test_affiliate_scope_policy_v229.py --changed-files /tmp/alo186-powerline-v231-changed-files.txt
          python alo186/tests/test_commerce_governance_v2.py
          python alo186/tests/test_commerce_governance_v3.py
          python alo186/tests/device_damage_deadline_guard.py
          node alo186/tests/test_release_manifest.js
      - name: Canonical production bundle
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py --output /tmp/alo186-powerline-v231 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-powerline-v231
          route=/tmp/alo186-powerline-v231/amazon-elektrik-urunleri/priz-hatti-powerline-internet-olcum-secimi
          test -f "$route/index.html"
          test -f "$route/catalog-v231.js"
          test -f "$route/app-v231.js"
          grep -Fq 'B0859MDSFX' "$route/index.html"
          grep -Fq 'B08XNLZLJ3' "$route/index.html"
          grep -Fq 'B00C2ICYPC' "$route/index.html"
          grep -Fq 'alo186rehber-21' "$route/catalog-v231.js"
          ! grep -Eq 'href="https://www\.amazon\.com\.tr/(dp|s\?k=)' "$route/index.html"
      - name: Custom-domain and project-path commerce acceptance
        run: |
          set -euo pipefail
          for spec in 'custom|' 'project|/chatgpt'; do
            name="${spec%%|*}"; base="${spec#*|}"; target="/tmp/alo186-powerline-v231-${name}"
            cp -a /tmp/alo186-powerline-v231 "$target"
            python alo186/deployment/prepare_github_pages.py --site "$target" --base-path "$base" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
            python alo186/deployment/inject_outcome_runtime.py --site "$target" --base-path "$base"
            python alo186/deployment/inject_shortlist_growth.py --site "$target" --base-path "$base" > "/tmp/alo186-powerline-v231-${name}-growth.json"
            python alo186/deployment/smoke_github_pages.py --site "$target" --base-path "$base"
            python alo186/deployment/guard_commerce_routes_v3.py --site "$target" | tee "/tmp/alo186-powerline-v231-${name}-guard.json"
          done
      - name: Verified artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: alo186-affiliate-powerline-internet-v231
          path: /tmp/alo186-powerline-v231-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
