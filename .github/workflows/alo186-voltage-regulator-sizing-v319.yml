name: ALO186 voltaj regülatörü kVA ve faz uygunluk testi

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/voltaj-regulatoru-kva-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-overlays/voltage-regulator-sizing-v319.json'
      - 'alo186/tests/test_voltage_regulator_sizing_v319.py'
      - 'alo186/tests/test_ups_va_topology_v318.py'
      - '.github/workflows/alo186-voltage-regulator-sizing-v319.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/voltaj-regulatoru-kva-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-overlays/voltage-regulator-sizing-v319.json'
      - 'alo186/tests/test_voltage_regulator_sizing_v319.py'
      - 'alo186/tests/test_ups_va_topology_v318.py'
      - '.github/workflows/alo186-voltage-regulator-sizing-v319.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-voltage-regulator-sizing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regülatör modülü sözleşme testi
        run: |
          python alo186/tests/test_voltage_regulator_sizing_v319.py
          python alo186/tests/test_ups_va_topology_v318.py

      - name: JavaScript ve Python sözdizimi
        run: |
          node --check alo186/hesaplama/voltaj-regulatoru-kva-uygunluk/app.js
          python -m py_compile alo186/tests/test_voltage_regulator_sizing_v319.py
          python -m py_compile alo186/tests/test_ups_va_topology_v318.py

      - name: Mevcut güven ve routing regresyonları
        run: |
          python alo186/tests/test_content_intent_consolidation.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical üretim paketini oluştur
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-voltage-regulator-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-voltage-regulator-canonical

      - name: Custom-domain Pages artifactı
        run: |
          cp -a /tmp/alo186-voltage-regulator-canonical /tmp/alo186-voltage-regulator-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-voltage-regulator-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-voltage-regulator-custom \
            --base-path ''
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-voltage-regulator-custom \
            --base-path '' \
            > /tmp/alo186-voltage-regulator-custom.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-voltage-regulator-custom \
            --base-path ''

      - name: Project-path Pages artifactı
        run: |
          cp -a /tmp/alo186-voltage-regulator-canonical /tmp/alo186-voltage-regulator-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-voltage-regulator-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-voltage-regulator-project \
            --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-voltage-regulator-project \
            --base-path '/chatgpt' \
            > /tmp/alo186-voltage-regulator-project.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-voltage-regulator-project \
            --base-path '/chatgpt'

      - name: Final artifact kabulü
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          route='/hesaplama/voltaj-regulatoru-kva-uygunluk/'
          for root,prefix in [
              (Path('/tmp/alo186-voltage-regulator-custom'),''),
              (Path('/tmp/alo186-voltage-regulator-project'),'/chatgpt'),
          ]:
              page=root/route.strip('/')/'index.html'
              app=page.with_name('app.js')
              styles=page.with_name('styles.css')
              assert page.is_file() and app.is_file() and styles.is_file()
              html=page.read_text(encoding='utf-8')
              js=app.read_text(encoding='utf-8')
              assert html.count('<h1')==1
              assert 'Voltaj Regülatörü kVA ve Faz Uygunluk Testi' in html
              assert 'sponsored nofollow noopener' in html
              assert 'alo186rehber-21' in js
              assert 'Ticari rota kapalı' in js or 'Ticari rota kapalı' in html
              assert 'localStorage' not in js and 'sessionStorage' not in js
              assert 'type="email"' not in html and 'type="tel"' not in html
              blocks=re.findall(r'<script[^>]+type="application/ld\+json"[^>]*>(.*?)</script>',html,re.S|re.I)
              types=set()
              for block in blocks:
                  payload=json.loads(block)
                  for node in payload.get('@graph',[payload]):
                      value=node.get('@type') if isinstance(node,dict) else None
                      if isinstance(value,str):types.add(value)
              assert {'WebApplication','FAQPage','BreadcrumbList'}<=types
              expected=prefix+route if prefix else route
              search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
              entry=next(item for item in search['entries'] if item['canonicalPath']==route)
              assert entry['url']==expected
              sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
              assert f'<loc>https://www.alo186.com{route}</loc>' in sitemap
              hub=(root/'hesaplama/index.html').read_text(encoding='utf-8')
              assert 'voltaj-regulatoru-kva-uygunluk' in hub
              count=re.search(r'(\d+) çekirdek araç',hub)
              assert count and int(count.group(1))>=34
          PY

      - name: Doğrulanmış regülatör modül artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-voltage-regulator-sizing-pages
          path: /tmp/alo186-voltage-regulator-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
