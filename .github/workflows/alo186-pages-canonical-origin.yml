name: ALO186 Pages canonical origin kalite kapısı

on:
  pull_request:
    paths:
      - 'alo186/deployment/prepare_github_pages.py'
      - 'alo186/deployment/prepare_github_pages_core.py'
      - 'alo186/deployment/finalize_live_quality.py'
      - 'alo186/deployment/smoke_github_pages.py'
      - 'alo186/tests/test_pages_canonical_origin.py'
      - '.github/workflows/alo186-pages-canonical-origin.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/deployment/prepare_github_pages.py'
      - 'alo186/deployment/prepare_github_pages_core.py'
      - 'alo186/deployment/finalize_live_quality.py'
      - 'alo186/deployment/smoke_github_pages.py'
      - 'alo186/tests/test_pages_canonical_origin.py'
      - '.github/workflows/alo186-pages-canonical-origin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-pages-canonical-origin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Namespace ve custom-domain metadata sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/deployment/prepare_github_pages.py \
            alo186/tests/test_pages_canonical_origin.py
          python alo186/tests/test_pages_canonical_origin.py

      - name: Project-path Pages kabulü
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-pages-origin-canonical \
            --commit "$GITHUB_SHA"
          cp -a /tmp/alo186-pages-origin-canonical /tmp/alo186-pages-origin-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-pages-origin-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-pages-origin-project \
            --base-path '/chatgpt'
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('/tmp/alo186-pages-origin-project/pages-release.json').read_text(encoding='utf-8'))
          assert release['canonicalHost']=='https://alo186.com'
          assert release['customDomain']=='alo186.com'
          assert release['basePath']=='/chatgpt'
          PY
