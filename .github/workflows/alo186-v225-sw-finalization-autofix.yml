name: ALO186 v225 service worker finalization autofix

on:
  push:
    branches: [fix/alo186-v225-sw-finalization-20260803]
    paths:
      - '.github/workflows/alo186-v225-sw-finalization-autofix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/alo186-v225-sw-finalization-20260803
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Wire finalizer after all article transformations
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('alo186/deployment/prepare_github_pages.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from finalize_live_quality import CANONICAL_HOST, CANONICAL_ORIGIN as LIVE_CANONICAL_ORIGIN\n'
          import_line = 'from finalize_pages_service_worker import finalize as finalize_service_worker_registration\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('prepare import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          call_anchor = '    ux = install_sitewide_ux(site, normalized)\n'
          call_line = '    service_worker_finalization = finalize_service_worker_registration(site, normalized)\n'
          if call_line not in text:
              if call_anchor not in text:
                  raise SystemExit('prepare finalizer call anchor missing')
              text = text.replace(call_anchor, call_anchor + call_line, 1)

          release_anchor = '    release["sitewideUx"] = ux\n'
          release_line = '    release["serviceWorkerRegistrationFinalization"] = service_worker_finalization\n'
          if release_line not in text:
              if release_anchor not in text:
                  raise SystemExit('prepare release anchor missing')
              text = text.replace(release_anchor, release_anchor + release_line, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile \
            alo186/deployment/finalize_pages_service_worker.py \
            alo186/deployment/prepare_github_pages.py \
            alo186/tests/test_finalize_pages_service_worker.py
          python alo186/tests/test_finalize_pages_service_worker.py
          rm .github/workflows/alo186-v225-sw-finalization-autofix.yml
          git config user.name 'alo186-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            alo186/deployment/prepare_github_pages.py \
            alo186/deployment/finalize_pages_service_worker.py \
            alo186/tests/test_finalize_pages_service_worker.py \
            .github/workflows/alo186-v225-sw-finalization-autofix.yml
          git commit -m 'fix(alo186): finalize service worker after article generation'
          git push origin HEAD:fix/alo186-v225-sw-finalization-20260803
