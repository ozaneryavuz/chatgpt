name: ALO186 outlet safety growth v345

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/priz-isiniyor-cizirti-yanik-kokusu-ne-yapmali/**'
      - 'alo186/hesaplama/priz-fis-elektrik-guvenlik-belirti-ayirici/**'
      - 'alo186/ev-elektrik-guvenlik-kontrol-merkezi/**'
      - 'alo186/deployment/routing-overlays/outlet-safety-growth-v345.json'
      - 'alo186/deployment/affiliate-category-decisions/outlet-safety-growth-v345.json'
      - 'alo186/tests/test_outlet_safety_growth_v345.py'
      - '.github/workflows/alo186-outlet-safety-v345.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/priz-isiniyor-cizirti-yanik-kokusu-ne-yapmali/**'
      - 'alo186/hesaplama/priz-fis-elektrik-guvenlik-belirti-ayirici/**'
      - 'alo186/ev-elektrik-guvenlik-kontrol-merkezi/**'
      - 'alo186/deployment/routing-overlays/outlet-safety-growth-v345.json'
      - 'alo186/deployment/affiliate-category-decisions/outlet-safety-growth-v345.json'
      - 'alo186/tests/test_outlet_safety_growth_v345.py'
      - '.github/workflows/alo186-outlet-safety-v345.yml'

permissions:
  contents: read

concurrency:
  group: alo186-outlet-safety-v345-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Outlet safety trust privacy no-buy and affiliate governance
        run: python alo186/tests/test_outlet_safety_growth_v345.py
      - name: Global content intent collision guard
        run: python alo186/tests/test_content_intent_consolidation.py
      - name: Canonical production build and smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-outlet-v345
          python alo186/deployment/build_static_site.py --output /tmp/alo186-outlet-v345 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-outlet-v345
      - name: Verify production routes and zero new merchant links
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-outlet-v345')
          routes = [
              '/haberler/priz-isiniyor-cizirti-yanik-kokusu-ne-yapmali/',
              '/hesaplama/priz-fis-elektrik-guvenlik-belirti-ayirici/',
              '/ev-elektrik-guvenlik-kontrol-merkezi/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 345
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              assert f'https://alo186.com{route}' in sitemap
          for route in routes:
              html = (root / route.strip('/') / 'index.html').read_text(encoding='utf-8').lower()
              assert 'href="https://www.amazon.com.tr' not in html
          tool_js = (root / 'hesaplama/priz-fis-elektrik-guvenlik-belirti-ayirici/app.js').read_text(encoding='utf-8')
          assert 'BEGIN:VCALENDAR' in tool_js
          assert 'affiliate ürün bağlantısı açılmaz' in tool_js
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes, 'newAffiliateClasses': 0, 'newMerchantLinks': 0})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-outlet-safety-v345-${{ github.sha }}
          path: /tmp/alo186-outlet-v345
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
