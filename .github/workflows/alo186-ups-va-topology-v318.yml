name: ALO186 UPS VA ve topoloji uygunluk testi

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/ups-va-topoloji-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-overlays/ups-va-topology-v318.json'
      - 'alo186/tests/test_ups_va_topology_v318.py'
      - '.github/workflows/alo186-ups-va-topology-v318.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/ups-va-topoloji-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-overlays/ups-va-topology-v318.json'
      - 'alo186/tests/test_ups_va_topology_v318.py'
      - '.github/workflows/alo186-ups-va-topology-v318.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-ups-va-topology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: UPS modülü sözleşme testi
        run: python alo186/tests/test_ups_va_topology_v318.py

      - name: JavaScript ve Python sözdizimi
        run: |
          node --check alo186/hesaplama/ups-va-topoloji-uygunluk/app.js
          python -m py_compile alo186/tests/test_ups_va_topology_v318.py

      - name: Canonical statik site üretimi
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-ups-va-topology \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-ups-va-topology

      - name: Üretilen rota ve güven kapısı kontrolü
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/alo186-ups-va-topology')
          page=root/'hesaplama/ups-va-topoloji-uygunluk/index.html'
          app=root/'hesaplama/ups-va-topoloji-uygunluk/app.js'
          assert page.is_file() and app.is_file()
          html=page.read_text(encoding='utf-8')
          js=app.read_text(encoding='utf-8')
          assert 'UPS VA, Watt ve Topoloji Uygunluk Testi' in html
          assert 'sponsored nofollow noopener' in html
          assert 'alo186rehber-21' in js
          assert 'Ticari rota kapalı' in js
          assert 'localStorage' not in js and 'sessionStorage' not in js
          PY

      # Bu kalite kapısı, ana daldaki son modül kodunu PR merge ref'i üzerinden doğrular.
