name: ALO186 sıcak hava kesintisi ve güvenli düşük güç seçimi v273

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-klima-calisir-mi/**'
      - 'alo186/hesaplama/elektrik-kesintisinde-sicak-hava-serinleme-plani/**'
      - 'alo186/amazon-elektrik-urunleri/sarjli-fan-termometre-elektrik-kesintisi-secimi/**'
      - 'alo186/deployment/routing-overlays/growth-v273-heat-outage.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v273_heat_outage.py'
      - '.github/workflows/alo186-growth-v273-heat-outage.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-klima-calisir-mi/**'
      - 'alo186/hesaplama/elektrik-kesintisinde-sicak-hava-serinleme-plani/**'
      - 'alo186/amazon-elektrik-urunleri/sarjli-fan-termometre-elektrik-kesintisi-secimi/**'
      - 'alo186/deployment/routing-overlays/growth-v273-heat-outage.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v273_heat_outage.py'
      - '.github/workflows/alo186-growth-v273-heat-outage.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v273-heat-outage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Sıcak hava, sağlık sınırı ve affiliate güven kapısı
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/tests/test_growth_v273_heat_outage.py \
            alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v273_heat_outage.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/routing-overlays/growth-v273-heat-outage.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v273
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v273 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-v273
          test -f /tmp/alo186-v273/haberler/elektrik-kesilince-klima-calisir-mi/index.html
          test -f /tmp/alo186-v273/hesaplama/elektrik-kesintisinde-sicak-hava-serinleme-plani/index.html
          test -f /tmp/alo186-v273/amazon-elektrik-urunleri/sarjli-fan-termometre-elektrik-kesintisi-secimi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v273
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py \
            --output /tmp/alo186-sites-v273 \
            --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-sites-v273')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-klima-calisir-mi/',
              '/hesaplama/elektrik-kesintisinde-sicak-hava-serinleme-plani/',
              '/amazon-elektrik-urunleri/sarjli-fan-termometre-elektrik-kesintisi-secimi/',
          }
          assert expected.issubset(pages), expected - set(pages)
          assert pages['/haberler/elektrik-kesilince-klima-calisir-mi/']['affiliate']['hasAffiliateLinks'] is False
          assert pages['/hesaplama/elektrik-kesintisinde-sicak-hava-serinleme-plani/']['affiliate']['hasAffiliateLinks'] is False
          commerce = pages['/amazon-elektrik-urunleri/sarjli-fan-termometre-elektrik-kesintisi-secimi/']
          assert commerce['affiliate']['safe'] is True
          assert commerce['affiliate']['disclosureVisible'] is True
          assert commerce['affiliate']['noBuyOutcomeVisible'] is True
          assert not commerce['affiliate']['unsafeStaticLinks']
          print(json.dumps({'ok': True, 'routes': sorted(expected)}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v273 sıcak hava kesintisi büyüme paketi

          - “Elektrik kesilince klima çalışır mı?” niyeti: kaynak doğrulamalı canonical rehber
          - Oda sıcaklığı, risk grubu, pasif serinleme ve mevcut fan testi: kişisel verisiz ücretsiz plan
          - 32 °C ve sağlık/electrik tehlikesinde: mağaza yolu kapalı
          - Klima, VRF ve chiller yedek gücü: consumer affiliate kapalı, professional-only
          - Mevcut fan hedef süreyi sağlıyorsa: satın almama sonucu
          - Şarjlı fan, USB fan ve pilli termometre: yalnız düşük riskli doğrulanmış ihtiyaçta
          - Amazon Türkiye bağlantıları: görünür açıklama ve güven kapısından sonra dinamik; statik href yok
          - 30/90 günlük bakım ve gerçek kesinti test döngüsü: yerel takvim dosyası
          - Fiyat, stok, puan, yorum, garanti, Offer ve AggregateRating: yok
          - Canonical build, static smoke ve ChatGPT Sites import kabulü: başarılı
          EOF
