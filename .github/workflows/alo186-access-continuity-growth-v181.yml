name: ALO186 access continuity growth v181

on:
  pull_request:
    paths:
      - "alo186/hesaplama/elektrik-kesintisi-erisilebilir-ev-cikis-aydinlatma-plani/**"
      - "alo186/hesaplama/akilli-kilit-pil-acil-guc-mekanik-anahtar-uygunlugu/**"
      - "alo186/sektor-rehberi/garaj-kapi-panjur-kepenk-elektrik-kesintisi-test-merkezi/**"
      - "alo186/deployment/routing-overlays/181-access-continuity-growth.json"
      - "alo186/audits/access-continuity-growth-v181-2026-08-01.md"
      - "alo186/tests/test_access_continuity_growth_v181.py"
      - ".github/workflows/alo186-access-continuity-growth-v181.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/elektrik-kesintisi-erisilebilir-ev-cikis-aydinlatma-plani/**"
      - "alo186/hesaplama/akilli-kilit-pil-acil-guc-mekanik-anahtar-uygunlugu/**"
      - "alo186/sektor-rehberi/garaj-kapi-panjur-kepenk-elektrik-kesintisi-test-merkezi/**"
      - "alo186/deployment/routing-overlays/181-access-continuity-growth.json"
      - "alo186/tests/test_access_continuity_growth_v181.py"
      - ".github/workflows/alo186-access-continuity-growth-v181.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python alo186/tests/test_access_continuity_growth_v181.py
