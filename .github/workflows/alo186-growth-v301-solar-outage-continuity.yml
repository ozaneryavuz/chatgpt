name: ALO186 GES kesinti sürekliliği v301

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-gunes-paneli-elektrik-verir-mi/**'
      - 'alo186/hesaplama/gunes-paneli-elektrik-kesintisi-yedekleme-uygunluk-kontrolu/**'
      - 'alo186/sektor-rehberi/ev-isletme-ges-kesinti-yedek-guc-surekliligi/**'
      - 'alo186/deployment/affiliate-category-decisions/solar-outage-v301.json'
      - 'alo186/deployment/routing-overlays/growth-v301-solar-outage-continuity.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v301_solar_outage_continuity.py'
      - '.github/workflows/alo186-growth-v301-solar-outage-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-gunes-paneli-elektrik-verir-mi/**'
      - 'alo186/hesaplama/gunes-paneli-elektrik-kesintisi-yedekleme-uygunluk-kontrolu/**'
      - 'alo186/sektor-rehberi/ev-isletme-ges-kesinti-yedek-guc-surekliligi/**'
      - 'alo186/deployment/affiliate-category-decisions/solar-outage-v301.json'
      - 'alo186/deployment/routing-overlays/growth-v301-solar-outage-continuity.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v301_solar_outage_continuity.py'
      - '.github/workflows/alo186-growth-v301-solar-outage-continuity.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v301-solar-outage-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: GES kesinti güven ve dönüşüm sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/tests/test_growth_v301_solar_outage_continuity.py \
            alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v301_solar_outage_continuity.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/affiliate-category-decisions/solar-outage-v301.json >/dev/null
          python -m json.tool alo186/deployment/routing-overlays/growth-v301-solar-outage-continuity.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v301
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v301 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v301
          test -f /tmp/alo186-v301/haberler/elektrik-kesilince-gunes-paneli-elektrik-verir-mi/index.html
          test -f /tmp/alo186-v301/hesaplama/gunes-paneli-elektrik-kesintisi-yedekleme-uygunluk-kontrolu/index.html
          test -f /tmp/alo186-v301/sektor-rehberi/ev-isletme-ges-kesinti-yedek-guc-surekliligi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v301
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v301 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-sites-v301')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-gunes-paneli-elektrik-verir-mi/',
              '/hesaplama/gunes-paneli-elektrik-kesintisi-yedekleme-uygunluk-kontrolu/',
              '/sektor-rehberi/ev-isletme-ges-kesinti-yedek-guc-surekliligi/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for route in expected:
              page = pages[route]
              assert page['affiliate']['hasAffiliateLinks'] is False
              assert not page['affiliate']['unsafeStaticLinks']
          print(json.dumps({'ok': True, 'routes': sorted(expected)}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v301 GES kesinti sürekliliği paketi

          - “Elektrik kesilince güneş paneli elektrik verir mi?”: anti-adalanma ve backup mimarisiyle doğrudan cevap
          - Batarya bulunması: tek başına kesinti yedeği kanıtı değil
          - Kişisel verisiz ücretsiz araç: mimari, transfer, kritik yük ve gerçek test kontrolü
          - Ev, otel, işletme ve tarımsal sistemler: professional-only süreklilik matrisi
          - Mevcut belgeli sistem gerçek testi geçiyorsa: yeni ürün almayın
          - Yeni Amazon veya başka mağaza bağlantısı: 0
          - Fiyat, stok, puan, yorum ve garanti: 0
          - 30/90/365 günlük işlevsel tekrar ziyaret döngüsü
          EOF
