name: ALO186 Emergency Live Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alo186-pages-admin-enable.yml'
      - 'alo186/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alo186-pages-admin-enable.yml'
      - 'alo186/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  EMERGENCY_ORIGIN: https://rawcdn.githack.com/ozaneryavuz/chatgpt/f6fb97539a8a62e3adbda765c6e0a76f9e70a7ce

jobs:
  verify:
    name: Verify immutable emergency mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_PAT || secrets.GH_PAT || secrets.PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_PAT || secrets.GITHUB_PERSONAL_ACCESS_TOKEN || secrets.DEPLOY_TOKEN || secrets.REPO_PAT }}
    steps:
      - name: Explain canonical-domain state
        run: |
          if [[ -n "$PAGES_ADMIN_TOKEN" ]]; then
            echo 'Administrator token is available; canonical Pages enablement may run.'
          else
            echo 'No administrator token is configured. The immutable public mirror remains the immediate live surface.'
          fi

      - name: Enable GitHub Pages when an administrator token exists
        if: env.PAGES_ADMIN_TOKEN != ''
        uses: actions/configure-pages@v5
        with:
          token: ${{ env.PAGES_ADMIN_TOKEN }}
          enablement: true

      - name: Bind gh-pages root and alo186.com when enabled
        if: env.PAGES_ADMIN_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.PAGES_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/pages.json <<'JSON'
          {
            "cname": "alo186.com",
            "build_type": "legacy",
            "source": {"branch": "gh-pages", "path": "/"}
          }
          JSON
          gh api --method PUT \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/pages" \
            --input /tmp/pages.json
          gh api --method POST \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Verify entry, navigation and all public routes
        run: |
          set -euo pipefail
          fetch_and_check() {
            local path="$1"
            local marker="$2"
            local body
            body="$(mktemp)"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "${EMERGENCY_ORIGIN}${path}" -o "$body"
            grep -q "$marker" "$body"
            echo "LIVE VERIFIED: ${EMERGENCY_ORIGIN}${path}"
            printf '%s' "$body"
          }

          entry="$(fetch_and_check '/canli/index.html' 'Duman ve karbonmonoksit alarmı kesinti rehberleri yayında')"
          grep -q 'href="../haberler/elektrik-kesilince-duman-dedektoru-calisir-mi/index.html"' "$entry"
          grep -q 'href="../hesaplama/duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu/index.html"' "$entry"
          grep -q 'href="../amazon-elektrik-urunleri/duman-alarmi-pil-yedegi-kesinti-hazirligi/index.html"' "$entry"
          rm -f "$entry"

          article="$(fetch_and_check '/haberler/elektrik-kesilince-duman-dedektoru-calisir-mi/index.html' 'Elektrik Kesilince Duman Dedektörü Çalışır mı')"
          calculator="$(fetch_and_check '/hesaplama/duman-karbonmonoksit-alarmi-elektrik-kesintisi-kontrolu/index.html' 'Duman ve Karbonmonoksit Alarmı Kesinti Kontrolü')"
          affiliate="$(fetch_and_check '/amazon-elektrik-urunleri/duman-alarmi-pil-yedegi-kesinti-hazirligi/index.html' 'Duman Alarmı ve Pil Yedeği Kesinti Hazırlığı')"
          grep -q 'Amazon Türkiye bağlantıları satış ortaklığı bağlantısıdır' "$affiliate"
          grep -q 'yeni ürün almayın' "$calculator"
          rm -f "$article" "$calculator" "$affiliate"

      - name: Write live verification receipt
        run: |
          cat > /tmp/alo186-emergency-live.json <<JSON
          {
            "status": "live-verified",
            "mode": "immutable-emergency-mirror",
            "sourceCommit": "f6fb97539a8a62e3adbda765c6e0a76f9e70a7ce",
            "entryUrl": "${EMERGENCY_ORIGIN}/canli/index.html",
            "canonicalCutoverPending": ${{ env.PAGES_ADMIN_TOKEN == '' }},
            "navigationVerified": true,
            "affiliateDisclosureVerified": true,
            "noBuyOutcomeVerified": true
          }
          JSON
          cat /tmp/alo186-emergency-live.json

      - name: Upload live verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: alo186-emergency-live-${{ github.run_id }}
          path: /tmp/alo186-emergency-live.json
          retention-days: 30
