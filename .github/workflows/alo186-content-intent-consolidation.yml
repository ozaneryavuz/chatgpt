name: ALO186 içerik niyeti ve canonical birleştirme kalite kontrolü

on:
  pull_request:
    paths:
      - 'alo186/haberler/**'
      - 'alo186/deployment/content-consolidations.json'
      - 'alo186/deployment/apply_content_consolidation.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/deployment/routing-overlays/**'
      - 'alo186/tests/test_content_intent_consolidation.py'
      - '.github/workflows/alo186-content-intent-consolidation.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/**'
      - 'alo186/deployment/content-consolidations.json'
      - 'alo186/deployment/apply_content_consolidation.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/deployment/routing-overlays/**'
      - 'alo186/tests/test_content_intent_consolidation.py'
      - '.github/workflows/alo186-content-intent-consolidation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-content-intent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aynı arama niyeti ve bildirilmeyen kanibalizasyon kontrolü
        run: python alo186/tests/test_content_intent_consolidation.py

      - name: Mevcut içerik, canonical ve cihaz hasarı regresyonları
        run: |
          node alo186/tests/test_authority_content.js
          node alo186/tests/test_release_manifest.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical üretim paketini oluştur ve temel smoke testini çalıştır
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-consolidation-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-consolidation-canonical

      - name: Legacy Apache için gerçek 301 ve canonical alias paketi
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/alo186-consolidation-canonical /tmp/alo186-consolidation-apache
          touch /tmp/alo186-consolidation-apache/.htaccess
          python alo186/deployment/apply_content_consolidation.py \
            --site /tmp/alo186-consolidation-apache \
            --base-path '' \
            > /tmp/alo186-consolidation-apache.json
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('alo186/deployment/content-consolidations.json').read_text(encoding='utf-8'))
          result=json.loads(Path('/tmp/alo186-consolidation-apache.json').read_text(encoding='utf-8'))
          htaccess=Path('/tmp/alo186-consolidation-apache/.htaccess').read_text(encoding='utf-8')
          assert result['ok'] is True
          assert result['apacheRedirects'] is True
          assert result['aliasCount']==len(config['consolidations'])
          assert 'R=301,L,NE' in htaccess
          for item in config['consolidations']:
              assert item['aliasPath'].lstrip('/') in htaccess
              assert item['canonicalPath'] in htaccess
          PY

      - name: GitHub Pages custom-domain artifactını birleştir
        run: |
          cp -a /tmp/alo186-consolidation-canonical /tmp/alo186-consolidation-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-consolidation-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-consolidation-custom \
            --base-path ''
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-consolidation-custom \
            --base-path ''
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-consolidation-custom \
            --base-path ''

      - name: GitHub Pages project-path artifactını birleştir
        run: |
          cp -a /tmp/alo186-consolidation-canonical /tmp/alo186-consolidation-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-consolidation-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-consolidation-project \
            --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-consolidation-project \
            --base-path '/chatgpt'
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-consolidation-project \
            --base-path '/chatgpt'

      - name: Sitemap, alias, release ve base-path sözleşmeleri
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit

          config=json.loads(Path('alo186/deployment/content-consolidations.json').read_text(encoding='utf-8'))
          pairs=[
              (item['aliasPath'].removeprefix('/haberler/'), item['canonicalPath'].removeprefix('/haberler/'))
              for item in config['consolidations']
          ]
          for root, prefix in [
              (Path('/tmp/alo186-consolidation-custom'), ''),
              (Path('/tmp/alo186-consolidation-project'), '/chatgpt'),
          ]:
              sitemap_root=ET.parse(root/'sitemap.xml').getroot()
              sitemap_paths={urlsplit(loc.text or '').path.rstrip('/') for loc in sitemap_root.findall('.//{*}loc') if loc.text}
              release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
              pages=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
              assert release['contentConsolidation']['aliasCount']==len(pairs)
              assert pages['contentConsolidation']['aliasesExcludedFromSitemap'] is True
              assert release['routeCount']==len(release['routes'])
              for alias, canonical in pairs:
                  alias_path=root/'haberler'/alias/'index.html'
                  text=alias_path.read_text(encoding='utf-8')
                  canonical_match=re.search(r'<link\s+rel="canonical"\s+href="([^"]+)"', text, re.I)
                  assert canonical_match, alias
                  assert urlsplit(canonical_match.group(1)).path.rstrip('/')==f'/haberler/{canonical}'
                  assert 'name="robots" content="noindex,follow"' in text
                  assert f'url={prefix}/haberler/{canonical}' in text
                  assert f'/haberler/{alias}' not in sitemap_paths
                  assert f'/haberler/{canonical}' in sitemap_paths
          PY

      - name: Doğrulanmış canonical birleştirme artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-content-consolidated-pages
          path: /tmp/alo186-consolidation-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
