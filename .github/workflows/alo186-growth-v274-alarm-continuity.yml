name: ALO186 alarm sistemi kesinti sürekliliği v274

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-alarm-sistemi-calisir-mi/**'
      - 'alo186/hesaplama/alarm-sistemi-elektrik-kesintisi-test-plani/**'
      - 'alo186/deployment/routing-overlays/growth-v274-alarm-continuity.json'
      - 'alo186/deployment/affiliate-category-decisions/alarm-continuity-v274.json'
      - 'alo186/tests/test_growth_v274_alarm_continuity.py'
      - '.github/workflows/alo186-growth-v274-alarm-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-alarm-sistemi-calisir-mi/**'
      - 'alo186/hesaplama/alarm-sistemi-elektrik-kesintisi-test-plani/**'
      - 'alo186/deployment/routing-overlays/growth-v274-alarm-continuity.json'
      - 'alo186/deployment/affiliate-category-decisions/alarm-continuity-v274.json'
      - 'alo186/tests/test_growth_v274_alarm_continuity.py'
      - '.github/workflows/alo186-growth-v274-alarm-continuity.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v274-alarm-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Alarm sürekliliği, gizlilik ve ticari sınır
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v274_alarm_continuity.py
          python alo186/tests/test_growth_v274_alarm_continuity.py
          python -m json.tool alo186/deployment/routing-overlays/growth-v274-alarm-continuity.json >/dev/null
          python -m json.tool alo186/deployment/affiliate-category-decisions/alarm-continuity-v274.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v274
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v274 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-v274
          test -f /tmp/alo186-v274/haberler/elektrik-kesilince-alarm-sistemi-calisir-mi/index.html
          test -f /tmp/alo186-v274/hesaplama/alarm-sistemi-elektrik-kesintisi-test-plani/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v274
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py \
            --output /tmp/alo186-sites-v274 \
            --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-sites-v274')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-alarm-sistemi-calisir-mi/',
              '/hesaplama/alarm-sistemi-elektrik-kesintisi-test-plani/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for path in expected:
              page = pages[path]
              assert page['affiliate']['hasAffiliateLinks'] is False
              assert not page['affiliate']['unsafeStaticLinks']
          print(json.dumps({'ok': True, 'routes': sorted(expected)}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v274 alarm sistemi kesinti sürekliliği

          - “Elektrik kesilince alarm sistemi çalışır mı?” niyeti: panel, siren, sensör ve haberleşmeyi ayıran kaynak doğrulamalı rehber
          - Sabit 7–13 saat iddiası yerine: model, akü sağlığı, bağlı yükler, sıcaklık ve iletişim kanallarına bağlı gerçek test
          - Kişisel verisiz araç: panel, yerel alarm, uygulama/CMS, router/ONT ve son test tarihi
          - Acil olay ve akü tehlikesinde: ticari yol kapalı, 112 veya yetkili servis
          - Mevcut sistem yeterliyse: yeni ürün almayın
          - Alarm aküsü, panel güç kaynağı, siren ve yangın alarmı bataryası: professional-only; tüketici affiliate kapalı
          - 30/90/365 günlük tekrar ziyaret: yerel takvim dosyası
          - Fiyat, stok, puan, garanti, Product, Offer ve AggregateRating: yok
          - Canonical build, static smoke ve ChatGPT Sites import kabulü doğrulanır
          EOF
