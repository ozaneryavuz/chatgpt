name: ALO186 one-shot apex sitemap v203

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/alo186-one-shot-apex-sitemap-v203.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  normalize-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/alo186-apex-canonical-contract-v203'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-apex-canonical-contract-v203
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize source sitemap and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          sitemap = Path('alo186/sitemap.xml')
          text = sitemap.read_text(encoding='utf-8')
          old = 'https://www.alo186.com'
          new = 'https://alo186.com'
          count = text.count(old)
          if count < 1:
              raise SystemExit('Source sitemap did not contain the expected legacy www origin.')
          sitemap.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/alo186-one-shot-apex-sitemap-v203.yml').unlink()
          PY

      - name: Run canonical contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          node alo186/tests/test_release_manifest.js
          python -m pytest -q -p no:cacheprovider alo186/tests/test_apex_canonical_contract_v203.py
          python alo186/tests/test_active_production_contract.py
          python alo186/deployment/build_static_site.py --output /tmp/alo186-apex-canonical-v203 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-apex-canonical-v203

      - name: Commit verified source normalization
        shell: bash
        run: |
          set -euo pipefail
          find alo186 -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(alo186): normalize source sitemap to apex"
          git push origin HEAD:fix/alo186-apex-canonical-contract-v203
