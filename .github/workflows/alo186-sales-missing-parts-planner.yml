name: ALO186 eksik parça planlayıcı satış kalite kontrolü

on:
  pull_request:
    paths:
      - 'alo186/urun-bilgi-grafigi/index.html'
      - 'alo186/urun-bilgi-grafigi/sales-missions.js'
      - 'alo186/urun-bilgi-grafigi/sales-missions.css'
      - 'alo186/urun-eslestirme/generator-guide-extension.js'
      - 'alo186/deployment/content-consolidations.json'
      - 'alo186/tests/test_affiliate_product_knowledge_graph_sales_planner.py'
      - '.github/workflows/alo186-sales-missing-parts-planner.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/urun-bilgi-grafigi/index.html'
      - 'alo186/urun-bilgi-grafigi/sales-missions.js'
      - 'alo186/urun-bilgi-grafigi/sales-missions.css'
      - 'alo186/urun-eslestirme/generator-guide-extension.js'
      - 'alo186/deployment/content-consolidations.json'
      - 'alo186/tests/test_affiliate_product_knowledge_graph_sales_planner.py'
      - '.github/workflows/alo186-sales-missing-parts-planner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-sales-missing-parts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Satış seti, satın almama ve affiliate güven sözleşmeleri
        run: |
          set -euo pipefail
          node alo186/tests/test_sales_catalog_expansion.js
          python alo186/tests/test_affiliate_product_knowledge_graph_sales_planner.py
          python alo186/tests/test_affiliate_product_knowledge_graph.py
          python alo186/tests/test_content_intent_consolidation.py

      - name: JavaScript sözdizimi
        run: |
          set -euo pipefail
          node --check alo186/urun-bilgi-grafigi/sales-missions.js
          node --check alo186/urun-bilgi-grafigi/app.js
          node --check alo186/urun-eslestirme/generator-guide-extension.js

      - name: Canonical üretim paketi
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-missing-parts-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-missing-parts-canonical

      - name: Custom-domain artifact kabulü
        run: |
          set -euo pipefail
          cp -a /tmp/alo186-missing-parts-canonical /tmp/alo186-missing-parts-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-missing-parts-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-missing-parts-custom \
            --base-path ''
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-missing-parts-custom \
            --base-path '' > /tmp/alo186-missing-parts-custom.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-missing-parts-custom \
            --base-path ''
          python alo186/tests/test_affiliate_product_knowledge_graph_sales_planner.py \
            --site /tmp/alo186-missing-parts-custom \
            --base-path ''

      - name: Project-path artifact kabulü
        run: |
          set -euo pipefail
          cp -a /tmp/alo186-missing-parts-canonical /tmp/alo186-missing-parts-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-missing-parts-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-missing-parts-project \
            --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-missing-parts-project \
            --base-path '/chatgpt' > /tmp/alo186-missing-parts-project.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-missing-parts-project \
            --base-path '/chatgpt'
          python alo186/tests/test_affiliate_product_knowledge_graph_sales_planner.py \
            --site /tmp/alo186-missing-parts-project \
            --base-path '/chatgpt'

      - name: Doğrulanmış satış planlayıcı artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-sales-missing-parts-pages
          path: /tmp/alo186-missing-parts-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
