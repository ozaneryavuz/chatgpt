name: ALO186 portal envanter iddiası koruması

on:
  pull_request:
    paths:
      - 'alo186/index.html'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - 'alo186/tests/test_portal_inventory_claims.js'
      - 'alo186/tests/test_portal_hardening.js'
      - 'alo186/tests/test_authority_content.js'
      - '.github/workflows/alo186-portal-inventory-claims.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/index.html'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - 'alo186/tests/test_portal_inventory_claims.js'
      - 'alo186/tests/test_portal_hardening.js'
      - 'alo186/tests/test_authority_content.js'
      - '.github/workflows/alo186-portal-inventory-claims.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-portal-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Portal envanter drift sözleşmesi
        run: node alo186/tests/test_portal_inventory_claims.js

      - name: Portal, otorite, canonical ve hukukî regresyonlar
        run: |
          node alo186/tests/test_portal_hardening.js
          node alo186/tests/test_authority_content.js
          node alo186/tests/test_release_manifest.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical artifactta sayısal envanter iddiası olmadığını doğrula
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-portal-inventory \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-portal-inventory
          ! grep -Eqi '\b[0-9]+[[:space:]]+(kişisel veri istemeyen (araç|hesaplama ve karar aracı)|kaynak doğrulamalı (teknik )?rehber)\b' \
            /tmp/alo186-portal-inventory/elektrik-portali/index.html
