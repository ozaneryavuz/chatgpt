name: ALO186 içerik otoritesi 159 kaynak rehber kalite kontrolü

on:
  pull_request:
    paths:
      - 'alo186/haberler/gerilim-cukuru-kisa-kesinti-dusuk-gerilim-farki/**'
      - 'alo186/haberler/enerji-depolama-garanti-throughput-cevrim-takvim-omru-soh/**'
      - 'alo186/haberler/jenerator-yakit-tuketimi-litre-saat-yuk-faktoru/**'
      - 'alo186/deployment/routing-overlays/content-authority-159-run40.json'
      - 'alo186/tests/test_authority_content_run40.py'
      - '.github/workflows/alo186-content-authority-159.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/gerilim-cukuru-kisa-kesinti-dusuk-gerilim-farki/**'
      - 'alo186/haberler/enerji-depolama-garanti-throughput-cevrim-takvim-omru-soh/**'
      - 'alo186/haberler/jenerator-yakit-tuketimi-litre-saat-yuk-faktoru/**'
      - 'alo186/deployment/routing-overlays/content-authority-159-run40.json'
      - 'alo186/tests/test_authority_content_run40.py'
      - '.github/workflows/alo186-content-authority-159.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-authority-159-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Yeni rehberlerin AEO SEO kaynak ve güven sözleşmeleri
        run: python alo186/tests/test_authority_content_run40.py
      - name: İçerik niyeti ve mevcut güven regresyonları
        run: |
          python alo186/tests/test_content_intent_consolidation.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py
      - name: Canonical üretim paketini oluştur
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-authority-159-canonical --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-authority-159-canonical
      - name: Custom-domain Pages artifactını doğrula
        run: |
          cp -a /tmp/alo186-authority-159-canonical /tmp/alo186-authority-159-custom
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-authority-159-custom --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-authority-159-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-authority-159-custom --base-path '' > /tmp/authority159.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-authority-159-custom --base-path ''
      - name: Canonical sitemap ve Teknik Arama kabulü
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/alo186-authority-159-custom')
          routes=[
            '/haberler/gerilim-cukuru-kisa-kesinti-dusuk-gerilim-farki',
            '/haberler/enerji-depolama-garanti-throughput-cevrim-takvim-omru-soh',
            '/haberler/jenerator-yakit-tuketimi-litre-saat-yuk-faktoru',
          ]
          sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
          search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
          release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
          active={item['canonicalPath'] for item in search['entries']}
          assert release['routingVersion'] >= 70
          assert release['articleCount'] >= 157
          for route in routes:
              assert (root/route.strip('/')/'index.html').is_file()
              assert f'https://www.alo186.com{route}' in sitemap
              assert route in active
          PY
      - name: Doğrulanmış içerik artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-authority-159-pages
          path: /tmp/alo186-authority-159-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
