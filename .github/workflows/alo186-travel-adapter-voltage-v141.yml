name: ALO186 travel adapter voltage v141

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/seyahat-priz-adaptoru-voltaj-donusturucu-uygunluk/**'
      - 'alo186/hesaplama/sac-kurutma-kettle-seyahat-gerilim-uygunluk/**'
      - 'alo186/sektor-rehberi/yurt-disi-seyahat-priz-sarj-tekrar-test-merkezi/**'
      - 'alo186/deployment/routing-overlays/141-travel-adapter-voltage.json'
      - 'alo186/tests/test_travel_adapter_voltage_growth_v141.py'
      - '.github/workflows/alo186-travel-adapter-voltage-v141.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-travel-adapter-voltage-v141-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-and-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate decisions, trust gates and published routes
        run: python alo186/tests/test_travel_adapter_voltage_growth_v141.py
