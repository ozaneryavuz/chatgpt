name: ALO186 trust revenue growth v187

on:
  pull_request:
    paths:
      - "alo186/hesaplama/oda-co2-havalandirma-sicaklik-nem-izleme/**"
      - "alo186/amazon-elektrik-urunleri/usb-ethernet-dusuk-gerilim-test-urun-secici/**"
      - "alo186/deployment/routing-overlays/187-trust-revenue-growth.json"
      - "alo186/audits/trust-revenue-growth-v187-2026-08-02.md"
      - "alo186/tests/test_trust_revenue_growth_v187.py"
      - ".github/workflows/alo186-trust-revenue-growth-v187.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/oda-co2-havalandirma-sicaklik-nem-izleme/**"
      - "alo186/amazon-elektrik-urunleri/usb-ethernet-dusuk-gerilim-test-urun-secici/**"
      - "alo186/deployment/routing-overlays/187-trust-revenue-growth.json"
      - "alo186/tests/test_trust_revenue_growth_v187.py"
      - ".github/workflows/alo186-trust-revenue-growth-v187.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-trust-revenue-growth-v187-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trust and commerce contract
        run: |
          set -euo pipefail
          python alo186/tests/test_trust_revenue_growth_v187.py
      - name: Canonical production artifact
        run: |
          set -euo pipefail
          SITE=/tmp/alo186-trust-revenue-v187
          python alo186/deployment/build_static_site.py --output "$SITE" --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle "$SITE"
          test -f "$SITE/hesaplama/oda-co2-havalandirma-sicaklik-nem-izleme/index.html"
          test -f "$SITE/amazon-elektrik-urunleri/usb-ethernet-dusuk-gerilim-test-urun-secici/index.html"
          grep -q 'oda-co2-havalandirma-sicaklik-nem-izleme' "$SITE/sitemap.xml"
          grep -q 'usb-ethernet-dusuk-gerilim-test-urun-secici' "$SITE/sitemap.xml"
      - name: Commerce safety guard
        run: |
          set -euo pipefail
          python alo186/deployment/guard_commerce_routes_v3.py --site /tmp/alo186-trust-revenue-v187
      - uses: actions/upload-artifact@v4
        with:
          name: alo186-trust-revenue-growth-v187
          path: /tmp/alo186-trust-revenue-v187
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
