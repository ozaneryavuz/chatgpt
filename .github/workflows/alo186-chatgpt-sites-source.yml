name: ALO186 — ChatGPT Sites kaynak paketi

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/sites-sync/**'
      - 'alo186/ai-cms/content/**'
      - 'alo186/ai-cms/policy.json'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/deployment/build_static_site.py'
      - 'alo186/turkiye-arama/**'
      - 'alo186/robots.txt'
      - 'alo186/sitemap*.xml'
      - 'alo186/index.html'
      - 'alo186/elektrik-portali/**'
      - 'alo186/karar-motoru/**'
      - 'alo186/hesaplama/**'
      - 'alo186/haberler/**'
      - 'alo186/amazon-elektrik-urunleri/**'
      - 'alo186/urun-rehberleri/**'
      - 'alo186/en/**'
      - '.github/workflows/alo186-chatgpt-sites-source.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/sites-sync/**'
      - 'alo186/ai-cms/content/**'
      - 'alo186/ai-cms/policy.json'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/deployment/build_static_site.py'
      - 'alo186/turkiye-arama/**'
      - 'alo186/robots.txt'
      - 'alo186/sitemap*.xml'
      - 'alo186/index.html'
      - 'alo186/elektrik-portali/**'
      - 'alo186/karar-motoru/**'
      - 'alo186/hesaplama/**'
      - 'alo186/haberler/**'
      - 'alo186/amazon-elektrik-urunleri/**'
      - 'alo186/urun-rehberleri/**'
      - 'alo186/en/**'
      - '.github/workflows/alo186-chatgpt-sites-source.yml'
  schedule:
    # Europe/Istanbul UTC+3: her pazartesi 10:20.
    - cron: '20 7 * * 1'

permissions:
  contents: read

concurrency:
  group: alo186-chatgpt-sites-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Sites paket kodu ve ağsız regresyon
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/sites-sync/build_sites_source_package.py \
            alo186/sites-sync/build_sites_source_package_v255.py \
            alo186/sites-sync/test_sites_source_package.py
          python alo186/sites-sync/test_sites_source_package.py
          python -m json.tool alo186/sites-sync/sites-source-manifest.json >/dev/null

      - name: Doğrulanmış canonical ALO186 bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-canonical
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-canonical

      - name: ChatGPT Sites kaynak artifactını üret
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-chatgpt-sites-source
          python alo186/sites-sync/build_sites_source_package_v255.py \
            --repo . \
            --bundle /tmp/alo186-canonical \
            --source-commit "$GITHUB_SHA" \
            --out /tmp/alo186-chatgpt-sites-source

      - name: Paket sözleşmesini fail-closed doğrula
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-chatgpt-sites-source')
          manifest = json.loads((root / 'sites-source-manifest.json').read_text(encoding='utf-8'))
          inventory = json.loads((root / 'route-inventory.json').read_text(encoding='utf-8'))
          proof = json.loads((root / 'source-integrity.json').read_text(encoding='utf-8'))
          result = json.loads((root / 'package-result.json').read_text(encoding='utf-8'))

          assert manifest['target'] == 'chatgpt-sites'
          assert manifest['siteSlug'] == 'alo186'
          assert manifest['canonicalHost'] == 'https://alo186.com'
          assert manifest['sourceCommit'] == result['sourceCommit']
          assert manifest['authority']['livePresentationAndPublishing'] == 'ChatGPT Sites'
          assert manifest['authority']['githubPagesCustomDomainAllowed'] is False
          assert manifest['authority']['undocumentedSitesApiAllowed'] is False
          assert manifest['transferStrategy']['preserveNativeSitesDesignSystem'] is True
          assert manifest['transferStrategy']['blindHtmlOrCssOverwriteAllowed'] is False

          assert result['sitesSyncVersion'] == 255
          assert result['rootRouteSource'] in {'canonical-bundle-root', '/elektrik-portali'}
          assert result['rootRouteCanonical'] == 'https://alo186.com/'
          root_record = next(item for item in inventory['routes'] if item['route'] == '/')
          assert root_record['status'] == 'packaged'
          assert root_record['packageEntry'] == 'public/index.html'
          assert (root / 'public/index.html').is_file()
          assert 'https://alo186.com/' in (root / 'public/index.html').read_text(encoding='utf-8')

          assert inventory['provincePages'] == 81
          assert inventory['distributionCompanyPages'] == 21
          assert inventory['affiliateValidation']['invalidRelLinks'] == 0
          assert inventory['affiliateValidation']['locationAffiliateLinks'] == 0
          assert result['provincePages'] == 81
          assert result['distributionCompanyPages'] == 21
          assert proof['algorithm'] == 'SHA-256'
          assert proof['fileCount'] > 100

          assert (root / 'sites-import-prompt.md').is_file()
          assert (root / 'public/robots.txt').is_file()
          assert (root / 'public/sitemap.xml').is_file()
          assert (root / 'public/il/mugla/index.html').is_file()
          assert (root / 'public/dagitim-sirketleri/adm-elektrik/index.html').is_file()
          assert not list((root / 'public').rglob('*.py'))
          assert not list((root / 'public').rglob('.htaccess'))
          print(json.dumps({
              'ok': True,
              'sitesSyncVersion': result['sitesSyncVersion'],
              'rootRouteSource': result['rootRouteSource'],
              'sourceCommit': result['sourceCommit'],
              'packageHash': result['packageHash'],
              'integrityDigest': proof['packageDigest'],
              'routeCount': result['routeCount'],
              'provincePages': result['provincePages'],
              'companyPages': result['distributionCompanyPages'],
              'publishedAiCmsRecords': result['publishedAiCmsRecords'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: ChatGPT Sites kaynak artifactı
        uses: actions/upload-artifact@v7
        with:
          name: alo186-chatgpt-sites-source-${{ github.sha }}
          path: /tmp/alo186-chatgpt-sites-source
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

      - name: Çalışma özeti
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-chatgpt-sites-source')
          result = json.loads((root / 'package-result.json').read_text(encoding='utf-8'))
          proof = json.loads((root / 'source-integrity.json').read_text(encoding='utf-8'))
          print('## ALO186 → ChatGPT Sites kaynak paketi')
          print()
          print(f"- Sites senkron sürümü: **{result['sitesSyncVersion']}**")
          print(f"- Kök içerik kaynağı: **{result['rootRouteSource']}**")
          print(f"- Kaynak commit: `{result['sourceCommit']}`")
          print(f"- Paket hash: `{result['packageHash']}`")
          print(f"- Bütünlük digest: `{proof['packageDigest']}`")
          print(f"- Canonical rota: **{result['routeCount']}**")
          print(f"- İl / EDAŞ: **{result['provincePages']} / {result['distributionCompanyPages']}**")
          print(f"- Published AI CMS kaydı: **{result['publishedAiCmsRecords']}**")
          print('- Hedef: **ChatGPT Sites / alo186**')
          print('- DNS veya GitHub Pages değişikliği: **yok**')
          print('- Otomatik/belgelenmemiş Sites API yayını: **yok**')
          print('- Uygulama talimatı: artifact içindeki `sites-import-prompt.md`')
          PY
