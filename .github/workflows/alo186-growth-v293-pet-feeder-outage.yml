name: ALO186 otomatik mama makinesi kesinti güveni v293

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-otomatik-mama-makinesi-calisir-mi/**'
      - 'alo186/hesaplama/otomatik-mama-makinesi-kesinti-plani/**'
      - 'alo186/amazon-elektrik-urunleri/pil-yedekli-otomatik-mama-makinesi-secimi/**'
      - 'alo186/deployment/affiliate-category-decisions/pet-feeder-outage-v293.json'
      - 'alo186/deployment/routing-overlays/growth-v293-pet-feeder-outage.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v293_pet_feeder_outage.py'
      - 'alo186/tests/test_affiliate_route_risk_policy_v265.py'
      - '.github/workflows/alo186-growth-v293-pet-feeder-outage.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-otomatik-mama-makinesi-calisir-mi/**'
      - 'alo186/hesaplama/otomatik-mama-makinesi-kesinti-plani/**'
      - 'alo186/amazon-elektrik-urunleri/pil-yedekli-otomatik-mama-makinesi-secimi/**'
      - 'alo186/deployment/affiliate-category-decisions/pet-feeder-outage-v293.json'
      - 'alo186/deployment/routing-overlays/growth-v293-pet-feeder-outage.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v293_pet_feeder_outage.py'
      - 'alo186/tests/test_affiliate_route_risk_policy_v265.py'
      - '.github/workflows/alo186-growth-v293-pet-feeder-outage.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v293-pet-feeder-outage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Evcil hayvan sürekliliği ve affiliate yönetişimi
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/tests/test_growth_v293_pet_feeder_outage.py \
            alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v293_pet_feeder_outage.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/affiliate-category-decisions/pet-feeder-outage-v293.json >/dev/null
          python -m json.tool alo186/deployment/routing-overlays/growth-v293-pet-feeder-outage.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v293
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v293 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-v293
          test -f /tmp/alo186-v293/haberler/elektrik-kesilince-otomatik-mama-makinesi-calisir-mi/index.html
          test -f /tmp/alo186-v293/hesaplama/otomatik-mama-makinesi-kesinti-plani/index.html
          test -f /tmp/alo186-v293/amazon-elektrik-urunleri/pil-yedekli-otomatik-mama-makinesi-secimi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v293
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py \
            --output /tmp/alo186-sites-v293 \
            --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-sites-v293')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          article = '/haberler/elektrik-kesilince-otomatik-mama-makinesi-calisir-mi/'
          tool = '/hesaplama/otomatik-mama-makinesi-kesinti-plani/'
          selector = '/amazon-elektrik-urunleri/pil-yedekli-otomatik-mama-makinesi-secimi/'
          expected = {article, tool, selector}
          assert expected.issubset(pages), expected - set(pages)
          assert pages[article]['affiliate']['hasAffiliateLinks'] is False
          assert pages[tool]['affiliate']['hasAffiliateLinks'] is False
          for route in expected:
              assert not pages[route]['affiliate']['unsafeStaticLinks'], route
          print(json.dumps({
              'ok': True,
              'routes': sorted(expected),
              'selectorAffiliateDetected': pages[selector]['affiliate']['hasAffiliateLinks'],
              'unsafeStaticLinks': 0,
          }, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v293 otomatik mama makinesi kesinti paketi

          - “Elektrik kesilince otomatik mama makinesi çalışır mı?” niyeti: kaynak doğrulamalı canonical rehber
          - Pil + çevrimdışı program + gerçek porsiyon + su + insan kontrolü: kişisel verisiz ücretsiz planlayıcı
          - Yalnız kuru mama ve ev kullanımı: altı onaylı, başlangıçta kilitli Amazon Türkiye seçicisi
          - Aktif hayvan sağlığı riski, özel diyet, yaş mama ve gözetimsiz uzun bakım: ticari yol kapalı
          - Mevcut düzen gözetimli testte yeterliyse: yeni ürün almayın
          - 7/30/90 günlük görsel kontrol, gerçek kesinti testi ve bakım döngüsü: doğrulandı
          - Fiyat, stok, puan, yorum, garanti, Offer ve AggregateRating: yok
          - Canonical build, static smoke ve ChatGPT Sites import kabulü: başarılı
          EOF
