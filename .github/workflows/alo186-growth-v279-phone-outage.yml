name: ALO186 telefon kesinti şarjı v279

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesintisinde-telefon-nasil-sarj-edilir/**'
      - 'alo186/hesaplama/telefon-elektrik-kesintisi-sarj-plani/**'
      - 'alo186/amazon-elektrik-urunleri/telefon-powerbank-kablo-secimi/**'
      - 'alo186/deployment/routing-overlays/growth-v279-phone-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/phone-outage-v279.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v279_phone_outage.py'
      - '.github/workflows/alo186-growth-v279-phone-outage.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesintisinde-telefon-nasil-sarj-edilir/**'
      - 'alo186/hesaplama/telefon-elektrik-kesintisi-sarj-plani/**'
      - 'alo186/amazon-elektrik-urunleri/telefon-powerbank-kablo-secimi/**'
      - 'alo186/deployment/routing-overlays/growth-v279-phone-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/phone-outage-v279.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v279_phone_outage.py'
      - '.github/workflows/alo186-growth-v279-phone-outage.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v279-phone-outage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Telefon kesinti şarjı, gizlilik ve ticari sınır
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v279_phone_outage.py alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v279_phone_outage.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/routing-overlays/growth-v279-phone-outage.json >/dev/null
          python -m json.tool alo186/deployment/affiliate-category-decisions/phone-outage-v279.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v279
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v279 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v279
          test -f /tmp/alo186-v279/haberler/elektrik-kesintisinde-telefon-nasil-sarj-edilir/index.html
          test -f /tmp/alo186-v279/hesaplama/telefon-elektrik-kesintisi-sarj-plani/index.html
          test -f /tmp/alo186-v279/amazon-elektrik-urunleri/telefon-powerbank-kablo-secimi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v279
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v279 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-sites-v279')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesintisinde-telefon-nasil-sarj-edilir/',
              '/hesaplama/telefon-elektrik-kesintisi-sarj-plani/',
              '/amazon-elektrik-urunleri/telefon-powerbank-kablo-secimi/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for path in expected:
              assert not pages[path]['affiliate']['unsafeStaticLinks']
          assert pages['/amazon-elektrik-urunleri/telefon-powerbank-kablo-secimi/']['affiliate']['hasAffiliateLinks'] is False
          print(json.dumps({'ok': True, 'routes': sorted(expected), 'unsafeStaticLinks': 0}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v279 telefon kesinti şarjı

          - Arama niyeti: elektrik kesintisinde telefon nasıl şarj edilir / telefon powerbank seçimi
          - Ücretsiz araç: kalan pil, tasarruf modu, hedef iletişim süresi ve gerçek test
          - Mevcut çözüm yeterliyse: yeni ürün almayın
          - Hasarlı batarya ve kritik tek iletişim kanalında: ticari yol kapalı
          - Affiliate: yalnız Amazon Türkiye; bağlantılar açıklama ve güven kapısından sonra dinamik açılır
          - Fiyat, stok, puan, yorum, teslimat, garanti, Offer ve AggregateRating: yok
          - 30/90 günlük tekrar ziyaret: yerel takvim dosyası
          EOF
