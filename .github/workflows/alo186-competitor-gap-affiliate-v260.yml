name: ALO186 competitor gap, semantic SSR and affiliate v260

on:
  pull_request:
    paths:
      - 'alo186/deployment/inject_competitor_gap_affiliate_v260.py'
      - 'alo186/deployment/aeo_control_plane_v219_sitemap_compat.py'
      - 'alo186/tests/test_competitor_gap_affiliate_v260.py'
      - 'alo186/robots.txt'
      - '.github/v260-payload/**'
      - '.github/workflows/alo186-competitor-gap-affiliate-v260.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/deployment/inject_competitor_gap_affiliate_v260.py'
      - 'alo186/deployment/aeo_control_plane_v219_sitemap_compat.py'
      - 'alo186/tests/test_competitor_gap_affiliate_v260.py'
      - 'alo186/robots.txt'
      - '.github/v260-payload/**'
      - '.github/workflows/alo186-competitor-gap-affiliate-v260.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-competitor-gap-affiliate-v260-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Kaynak, robots ve Python sözleşmeleri
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/deployment/inject_competitor_gap_affiliate_v260.py \
            alo186/deployment/aeo_control_plane_v219_sitemap_compat.py \
            alo186/tests/test_competitor_gap_affiliate_v260.py
          python alo186/tests/test_competitor_gap_affiliate_v260.py
          grep -q 'import inject_competitor_gap_affiliate_v260 as _competitor_gap' alo186/deployment/aeo_control_plane_v219_sitemap_compat.py
          grep -q 'competitorGapAffiliateV260' alo186/deployment/aeo_control_plane_v219_sitemap_compat.py

      - name: Canonical site artifactını oluştur
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v260-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-v260-canonical

      - name: Custom-domain artifactında v260 uygula ve doğrula
        run: |
          set -euo pipefail
          cp -a /tmp/alo186-v260-canonical /tmp/alo186-v260-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-v260-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-v260-custom \
            --base-path ''
          python alo186/deployment/inject_competitor_gap_affiliate_v260.py \
            --site /tmp/alo186-v260-custom \
            --base-path ''
          python alo186/tests/test_competitor_gap_affiliate_v260.py \
            --site /tmp/alo186-v260-custom \
            --base-path ''
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-v260-custom \
            --base-path ''

      - name: Project-path artifactında v260 uygula ve doğrula
        run: |
          set -euo pipefail
          cp -a /tmp/alo186-v260-canonical /tmp/alo186-v260-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-v260-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-v260-project \
            --base-path '/chatgpt'
          python alo186/deployment/inject_competitor_gap_affiliate_v260.py \
            --site /tmp/alo186-v260-project \
            --base-path '/chatgpt'
          python alo186/tests/test_competitor_gap_affiliate_v260.py \
            --site /tmp/alo186-v260-project \
            --base-path '/chatgpt'
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-v260-project \
            --base-path '/chatgpt'

      - name: Şema ve Rich Results uygunluk raporlarını yükle
        uses: actions/upload-artifact@v5
        with:
          name: alo186-competitor-gap-affiliate-v260
          path: |
            /tmp/alo186-v260-custom/schema-validation-v260.json
            /tmp/alo186-v260-project/schema-validation-v260.json
          if-no-files-found: error
          retention-days: 30
