name: ALO186 GES kesinti ve yedek güç büyümesi v271

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-gunes-paneli-calisir-mi/**'
      - 'alo186/hesaplama/ges-elektrik-kesintisi-yedek-guc-uygunluk-kontrolu/**'
      - 'alo186/deployment/routing-overlays/growth-v271-solar-backup-intent.json'
      - 'alo186/tests/test_growth_v271_solar_backup_intent.py'
      - '.github/workflows/alo186-growth-v271-solar-backup-intent.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-gunes-paneli-calisir-mi/**'
      - 'alo186/hesaplama/ges-elektrik-kesintisi-yedek-guc-uygunluk-kontrolu/**'
      - 'alo186/deployment/routing-overlays/growth-v271-solar-backup-intent.json'
      - 'alo186/tests/test_growth_v271_solar_backup_intent.py'
      - '.github/workflows/alo186-growth-v271-solar-backup-intent.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v271-solar-backup-intent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Arama niyeti, güven ve dönüşüm sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v271_solar_backup_intent.py
          python alo186/tests/test_growth_v271_solar_backup_intent.py
          python -m json.tool alo186/deployment/routing-overlays/growth-v271-solar-backup-intent.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v271
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v271 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-v271
          test -f /tmp/alo186-v271/haberler/elektrik-kesilince-gunes-paneli-calisir-mi/index.html
          test -f /tmp/alo186-v271/hesaplama/ges-elektrik-kesintisi-yedek-guc-uygunluk-kontrolu/index.html
          test -f /tmp/alo186-v271/assets/journey-events-v260.js

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v271
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py \
            --output /tmp/alo186-sites-v271 \
            --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-sites-v271')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-gunes-paneli-calisir-mi/',
              '/hesaplama/ges-elektrik-kesintisi-yedek-guc-uygunluk-kontrolu/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for path in expected:
              page = pages[path]
              assert page['affiliate']['hasAffiliateLinks'] is False
              assert not page['affiliate']['unsafeStaticLinks']
          print(json.dumps({'ok': True, 'routes': sorted(expected)}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v271 GES kesinti büyüme paketi

          - Arama boşluğu: “Elektrik kesilince güneş paneli çalışır mı?”
          - Kullanıcı aracı: on-grid, hibrit, off-grid, yedek çıkış, transfer ve kritik yük ayrımı
          - Dönüşüm: ürün yerine indirilebilir teknik ön değerlendirme kapsamı ve profesyonel süreklilik yolu
          - Tekrar ziyaret: 30 günlük belge kontrolü, 90 günlük gerçek kesinti tatbikatı, yıllık profesyonel kontrol
          - Affiliate: yok; GES yedekleme professional-only sınıfında
          - Satın almama: gerçek test hedefi sağlıyorsa zorunlu sonuç
          - Fiyat, stok, puan, garanti, Offer ve AggregateRating: yok
          - Resmî kurum izlenimi ve kişisel veri toplama: yok
          EOF
