name: ALO186 communication continuity growth v154

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/modem-ont-router-mini-ups-guc-sure-uygunluk/**'
      - 'alo186/hesaplama/telefon-powerbank-acil-sarj-uygunluk/**'
      - 'alo186/sektor-rehberi/elektrik-kesintisi-iletisim-sureklilik-merkezi/**'
      - 'alo186/deployment/routing-overlays/154-communication-continuity-growth.json'
      - 'alo186/audits/communication-continuity-growth-v154-2026-07-31.md'
      - 'alo186/tests/test_communication_continuity_growth_v154.py'
      - '.github/workflows/alo186-communication-continuity-growth-v154.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-communication-continuity-growth-v154-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-and-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate communication tools, affiliate gates, repeat visits and routes
        run: python alo186/tests/test_communication_continuity_growth_v154.py
