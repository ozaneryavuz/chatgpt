name: ALO186 akım korumalı grup priz uygunluğu

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/akim-korumali-grup-priz-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/urun-eslestirme/catalog.js'
      - 'alo186/urun-eslestirme/journey-retention-core.js'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - 'alo186/tests/**'
      - 'alo186/deployment/build_static_site.py'
      - 'alo186/deployment/smoke_static_site.py'
      - 'alo186/deployment/prepare_github_pages.py'
      - 'alo186/deployment/smoke_github_pages.py'
      - '.github/workflows/alo186-surge-strip-suitability.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/akim-korumali-grup-priz-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/urun-eslestirme/catalog.js'
      - 'alo186/urun-eslestirme/journey-retention-core.js'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - '.github/workflows/alo186-surge-strip-suitability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-surge-strip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Modül senaryo, güvenlik ve yayın testleri
        run: node alo186/hesaplama/akim-korumali-grup-priz-uygunluk/test.js

      - name: Ürün kapısı ve tekrar ziyaret yolculuğu
        run: |
          node <<'NODE'
          const assert=require('assert');
          const catalog=require('./alo186/urun-eslestirme/catalog.js');
          const journey=require('./alo186/urun-eslestirme/journey-retention-core.js');
          const category=catalog.getCategory('surge_strip');
          assert(category);
          assert.equal(category.mode,'guide');
          assert.equal(category.affiliatePolicy,'after_tool');
          assert.equal(category.nextStepUrl,'https://www.alo186.com/hesaplama/akim-korumali-grup-priz-uygunluk/');
          const verified=catalog.productsFor('surge_strip');
          assert(verified.length>=4,'En az dört doğrulanmış grup priz ürünü korunmalı.');
          assert.equal(new Set(verified.map(product=>product.id)).size,verified.length);
          assert(verified.every(product=>product.status==='verified_listing'));
          const route=journey.getJourney('surge_strip');
          assert(route);
          assert.equal(route.calculate.url,'/hesaplama/akim-korumali-grup-priz-uygunluk/');
          assert.equal(route.compare.url,'/akilli-urun-secimi?kategori=surge_strip');
          assert.equal(route.maintenance.length,3);
          console.log(`Surge strip affiliate kapısı ve ${verified.length} doğrulanmış ürün yolculuğu başarılı.`);
          NODE

      - name: JavaScript sözdizimi
        run: |
          node --check alo186/hesaplama/akim-korumali-grup-priz-uygunluk/core.js
          node --check alo186/hesaplama/akim-korumali-grup-priz-uygunluk/app.js
          node --check alo186/urun-eslestirme/catalog.js
          node --check alo186/urun-eslestirme/journey-retention-core.js

      - name: Genel canonical ve cihaz hasarı güvenlik kapıları
        run: |
          node alo186/tests/test_release_manifest.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical production bundle
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-surge-strip-site \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-surge-strip-site

      - name: GitHub Pages custom-domain smoke
        run: |
          cp -a /tmp/alo186-surge-strip-site /tmp/alo186-surge-strip-pages
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-surge-strip-pages \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-surge-strip-pages \
            --base-path ''

      - name: Production artifact sözleşmesi
        shell: bash
        run: |
          set -euo pipefail
          route='hesaplama/akim-korumali-grup-priz-uygunluk'
          test -f "/tmp/alo186-surge-strip-pages/$route/index.html"
          test -f "/tmp/alo186-surge-strip-pages/$route/core.js"
          test -f "/tmp/alo186-surge-strip-pages/$route/app.js"
          grep -q 'Akım Korumalı Grup Priz Yük, Joule ve Güvenlik Testi' "/tmp/alo186-surge-strip-pages/$route/index.html"
          grep -q 'Satış ortaklığı açıklaması' "/tmp/alo186-surge-strip-pages/$route/index.html"
          grep -q 'Tam model geri çağırma kontrolü' "/tmp/alo186-surge-strip-pages/$route/index.html"
          grep -q 'JSON teknik fişi indir' "/tmp/alo186-surge-strip-pages/$route/index.html"
          grep -q 'data-confirm-technical' "/tmp/alo186-surge-strip-pages/$route/app.js"
          grep -q 'sponsored nofollow noopener' "/tmp/alo186-surge-strip-pages/$route/app.js"
          grep -Eq '[3-9][0-9]* çekirdek araç' /tmp/alo186-surge-strip-pages/hesaplama/index.html
          grep -q 'akim-korumali-grup-priz-uygunluk' /tmp/alo186-surge-strip-pages/sitemap.xml
          grep -q 'affiliatePolicy.*after_tool' /tmp/alo186-surge-strip-pages/akilli-urun-secimi/catalog.js
          grep -q 'akim-korumali-grup-priz-uygunluk' /tmp/alo186-surge-strip-pages/akilli-urun-secimi/journey-retention-core.js
          ! grep -Eqi 'amazon\.(com|com\.tr)/' "/tmp/alo186-surge-strip-pages/$route/index.html"
          ! grep -Eqi 'type="(email|tel|text)"' "/tmp/alo186-surge-strip-pages/$route/index.html"
          ! grep -Eqi '"offers"[[:space:]]*:' "/tmp/alo186-surge-strip-pages/$route/index.html"

      - name: Doğrulanmış modül artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-surge-strip-suitability-production
          path: /tmp/alo186-surge-strip-pages
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
