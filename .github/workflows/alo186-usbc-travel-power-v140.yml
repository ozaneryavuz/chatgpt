name: ALO186 USB-C travel power v140

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/usb-c-sarj-cihazi-kablo-uygunluk/**'
      - 'alo186/hesaplama/power-bank-wh-ucus-ve-sure-uygunluk/**'
      - 'alo186/sektor-rehberi/usb-c-seyahat-sarj-ve-power-bank-test-merkezi/**'
      - 'alo186/deployment/routing-overlays/140-usbc-travel-power.json'
      - 'alo186/tests/test_usbc_travel_power_growth_v140.py'
      - '.github/workflows/alo186-usbc-travel-power-v140.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-usbc-travel-power-v140-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-and-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate decisions, trust gates and published routes
        run: python alo186/tests/test_usbc_travel_power_growth_v140.py
