name: ALO186 elevator outage safety v368

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-asansor-ne-olur-mahsur-kalinca-ne-yapmali/**'
      - 'alo186/hesaplama/asansor-elektrik-kesintisi-kurtarma-hazirlik-kontrolu/**'
      - 'alo186/sektor-rehberi/site-otel-asansor-elektrik-kesintisi-kurtarma-surekliligi/**'
      - 'alo186/content/commerce/elevator-outage-safety-v368.json'
      - 'alo186/deployment/routing-overlays/elevator-outage-safety-v368.json'
      - 'alo186/tests/test_elevator_outage_safety_growth_v368.py'
      - '.github/workflows/alo186-elevator-outage-safety-v368.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-asansor-ne-olur-mahsur-kalinca-ne-yapmali/**'
      - 'alo186/hesaplama/asansor-elektrik-kesintisi-kurtarma-hazirlik-kontrolu/**'
      - 'alo186/sektor-rehberi/site-otel-asansor-elektrik-kesintisi-kurtarma-surekliligi/**'
      - 'alo186/content/commerce/elevator-outage-safety-v368.json'
      - 'alo186/deployment/routing-overlays/elevator-outage-safety-v368.json'
      - 'alo186/tests/test_elevator_outage_safety_growth_v368.py'
      - '.github/workflows/alo186-elevator-outage-safety-v368.yml'

permissions:
  contents: read

concurrency:
  group: alo186-elevator-outage-v368-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: v368 trust privacy safety and commerce checks
        run: python alo186/tests/test_elevator_outage_safety_growth_v368.py
      - name: Canonical production build and smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-elevator-outage-v368
          python alo186/deployment/build_static_site.py --output /tmp/alo186-elevator-outage-v368 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-elevator-outage-v368
      - name: Verify routes sitemap schema and commercial closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-elevator-outage-v368')
          routes = [
              '/haberler/elektrik-kesilince-asansor-ne-olur-mahsur-kalinca-ne-yapmali/',
              '/hesaplama/asansor-elektrik-kesintisi-kurtarma-hazirlik-kontrolu/',
              '/sektor-rehberi/site-otel-asansor-elektrik-kesintisi-kurtarma-surekliligi/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 368
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              html = page.read_text(encoding='utf-8')
              lowered = html.casefold()
              canonical = f'https://alo186.com{route}'
              assert canonical in sitemap or canonical.rstrip('/') in sitemap
              assert f'<link rel="canonical" href="{canonical}">' in html
              assert 'amazon.com.tr' not in lowered
              assert 'amzn.to' not in lowered
              assert 'pricecurrency' not in lowered
              assert '"@type":"product"' not in lowered
              assert '"@type":"offer"' not in lowered
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes, 'merchantLinks': 0})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-elevator-outage-v368-${{ github.sha }}
          path: /tmp/alo186-elevator-outage-v368
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
