name: ALO186 Live Browser Audit 0501

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser audit tools
        run: |
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Run responsive and accessibility audit
        shell: bash
        run: |
          mkdir -p artifacts-browser/screenshots
          cat > browser-audit-0501.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';

          const routes=['/','/elektrik-portali','/elektrik-kesintisi','/haberler','/iletisim','/acil-numaralar','/sektor-rehberi/elektrikli-cihaz-hasar-basvurusu'];
          const views=[
            {name:'mobile-360',width:360,height:800,isMobile:true,hasTouch:true},
            {name:'mobile-390',width:390,height:844,isMobile:true,hasTouch:true},
            {name:'desktop',width:1440,height:1000,isMobile:false,hasTouch:false}
          ];
          const results=[];
          const browser=await chromium.launch({headless:true});
          for(const view of views){
            const context=await browser.newContext({viewport:{width:view.width,height:view.height},isMobile:view.isMobile,hasTouch:view.hasTouch});
            for(const route of routes){
              const page=await context.newPage();
              const consoleErrors=[]; const pageErrors=[]; const failedRequests=[];
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('requestfailed',r=>failedRequests.push({url:r.url(),failure:r.failure()?.errorText||''}));
              try{
                const response=await page.goto('https://alo186.com'+route,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(2500);
                const data=await page.evaluate(()=>{
                  const isVisible=(el)=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0};
                  const interactives=[...document.querySelectorAll('a,button,input,select,textarea,[role="button"]')].filter(isVisible);
                  const smallTargets=interactives.map(el=>{const r=el.getBoundingClientRect();return{tag:el.tagName,text:(el.innerText||el.getAttribute('aria-label')||el.getAttribute('name')||'').trim().replace(/\s+/g,' ').slice(0,120),width:Math.round(r.width),height:Math.round(r.height)}}).filter(x=>x.width<44||x.height<44).slice(0,150);
                  const occluded=[];
                  for(const el of interactives){const r=el.getBoundingClientRect();if(r.width<1||r.height<1)continue;const x=Math.min(innerWidth-1,Math.max(0,r.left+r.width/2));const y=Math.min(innerHeight-1,Math.max(0,r.top+r.height/2));if(y<0||y>=innerHeight)continue;const top=document.elementFromPoint(x,y);if(top&&!el.contains(top)&&!top.contains(el)){occluded.push({tag:el.tagName,text:(el.innerText||el.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ').slice(0,120),coveredBy:top.tagName+'.'+String(top.className||'').slice(0,100)})}}
                  const ids=[...document.querySelectorAll('[id]')].map(x=>x.id);
                  const images=[...document.images];
                  const forms=[...document.querySelectorAll('input,textarea,select')].map(el=>({tag:el.tagName,type:el.getAttribute('type')||'',name:el.getAttribute('name')||'',placeholder:el.getAttribute('placeholder')||'',autocomplete:el.getAttribute('autocomplete')||''}));
                  return{
                    url:location.href,title:document.title,lang:document.documentElement.lang,
                    viewport:{width:innerWidth,height:innerHeight},
                    scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,overflowPx:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),
                    h1Count:document.querySelectorAll('h1').length,duplicateIds:[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))],
                    failedImages:images.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.currentSrc||i.src),pendingImages:images.filter(i=>!i.complete).map(i=>i.currentSrc||i.src),
                    imagesMissingAlt:images.filter(i=>!i.hasAttribute('alt')).map(i=>i.currentSrc||i.src),
                    smallTargets,occluded:occluded.slice(0,100),forms
                  };
                });
                const axe=await new AxeBuilder({page}).analyze();
                const safe=route==='/'?'home':route.slice(1).replaceAll('/','-');
                const screenshot=`artifacts-browser/screenshots/${view.name}-${safe}.png`;
                await page.screenshot({path:screenshot,fullPage:true});
                results.push({view:view.name,route,status:response?.status()??null,data,consoleErrors,pageErrors,failedRequests,axeViolations:axe.violations.map(v=>({id:v.id,impact:v.impact,description:v.description,help:v.help,helpUrl:v.helpUrl,nodes:v.nodes.map(n=>({html:n.html,target:n.target,failureSummary:n.failureSummary})).slice(0,20)})),screenshot});
              }catch(error){results.push({view:view.name,route,error:String(error),consoleErrors,pageErrors,failedRequests})}
              await page.close();
            }
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('artifacts-browser/browser-audit.json',JSON.stringify(results,null,2));
          const summary={scenarios:results.length,errors:results.filter(x=>x.error).length,overflow:results.filter(x=>(x.data?.overflowPx||0)>2).length,imageFailures:results.filter(x=>x.data?.failedImages?.length||x.data?.pendingImages?.length).length,consoleErrors:results.reduce((n,x)=>n+x.consoleErrors.length,0),requestFailures:results.reduce((n,x)=>n+x.failedRequests.length,0),axeViolations:results.reduce((n,x)=>n+x.axeViolations.length,0),smallTargets:results.filter(x=>x.view.startsWith('mobile')).reduce((n,x)=>n+(x.data?.smallTargets?.length||0),0),occluded:results.reduce((n,x)=>n+(x.data?.occluded?.length||0),0)};
          fs.writeFileSync('artifacts-browser/summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE
          node browser-audit-0501.mjs
      - name: Upload browser artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-browser-0501
          path: artifacts-browser/
          if-no-files-found: error
          retention-days: 7
