name: ALO186 commerce source canonical migration v217

on:
  push:
    branches:
      - fix/commerce-canonical-apex-v217-main
    paths:
      - 'alo186/deployment/normalize_commerce_source_canonical_v217.py'
      - '.github/workflows/alo186-commerce-source-canonical-migrate-v217.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alo186-commerce-source-canonical-migrate-v217
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/commerce-canonical-apex-v217-main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ticari ve hizmet kaynaklarını apex canonicala taşı
        run: python alo186/deployment/normalize_commerce_source_canonical_v217.py
      - name: Değişiklik varsa aynı dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- alo186/amazon-elektrik-urunleri alo186/hizmetler; then
            echo 'Kaynak canonical drift bulunmadı.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alo186/amazon-elektrik-urunleri alo186/hizmetler
          git commit -m 'fix(alo186): normalize commerce source canonicals to apex'
          git push origin HEAD:fix/commerce-canonical-apex-v217-main
