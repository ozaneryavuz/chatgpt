name: ALO186 device damage 30 day correction

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alo186-device-damage-30-day-fix.yml'

permissions:
  contents: write

concurrency:
  group: alo186-device-damage-30-day-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  correct-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Yürürlükteki 30 günlük süreyi kaynak içeriğe uygula
        run: |
          set -euo pipefail
          git fetch origin main
          TARGET='alo186/haberler/elektrik-kesintisi-gerilim-dalgalanmasi-cihaz-hasari-edas-tazminat-basvurusu/index.html'
          mkdir -p "$(dirname "$TARGET")"
          git show "origin/main:$TARGET" > "$TARGET"
          python - <<'PY'
          from pathlib import Path

          path = Path('alo186/haberler/elektrik-kesintisi-gerilim-dalgalanmasi-cihaz-hasari-edas-tazminat-basvurusu/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'cihaz hasarında 10 iş günlük EDAŞ başvurusunu': 'cihaz hasarında 30 günlük dağıtım şirketi başvurusunu',
              'elektrik arızası servis raporu, 10 iş günü': 'elektrik arızası servis raporu, 30 gün',
              '"name":"Ten Business Days"': '"name":"Thirty Days"',
              'EPDK tüketici açıklamasına göre dağıtım şebekesinden kaynaklanan hasar için zarar tarihinden itibaren on iş günü içinde dağıtım şirketine talep iletilebilir.': 'Yürürlükteki Elektrik Piyasasında Dağıtım ve Perakende Satış Faaliyetlerine İlişkin Kalite Yönetmeliğinin 26 ncı maddesine göre, elektrik dağıtım sisteminden kaynaklanan kalite sorunları nedeniyle oluşan teçhizat hasarı için zarar tarihinden itibaren 30 gün içinde dağıtım şirketine talepte bulunulur.',
              'zarar tarihinden itibaren on iş günü içinde ilgili dağıtım şirketine yazılı başvuru yapın.': 'zararın ortaya çıktığı tarihten itibaren 30 gün içinde ilgili dağıtım şirketine yazılı başvuru yapın.',
              '<strong>On iş günü dolmadan başvurun:</strong>': '<strong>30 gün dolmadan başvurun:</strong>',
              'https://epdk.gov.tr/Detay/Icerik/12-3/1-elektrik-aboneligini-kendi-adima-almak-zorunda': 'https://www.epdk.gov.tr/Detay/Icerik/3-0-159/yonetmelikler',
              'https://www.epdk.gov.tr/Detay/Icerik/3-6740/elektrik-dagitimi-ve-perakende-satisina-iliskin-hizmet-kalitesi-yonetmeligi': 'https://www.resmigazete.gov.tr/eskiler/2020/12/20201229M1-1.htm',
              'EPDK tüketici açıklaması: cihaz hasarı ve 10 iş günü': 'EPDK yürürlükteki elektrik piyasası yönetmelikleri listesi',
              'EPDK Hizmet Kalitesi Yönetmeliği': 'Resmî Gazete: Elektrik Piyasasında Dağıtım ve Perakende Satış Faaliyetlerine İlişkin Kalite Yönetmeliği',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Beklenen eski ifade bulunamadı: {old}')
              text = text.replace(old, new)
          text = text.replace('EPDK tüketici soruları: kesinti kaynaklı zarar', 'EPDK tüketici sayfası: kesinti kaynaklı zarar (sayfa güncelliğini yönetmelikle karşılaştırın)')
          if any(term in text.lower() for term in ('10 iş günlük', 'on iş günü içinde dağıtım şirketine talep', 'ten business days')):
              raise SystemExit('Eski başvuru süresi içeriği tamamen temizlenemedi')
          if text.count('30 gün') < 5:
              raise SystemExit('30 günlük süre meta, cevap, adım ve FAQ alanlarında yeterince görünür değil')
          path.write_text(text, encoding='utf-8')
          PY
          grep -q 'zararın ortaya çıktığı tarihten itibaren 30 gün içinde' "$TARGET"
          grep -q '20201229M1-1.htm' "$TARGET"
          ! grep -Eqi '10 iş günlük|on iş günü içinde dağıtım şirketine talep|Ten Business Days' "$TARGET"
      - name: Tam üretim paketi doğrulaması
        env:
          GA4: G-639TVHL0LC
        run: |
          set -euo pipefail
          SITE=/tmp/alo186-v211-final
          rm -rf "$SITE"
          python alo186/deployment/build_static_site.py --output "$SITE" --commit "$GITHUB_SHA"
          python alo186/deployment/prepare_github_pages.py --site "$SITE" --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_contextual_affiliate_v176.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_home_affiliate_banner_v209.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_affiliate_intent_router_v210.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_ga4_consent.py --site "$SITE" --base-path '' --measurement-id "$GA4"
          python alo186/deployment/inject_affiliate_measurement_v211.py --site "$SITE" --base-path ''
          node --check "$SITE/assets/affiliate-measurement-v211.js"
          python alo186/deployment/smoke_github_pages.py --site "$SITE" --base-path ''
          python alo186/deployment/guard_commerce_routes_v3.py --site "$SITE"
      - name: Düzeltmeyi PR dalına kaydet
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          TARGET='alo186/haberler/elektrik-kesintisi-gerilim-dalgalanmasi-cihaz-hasari-edas-tazminat-basvurusu/index.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git diff --cached --quiet && exit 0
          git commit -m 'ALO186 cihaz hasarı başvuru süresini 30 gün olarak düzelt'
          git fetch origin "$HEAD_REF"
          git rebase "origin/$HEAD_REF"
          git push origin HEAD:"$HEAD_REF"
