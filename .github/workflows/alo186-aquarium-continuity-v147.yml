name: ALO186 aquarium continuity growth v147

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/akvaryum-elektrik-kesintisi-oksijen-sicaklik-guvenligi/**'
      - 'alo186/hesaplama/akvaryum-hava-motoru-yedek-guc-sure-uygunluk/**'
      - 'alo186/sektor-rehberi/akvaryum-elektrik-kesintisi-sureklilik-merkezi/**'
      - 'alo186/deployment/routing-overlays/147-aquarium-continuity-growth.json'
      - 'alo186/audits/aquarium-continuity-growth-v147-2026-07-31.md'
      - 'alo186/tests/test_aquarium_continuity_growth_v147.py'
      - '.github/workflows/alo186-aquarium-continuity-v147.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-aquarium-continuity-v147-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-and-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate aquarium safety, affiliate gates and routes
        run: python alo186/tests/test_aquarium_continuity_growth_v147.py
