name: ALO186 one-shot authority sitemap apex v203

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/alo186-one-shot-authority-apex-v203.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  migrate-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/alo186-apex-canonical-contract-v203'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-apex-canonical-contract-v203
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Align authority sitemap assertion to apex
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('alo186/tests/test_authority_content.js')
          text = path.read_text(encoding='utf-8')
          old = 'assert(sitemap.includes(`https://www.alo186.com${canonicalPath}`),`Sitemap eksik: ${article.slug}`);'
          new = 'assert(sitemap.includes(`${routing.canonicalHost}${canonicalPath}`),`Sitemap eksik: ${article.slug}`);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one legacy authority sitemap assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/alo186-one-shot-authority-apex-v203.yml').unlink()
          PY

      - name: Verify authority and canonical contracts
        shell: bash
        run: |
          set -euo pipefail
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_authority_content.js

      - name: Commit verified assertion migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(alo186): read authority sitemap host from manifest"
          git push origin HEAD:fix/alo186-apex-canonical-contract-v203
