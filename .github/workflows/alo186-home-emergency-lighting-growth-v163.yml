name: ALO186 home emergency lighting growth v163

on:
  pull_request:
    paths:
      - "alo186/hesaplama/elektrik-kesintisi-el-feneri-mum-guvenligi/**"
      - "alo186/hesaplama/sarjli-fener-acil-aydinlatma-lumen-wh-sure-uygunlugu/**"
      - "alo186/sektor-rehberi/ev-acil-aydinlatma-batarya-test-merkezi/**"
      - "alo186/deployment/routing-overlays/163-home-emergency-lighting-growth.json"
      - "alo186/audits/home-emergency-lighting-growth-v163-2026-08-01.md"
      - "alo186/tests/test_home_emergency_lighting_growth_v163.py"
      - ".github/workflows/alo186-home-emergency-lighting-growth-v163.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/elektrik-kesintisi-el-feneri-mum-guvenligi/**"
      - "alo186/hesaplama/sarjli-fener-acil-aydinlatma-lumen-wh-sure-uygunlugu/**"
      - "alo186/sektor-rehberi/ev-acil-aydinlatma-batarya-test-merkezi/**"
      - "alo186/deployment/routing-overlays/163-home-emergency-lighting-growth.json"
      - "alo186/tests/test_home_emergency_lighting_growth_v163.py"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python alo186/tests/test_home_emergency_lighting_growth_v163.py
