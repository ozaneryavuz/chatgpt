name: ALO186 canlı mobil ve masaüstü teknik kalite

on:
  pull_request:
    paths:
      - 'alo186/tests/live_site_technical_audit.py'
      - 'alo186/tests/live_site_technical_audit_v2.py'
      - 'alo186/tests/test_live_domain_integration_manifest.py'
      - 'alo186/tests/test_live_quality_hardening.py'
      - 'alo186/deployment/live-domain-integration.json'
      - 'alo186/deployment/inject_live_quality_hardening.py'
      - 'alo186/deployment/prepare_github_pages_core.py'
      - 'alo186/deployment/routing-manifest.json'
      - '.github/workflows/alo186-live-domain-acceptance.yml'
      - '.github/workflows/alo186-live-technical-quality.yml'
      - '.github/workflows/alo186-github-pages.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/**'
      - '.github/workflows/alo186-live-technical-quality.yml'
      - '.github/workflows/alo186-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-live-technical-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Denetim bağımlılıkları
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium
          npm install --no-save axe-core@4.10.3

      - name: Push sonrası güncel Pages release kimliğini bekle
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            code=$(curl --silent --show-error --location --max-time 20 --output /tmp/alo186-pages-release.json --write-out '%{http_code}' https://alo186.com/pages-release.json || true)
            if [[ "$code" == "200" ]]; then
              if python - "$GITHUB_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path
          expected=sys.argv[1]
          try:
              payload=json.loads(Path('/tmp/alo186-pages-release.json').read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          if payload.get('commit') != expected:
              raise SystemExit(1)
          if payload.get('canonicalHost') != 'https://alo186.com':
              raise SystemExit(1)
          if int(payload.get('routeCount') or 0) < 275:
              raise SystemExit(1)
          quality=payload.get('liveTechnicalQuality') or {}
          if quality.get('minimumTouchTargetCssPx') != 44:
              raise SystemExit(1)
          PY
              then
                echo "Güncel release görünür: deneme=$attempt commit=$GITHUB_SHA"
                break
              fi
            fi
            if [[ "$attempt" == "45" ]]; then
              echo 'Canlı apex alan adı güncel GitHub Pages release kimliğini 15 dakika içinde sunmadı.' >&2
              echo 'DNS/custom-host hâlâ eski yayın yüzeyine gidiyor olabilir.' >&2
              exit 1
            fi
            sleep 20
          done

      - name: Canlı mobil ve masaüstü denetimi
        id: live_audit
        continue-on-error: true
        env:
          AXE_CORE_PATH: node_modules/axe-core/axe.min.js
        run: |
          python alo186/tests/live_site_technical_audit_v2.py \
            --output /tmp/alo186-live-technical-audit

      - name: Kaynak ve yayın regresyonları
        run: |
          python alo186/tests/test_live_domain_integration_manifest.py
          python alo186/tests/test_live_quality_hardening.py
          python alo186/tests/test_content_intent_consolidation.py
          python alo186/tests/device_damage_deadline_guard.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js

      - name: Denetim raporunu iş özetine ekle
        if: always()
        run: |
          if [[ -f /tmp/alo186-live-technical-audit/report.md ]]; then
            cat /tmp/alo186-live-technical-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Canlı teknik denetim raporu üretilemedi.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Denetim artifactını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-technical-quality-report
          path: /tmp/alo186-live-technical-audit
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Pull request canlı bulgularını bilgilendirme olarak tut
        if: always() && github.event_name == 'pull_request'
        run: |
          echo 'Pull request sırasında canlı alan adı önceki release’i gösterebilir; P0/P1 bulguları artifactta raporlanır fakat merge kapısı yalnız kaynak regresyonlarıdır.' >> "$GITHUB_STEP_SUMMARY"

      - name: Push sonrası P0/P1 kalite kapısı
        if: always() && github.event_name != 'pull_request'
        run: |
          if [[ ! -f /tmp/alo186-live-technical-audit/audit.json ]]; then
            echo 'Denetim JSON raporu yok.' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/alo186-live-technical-audit/audit.json').read_text(encoding='utf-8'))
          summary=report.get('summary',{})
          print(json.dumps({'preferredOrigin':report.get('preferredOrigin'),'summary':summary},ensure_ascii=False,indent=2))
          if int(summary.get('P0',0)) or int(summary.get('P1',0)):
              raise SystemExit('Güncel canlı release teknik kalite denetiminde P0/P1 bulguları var.')
          PY
