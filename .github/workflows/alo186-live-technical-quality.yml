name: ALO186 canlı mobil ve masaüstü teknik kalite

on:
  pull_request:
    paths:
      - 'alo186/tests/live_site_technical_audit.py'
      - 'alo186/tests/test_live_domain_integration_manifest.py'
      - 'alo186/deployment/live-domain-integration.json'
      - 'alo186/deployment/prepare_github_pages_core.py'
      - 'alo186/deployment/routing-manifest.json'
      - '.github/workflows/alo186-live-domain-acceptance.yml'
      - '.github/workflows/alo186-live-technical-quality.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/**'
      - '.github/workflows/alo186-live-technical-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-live-technical-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Denetim bağımlılıkları
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium
          npm install --no-save axe-core@4.10.3

      - name: Canlı mobil ve masaüstü denetimi
        id: live_audit
        continue-on-error: true
        env:
          AXE_CORE_PATH: node_modules/axe-core/axe.min.js
        run: |
          python alo186/tests/live_site_technical_audit.py \
            --output /tmp/alo186-live-technical-audit

      - name: Kaynak ve yayın regresyonları
        run: |
          python alo186/tests/test_live_domain_integration_manifest.py
          python alo186/tests/test_content_intent_consolidation.py
          python alo186/tests/device_damage_deadline_guard.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js

      - name: Denetim raporunu iş özetine ekle
        if: always()
        run: |
          if [[ -f /tmp/alo186-live-technical-audit/report.md ]]; then
            cat /tmp/alo186-live-technical-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Canlı teknik denetim raporu üretilemedi.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Denetim artifactını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-technical-quality-report
          path: /tmp/alo186-live-technical-audit
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: P0/P1 kalite kapısı
        if: always()
        run: |
          if [[ ! -f /tmp/alo186-live-technical-audit/audit.json ]]; then
            echo 'Denetim JSON raporu yok.' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/alo186-live-technical-audit/audit.json').read_text(encoding='utf-8'))
          summary=report.get('summary',{})
          print(json.dumps({'preferredOrigin':report.get('preferredOrigin'),'summary':summary},ensure_ascii=False,indent=2))
          if int(summary.get('P0',0)) or int(summary.get('P1',0)):
              raise SystemExit('Canlı teknik kalite denetiminde P0/P1 bulguları var.')
          PY
