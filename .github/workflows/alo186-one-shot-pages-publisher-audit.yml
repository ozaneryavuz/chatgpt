name: ALO186 one-shot Pages publisher audit

on:
  push:
    branches:
      - agent/alo186-pages-publisher-audit
    paths:
      - '.github/workflows/alo186-one-shot-pages-publisher-audit.yml'

permissions:
  contents: write

concurrency:
  group: alo186-one-shot-pages-publisher-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alo186-pages-publisher-audit
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan workflow publishers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('.github/workflows')
          rows = []
          for path in sorted(root.glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              if 'actions/deploy-pages@' not in text:
                  continue
              groups = re.findall(r'^\s*group:\s*(.+?)\s*$', text, flags=re.M)
              cancel = re.findall(r'^\s*cancel-in-progress:\s*(.+?)\s*$', text, flags=re.M)
              deploy_count = text.count('actions/deploy-pages@')
              rows.append({
                  'path': str(path),
                  'deployPagesCount': deploy_count,
                  'concurrencyGroups': groups,
                  'cancelInProgress': cancel,
                  'workflowRunTrigger': 'workflow_run:' in text,
                  'scheduleTrigger': 'schedule:' in text,
                  'pushMain': bool(re.search(r'branches:\s*\[?main\]?', text)),
                  'sha256': hashlib.sha256(text.encode()).hexdigest(),
              })

          payload = {
              'schemaVersion': 1,
              'publisherCount': len(rows),
              'deployStepCount': sum(row['deployPagesCount'] for row in rows),
              'publishers': rows,
              'singleSharedProductionConcurrency': len({
                  group
                  for row in rows
                  for group in row['concurrencyGroups']
                  if 'pull_request' not in group
              }) <= 1,
          }
          output = Path('alo186/deployment/pages-publisher-audit.json')
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/alo186-one-shot-pages-publisher-audit.yml'
          git add alo186/deployment/pages-publisher-audit.json
          git commit -m 'test: record Pages publisher concurrency audit'
          git push origin HEAD:agent/alo186-pages-publisher-audit
