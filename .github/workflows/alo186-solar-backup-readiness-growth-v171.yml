name: ALO186 solar backup readiness growth v171

on:
  pull_request:
    paths:
      - "alo186/hesaplama/elektrik-kesintisinde-gunes-paneli-neden-calismiyor-guvenlik/**"
      - "alo186/hesaplama/ev-ges-eps-backup-kritik-yuk-w-wh-uygunlugu/**"
      - "alo186/sektor-rehberi/ev-ges-batarya-yedek-guc-kabul-test-merkezi/**"
      - "alo186/deployment/routing-overlays/171-solar-backup-readiness-growth.json"
      - "alo186/audits/solar-backup-readiness-growth-v171-2026-08-01.md"
      - "alo186/tests/test_solar_backup_readiness_growth_v171.py"
      - ".github/workflows/alo186-solar-backup-readiness-growth-v171.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/elektrik-kesintisinde-gunes-paneli-neden-calismiyor-guvenlik/**"
      - "alo186/hesaplama/ev-ges-eps-backup-kritik-yuk-w-wh-uygunlugu/**"
