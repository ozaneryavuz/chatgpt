name: ALO186 RCD test repeat-use v381

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/kacak-akim-rolesi-test-butonu-basilinca-atmiyor/**'
      - 'alo186/hesaplama/kacak-akim-rolesi-test-hatirlatici/**'
      - 'alo186/ev-elektrik-guvenlik-kontrol-merkezi/**'
      - 'alo186/deployment/routing-overlays/rcd-test-repeat-v381.json'
      - 'alo186/deployment/affiliate-category-decisions/rcd-test-repeat-v381.json'
      - 'alo186/tests/test_rcd_test_repeat_v381.py'
      - '.github/workflows/alo186-rcd-test-repeat-v381.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/kacak-akim-rolesi-test-butonu-basilinca-atmiyor/**'
      - 'alo186/hesaplama/kacak-akim-rolesi-test-hatirlatici/**'
      - 'alo186/ev-elektrik-guvenlik-kontrol-merkezi/**'
      - 'alo186/deployment/routing-overlays/rcd-test-repeat-v381.json'
      - 'alo186/deployment/affiliate-category-decisions/rcd-test-repeat-v381.json'
      - 'alo186/tests/test_rcd_test_repeat_v381.py'
      - '.github/workflows/alo186-rcd-test-repeat-v381.yml'

permissions:
  contents: read

concurrency:
  group: alo186-rcd-test-repeat-v381-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: RCD test trust privacy and no-commerce checks
        run: python alo186/tests/test_rcd_test_repeat_v381.py
      - name: Canonical production build and smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-rcd-test-repeat-v381
          python alo186/deployment/build_static_site.py --output /tmp/alo186-rcd-test-repeat-v381 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-rcd-test-repeat-v381
      - name: Verify route sitemap hub and commercial closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-rcd-test-repeat-v381')
          route = '/hesaplama/kacak-akim-rolesi-test-hatirlatici/'
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 381
          page = root / route.strip('/') / 'index.html'
          assert page.is_file(), page
          html = page.read_text(encoding='utf-8').lower()
          assert f'https://alo186.com{route}' in sitemap
          assert 'amazon.com.tr' not in html
          assert 'amzn.to' not in html
          hub = root / 'ev-elektrik-guvenlik-kontrol-merkezi/index.html'
          guide = root / 'haberler/kacak-akim-rolesi-test-butonu-basilinca-atmiyor/index.html'
          assert hub.is_file() and guide.is_file()
          assert route in hub.read_text(encoding='utf-8')
          assert route in guide.read_text(encoding='utf-8')
          print({'ok': True, 'routingVersion': release['routingVersion'], 'route': route, 'merchantLinks': 0})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-rcd-test-repeat-v381-${{ github.sha }}
          path: /tmp/alo186-rcd-test-repeat-v381
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
