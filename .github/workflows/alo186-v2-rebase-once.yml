name: ALO186 production infra v2 rebase helper

on:
  push:
    branches: [ops/alo186-production-infra-v2-main-20260728]
    paths:
      - '.github/workflows/alo186-v2-rebase-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-nonconflicting-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/alo186-production-infra-v2-main-20260728
          fetch-depth: 0
      - name: PR42 dalından çakışmayan üretim dosyalarını al
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin ops/alo186-production-infra-v2
          files=(
            .github/workflows/alo186-dns-reconcile.yml
            .github/workflows/alo186-infra-ci.yml
            .github/workflows/alo186-production-readiness.yml
            .github/workflows/alo186-production-synthetic.yml
            .github/workflows/alo186-r2-bootstrap.yml
            .github/workflows/alo186-render-deploy.yml
            alo186/infra/caddy/.env.production.example
            alo186/infra/caddy/docker-compose.yml
            alo186/infra/cloudflare/reconcile_dns.py
            alo186/infra/observability/Dockerfile
            alo186/infra/observability/render.config.alloy
            alo186/infra/production/PROVIDER_ACTIVATION.md
            alo186/infra/production/check_email_dns.sh
            alo186/infra/production/smtp_probe.py
            alo186/sureklilik-api/ops/backup/Dockerfile
            alo186/sureklilik-api/ops/backup/backup_to_r2.sh
            alo186/sureklilik-api/scripts/generate_production_secrets.py
            alo186/sureklilik-api/tests/test_database_url.py
            alo186/sureklilik-api/tests/test_metrics_auth.py
          )
          git checkout origin/ops/alo186-production-infra-v2 -- "${files[@]}"
          git rm .github/workflows/alo186-v2-rebase-once.yml
          git add "${files[@]}"
          git commit -m 'chore(alo186): production infra v2 dosyalarını güncel main üzerine taşı'
          git push origin HEAD:ops/alo186-production-infra-v2-main-20260728
