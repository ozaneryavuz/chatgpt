name: ALO186 GitHub Pages — sunucusuz canlı yayın

on:
  push:
    branches: [main]
    paths:
      - 'alo186/**'
      - '.github/workflows/alo186-github-pages.yml'
  pull_request:
    paths:
      - 'alo186/**'
      - '.github/workflows/alo186-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('alo186-pages-pr-{0}', github.event.pull_request.number) || 'alo186-pages-production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      pages_ready: ${{ steps.pages_mode.outputs.pages_ready }}
      base_path: ${{ steps.pages_mode.outputs.base_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kaynak güvenlik ve yayın sözleşmeleri
        shell: bash
        run: |
          set -euo pipefail
          node alo186/tests/test_portal_hardening.js
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_authority_content.js
          node alo186/hesaplama/teknik-urun-karsilastirma/test.js
          node alo186/tests/test_technical_shortlist_growth.js
          python alo186/tests/device_damage_deadline_guard.py
          python alo186/tests/test_github_pages_bootstrap.py
          python alo186/tests/test_pages_single_publisher.py
          python alo186/tests/test_live_quality_hardening.py
          python alo186/tests/test_live_domain_integration_manifest.py
          python alo186/tests/test_ga4_consent_integration.py
          python alo186/tests/test_contextual_affiliate_growth_v177.py

      - name: Canonical statik siteyi oluştur
        shell: bash
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-canonical

      - name: Custom-domain ve github.io alt-yol modlarını birlikte test et
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'custom|' 'project|/chatgpt'; do
            name=${spec%%|*}
            base=${spec#*|}
            site="/tmp/alo186-pages-${name}"
            rm -rf "$site"
            cp -a /tmp/alo186-canonical "$site"
            python alo186/deployment/prepare_github_pages.py \
              --site "$site" \
              --base-path "$base" \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA"
            python alo186/deployment/inject_outcome_runtime.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/inject_shortlist_growth.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/smoke_github_pages.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/inject_contextual_affiliate_growth_v177.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/inject_live_quality_hardening_v2.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/inject_ga4_consent.py \
              --site "$site" \
              --base-path "$base" \
              --measurement-id ""
          done

      - name: Pages yönetici tokenı durumunu belirle
        id: pages_admin
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PAGES_ADMIN_TOKEN: ${{ secrets.ALO186_PAGES_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$PAGES_ADMIN_TOKEN" ]; then
            echo 'token_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'token_present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Pages workflow modunu ve apex custom domainini otomatik hazırla
        id: pages_bootstrap
        if: github.event_name != 'pull_request' && steps.pages_admin.outputs.token_present == 'true'
        shell: bash
        env:
          ALO186_PAGES_ADMIN_TOKEN: ${{ secrets.ALO186_PAGES_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python alo186/deployment/bootstrap_github_pages.py \
            --repository "$GITHUB_REPOSITORY" \
            --custom-domain alo186.com \
            > /tmp/alo186-pages-bootstrap.json
          cat /tmp/alo186-pages-bootstrap.json

      - name: Pages bootstrap tanısını sakla
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: alo186-github-pages-bootstrap
          path: /tmp/alo186-pages-bootstrap.json
          if-no-files-found: ignore
          retention-days: 30

      - name: GitHub Pages ayarlarını oku
        id: pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Yönetici tokenı kullanıldıysa Pages ayarını zorunlu doğrula
        if: >-
          github.event_name != 'pull_request' &&
          steps.pages_admin.outputs.token_present == 'true' &&
          steps.pages.outcome != 'success'
        shell: bash
        run: |
          echo 'ALO186_PAGES_ADMIN_TOKEN ile bootstrap çalıştı fakat configure-pages doğrulaması başarısız.' >&2
          exit 1

      - name: Gerçek yayın modunu seç
        id: pages_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIGURE_OUTCOME: ${{ steps.pages.outcome }}
          CONFIGURED_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != 'pull_request' ] && [ "$CONFIGURE_OUTCOME" = 'success' ]; then
            printf 'pages_ready=true\n' >> "$GITHUB_OUTPUT"
            printf 'base_path=%s\n' "$CONFIGURED_BASE_PATH" >> "$GITHUB_OUTPUT"
          else
            printf 'pages_ready=false\n' >> "$GITHUB_OUTPUT"
            printf 'base_path=/chatgpt\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Yayınlanacak Pages artifactını hazırla ve son kalite katmanını uygula
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.pages_mode.outputs.base_path }}
          ALO186_GA4_MEASUREMENT_ID: ${{ vars.ALO186_GA4_MEASUREMENT_ID || 'G-639TVHL0LC' }}
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-pages-site
          cp -a /tmp/alo186-canonical /tmp/alo186-pages-site
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH"
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH"
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH"
          python alo186/deployment/inject_contextual_affiliate_growth_v177.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH" \
            | tee /tmp/alo186-contextual-affiliate-v177.json
          python alo186/deployment/inject_live_quality_hardening_v2.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH" \
            | tee /tmp/alo186-live-quality-hardening.json
          python alo186/deployment/inject_ga4_consent.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH" \
            --measurement-id "${ALO186_GA4_MEASUREMENT_ID:-}" \
            | tee /tmp/alo186-ga4-release.json

      - name: Pages önizleme artifactını sakla
        uses: actions/upload-artifact@v4
        with:
          name: alo186-github-pages-preview
          path: |
            /tmp/alo186-pages-site
            /tmp/alo186-contextual-affiliate-v177.json
            /tmp/alo186-live-quality-hardening.json
            /tmp/alo186-ga4-release.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: GitHub Pages artifactını yükle
        if: github.event_name != 'pull_request' && steps.pages_mode.outputs.pages_ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/alo186-pages-site

      - name: Yayın özeti
        shell: bash
        env:
          PAGES_READY: ${{ steps.pages_mode.outputs.pages_ready }}
          BASE_PATH: ${{ steps.pages_mode.outputs.base_path }}
          ADMIN_TOKEN_PRESENT: ${{ steps.pages_admin.outputs.token_present }}
          GA4_MEASUREMENT_ID: ${{ vars.ALO186_GA4_MEASUREMENT_ID || 'G-639TVHL0LC' }}
        run: |
          {
            echo '## ALO186 GitHub Pages'
            echo
            echo "- Pages yapılandırması hazır: **$PAGES_READY**"
            echo "- Build base path: \`$BASE_PATH\`"
            echo "- Yönetici bootstrap tokenı mevcut: **${ADMIN_TOKEN_PRESENT:-false}**"
            echo '- Custom domain hedefi: `alo186.com`'
            echo '- Canonical, sitemap, robots ve release kimliği apex origin üzerinde birleştirildi.'
            echo '- 40 yüksek niyetli rehbere 120 bağlamsal ürün kartı, üçlü güven kapısı ve açık satış ortaklığı bilgisi eklendi.'
            echo '- 44 px dokunma hedefi, görünür odak, taşma ve bilinen kontrast seçicileri son artifact katmanında sertleştirildi.'
            echo '- Cihaz hasarı başvurusu için 10 iş günü fail-closed koruması uygulandı.'
            if [ -n "$GA4_MEASUREMENT_ID" ]; then
              echo '- GA4 açık onay katmanı: **etkin**; etiket yalnız kullanıcı izninden sonra yüklenir.'
            else
              echo '- GA4 açık onay katmanı: **hazır fakat ALO186_GA4_MEASUREMENT_ID bekliyor**; canlı etikete ağ isteği gönderilmez.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout doğrulama araçları
        uses: actions/checkout@v4

      - name: Python doğrulama ortamı
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail-closed Pages yayın sonucu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python alo186/deployment/verify_live_origin.py \
            --origin https://alo186.com \
            --alias-origin https://www.alo186.com \
            --expected-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --github-token "$GITHUB_TOKEN" \
            --receipt /tmp/alo186-live-origin-receipt.json \
            --diagnostics /tmp/alo186-origin-diagnostics \
            --attempts 36 \
            --sleep-seconds 10
          python alo186/deployment/verify_contextual_affiliate_live_v177.py \
            --origin https://alo186.com \
            --receipt /tmp/alo186-v177-live-receipt.json \
            --diagnostics /tmp/alo186-v177-diagnostics \
            --attempts 36 \
            --sleep-seconds 10

      - name: Canlı yayın makbuzunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-full-live-receipt
          path: |
            /tmp/alo186-live-origin-receipt.json
            /tmp/alo186-v177-live-receipt.json
            /tmp/alo186-origin-diagnostics
            /tmp/alo186-v177-diagnostics
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 45
