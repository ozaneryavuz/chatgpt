name: ALO186 GitHub Pages — sunucusuz canlı yayın

on:
  push:
    branches: [main]
    paths:
      - 'alo186/**'
      - '.github/workflows/alo186-github-pages.yml'
  pull_request:
    paths:
      - 'alo186/**'
      - '.github/workflows/alo186-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('alo186-pages-pr-{0}', github.event.pull_request.number) || 'alo186-pages-production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      pages_ready: ${{ steps.pages_mode.outputs.pages_ready }}
      base_path: ${{ steps.pages_mode.outputs.base_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Kaynak güvenlik ve yayın sözleşmeleri
        shell: bash
        run: |
          set -euo pipefail
          node alo186/tests/test_portal_hardening.js
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_authority_content.js
          node alo186/hesaplama/teknik-urun-karsilastirma/test.js
          node alo186/tests/test_technical_shortlist_growth.js
          python alo186/tests/device_damage_deadline_guard.py
          python alo186/tests/test_github_pages_bootstrap.py
          python alo186/tests/test_pages_single_publisher.py
          python alo186/tests/test_live_quality_hardening.py
          python alo186/tests/test_live_domain_integration_manifest.py
          python alo186/tests/test_ga4_consent_integration.py
          python alo186/tests/test_contextual_affiliate_growth_v177.py
          python alo186/tests/test_affiliate_measurement_v211.py
          python alo186/tests/test_live_english_smoke_v2.py

      - name: Canonical statik siteyi oluştur
        shell: bash
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-canonical

      - name: Custom-domain ve github.io alt-yol modlarını birlikte test et
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'custom|' 'project|/chatgpt'; do
            name=${spec%%|*}
            base=${spec#*|}
            site="/tmp/alo186-pages-${name}"
            rm -rf "$site"
            cp -a /tmp/alo186-canonical "$site"
            python alo186/deployment/prepare_github_pages.py \
              --site "$site" \
              --base-path "$base" \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA"
            python alo186/deployment/inject_outcome_runtime.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/smoke_github_pages.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/inject_contextual_affiliate_growth_v177.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/inject_live_quality_hardening_v2.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/inject_home_affiliate_banner_v209.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/inject_affiliate_intent_router_v210.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/inject_ga4_consent.py \
              --site "$site" \
              --base-path "$base" \
              --measurement-id ""
            python alo186/deployment/inject_affiliate_measurement_v211.py \
              --site "$site" \
              --base-path "$base"
            node --check "$site/assets/affiliate-measurement-v211.js"
            python alo186/deployment/smoke_github_pages.py \
              --site "$site" \
              --base-path "$base"
            python alo186/deployment/guard_commerce_routes_v3.py \
              --site "$site"
          done

      - name: Pages yönetici tokenı durumunu belirle
        id: pages_admin
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PAGES_ADMIN_TOKEN: ${{ secrets.ALO186_PAGES_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$PAGES_ADMIN_TOKEN" ]; then
            echo 'token_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'token_present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Pages workflow modunu ve apex custom domainini otomatik hazırla
        id: pages_bootstrap
        if: github.event_name != 'pull_request' && steps.pages_admin.outputs.token_present == 'true'
        shell: bash
        env:
          ALO186_PAGES_ADMIN_TOKEN: ${{ secrets.ALO186_PAGES_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python alo186/deployment/bootstrap_github_pages.py \
            --repository "$GITHUB_REPOSITORY" \
            --custom-domain alo186.com \
            > /tmp/alo186-pages-bootstrap.json
          cat /tmp/alo186-pages-bootstrap.json

      - name: Pages bootstrap tanısını sakla
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: alo186-github-pages-bootstrap
          path: /tmp/alo186-pages-bootstrap.json
          if-no-files-found: ignore
          retention-days: 30

      - name: GitHub Pages ayarlarını oku
        id: pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Yönetici tokenı kullanıldıysa Pages ayarını zorunlu doğrula
        if: >-
          github.event_name != 'pull_request' &&
          steps.pages_admin.outputs.token_present == 'true' &&
          steps.pages.outcome != 'success'
        shell: bash
        run: |
          echo 'ALO186_PAGES_ADMIN_TOKEN ile bootstrap çalıştı fakat configure-pages doğrulaması başarısız.' >&2
          exit 1

      - name: Gerçek yayın modunu seç
        id: pages_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIGURE_OUTCOME: ${{ steps.pages.outcome }}
          CONFIGURED_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != 'pull_request' ] && [ "$CONFIGURE_OUTCOME" = 'success' ]; then
            printf 'pages_ready=true\n' >> "$GITHUB_OUTPUT"
            printf 'base_path=%s\n' "$CONFIGURED_BASE_PATH" >> "$GITHUB_OUTPUT"
          else
            printf 'pages_ready=false\n' >> "$GITHUB_OUTPUT"
            printf 'base_path=/chatgpt\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Yayınlanacak Pages artifactını hazırla ve son kalite katmanını uygula
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ steps.pages_mode.outputs.base_path }}
          ALO186_GA4_MEASUREMENT_ID: ${{ vars.ALO186_GA4_MEASUREMENT_ID || 'G-639TVHL0LC' }}
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-pages-site
          cp -a /tmp/alo186-canonical /tmp/alo186-pages-site
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH"
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH"
          python alo186/deployment/inject_contextual_affiliate_growth_v177.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH" \
            | tee /tmp/alo186-contextual-affiliate-v177.json
          python alo186/deployment/inject_live_quality_hardening_v2.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH" \
            | tee /tmp/alo186-live-quality-hardening.json
          python alo186/deployment/inject_home_affiliate_banner_v209.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH" \
            | tee /tmp/alo186-home-affiliate-v209.json
          python alo186/deployment/inject_affiliate_intent_router_v210.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH" \
            | tee /tmp/alo186-affiliate-intent-v210.json
          python alo186/deployment/inject_ga4_consent.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH" \
            --measurement-id "${ALO186_GA4_MEASUREMENT_ID:-}" \
            | tee /tmp/alo186-ga4-release.json
          python alo186/deployment/inject_affiliate_measurement_v211.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH" \
            | tee /tmp/alo186-affiliate-measurement-v211.json
          node --check /tmp/alo186-pages-site/assets/affiliate-measurement-v211.js
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-pages-site \
            --base-path "$PAGES_BASE_PATH"
          python alo186/deployment/guard_commerce_routes_v3.py \
            --site /tmp/alo186-pages-site \
            | tee /tmp/alo186-commerce-guard-v211.json

      - name: Pages önizleme artifactını sakla
        uses: actions/upload-artifact@v5
        with:
          name: alo186-github-pages-preview
          path: |
            /tmp/alo186-pages-site
            /tmp/alo186-contextual-affiliate-v177.json
            /tmp/alo186-live-quality-hardening.json
            /tmp/alo186-home-affiliate-v209.json
            /tmp/alo186-affiliate-intent-v210.json
            /tmp/alo186-ga4-release.json
            /tmp/alo186-affiliate-measurement-v211.json
            /tmp/alo186-commerce-guard-v211.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: GitHub Pages artifactını yükle
        if: github.event_name != 'pull_request' && steps.pages_mode.outputs.pages_ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/alo186-pages-site

      - name: Yayın özeti
        shell: bash
        env:
          PAGES_READY: ${{ steps.pages_mode.outputs.pages_ready }}
          BASE_PATH: ${{ steps.pages_mode.outputs.base_path }}
          ADMIN_TOKEN_PRESENT: ${{ steps.pages_admin.outputs.token_present }}
          GA4_MEASUREMENT_ID: ${{ vars.ALO186_GA4_MEASUREMENT_ID || 'G-639TVHL0LC' }}
        run: |
          {
            echo '## ALO186 GitHub Pages'
            echo
            echo "- Pages yapılandırması hazır: **$PAGES_READY**"
            echo "- Build base path: \`$BASE_PATH\`"
            echo "- Yönetici bootstrap tokenı mevcut: **${ADMIN_TOKEN_PRESENT:-false}**"
            echo '- Custom domain hedefi: `alo186.com`'
            echo '- Canonical, sitemap, robots ve release kimliği apex origin üzerinde birleştirildi.'
            echo '- 40 yüksek niyetli rehbere 120 bağlamsal ürün kartı, üçlü güven kapısı ve açık satış ortaklığı bilgisi eklendi.'
            echo '- Ana sayfa vitrini v209 ve görev bazlı ihtiyaç yönlendiricisi v210 tek yetkili Pages artifactına bağlandı.'
            echo '- Affiliate ölçüm v211; açık rıza, anonim ürün anahtarı, link türü, içerik kümesi ve yerleşim boyutlarıyla etkinleştirildi.'
            echo '- Ham hedef URL, Amazon arama sorgusu ve kullanıcı/cihaz kimliği analitiğe gönderilmez.'
            echo '- 44 px dokunma hedefi, görünür odak, taşma ve bilinen kontrast seçicileri son artifact katmanında sertleştirildi.'
            echo '- Cihaz hasarı başvurusu fail-closed güncel hukukî süre sözleşmesiyle doğrulandı.'
            if [ -n "$GA4_MEASUREMENT_ID" ]; then
              echo '- GA4 açık onay katmanı: **etkin**; etiket yalnız kullanıcı izninden sonra yüklenir.'
            else
              echo '- GA4 açık onay katmanı: **hazır fakat ALO186_GA4_MEASUREMENT_ID bekliyor**; canlı etikete ağ isteği gönderilmez.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout doğrulama araçları
        uses: actions/checkout@v6

      - name: Python doğrulama ortamı
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Pages deployment ve canlı origin yetkisini ayrıştır
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python alo186/deployment/verify_live_origin.py \
            --origin https://alo186.com \
            --alias-origin https://www.alo186.com \
            --expected-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --github-token "$GITHUB_TOKEN" \
            --receipt /tmp/alo186-live-origin-receipt.json \
            --diagnostics /tmp/alo186-origin-diagnostics \
            --attempts 6 \
            --sleep-seconds 5

          hosting_mode=$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/alo186-live-origin-receipt.json').read_text(encoding='utf-8'))
          print(str(payload.get('mode') or 'unknown'))
          PY
          )
          echo "Canlı origin hosting modu: $hosting_mode"

          if [ "$hosting_mode" = 'github-pages' ]; then
            python alo186/deployment/verify_contextual_affiliate_live_v177.py \
              --origin https://alo186.com \
              --receipt /tmp/alo186-v177-live-receipt.json \
              --diagnostics /tmp/alo186-v177-diagnostics \
              --attempts 18 \
              --sleep-seconds 10
            python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          origin = 'https://alo186.com/'
          headers = {'User-Agent': 'ALO186-release-verifier/211'}

          def fetch_json(url: str) -> dict:
              with urlopen(Request(url, headers=headers), timeout=30) as response:
                  value = json.loads(response.read().decode('utf-8'))
              if not isinstance(value, dict):
                  raise AssertionError(f'JSON kökü object değil: {url}')
              return value

          release = fetch_json(urljoin(origin, 'pages-release.json'))
          measurement = release.get('affiliateMeasurement') or {}
          assert measurement.get('version') == 211, measurement
          inventory = fetch_json(urljoin(origin, str(measurement.get('inventory') or 'affiliate-measurement-v211.json')))
          assert inventory.get('version') == 211
          assert inventory.get('events') == ['affiliate_page_view', 'affiliate_click']
          assert inventory.get('privacy', {}).get('rawDestinationUrlStored') is False
          assert inventory.get('privacy', {}).get('userIdentifierStored') is False
          asset_url = urljoin(origin, str(measurement.get('asset') or 'assets/affiliate-measurement-v211.js'))
          with urlopen(Request(asset_url, headers=headers), timeout=30) as response:
              asset = response.read().decode('utf-8')
          assert 'affiliate_page_view' in asset and 'affiliate_click' in asset
          receipt = {
              'ok': True,
              'status': 'verified-on-github-pages',
              'version': 211,
              'asset': asset_url,
              'inventorySummary': inventory.get('summary', {}),
              'rawDestinationUrlStored': False,
              'userIdentifierStored': False,
          }
          Path('/tmp/alo186-v211-live-receipt.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY
          else
            echo "::warning title=ALO186 hosting authority ayrımı::GitHub Pages deployment başarılı; alo186.com halen $hosting_mode tarafından servis ediliyor. Exact-commit/v177/v211 doğrulaması hosting-aware canlı workflow'a devredildi."
            HOSTING_MODE="$hosting_mode" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          common = {
              'ok': False,
              'status': 'deferred-external-live-authority',
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'hostingMode': os.environ['HOSTING_MODE'],
              'reason': 'GitHub Pages artifactı yayınlandı; alo186.com exact-commit yetkisi başka hosting yüzeyinde.',
          }
          Path('/tmp/alo186-v177-live-receipt.json').write_text(
              json.dumps({**common, 'version': 177}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('/tmp/alo186-v211-live-receipt.json').write_text(
              json.dumps({**common, 'version': 211}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(common, ensure_ascii=False, indent=2))
          PY
          fi

      - name: Canlı yayın makbuzunu sakla
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: alo186-full-live-receipt
          path: |
            /tmp/alo186-live-origin-receipt.json
            /tmp/alo186-v177-live-receipt.json
            /tmp/alo186-v211-live-receipt.json
            /tmp/alo186-origin-diagnostics
            /tmp/alo186-v177-diagnostics
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 45
