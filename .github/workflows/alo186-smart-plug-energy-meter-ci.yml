name: ALO186 Smart Plug Energy Meter CI

on:
  push:
    branches:
      - main
    paths:
      - 'alo186/hesaplama/akilli-priz-enerji-olcer-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - '.github/workflows/alo186-smart-plug-energy-meter-ci.yml'
  pull_request:
    paths:
      - 'alo186/hesaplama/akilli-priz-enerji-olcer-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - '.github/workflows/alo186-smart-plug-energy-meter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smart-plug-energy-meter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check alo186/hesaplama/akilli-priz-enerji-olcer-uygunluk/core.js
          node --check alo186/hesaplama/akilli-priz-enerji-olcer-uygunluk/app.js
          node --check alo186/hesaplama/akilli-priz-enerji-olcer-uygunluk/test.js
      - name: Calculation, safety and affiliate tests
        run: node alo186/hesaplama/akilli-priz-enerji-olcer-uygunluk/test.js
      - name: JSON-LD, sitemap and routing smoke test
        run: |
          python - <<'PY'
          import json, pathlib, re, xml.etree.ElementTree as ET
          html=pathlib.Path('alo186/hesaplama/akilli-priz-enerji-olcer-uygunluk/index.html').read_text()
          blocks=re.findall(r'<script type="application/ld\+json">(.*?)</script>',html,re.S)
          assert blocks
          for block in blocks: json.loads(block)
          ET.parse('alo186/sitemap.xml')
          manifest=json.loads(pathlib.Path('alo186/deployment/routing-manifest.json').read_text())
          assert manifest['version'] >= 20
          assert any(r['canonicalPath']=='/hesaplama/akilli-priz-enerji-olcer-uygunluk/' for r in manifest['routes'])
          center=pathlib.Path('alo186/hesaplama/index.html').read_text()
          assert './akilli-priz-enerji-olcer-uygunluk/' in center
          print('JSON-LD, sitemap, routing ve hesaplama merkezi doğrulandı.')
          PY