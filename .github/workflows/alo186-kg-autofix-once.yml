name: ALO186 KG route response tek seferlik düzeltme

on:
  push:
    branches: [feat/alo186-knowledge-graph-v1]
    paths:
      - '.github/workflows/alo186-kg-autofix-once.yml'
      - 'alo186/sureklilik-api/kg-autofix.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alo186-knowledge-graph-v1
          fetch-depth: 0
      - name: FastAPI 204 response rotalarını düzelt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('alo186/sureklilik-api/app/knowledge_graph.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from fastapi import APIRouter, Depends, HTTPException, Query, status',
              'from fastapi import APIRouter, Depends, HTTPException, Query, Response, status',
          )
          text = text.replace(
              '@router.delete("/entities/{entity_id}", status_code=status.HTTP_204_NO_CONTENT)\ndef retire_tenant_entity(',
              '@router.delete("/entities/{entity_id}", status_code=status.HTTP_204_NO_CONTENT, response_class=Response)\ndef retire_tenant_entity(',
          )
          text = text.replace(
              ') -> None:\n    entity = _tenant_entity(db, entity_id, context)',
              ') -> Response:\n    entity = _tenant_entity(db, entity_id, context)',
              1,
          )
          marker = '''    db.commit()\n\n\n@router.post("/sources", status_code=status.HTTP_201_CREATED)'''
          replacement = '''    db.commit()\n    return Response(status_code=status.HTTP_204_NO_CONTENT)\n\n\n@router.post("/sources", status_code=status.HTTP_201_CREATED)'''
          if marker not in text:
              raise SystemExit('Entity delete return marker bulunamadı.')
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              '@router.delete("/assertions/{assertion_id}", status_code=status.HTTP_204_NO_CONTENT)\ndef retire_tenant_assertion(',
              '@router.delete("/assertions/{assertion_id}", status_code=status.HTTP_204_NO_CONTENT, response_class=Response)\ndef retire_tenant_assertion(',
          )
          assertion_signature = ''') -> None:\n    assertion = _tenant_assertion(db, assertion_id, context)'''
          if assertion_signature not in text:
              raise SystemExit('Assertion delete signature bulunamadı.')
          text = text.replace(
              assertion_signature,
              ''') -> Response:\n    assertion = _tenant_assertion(db, assertion_id, context)''',
              1,
          )
          marker = '''    db.commit()\n\n\n@router.get("/entities/{entity_id}/neighbors")'''
          replacement = '''    db.commit()\n    return Response(status_code=status.HTTP_204_NO_CONTENT)\n\n\n@router.get("/entities/{entity_id}/neighbors")'''
          if marker not in text:
              raise SystemExit('Assertion delete return marker bulunamadı.')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile alo186/sureklilik-api/app/knowledge_graph.py
      - name: Değişikliği dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alo186/sureklilik-api/app/knowledge_graph.py
          if git diff --cached --quiet; then
            echo 'Değişiklik bulunmadı.'
          else
            git commit -m 'fix(alo186): Knowledge Graph 204 response rotalarını düzelt'
            git push origin HEAD:feat/alo186-knowledge-graph-v1
          fi
