name: ALO186 portal envanter test sözleşmelerini tek sefer güncelle

on:
  pull_request:
    branches: [main]
    paths:
      - 'alo186/index.html'
      - 'alo186/tests/**'
      - '.github/workflows/alo186-portal-inventory-test-autofix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/alo186-portal-inventory-drift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-portal-inventory-drift
          fetch-depth: 0

      - name: Eski sayısal envanter beklentilerini kalıcı sözleşmeye taşı
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in sorted(Path('alo186/tests').glob('*.js')):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('45 kaynak doğrulamalı rehber', 'kaynak doğrulamalı rehberler')
              updated = updated.replace('26 kişisel veri istemeyen araç', 'kişisel veri istemeyen araçlar')
              updated = updated.replace('Portal mevcut 45 kartı görünür göstermeli; yeni on sekiz rehber sitemap ve konu içi bağlantılarla yayınlanır.', 'Portal kaynak doğrulamalı rehber ailesini görünür göstermeli; routing ve sitemap tam makale envanterini doğrular.')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())
          if not changed:
              raise SystemExit('Güncellenecek eski sayısal test sözleşmesi bulunamadı.')
          print('\n'.join(changed))
          PY

          node alo186/tests/test_portal_inventory_claims.js
          node alo186/tests/test_portal_hardening.js
          node alo186/tests/test_authority_content.js

      - name: Tek seferlik workflowu kaldır ve değişiklikleri dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/alo186-portal-inventory-test-autofix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alo186/tests
          git commit -m 'test(alo186): envanter testlerini sayısal driftten ayır'
          git push origin HEAD:fix/alo186-portal-inventory-drift
