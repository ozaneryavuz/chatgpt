name: ALO186 buzdolabı dondurucu kesinti güvenliği v282

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-buzdolabi-derin-dondurucu-ne-kadar-dayanir/**'
      - 'alo186/hesaplama/buzdolabi-dondurucu-elektrik-kesintisi-gida-guvenligi-plani/**'
      - 'alo186/amazon-elektrik-urunleri/buzdolabi-dondurucu-termometre-soguk-zincir-secimi/**'
      - 'alo186/deployment/routing-overlays/growth-v282-cold-chain-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/cold-chain-outage-v282.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v282_cold_chain_outage.py'
      - '.github/workflows/alo186-growth-v282-cold-chain-outage.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-buzdolabi-derin-dondurucu-ne-kadar-dayanir/**'
      - 'alo186/hesaplama/buzdolabi-dondurucu-elektrik-kesintisi-gida-guvenligi-plani/**'
      - 'alo186/amazon-elektrik-urunleri/buzdolabi-dondurucu-termometre-soguk-zincir-secimi/**'
      - 'alo186/deployment/routing-overlays/growth-v282-cold-chain-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/cold-chain-outage-v282.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v282_cold_chain_outage.py'
      - '.github/workflows/alo186-growth-v282-cold-chain-outage.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v282-cold-chain-outage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Soğuk zincir arama niyeti, gizlilik ve ticari sınır
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v282_cold_chain_outage.py alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v282_cold_chain_outage.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/routing-overlays/growth-v282-cold-chain-outage.json >/dev/null
          python -m json.tool alo186/deployment/affiliate-category-decisions/cold-chain-outage-v282.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v282
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v282 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v282
          test -f /tmp/alo186-v282/haberler/elektrik-kesilince-buzdolabi-derin-dondurucu-ne-kadar-dayanir/index.html
          test -f /tmp/alo186-v282/hesaplama/buzdolabi-dondurucu-elektrik-kesintisi-gida-guvenligi-plani/index.html
          test -f /tmp/alo186-v282/amazon-elektrik-urunleri/buzdolabi-dondurucu-termometre-soguk-zincir-secimi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v282
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v282 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-sites-v282')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-buzdolabi-derin-dondurucu-ne-kadar-dayanir/',
              '/hesaplama/buzdolabi-dondurucu-elektrik-kesintisi-gida-guvenligi-plani/',
              '/amazon-elektrik-urunleri/buzdolabi-dondurucu-termometre-soguk-zincir-secimi/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for path in expected:
              assert not pages[path]['affiliate']['unsafeStaticLinks']
          assert pages['/amazon-elektrik-urunleri/buzdolabi-dondurucu-termometre-soguk-zincir-secimi/']['affiliate']['hasAffiliateLinks'] is False
          print(json.dumps({'ok': True, 'routes': sorted(expected), 'unsafeStaticLinks': 0}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v282 buzdolabı ve dondurucu kesinti güvenliği

          - Arama niyeti: elektrik kesilince buzdolabı / derin dondurucu kaç saat dayanır
          - Ücretsiz araç: süre, kapı, doluluk, sıcaklık ve buz kristali kararı
          - Mevcut termometre ve soğuk zincir hazırlığı yeterliyse: yeni ürün almayın
          - İlaç, bebek besini, tıbbi ve profesyonel soğuk zincirde: affiliate yolu kapalı
          - Affiliate: yalnız Amazon Türkiye; bağlantılar açıklama ve güven kapısından sonra dinamik açılır
          - Fiyat, stok, puan, yorum, teslimat, garanti, Offer ve AggregateRating: yok
          - 30/90/180 günlük tekrar ziyaret: yerel takvim dosyası
          EOF
