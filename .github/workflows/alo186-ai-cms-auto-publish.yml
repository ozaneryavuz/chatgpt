name: ALO186 AI CMS — kalite geçince otomatik yayımla

on:
  workflow_run:
    workflows:
      - ALO186 AI CMS — kalite ve yayın kapısı
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: alo186-ai-cms-auto-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Güvenli AI CMS PR'ına toplu yayın komutu ekle
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const fullName = `${owner}/${repo}`;
            const branch = run.head_branch || '';

            if (run.head_repository?.full_name !== fullName) {
              core.info('Fork veya farklı repository workflow koşusu; otomatik yayın kapalı.');
              return;
            }
            if (!/^(automation\/content-authority-|automation\/electrical-project-content-|ai-cms\/)/.test(branch)) {
              core.info(`İzin verilmeyen branch: ${branch}`);
              return;
            }

            const {data: associated} = await github.request(
              'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
              {owner, repo, commit_sha: run.head_sha, per_page: 100}
            );
            const candidates = associated.filter(pr =>
              pr.state === 'open' &&
              !pr.draft &&
              pr.base?.ref === 'main' &&
              pr.head?.ref === branch &&
              pr.head?.repo?.full_name === fullName &&
              pr.user?.login === owner
            );
            if (candidates.length !== 1) {
              core.info(`Tek güvenli açık PR bulunamadı: ${candidates.length}`);
              return;
            }

            const pr = candidates[0];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const allowed = [
              /^alo186\/ai-cms\/briefs\/[a-z0-9-]+\.json$/,
              /^alo186\/ai-cms\/content\/[a-z0-9-]+\.json$/,
              /^alo186\/ai-cms\/reviews\/[a-z0-9-]+\.md$/,
              /^alo186\/ai-cms\/previews\/[a-z0-9-]+\.html$/,
            ];
            const filenames = files.map(file => file.filename);
            const contentFiles = filenames.filter(name => /^alo186\/ai-cms\/content\/[a-z0-9-]+\.json$/.test(name));
            const forbidden = filenames.filter(name => !allowed.some(pattern => pattern.test(name)));
            if (!contentFiles.length || forbidden.length) {
              core.warning(`Otomatik yayın kapsamı reddedildi. content=${contentFiles.length}, forbidden=${forbidden.join(', ')}`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            if (comments.some(comment => (comment.body || '').trim() === '/cms publish-all')) {
              core.info('Toplu yayın komutu zaten mevcut.');
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: '/cms publish-all',
            });
            core.notice(`PR #${pr.number} kalite sonrası otomatik yayın hattına alındı.`);
