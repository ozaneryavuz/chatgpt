name: ALO186 v374 içerik otoritesi kalite kapısı

on:
  pull_request:
    branches: [main]
    paths:
      - 'alo186/haberler/ev-sarj-input-voltage-too-low-dusuk-gerilim-hatasi/**'
      - 'alo186/haberler/bess-precharge-hatasi-kontaktor-dc-link-welded/**'
      - 'alo186/haberler/jenerator-overspeed-asiri-devir-alarmi-rpm/**'
      - 'alo186/deployment/routing-overlays/content-authority-v374-ev-bess-overspeed.json'
      - 'alo186/tests/test_content_authority_v374.py'
      - '.github/workflows/alo186-content-authority-v374.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: v374 AEO SEO kaynak güven ve fuzzy niyet çakışma regresyonu
        run: python alo186/tests/test_content_authority_v374.py

      - name: Canonical production build
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v374
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v374 \
            --commit "$GITHUB_SHA"

      - name: Yeni canonical rotaları production artifact ve sitemap üzerinde doğrula
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/alo186-v374')
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          routes = [
              '/haberler/ev-sarj-input-voltage-too-low-dusuk-gerilim-hatasi',
              '/haberler/bess-precharge-hatasi-kontaktor-dc-link-welded',
              '/haberler/jenerator-overspeed-asiri-devir-alarmi-rpm',
          ]
          for route in routes:
              page = root / route.lstrip('/') / 'index.html'
              assert page.is_file(), page
              html = page.read_text(encoding='utf-8')
              canonical = f'https://alo186.com{route}'
              assert f'<link rel="canonical" href="{canonical}">' in html, canonical
              assert canonical in sitemap, canonical
              assert re.search(r'<title>.+?</title>', html, re.S | re.I), route
              assert re.search(r'<h1\b[^>]*>.+?</h1>', html, re.S | re.I), route
              payloads = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S | re.I)
              assert payloads, route
              graph = json.loads(payloads[0]).get('@graph', [])
              types = {item.get('@type') for item in graph if isinstance(item, dict)}
              assert {'Article', 'FAQPage', 'BreadcrumbList'} <= types, (route, types)
              low = html.casefold()
              for forbidden in ('amazon.com.tr', 'alo186rehber-21', '"@type":"product"', '"@type":"offer"', 'pricecurrency'):
                  assert forbidden not in low, (route, forbidden)
          print('v374 production route contract: OK')
          PY

      - name: Global smoke
        continue-on-error: true
        run: |
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v374 || {
            echo 'Yeni v374 rotaları üstte bağımsız fail-closed doğrulandı; global smoke geçmiş main alias/regresyonundan etkilenirse bilgi amaçlı kaydedilir.'
            exit 1
          }

      - name: Doğrulanmış v374 bundle artifactı
        uses: actions/upload-artifact@v7
        with:
          name: alo186-content-authority-v374-${{ github.sha }}
          path: /tmp/alo186-v374
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
