name: ALO186 commerce trust v212 persist source only

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/alo186-commerce-trust-v212-pr4.yml'

permissions:
  contents: write

concurrency:
  group: alo186-commerce-trust-v212-pr4-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  persist-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Doğrulanmış kaynak migrasyonu ve test
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('alo186/deployment/apply_commerce_trust_v212_migration.py')
          text = path.read_text(encoding='utf-8')
          old_open = "    path.write_text(r'''from __future__ import annotations"
          new_open = '    path.write_text(r"""from __future__ import annotations'
          old_close = "    print(\"ALO186 commerce trust v212: PASS\")\n''', encoding=\"utf-8\")"
          new_close = '    print("ALO186 commerce trust v212: PASS")\n""", encoding="utf-8")'
          if old_open in text:
              text = text.replace(old_open, new_open, 1)
          if old_close in text:
              text = text.replace(old_close, new_close, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python alo186/deployment/apply_commerce_trust_v212_migration.py
          git checkout -- .github/workflows/alo186-affiliate-measurement-v211.yml
          python -m py_compile alo186/deployment/guard_commerce_routes_v3.py alo186/tests/test_commerce_trust_v212.py
          python alo186/tests/test_commerce_trust_v212.py
          python alo186/tests/test_affiliate_measurement_v211.py
      - name: Yalnız kaynak değişikliklerini dala yaz
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm -f alo186/deployment/apply_commerce_trust_v212_migration.py
          find alo186 -type d -name __pycache__ -prune -exec rm -rf {} +
          find alo186 -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            alo186/amazon-elektrik-urunleri/index.html \
            alo186/amazon-elektrik-urunleri/akim-korumali-grup-priz-secimi/index.html \
            alo186/amazon-elektrik-urunleri/modem-mini-ups-secimi/index.html \
            alo186/amazon-elektrik-urunleri/acil-aydinlatma-duman-alarmi/index.html \
            alo186/deployment/guard_commerce_routes_v3.py \
            alo186/tests/test_commerce_trust_v212.py \
            alo186/deployment/apply_commerce_trust_v212_migration.py
          git diff --cached --quiet && exit 0
          git commit -m 'ALO186 ticari güven kapılarını v212 ile sağlamlaştır'
          git fetch origin "$HEAD_REF"
          git rebase "origin/$HEAD_REF"
          git push origin HEAD:"$HEAD_REF"
