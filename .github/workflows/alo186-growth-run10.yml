name: ALO186 güvenli ticari niyet büyümesi run10

on:
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/type-2-ev-sarj-kablosu-secimi/**'
      - 'alo186/amazon-elektrik-urunleri/ups-yedek-akusu-kartus-secimi/**'
      - 'alo186/amazon-elektrik-urunleri/priz-rcd-test-cihazi-secimi/**'
      - 'alo186/deployment/inject_growth_run10.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-overlays/growth-commercial-intent-run10.json'
      - 'alo186/tests/test_growth_run10.py'
      - '.github/workflows/alo186-growth-run10.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/type-2-ev-sarj-kablosu-secimi/**'
      - 'alo186/amazon-elektrik-urunleri/ups-yedek-akusu-kartus-secimi/**'
      - 'alo186/amazon-elektrik-urunleri/priz-rcd-test-cihazi-secimi/**'
      - 'alo186/deployment/inject_growth_run10.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-overlays/growth-commercial-intent-run10.json'
      - 'alo186/tests/test_growth_run10.py'
      - '.github/workflows/alo186-growth-run10.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-growth-run10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: AEO, SEO, kaynak ve ticari güven sözleşmeleri
        run: python alo186/tests/test_growth_run10.py

      - name: Python sözdizimi
        run: |
          python -m py_compile alo186/deployment/inject_growth_run10.py
          python -m py_compile alo186/deployment/inject_shortlist_growth.py

      - name: Mevcut güven, ticaret ve içerik regresyonları
        run: |
          python alo186/tests/test_content_intent_consolidation.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical üretim paketini oluştur
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-growth10-canonical --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-growth10-canonical

      - name: Custom-domain artifactı
        run: |
          cp -a /tmp/alo186-growth10-canonical /tmp/alo186-growth10-custom
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-growth10-custom --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-growth10-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-growth10-custom --base-path '' > /tmp/growth10-custom.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-growth10-custom --base-path ''

      - name: Project-path artifactı
        run: |
          cp -a /tmp/alo186-growth10-canonical /tmp/alo186-growth10-project
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-growth10-project --base-path '/chatgpt' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-growth10-project --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-growth10-project --base-path '/chatgpt' > /tmp/growth10-project.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-growth10-project --base-path '/chatgpt'

      - name: Artifact, sitemap, Teknik Arama ve dönüşüm kapıları
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          routes = {
              'ev_cable': '/amazon-elektrik-urunleri/type-2-ev-sarj-kablosu-secimi',
              'ups_battery': '/amazon-elektrik-urunleri/ups-yedek-akusu-kartus-secimi',
              'outlet_tester': '/amazon-elektrik-urunleri/priz-rcd-test-cihazi-secimi',
          }
          for root, prefix in [
              (Path('/tmp/alo186-growth10-custom'), ''),
              (Path('/tmp/alo186-growth10-project'), '/chatgpt'),
          ]:
              release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
              pages=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
              search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
              indexed={item['canonicalPath']:item for item in search['entries']}
              contract=release['growthRun10']
              assert contract['directAffiliateLinksAdded']==0
              assert contract['qualifiedAffiliateCategories']==['ev_cable']
              assert contract['professionalOnlyCategories']==['ups_battery','outlet_tester']
              assert contract['unverifiedCommercialFieldsUsed']==[]
              assert contract['noBuyOutcomePreserved'] is True
              assert contract['officialApprovalClaimed'] is False
              assert pages['growthRun10']['directAffiliateLinksAdded']==0
              sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
              for key, route in routes.items():
                  page=root/route.strip('/')/'index.html'
                  assert page.is_file(), page
                  html=page.read_text(encoding='utf-8')
                  assert f'https://www.alo186.com{route}' in html
                  assert 'application/ld+json' in html
                  assert 'amazon.com' not in html.lower() and 'amzn.' not in html.lower()
                  assert f'<loc>https://www.alo186.com{route}</loc>' in sitemap
                  assert route in indexed
                  assert indexed[route]['bucket']=='commercial-guide'
                  assert indexed[route]['url']==(prefix+route if prefix else route)
                  assert not any(field in indexed[route] for field in ['price','stock','rating','seller','warranty','asin'])
              hub=(root/'amazon-elektrik-urunleri/index.html').read_text(encoding='utf-8')
              center=(root/'akilli-urun-secimi/index.html').read_text(encoding='utf-8')
              portal=(root/'elektrik-portali/index.html').read_text(encoding='utf-8')
              assert '10 özel rehber' in hub
              assert 'data-alo186-growth-run10-hub="true"' in hub
              assert 'data-alo186-growth-run10-center="true"' in center
              assert 'data-alo186-growth-run10-journey="true"' in portal
              ev=(root/routes['ev_cable'].strip('/')/'index.html').read_text(encoding='utf-8').lower()
              ups=(root/routes['ups_battery'].strip('/')/'index.html').read_text(encoding='utf-8').lower()
              outlet=(root/routes['outlet_tester'].strip('/')/'index.html').read_text(encoding='utf-8').lower()
              assert 'amazon satış ortaklığı' in ev
              assert 'doğrudan amazon veya mağaza bağlantısı içermez' in ups
              assert 'doğrudan amazon veya mağaza bağlantısı içermez' in outlet
          PY

      - name: Doğrulanmış yayın artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-commercial-intent-growth-run10
          path: /tmp/alo186-growth10-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
