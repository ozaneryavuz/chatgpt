      - "alo186/tests/test_home_alarm_continuity_growth_v182.py"
      - ".github/workflows/alo186-home-alarm-continuity-growth-v182.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python alo186/tests/test_home_alarm_continuity_growth_v182.py
