name: ALO186 home alarm continuity growth v182

on:
  pull_request:
    paths:
      - "alo186/hesaplama/duman-karbonmonoksit-alarmi-pil-omur-test-karari/**"
      - "alo186/amazon-elektrik-urunleri/ev-alarm-pil-test-urun-secici/**"
      - "alo186/sektor-rehberi/ev-alarm-30-180-gun-test-merkezi/**"
      - "alo186/deployment/routing-overlays/182-home-alarm-continuity-growth.json"
      - "alo186/audits/home-alarm-continuity-growth-v182-2026-08-01.md"
      - "alo186/tests/test_home_alarm_continuity_growth_v182.py"
      - ".github/workflows/alo186-home-alarm-continuity-growth-v182.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/duman-karbonmonoksit-alarmi-pil-omur-test-karari/**"
      - "alo186/amazon-elektrik-urunleri/ev-alarm-pil-test-urun-secici/**"
      - "alo186/sektor-rehberi/ev-alarm-30-180-gun-test-merkezi/**"
