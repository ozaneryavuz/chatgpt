name: ALO186 ChatGPT Sites aktarım paketi

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/**'
      - '.github/workflows/alo186-chatgpt-sites-export.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/**'
      - '.github/workflows/alo186-chatgpt-sites-export.yml'
  schedule:
    # Europe/Istanbul UTC+3: her pazartesi 10:20.
    - cron: '20 7 * * 1'

permissions:
  contents: read

concurrency:
  group: alo186-chatgpt-sites-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Kaynak, manifest, kritik bilgi ve politika doğrulaması
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/deployment/export_chatgpt_sites_bundle.py \
            alo186/deployment/export_chatgpt_sites_bundle_v2.py \
            alo186/deployment/export_chatgpt_sites_bundle_v3.py \
            alo186/tests/test_growth_trust_v258.py
          python -m json.tool alo186/deployment/chatgpt-sites-export-policy.json >/dev/null
          python -m json.tool alo186/sites-sync/sites-source-manifest.json >/dev/null
          python -m json.tool alo186/growth/critical-claims-v258.json >/dev/null
          test -s alo186/sites-sync/sites-import-prompt.md
          node --check alo186/hesaplama/kesinti-gunlugu/damage-deadline-v258.js
          python alo186/tests/test_chatgpt_sites_export.py
          python alo186/tests/test_growth_trust_v258.py

      - name: ChatGPT Sites aktarım paketini üret
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-chatgpt-sites /tmp/alo186-chatgpt-sites.zip
          python alo186/deployment/export_chatgpt_sites_bundle_v3.py \
            --output /tmp/alo186-chatgpt-sites \
            --commit "$GITHUB_SHA"

      - name: Sites kaynak otoritesini ve bütünlük makbuzunu ekle
        run: |
          set -euo pipefail
          cp alo186/sites-sync/sites-source-manifest.json \
            /tmp/alo186-chatgpt-sites/sites-source-manifest.json
          cp alo186/sites-sync/sites-import-prompt.md \
            /tmp/alo186-chatgpt-sites/sites-import-prompt.md
          cp alo186/sites-sync/README.md \
            /tmp/alo186-chatgpt-sites/SOURCE-AUTHORITY.md
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json

          root = Path('/tmp/alo186-chatgpt-sites')
          stats = json.loads((root / 'data/export-stats.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'sites-source-manifest.json').read_text(encoding='utf-8'))
          policy = json.loads(Path('alo186/deployment/chatgpt-sites-export-policy.json').read_text(encoding='utf-8'))
          sites_import = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          claims = json.loads((root / 'data/critical-claims.json').read_text(encoding='utf-8'))
          action = json.loads((root / 'data/growth-action-v258.json').read_text(encoding='utf-8'))

          assert stats['provincePages'] == 81
          assert stats['companyPages'] == 21
          assert manifest['target'] == 'chatgpt-sites'
          assert manifest['siteSlug'] == 'alo186'
          assert manifest['canonicalHost'] == 'https://alo186.com'
          assert policy['targetPlatform'] == 'ChatGPT Sites'
          assert policy['sourceAuthorityManifest'] == 'alo186/sites-sync/sites-source-manifest.json'
          assert policy['migrationRules']['doNotChangeDns'] is True
          assert policy['migrationRules']['doNotAttachCustomDomainToGitHubPages'] is True
          assert policy['migrationRules']['undocumentedSitesApiAllowed'] is False
          assert sites_import['exporterVersion'] == 3
          assert sites_import['criticalClaimsVersion'] == 258
          assert claims['verifiedAt'] == '2026-08-04'
          assert len(claims['claims']) == 3
          assert action['affiliateLinksAdded'] == 0
          assert action['commercialFieldsPublished'] == []
          assert action['officialInstitutionImpressionCreated'] is False

          files = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name in {'source-integrity.json', 'source-authority.json'}:
                  continue
              files.append({
                  'path': path.relative_to(root).as_posix(),
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'bytes': path.stat().st_size,
              })
          digest = hashlib.sha256(
              json.dumps(files, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          ).hexdigest()
          integrity = {
              'schemaVersion': 1,
              'algorithm': 'SHA-256',
              'sourceCommit': '${{ github.sha }}',
              'fileCount': len(files),
              'packageDigest': digest,
              'files': files,
          }
          authority = {
              'schemaVersion': 1,
              'target': 'chatgpt-sites',
              'siteSlug': 'alo186',
              'canonicalHost': 'https://alo186.com',
              'sourceCommit': '${{ github.sha }}',
              'generatedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'packageDigest': digest,
              'livePresentationAndPublishing': 'ChatGPT Sites',
              'contentSourceQualityAndRollback': 'GitHub',
              'criticalClaimsVersion': 258,
              'dnsChanged': False,
              'githubPagesCustomDomainEnabled': False,
              'liveSitesMutationPerformedByWorkflow': False,
              'applyWith': 'sites-import-prompt.md in an explicitly connected @Sites session',
          }
          (root / 'data/source-integrity.json').write_text(
              json.dumps(integrity, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          (root / 'data/source-authority.json').write_text(
              json.dumps(authority, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(authority, ensure_ascii=False, indent=2))
          PY

      - name: ZIP paketini oluştur
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          shutil.make_archive('/tmp/alo186-chatgpt-sites', 'zip', '/tmp', 'alo186-chatgpt-sites')
          archive = Path('/tmp/alo186-chatgpt-sites.zip')
          assert archive.is_file() and archive.stat().st_size > 0
          PY

      - name: Paket özetini yaz
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-chatgpt-sites')
          data = json.loads((root / 'data/export-stats.json').read_text(encoding='utf-8'))
          authority = json.loads((root / 'data/source-authority.json').read_text(encoding='utf-8'))
          action = json.loads((root / 'data/growth-action-v258.json').read_text(encoding='utf-8'))
          print('# ALO186 → ChatGPT Sites aktarım paketi')
          print()
          print(f"- Kaynak commit: `{authority['sourceCommit']}`")
          print(f"- Paket digest: `{authority['packageDigest']}`")
          print(f"- Kritik bilgi sürümü: **{authority['criticalClaimsVersion']}**")
          print(f"- Aktarıma hazır sayfa: **{data['importReady']}**")
          print(f"- İnceleme kuyruğu: **{data['reviewOnly']}**")
          print(f"- İl sayfası: **{data['provincePages']}**")
          print(f"- Dağıtım şirketi sayfası: **{data['companyPages']}**")
          print(f"- Interaktif araç: **{data['interactiveTools']}**")
          print(f"- Teknik makale: **{data['technicalArticles']}**")
          print(f"- Affiliate rehberi: **{data['affiliateGuides']}**")
          print(f"- Redirect: **{data['redirectCount']}**")
          print()
          print('## Bu çalıştırmanın üç güven ve büyüme aksiyonu')
          print()
          for item in action['actions']:
              print(f"{item['priority']}. {item['action']}")
          print()
          print('- Canlı otorite: **ChatGPT Sites**')
          print('- DNS / GitHub Pages özel alan adı değişikliği: **yok**')
          print('- Yeni affiliate bağlantısı: **yok**')
          print('- Fiyat, stok, puan veya garanti: **yok**')
          print('- Artifact içi uygulama talimatı: `sites-import-prompt.md`')
          print('- Paket kendi başına canlı mutasyon yapmaz; yayın makbuzu @Sites uygulamasından sonra oluşur.')
          PY

      - name: ChatGPT Sites aktarım artifactını yükle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-chatgpt-sites-import-${{ github.sha }}
          path: |
            /tmp/alo186-chatgpt-sites
            /tmp/alo186-chatgpt-sites.zip
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
