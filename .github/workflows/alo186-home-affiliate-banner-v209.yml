name: ALO186 homepage affiliate banner v209

on:
  pull_request:
    paths:
      - 'alo186/deployment/inject_home_affiliate_banner_v209.py'
      - 'alo186/tests/test_home_affiliate_banner_v209.py'
      - '.github/workflows/alo186-home-affiliate-banner-v209.yml'
      - '.github/workflows/alo186-github-pages.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/deployment/inject_home_affiliate_banner_v209.py'
      - 'alo186/tests/test_home_affiliate_banner_v209.py'
      - '.github/workflows/alo186-home-affiliate-banner-v209.yml'
      - '.github/workflows/alo186-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-home-affiliate-v209-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Python ve fail-closed sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/deployment/inject_home_affiliate_banner_v209.py \
            alo186/tests/test_home_affiliate_banner_v209.py
          python alo186/tests/test_home_affiliate_banner_v209.py
      - name: Canonical yayıncı entegrasyonu
        run: |
          set -euo pipefail
          grep -q 'inject_home_affiliate_banner_v209.py' .github/workflows/alo186-github-pages.yml
          ! grep -q 'actions/deploy-pages' .github/workflows/alo186-home-affiliate-banner-v209.yml
          ! grep -q 'actions/upload-pages-artifact' .github/workflows/alo186-home-affiliate-banner-v209.yml
