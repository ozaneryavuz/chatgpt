name: ALO186 hesaplayıcı kalite kontrolü

on:
  push:
    branches: [main, feat/alo186-kullanici-fayda-v1, 'feature/**', 'growth/**']
    paths:
      - 'alo186/hesaplama/**'
      - 'alo186/tests/**'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - 'alo186/urun-eslestirme/**'
      - '.github/workflows/alo186-calculators-ci.yml'
  pull_request:
    paths:
      - 'alo186/hesaplama/**'
      - 'alo186/tests/**'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - 'alo186/urun-eslestirme/**'
      - '.github/workflows/alo186-calculators-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hesap motoru testleri
        run: node alo186/tests/test_calc_core.js
      - name: Modül senaryo ve yayın sözleşmesi testleri
        shell: bash
        run: |
          set -euo pipefail
          node alo186/hesaplama/parafudr-risk-testi/test.js
          node alo186/hesaplama/jenerator-gucu-secimi/test.js
          node alo186/hesaplama/ev-sarj-uygunluk/test.js
          node alo186/hesaplama/kesinti-gunlugu/test.js
          node alo186/hesaplama/inverter-uygunluk/test.js
          node alo186/hesaplama/ekipman-bakim-plani/test.js
      - name: Kesinti günlüğü güven ve veri minimizasyonu sözleşmesi
        shell: bash
        run: |
          set -euo pipefail
          file='alo186/hesaplama/kesinti-gunlugu/index.html'
          grep -q 'Resmî kayıt değildir' "$file"
          grep -q 'Reklam / satış ortaklığı açıklaması' "$file"
          grep -q 'Ticari ürün yönlendirmesi kapatıldı' "$file"
          grep -q 'https://www.epdk.gov.tr/' "$file"
          grep -q 'https://www.alo186.com/edas-bul' "$file"
          grep -q 'kesinti-gunlugu' alo186/deployment/routing-manifest.json
          grep -q 'hesaplama/kesinti-gunlugu/' alo186/sitemap.xml
          if grep -Eqi 'type="(email|tel|text)"|name="(address|phone|email|subscription|tc)' "$file"; then
            echo 'Kesinti günlüğünde kişisel veri veya serbest metin alanı bulundu.' >&2
            exit 1
          fi
          if grep -Eqi 'amazon\.(com\.tr|com)/' "$file"; then
            echo 'Kesinti günlüğünde doğrudan Amazon bağlantısı bulundu.' >&2
            exit 1
          fi
      - name: Ekipman bakım planı güven ve affiliate sözleşmesi
        shell: bash
        run: |
          set -euo pipefail
          file='alo186/hesaplama/ekipman-bakim-plani/index.html'
          grep -q 'Hatırlatma aracıdır; bakım talimatı değildir' "$file"
          grep -q 'Normal sonuçta satış yok' "$file"
          grep -q 'Reklam / satış ortaklığı açıklaması' "$file"
          grep -q 'ALO186 herhangi bir markanın temsilcisi değildir' "$file"
          grep -q 'ekipman-bakim-plani' alo186/deployment/routing-manifest.json
          grep -q 'hesaplama/ekipman-bakim-plani/' alo186/sitemap.xml
          if grep -Eqi 'type="(email|tel|text)"|name="(address|phone|email|subscription|serial|model|note)' "$file"; then
            echo 'Ekipman bakım planında kişisel veri, seri/model veya serbest metin alanı bulundu.' >&2
            exit 1
          fi
          if grep -Eqi 'amazon\.(com\.tr|com)/' "$file"; then
            echo 'Ekipman bakım planında doğrudan Amazon bağlantısı bulundu.' >&2
            exit 1
          fi
      - name: HTML temel kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            grep -qi '<!doctype html>' "$file"
            grep -qi '<title>' "$file"
            grep -qi 'meta name="description"' "$file"
            grep -qi 'rel="canonical"' "$file"
          done < <(find alo186/hesaplama -name '*.html' -type f | sort)
      - name: JavaScript sözdizimi
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find alo186/hesaplama -name '*.js' -type f | sort)