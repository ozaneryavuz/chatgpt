name: ALO186 aquarium outage growth v167

on:
  pull_request:
    paths:
      - "alo186/hesaplama/akvaryum-elektrik-kesintisi-oksijen-filtre-guvenligi/**"
      - "alo186/hesaplama/akvaryum-hava-motoru-yedek-guc-w-wh-sure-uygunlugu/**"
      - "alo186/sektor-rehberi/akvaryum-elektrik-kesintisi-tekrar-test-merkezi/**"
      - "alo186/deployment/routing-overlays/167-aquarium-outage-growth.json"
      - "alo186/audits/aquarium-outage-growth-v167-2026-08-01.md"
      - "alo186/tests/test_aquarium_outage_growth_v167.py"
      - ".github/workflows/alo186-aquarium-outage-growth-v167.yml"
  push:
    branches: [main]
    paths:
