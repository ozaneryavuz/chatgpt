name: ALO186 voltage sag power quality v383

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/evde-voltaj-dusuyor-isiklar-karariyor-ne-yapmali/**'
      - 'alo186/hesaplama/ev-voltaj-dusmesi-dalgalanma-belirti-ayirici/**'
      - 'alo186/sektor-rehberi/otel-isletme-gerilim-dusmesi-guc-kalitesi-kabul/**'
      - 'alo186/deployment/routing-overlays/voltage-sag-v383.json'
      - 'alo186/deployment/affiliate-category-decisions/voltage-sag-v383.json'
      - 'alo186/tests/test_voltage_sag_v383.py'
      - '.github/workflows/alo186-voltage-sag-v383.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/evde-voltaj-dusuyor-isiklar-karariyor-ne-yapmali/**'
      - 'alo186/hesaplama/ev-voltaj-dusmesi-dalgalanma-belirti-ayirici/**'
      - 'alo186/sektor-rehberi/otel-isletme-gerilim-dusmesi-guc-kalitesi-kabul/**'
      - 'alo186/deployment/routing-overlays/voltage-sag-v383.json'
      - 'alo186/deployment/affiliate-category-decisions/voltage-sag-v383.json'
      - 'alo186/tests/test_voltage_sag_v383.py'
      - '.github/workflows/alo186-voltage-sag-v383.yml'

permissions:
  contents: read

concurrency:
  group: alo186-voltage-sag-v383-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Voltage sag trust privacy and no-commerce checks
        run: python alo186/tests/test_voltage_sag_v383.py
      - name: Global content intent collision guard
        run: python alo186/tests/test_content_intent_consolidation.py
      - name: Canonical production build and smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-voltage-sag-v383
          python alo186/deployment/build_static_site.py --output /tmp/alo186-voltage-sag-v383 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-voltage-sag-v383
      - name: Verify routes sitemap and commercial closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-voltage-sag-v383')
          routes = [
              '/haberler/evde-voltaj-dusuyor-isiklar-karariyor-ne-yapmali/',
              '/hesaplama/ev-voltaj-dusmesi-dalgalanma-belirti-ayirici/',
              '/sektor-rehberi/otel-isletme-gerilim-dusmesi-guc-kalitesi-kabul/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 383
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              html = page.read_text(encoding='utf-8').lower()
              assert f'https://alo186.com{route}' in sitemap
              assert 'amazon.com.tr' not in html
              assert 'amzn.to' not in html
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes, 'merchantLinks': 0})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-voltage-sag-v383-${{ github.sha }}
          path: /tmp/alo186-voltage-sag-v383
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
