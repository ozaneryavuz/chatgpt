name: ALO186 CPAP elektrik kesintisi v204

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/cpap-elektrik-kesintisi-batarya-calisma-suresi/**'
      - 'alo186/amazon-elektrik-urunleri/cpap-yedek-guc-uygunluk-secici/**'
      - 'alo186/sektor-rehberi/cpap-elektrik-kesintisi-30-90-gun-hazirlik-merkezi/**'
      - 'alo186/audits/cpap-outage-growth-v204-2026-08-02.md'
      - 'alo186/deployment/routing-overlays/204-cpap-outage-growth.json'
      - 'alo186/tests/test_cpap_outage_growth_v204.py'
      - '.github/workflows/alo186-cpap-outage-v204.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/cpap-elektrik-kesintisi-batarya-calisma-suresi/**'
      - 'alo186/amazon-elektrik-urunleri/cpap-yedek-guc-uygunluk-secici/**'
      - 'alo186/sektor-rehberi/cpap-elektrik-kesintisi-30-90-gun-hazirlik-merkezi/**'
      - 'alo186/audits/cpap-outage-growth-v204-2026-08-02.md'
      - 'alo186/deployment/routing-overlays/204-cpap-outage-growth.json'
      - 'alo186/tests/test_cpap_outage_growth_v204.py'
      - '.github/workflows/alo186-cpap-outage-v204.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Fail-closed CPAP güven ve ticari sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_cpap_outage_growth_v204.py
          python alo186/tests/test_cpap_outage_growth_v204.py
      - name: Sayfa JavaScript sözdizimi
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          pages = [
              Path('alo186/hesaplama/cpap-elektrik-kesintisi-batarya-calisma-suresi/index.html'),
              Path('alo186/amazon-elektrik-urunleri/cpap-yedek-guc-uygunluk-secici/index.html'),
              Path('alo186/sektor-rehberi/cpap-elektrik-kesintisi-30-90-gun-hazirlik-merkezi/index.html'),
          ]
          for page in pages:
              html = page.read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?![^>]*application/ld\+json)[^>]*>(.*?)</script>', html, re.S | re.I)
              assert scripts, f'javascript missing: {page}'
              for index, script in enumerate(scripts):
                  target = Path(tempfile.gettempdir()) / f'{page.parent.name}-{index}.js'
                  target.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(target)], check=True)
          PY
      - name: Routing overlay JSON
        run: python -m json.tool alo186/deployment/routing-overlays/204-cpap-outage-growth.json >/dev/null
