name: ALO186 commerce trust v212 migration

on:
  push:
    branches:
      - agent/affiliate-measurement-v211
    paths:
      - '.github/workflows/alo186-commerce-trust-v212-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alo186-commerce-trust-v212-migration
  cancel-in-progress: false

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/affiliate-measurement-v211
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Ticari güven sözleşmesini kaynakta düzelt
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          hub = root / 'alo186/amazon-elektrik-urunleri/index.html'
          text = hub.read_text(encoding='utf-8')
          old = 'https://alo186.com/amazon-elektrik-urunleri/'
          new = 'https://alo186.com/amazon-elektrik-urunleri'
          if old not in text:
              raise SystemExit('Ürün merkezi canonical kaynağı beklenen biçimde bulunamadı')
          hub.write_text(text.replace(old, new), encoding='utf-8')

          targets = {
              'akim-korumali-grup-priz-secimi': 'surge-strip',
              'modem-mini-ups-secimi': 'mini-ups',
              'acil-aydinlatma-duman-alarmi': 'safety-lighting',
          }
          trust = (
              '<div class="trust-boundary" data-alo186-commerce-trust-v212="true">'
              '<strong>Satın almama ve bağımsızlık sınırı:</strong> '
              'Mevcut güvenli ürün ihtiyacınızı karşılıyorsa yeni ürün almayın. '
              'ALO186 bağımsız bilgi platformudur; EDAŞ, kamu kurumu, üretici veya ürün satıcısı değildir.'
              '</div>'
          )
          for slug in targets:
              path = root / 'alo186/amazon-elektrik-urunleri' / slug / 'index.html'
              html = path.read_text(encoding='utf-8')
              html = html.replace('https://www.alo186.com', 'https://alo186.com')
              if 'data-alo186-commerce-trust-v212="true"' not in html:
                  marker = '<div class="affiliate-disclosure">'
                  start = html.find(marker)
                  if start < 0:
                      raise SystemExit(f'{slug}: affiliate açıklaması bulunamadı')
                  end = html.find('</div>', start)
                  if end < 0:
                      raise SystemExit(f'{slug}: affiliate açıklaması kapanışı bulunamadı')
                  end += len('</div>')
                  html = html[:end] + '\n  ' + trust + html[end:]
              path.write_text(html, encoding='utf-8')

          guard = root / 'alo186/deployment/guard_commerce_routes_v3.py'
          code = guard.read_text(encoding='utf-8')
          sentinel = '# V2\'nin ticari sayfa, hizmet, katalog, canonical ve rapor sözleşmeleri aynen\n'
          if sentinel not in code:
              raise SystemExit('guard v3 ekleme noktası bulunamadı')
          if '_trusted_closed_choice_router' not in code:
              addition = r'''
# Ürün merkezindeki v210 yönlendiricisi kişisel veri istemeyen üç kapalı
# seçimden oluşur. V2'nin bütün <form> etiketlerini kişisel veri formu sayan
# eski kontrolü yalnız bu kesin sözleşme için daraltılır; metin, e-posta,
# telefon, adres, dosya veya serbest giriş alanı eklenirse kapı yeniden kapanır.
_original_validate_commercial_pages = v2.validate_commercial_pages


def _trusted_closed_choice_router(site: Path) -> bool:
    path = v2.route_file(site, "/amazon-elektrik-urunleri")
    if not path.is_file():
        return False
    html = path.read_text(encoding="utf-8", errors="ignore")
    if 'data-alo186-affiliate-intent-v210="true"' not in html:
        return False
    forms = re.findall(r"<form\b(?P<attrs>[^>]*)>(?P<body>.*?)</form>", html, re.I | re.S)
    if len(forms) != 1:
        return False
    attrs, body = forms[0]
    if "data-affiliate-intent-form" not in attrs:
        return False
    if re.search(r"<(?:input|textarea)\b", body, re.I):
        return False
    if re.search(r"\b(?:email|tel|phone|address|name|surname|file|location|message)\b", body, re.I):
        return False
    names = re.findall(r"<select\b[^>]*\bname=[\"']([^\"']+)[\"']", body, re.I)
    return names == ["need", "duration", "status"]


def validate_commercial_pages(site: Path) -> tuple[list[str], dict]:
    errors, stats = _original_validate_commercial_pages(site)
    if _trusted_closed_choice_router(site):
        blocked = "/amazon-elektrik-urunleri: ticari içerik sayfası kişisel veri formu içermemeli"
        errors = [error for error in errors if error != blocked]
    return errors, stats


v2.validate_commercial_pages = validate_commercial_pages

'''
              code = code.replace(sentinel, addition + sentinel, 1)
          guard.write_text(code, encoding='utf-8')

          test = root / 'alo186/tests/test_commerce_trust_v212.py'
          test.write_text(r'''from __future__ import annotations

import sys
import tempfile
from pathlib import Path

ROOT = Path(__file__).resolve().parents[2]
sys.path.insert(0, str(ROOT / "alo186" / "deployment"))
import guard_commerce_routes_v3 as guard  # noqa: E402


def test_source_contract() -> None:
    hub = (ROOT / "alo186/amazon-elektrik-urunleri/index.html").read_text(encoding="utf-8")
    assert 'rel="canonical" href="https://alo186.com/amazon-elektrik-urunleri"' in hub
    for slug in (
        "akim-korumali-grup-priz-secimi",
        "modem-mini-ups-secimi",
        "acil-aydinlatma-duman-alarmi",
    ):
        text = (ROOT / "alo186/amazon-elektrik-urunleri" / slug / "index.html").read_text(encoding="utf-8")
        assert "https://www.alo186.com" not in text
        assert "Mevcut güvenli ürün ihtiyacınızı karşılıyorsa yeni ürün almayın" in text
        assert "ALO186 bağımsız bilgi platformudur" in text
        assert "ürün satıcısı değildir" in text


def test_closed_choice_form_exception_is_fail_closed() -> None:
    with tempfile.TemporaryDirectory() as tmp:
        page = Path(tmp) / "amazon-elektrik-urunleri/index.html"
        page.parent.mkdir(parents=True)
        page.write_text('''<section data-alo186-affiliate-intent-v210="true"><form data-affiliate-intent-form><select name="need"></select><select name="duration"></select><select name="status"></select></form></section>''', encoding="utf-8")
        assert guard._trusted_closed_choice_router(Path(tmp)) is True
        page.write_text('''<section data-alo186-affiliate-intent-v210="true"><form data-affiliate-intent-form><select name="need"></select><select name="duration"></select><select name="status"></select><input type="email"></form></section>''', encoding="utf-8")
        assert guard._trusted_closed_choice_router(Path(tmp)) is False


if __name__ == "__main__":
    test_source_contract()
    test_closed_choice_form_exception_is_fail_closed()
    print("ALO186 commerce trust v212: PASS")
''', encoding='utf-8')

          workflow = root / '.github/workflows/alo186-affiliate-measurement-v211.yml'
          yaml = workflow.read_text(encoding='utf-8')
          needle = '          python alo186/tests/test_affiliate_measurement_v211.py\n'
          if 'test_commerce_trust_v212.py' not in yaml:
              if needle not in yaml:
                  raise SystemExit('v211 test ekleme noktası bulunamadı')
              yaml = yaml.replace(needle, needle + '          python alo186/tests/test_commerce_trust_v212.py\n', 1)
          workflow.write_text(yaml, encoding='utf-8')
          PY
      - name: Hedefli ve tam artifact doğrulaması
        env:
          GA4: G-639TVHL0LC
        run: |
          set -euo pipefail
          python -m py_compile alo186/deployment/guard_commerce_routes_v3.py alo186/tests/test_commerce_trust_v212.py
          python alo186/tests/test_commerce_trust_v212.py
          python alo186/tests/test_affiliate_measurement_v211.py
          SITE=/tmp/alo186-commerce-trust-v212
          rm -rf "$SITE"
          python alo186/deployment/build_static_site.py --output "$SITE" --commit "$GITHUB_SHA"
          python alo186/deployment/prepare_github_pages.py --site "$SITE" --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_contextual_affiliate_v176.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_home_affiliate_banner_v209.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_affiliate_intent_router_v210.py --site "$SITE" --base-path ''
          python alo186/deployment/inject_ga4_consent.py --site "$SITE" --base-path '' --measurement-id "$GA4"
          python alo186/deployment/inject_affiliate_measurement_v211.py --site "$SITE" --base-path ''
          node --check "$SITE/assets/affiliate-measurement-v211.js"
          python alo186/deployment/smoke_github_pages.py --site "$SITE" --base-path ''
          python alo186/deployment/guard_commerce_routes_v3.py --site "$SITE"
      - name: Doğrulanmış değişiklikleri dala kaydet
        run: |
          set -euo pipefail
          rm -f .github/workflows/alo186-commerce-trust-v212-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'ALO186 ticari güven kapılarını v212 ile sağlamlaştır'
          git push origin HEAD:agent/affiliate-measurement-v211
