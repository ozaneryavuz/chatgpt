name: ALO186 production infra v2 main sync once

on:
  push:
    branches: [ops/alo186-production-infra-v2-main-20260728]
    paths:
      - '.github/workflows/alo186-v2-sync-main-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/alo186-production-infra-v2-main-20260728
          fetch-depth: 0
      - name: Güncel main dalını birleştir
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/alo186-v2-sync-main-once.yml
          git commit -m 'chore(alo186): production infra v2 dalını güncel main ile senkronize et'
          git push origin HEAD:ops/alo186-production-infra-v2-main-20260728
