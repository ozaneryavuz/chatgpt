name: ALO186 drill panel branch main sync once

on:
  push:
    branches: [fix/alo186-drill-panel-handoff-20260728]
    paths:
      - '.github/alo186-drill-panel-sync.trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-drill-panel-handoff-20260728
          fetch-depth: 0
      - name: Güncel main dalını merge et
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/alo186-drill-panel-sync-once.yml .github/alo186-drill-panel-sync.trigger
          git commit -m 'chore(alo186): tatbikat panel düzeltmesini güncel main ile senkronize et'
          git push origin HEAD:fix/alo186-drill-panel-handoff-20260728
