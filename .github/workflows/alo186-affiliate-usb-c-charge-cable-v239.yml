name: ALO186 güvenli USB-C şarj kablosu affiliate v239

on:
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/**'
      - 'alo186/deployment/routing-overlays/239-affiliate-usb-c-charge-cable.json'
      - 'alo186/tests/test_affiliate_usb_c_charge_cable_v239.js'
      - '.github/workflows/alo186-affiliate-usb-c-charge-cable-v239.yml'
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/**'
      - 'alo186/deployment/routing-overlays/239-affiliate-usb-c-charge-cable.json'
      - 'alo186/tests/test_affiliate_usb_c_charge_cable_v239.js'
      - '.github/workflows/alo186-affiliate-usb-c-charge-cable-v239.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-usb-c-charge-cable-v239-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ürün, Knowledge Graph ve affiliate güven regresyonu
        run: |
          node --check alo186/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/catalog-v239.js
          node --check alo186/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/app-v239.js
          node alo186/tests/test_affiliate_usb_c_charge_cable_v239.js
      - name: Affiliate kapsam ve ticari yönetişim
        run: |
          printf '%s\n' \
            'alo186/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/index.html' \
            'alo186/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/catalog-v239.js' \
            'alo186/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/app-v239.js' \
            > /tmp/changed-affiliate-v239.txt
          python alo186/tests/test_affiliate_scope_policy_v229.py --changed-files /tmp/changed-affiliate-v239.txt
          node alo186/tests/test_release_manifest.js
      - name: Canonical production paketi
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-affiliate-v239 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-affiliate-v239
          test -f /tmp/alo186-affiliate-v239/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/index.html
          grep -Fq 'https://alo186.com/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/' /tmp/alo186-affiliate-v239/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/index.html
          grep -Fq 'rel="sponsored nofollow noopener"' /tmp/alo186-affiliate-v239/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/index.html
          ! grep -Eqi '"@type"[[:space:]]*:[[:space:]]*"Offer"|priceCurrency|aggregateRating|ratingValue' /tmp/alo186-affiliate-v239/amazon-elektrik-urunleri/usb-c-sarj-kablosu-guc-uygunluk-secimi/index.html
