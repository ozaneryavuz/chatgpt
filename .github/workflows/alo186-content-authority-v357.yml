name: ALO186 content authority weather and meter v357

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/yagmurda-kacak-akim-rolesi-atiyor-nem-izolasyon-arizasi/**'
      - 'alo186/haberler/yagmurda-elektrikli-arac-sarj-edilir-mi-su-girisi/**'
      - 'alo186/haberler/elektrik-sayaci-ekrani-kapali-arizali-ne-yapmali/**'
      - 'alo186/deployment/routing-overlays/content-authority-weather-meter-v357.json'
      - 'alo186/tests/test_content_authority_weather_meter_v357.py'
      - '.github/workflows/alo186-content-authority-v357.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/yagmurda-kacak-akim-rolesi-atiyor-nem-izolasyon-arizasi/**'
      - 'alo186/haberler/yagmurda-elektrikli-arac-sarj-edilir-mi-su-girisi/**'
      - 'alo186/haberler/elektrik-sayaci-ekrani-kapali-arizali-ne-yapmali/**'
      - 'alo186/deployment/routing-overlays/content-authority-weather-meter-v357.json'
      - 'alo186/tests/test_content_authority_weather_meter_v357.py'
      - '.github/workflows/alo186-content-authority-v357.yml'

permissions:
  contents: read

concurrency:
  group: alo186-content-authority-v357-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Weather and meter AEO, trust and commerce checks
        run: python alo186/tests/test_content_authority_weather_meter_v357.py
      - name: Global content intent collision guard
        run: python alo186/tests/test_content_intent_consolidation.py
      - name: Canonical production build and smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-content-authority-v357
          python alo186/deployment/build_static_site.py --output /tmp/alo186-content-authority-v357 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-content-authority-v357
      - name: Verify production routes, sitemap, schema and commercial closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-content-authority-v357')
          routes = [
              '/haberler/yagmurda-kacak-akim-rolesi-atiyor-nem-izolasyon-arizasi/',
              '/haberler/yagmurda-elektrikli-arac-sarj-edilir-mi-su-girisi/',
              '/haberler/elektrik-sayaci-ekrani-kapali-arizali-ne-yapmali/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 357
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              html = page.read_text(encoding='utf-8')
              lowered = html.lower()
              assert f'https://alo186.com{route}' in sitemap
              assert f'<link rel="canonical" href="https://alo186.com{route}">' in html
              assert 'amazon.com.tr' not in lowered
              assert 'pricecurrency' not in lowered
              for schema in ('"@type":"Article"', '"@type":"FAQPage"', '"@type":"BreadcrumbList"'):
                  assert schema in html
              for forbidden in ('"@type":"Product"', '"@type":"Offer"', 'AggregateRating'):
                  assert forbidden not in html
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes, 'merchantLinks': 0})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-content-authority-v357-${{ github.sha }}
          path: /tmp/alo186-content-authority-v357
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
