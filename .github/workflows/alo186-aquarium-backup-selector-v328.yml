name: ALO186 Akvaryum kesinti yedek güç seçimi

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/akvaryum-kesinti-yedek-guc-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-overlays/091-aquarium-backup-selector.json'
      - '.github/workflows/alo186-aquarium-backup-selector-v328.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/akvaryum-kesinti-yedek-guc-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-overlays/091-aquarium-backup-selector.json'
      - '.github/workflows/alo186-aquarium-backup-selector-v328.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-aquarium-backup-selector-v328-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Akvaryum hesabı, güven, satın almama ve dönüşüm senaryoları
        run: |
          set -euo pipefail
          node alo186/hesaplama/akvaryum-kesinti-yedek-guc-uygunluk/app.test.js
          node --check alo186/hesaplama/akvaryum-kesinti-yedek-guc-uygunluk/app.js

      - name: Mevcut yayın ve güven regresyonları
        run: |
          set -euo pipefail
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical üretim ve statik site smoke testi
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-aquarium-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-aquarium-canonical

      - name: Custom-domain ve project-path Pages üretimi
        run: |
          set -euo pipefail
          for target in custom project; do
            cp -a /tmp/alo186-aquarium-canonical "/tmp/alo186-aquarium-$target"
          done

          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-aquarium-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-aquarium-custom \
            --base-path ''
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-aquarium-custom \
            --base-path '' > /tmp/alo186-aquarium-custom.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-aquarium-custom \
            --base-path ''

          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-aquarium-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-aquarium-project \
            --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-aquarium-project \
            --base-path '/chatgpt' > /tmp/alo186-aquarium-project.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-aquarium-project \
            --base-path '/chatgpt'

      - name: Rota, sitemap, teknik arama, affiliate ve gizlilik kabulü
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          route='hesaplama/akvaryum-kesinti-yedek-guc-uygunluk'
          slug='akvaryum-kesinti-yedek-guc-uygunluk/'
          canonical='/hesaplama/akvaryum-kesinti-yedek-guc-uygunluk/'

          for root in [
              Path('/tmp/alo186-aquarium-custom'),
              Path('/tmp/alo186-aquarium-project'),
          ]:
              page=root/route/'index.html'
              app=root/route/'app.js'
              css=root/route/'styles.css'
              assert all(path.is_file() for path in [page, app, css])

              html=page.read_text(encoding='utf-8')
              js=app.read_text(encoding='utf-8')
              assert slug in html
              assert all(token in html for token in [
                  'actualNeed',
                  'technicalCheck',
                  'affiliateCheck',
                  'Amazon satış ortaklığı bağlantısı',
                  'rel="sponsored nofollow noopener"',
                  'JSON teknik fişi indir',
                  '90 günlük yeniden test',
                  'ALO186 EDAŞ, kamu kurumu, veteriner',
                  'aria-live="polite"',
                  'WebApplication',
                  'DefinedTermSet',
                  'FAQPage',
                  'BreadcrumbList',
              ])
              assert all(token not in js for token in ['localStorage', 'sessionStorage', 'fetch(', 'geolocation'])
              assert 'alo186rehber-21' in js
              assert 'commerceAllowed' in js and "state === 'no_buy'" in js
              assert 'electricalHazard' in js and "state = 'hazard'" in js
              assert 'activeOutage' in js and "state = 'active_event'" in js
              assert 'commercialSystem' in js and "state = 'professional'" in js
              assert 'speciesPlanVerified' in js and "state = 'evidence'" in js
              assert 'lifeSupportW' in js and 'requiredNominalWh' in js
              assert 'lightingW' in js and 'fullSystemWh' in js
              assert '"@type":"Product"' not in html
              assert '"@type":"Offer"' not in html
              assert all(token not in html for token in [
                  '"availability":',
                  '"aggregateRating":',
                  '"review":',
                  '"warranty":',
              ])

              hub=(root/'hesaplama/index.html').read_text(encoding='utf-8')
              assert slug in hub
              assert hub.count('class="tool-card"') >= 44
              assert '44 çekirdek araç' in hub

              sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
              assert slug in sitemap
              search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
              entry=next(item for item in search['entries'] if item['canonicalPath'] == canonical)
              assert entry['url'].endswith(canonical)

          print(json.dumps({
              'ok': True,
              'route': canonical,
              'toolCountMinimum': 44,
              'states': ['hazard', 'active_event', 'professional', 'evidence', 'no_buy', 'commerce'],
              'scenarios': 18,
              'affiliateTripleGate': True,
              'affiliateDisclosure': True,
              'unverifiedCommercialFields': False,
              'personalData': False,
              'storage': False,
              'revisitDays': 90,
              'searchIndexed': True,
          }, ensure_ascii=False))
          PY

      - name: Doğrulanmış site artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-aquarium-backup-selector-v328
          path: /tmp/alo186-aquarium-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
