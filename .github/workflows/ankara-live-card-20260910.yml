name: Ankara live card 2026-09-10

on:
  push:
    branches:
      - ankara-live-20260910-1300
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  fetch-live-card:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pandas

      - name: Fetch official TJK program, AGF and parse all runners
        shell: bash
        run: |
          mkdir -p ankara_live
          python - <<'PY'
          from __future__ import annotations
          import csv, io, json, re, time, hashlib
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote
          import requests
          import pandas as pd
          from bs4 import BeautifulSoup

          OUT = Path('ankara_live')
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'tr-TR,tr;q=0.9,en;q=0.7',
          })

          date_iso = '2026-09-10'
          date_dot = '10.09.2026'
          date_slash = '10/09/2026'
          city = 'Ankara'
          city_id = 5
          program_url = (
              'https://medya-cdn.tjk.org/raporftp/TJKPDF/2026/2026-09-10/CSV/'
              'GunlukYarisProgrami/10.09.2026-Ankara-GunlukYarisProgrami-TR.csv'
          )
          page_url = (
              'https://www.tjk.org/TR/YarisSever/Info/Page/GunlukYarisProgrami?'
              'QueryParameter_Tarih=' + quote(date_slash, safe='') + '&SehirAdi=Ankara&SehirId=5'
          )
          city_url = (
              'https://www.tjk.org/TR/YarisSever/Info/Sehir/GunlukYarisProgrami?Era=today&'
              'QueryParameter_Tarih=' + quote(date_slash, safe='') + '&SehirAdi=Ankara&SehirId=5'
          )
          data_url = (
              'https://www.tjk.org/TR/YarisSever/Info/Data/GunlukYarisProgrami?Era=today&'
              'QueryParameter_Tarih=' + quote(date_slash, safe='') + '&SehirAdi=Ankara&SehirId=5'
          )
          agf_urls = [
              'https://www.tjk.org/AGFv2/5/10092026/TR/1/1',
              'https://www.tjk.org/AGFv2/5/10092026/TR/1/2',
          ]
          fixed_url = 'https://www.tjk.org/TR/YarisSever/Info/SabitIhtimalliOyunProgrami'

          def fetch(url: str, filename: str, required: bool = True) -> bytes:
              last = None
              for attempt in range(4):
                  try:
                      r = session.get(url, timeout=45, allow_redirects=True)
                      if r.status_code == 404 and not required:
                          return b''
                      r.raise_for_status()
                      data = r.content
                      if required and len(data) < 20:
                          raise RuntimeError(f'too small: {len(data)}')
                      if data:
                          (OUT / filename).write_bytes(data)
                      return data
                  except Exception as exc:
                      last = exc
                      time.sleep(2 ** attempt)
              if required:
                  raise RuntimeError(f'fetch failed {url}: {last}')
              (OUT / f'{filename}.error.txt').write_text(str(last), encoding='utf-8')
              return b''

          program_bytes = fetch(program_url, 'official_program.csv')
          page_bytes = fetch(page_url, 'official_program_page.html')
          city_bytes = fetch(city_url, 'official_program_city.html')
          data_bytes = fetch(data_url, 'official_program_data.html', required=False)
          fixed_bytes = fetch(fixed_url, 'fixed_odds_page.html', required=False)
          agf_payloads = []
          for idx, url in enumerate(agf_urls, start=1):
              agf_payloads.append(fetch(url, f'agf_{idx}.html', required=False))

          text = None
          used_encoding = None
          for encoding in ('utf-8-sig', 'cp1254', 'latin1'):
              try:
                  text = program_bytes.decode(encoding)
                  used_encoding = encoding
                  break
              except UnicodeDecodeError:
                  pass
          assert text is not None
          rows = list(csv.reader(io.StringIO(text), delimiter=';'))

          def clean(value):
              return re.sub(r'\s+', ' ', str(value or '')).strip()

          def parse_num(value):
              s = clean(value).replace('%', '').replace('₺', '').replace('TL', '').replace(' ', '')
              if not s:
                  return None
              if ',' in s and '.' in s:
                  s = s.replace('.', '').replace(',', '.') if s.rfind(',') > s.rfind('.') else s.replace(',', '')
              else:
                  s = s.replace(',', '.')
              m = re.search(r'-?\d+(?:\.\d+)?', s)
              return float(m.group()) if m else None

          def agf_values(value):
              vals = []
              for pct, rank in re.findall(r'%(\d+(?:[.,]\d+)?)\((\d+)\)', str(value or '')):
                  vals.append({'pct': float(pct.replace(',', '.')), 'rank': int(rank)})
              return vals

          races = []
          race = None
          header = None
          first_six_start = None
          second_six_start = None

          def parse_race_header(row):
              first = clean(row[0])
              m = re.search(r'(\d+)\.\s*(?:Kosu|Koşu)\s*:\s*(\d{1,2})[.:](\d{2})', first, re.I)
              if not m:
                  return None
              fields = [clean(x) for x in row]
              return {
                  'race_number': int(m.group(1)),
                  'post_time': f'{int(m.group(2)):02d}:{m.group(3)}',
                  'condition': fields[1] if len(fields) > 1 else '',
                  'age_group': fields[2] if len(fields) > 2 else '',
                  'weight_rule': fields[3] if len(fields) > 3 else '',
                  'distance': fields[4] if len(fields) > 4 else '',
                  'surface': fields[5] if len(fields) > 5 else '',
                  'record': next((x for x in fields if 'Rekor Derece' in x), ''),
                  'runners': [],
                  'bet_types': [],
                  'coupled_text': [],
              }

          for row in rows:
              if not row:
                  continue
              first = clean(row[0])
              parsed = parse_race_header(row)
              if parsed:
                  if race is not None:
                      races.append(race)
                  race = parsed
                  header = None
                  continue
              if race is None:
                  continue
              joined = ' '.join(clean(x) for x in row if clean(x))
              marker = joined.upper().replace('’', "'")
              if "1. 6'LI GANYAN" in marker or '1. 6LI GANYAN' in marker:
                  first_six_start = race['race_number']
              if "2. 6'LI GANYAN" in marker or '2. 6LI GANYAN' in marker:
                  second_six_start = race['race_number']
              if first == 'At No':
                  header = [clean(x) for x in row]
                  continue
              if header is not None and re.fullmatch(r'\d+', first or ''):
                  padded = row + [''] * max(0, len(header) - len(row))
                  item = {header[i]: clean(padded[i]) for i in range(min(len(header), len(padded)))}
                  horse_raw = item.get('At İsmi', '')
                  scratched = bool(re.search(r'Koşmaz|KOSMAZ', horse_raw))
                  horse = re.sub(r'\s*\(Koşmaz\)\s*', '', horse_raw, flags=re.I).strip()
                  agf_raw = item.get('AGF', '')
                  agfs = agf_values(agf_raw)
                  race['runners'].append({
                      'number': int(first),
                      'horse': horse,
                      'horse_raw': horse_raw,
                      'scratched': scratched,
                      'age_sex': item.get('Yaş', ''),
                      'sire': item.get('Orijin(Baba)', ''),
                      'dam': item.get('Orijin(Anne)', ''),
                      'weight': item.get('Kilo', ''),
                      'jockey': item.get('Jokey Adı', ''),
                      'owner': item.get('Sahip Adı', ''),
                      'trainer': item.get('Antrenör Adı', ''),
                      'gate': item.get('St', ''),
                      'handicap': item.get('H', ''),
                      'last6': item.get('Son 6 Yarış', ''),
                      'kgs': item.get('KGS', ''),
                      's20': item.get('s20', ''),
                      'best_time': item.get('EnİyiDerece', ''),
                      'ganyan_raw': item.get('Gny', '') or item.get('Ganyan', ''),
                      'ganyan': parse_num(item.get('Gny', '') or item.get('Ganyan', '')),
                      'agf_raw': agf_raw,
                      'agf_first_pct': agfs[0]['pct'] if agfs else None,
                      'agf_second_pct': agfs[1]['pct'] if len(agfs) > 1 else None,
                  })
                  continue
              if header is not None and joined:
                  if 'eküridir' in joined.lower() or 'ekuridir' in joined.lower():
                      race['coupled_text'].append(joined)
                  if any(token in marker for token in ('GANYAN', 'ÇİFTE', "6'LI", "5'Lİ", "4'LÜ", "3'LÜ")):
                      race['bet_types'].append(joined)
                  header = None
          if race is not None:
              races.append(race)

          # Parse visible page metadata, weather, track and jockey/scratch changes.
          page_soup = BeautifulSoup(page_bytes, 'lxml')
          page_text = '\n'.join(page_soup.stripped_strings)
          (OUT / 'official_program_visible.txt').write_text(page_text, encoding='utf-8')
          weather_lines = [line for line in page_text.splitlines() if any(k in line for k in ('Çim:', 'Kum:', 'Hava:', 'NEM'))]
          changes = [line for line in page_text.splitlines() if any(k.lower() in line.lower() for k in ('koşmaz', 'jokey değişikliği', 'raporlu', 'fazla kilo'))]

          # AGF endpoints: save visible text and attempt table extraction.
          agf_parsed = {}
          agf_meta = []
          for idx, raw in enumerate(agf_payloads, start=1):
              if not raw:
                  continue
              soup = BeautifulSoup(raw, 'lxml')
              visible = '\n'.join(soup.stripped_strings)
              (OUT / f'agf_{idx}_visible.txt').write_text(visible, encoding='utf-8')
              update_match = re.search(r'Son güncellenme zamanı\s*:\s*(\d{1,2}:\d{2}:\d{2})', visible, re.I)
              leg_map = {}
              current_leg = None
              for line in [clean(x) for x in visible.splitlines() if clean(x)]:
                  m_leg = re.match(r'([1-6])\.\s*AYAK', line, re.I)
                  if m_leg:
                      current_leg = int(m_leg.group(1)); leg_map.setdefault(str(current_leg), [])
                      continue
                  if current_leg is None:
                      continue
                  for no, pct in re.findall(r'(?<!\d)(\d{1,2})\s*\(%\s*([0-9]+(?:[.,][0-9]+)?)\)', line):
                      item = {'horse_no': int(no), 'pct': float(pct.replace(',', '.'))}
                      if item not in leg_map[str(current_leg)]:
                          leg_map[str(current_leg)].append(item)
              agf_parsed[str(idx)] = leg_map
              agf_meta.append({'index': idx, 'last_update': update_match.group(1) if update_match else None, 'visible_length': len(visible), 'rows': sum(len(v) for v in leg_map.values())})

          first_start = first_six_start or 1
          first_six_races = [r for r in races if first_start <= r['race_number'] <= first_start + 5]
          flat = []
          for leg, r in enumerate(first_six_races, start=1):
              for x in r['runners']:
                  flat.append({
                      'leg': leg,
                      'race_number': r['race_number'],
                      'post_time': r['post_time'],
                      'condition': r['condition'],
                      'age_group': r['age_group'],
                      'distance': r['distance'],
                      'surface': r['surface'],
                      **x,
                  })
          if flat:
              pd.DataFrame(flat).to_csv(OUT / 'ankara_first_six_runners.csv', index=False, encoding='utf-8-sig')

          payload = {
              'fetched_at_utc': datetime.now(timezone.utc).isoformat(),
              'date': date_iso,
              'track': city,
              'program_url': program_url,
              'page_url': page_url,
              'city_url': city_url,
              'data_url': data_url,
              'agf_urls': agf_urls,
              'encoding': used_encoding,
              'first_six_start': first_start,
              'second_six_start': second_six_start,
              'race_count': len(races),
              'first_six_race_count': len(first_six_races),
              'runner_count_first_six': len(flat),
              'weather_track_lines': weather_lines[:30],
              'change_lines': changes[:100],
              'agf_meta': agf_meta,
              'agf_parsed': agf_parsed,
              'first_six_races': first_six_races,
              'all_races': races,
              'source_sizes': {
                  'program_csv': len(program_bytes),
                  'program_page': len(page_bytes),
                  'program_city': len(city_bytes),
                  'program_data': len(data_bytes),
                  'fixed_odds': len(fixed_bytes),
                  'agf_1': len(agf_payloads[0]),
                  'agf_2': len(agf_payloads[1]),
              },
              'sha256': {
                  'program_csv': hashlib.sha256(program_bytes).hexdigest(),
                  'program_page': hashlib.sha256(page_bytes).hexdigest(),
                  'program_city': hashlib.sha256(city_bytes).hexdigest(),
                  'program_data': hashlib.sha256(data_bytes).hexdigest() if data_bytes else None,
                  'agf_1': hashlib.sha256(agf_payloads[0]).hexdigest() if agf_payloads[0] else None,
                  'agf_2': hashlib.sha256(agf_payloads[1]).hexdigest() if agf_payloads[1] else None,
              },
          }
          (OUT / 'ankara_live_card.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({
              'fetched_at_utc': payload['fetched_at_utc'],
              'first_six_start': first_start,
              'second_six_start': second_six_start,
              'first_six_races': len(first_six_races),
              'runners': len(flat),
              'weather': weather_lines[:5],
              'agf_meta': agf_meta,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload Ankara live-card artifact
        uses: actions/upload-artifact@v4
        with:
          name: ankara-live-card-20260910
          path: ankara_live
          if-no-files-found: error
          retention-days: 2
