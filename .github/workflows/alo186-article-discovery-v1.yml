name: ALO186 bütün teknik makaleler merkezi v1

on:
  pull_request:
    paths:
      - 'alo186/article-hub/**'
      - 'alo186/assets/alo186-article-discovery.css'
      - 'alo186/deployment/finalize_article_discovery.py'
      - 'alo186/deployment/prepare_github_pages.py'
      - 'alo186/deployment/routing-overlays/130-user-centered-article-hub.json'
      - 'alo186/tests/test_article_discovery_v1.py'
      - '.github/workflows/alo186-article-discovery-v1.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/article-hub/**'
      - 'alo186/assets/alo186-article-discovery.css'
      - 'alo186/deployment/finalize_article_discovery.py'
      - 'alo186/deployment/prepare_github_pages.py'
      - 'alo186/deployment/routing-overlays/130-user-centered-article-hub.json'
      - 'alo186/tests/test_article_discovery_v1.py'
      - '.github/workflows/alo186-article-discovery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-article-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bütün teknik makaleler ve iki Pages modu
        run: python alo186/tests/test_article_discovery_v1.py

      - name: Python ve tarayıcı JavaScript sözdizimi
        run: |
          python -m py_compile \
            alo186/deployment/finalize_article_discovery.py \
            alo186/deployment/prepare_github_pages.py \
            alo186/tests/test_article_discovery_v1.py
          node --check alo186/article-hub/app.js

      - name: Mevcut portal, hukuk, canonical, teknik arama ve site geneli UX regresyonları
        run: |
          node alo186/tests/test_portal_hardening.js
          node alo186/tests/test_release_manifest.js
          python alo186/tests/device_damage_deadline_guard.py
          python alo186/tests/test_content_intent_consolidation.py
          python alo186/tests/test_private_technical_search.py
          python alo186/tests/test_sitewide_user_experience_v120.py

      - name: Canonical production paketi
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-article-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-article-canonical

      - name: Custom-domain Pages artifactı
        run: |
          cp -a /tmp/alo186-article-canonical /tmp/alo186-article-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-article-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-article-custom \
            --base-path ''
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-article-custom \
            --base-path '' \
            > /tmp/alo186-article-custom-growth.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-article-custom \
            --base-path ''

      - name: Project-path Pages artifactı
        run: |
          cp -a /tmp/alo186-article-canonical /tmp/alo186-article-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-article-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-article-project \
            --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-article-project \
            --base-path '/chatgpt' \
            > /tmp/alo186-article-project-growth.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-article-project \
            --base-path '/chatgpt'

      - name: Makale merkezi, geri dönüş ve metadata kabulü
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for root, prefix in [
              (Path('/tmp/alo186-article-custom'), ''),
              (Path('/tmp/alo186-article-project'), '/chatgpt'),
          ]:
              release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
              pages=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
              canonical_article_count=int(release['articleCount'])
              discovery=pages['articleDiscoveryV1']
              assert canonical_article_count >= 50
              assert discovery['articleCount'] == canonical_article_count
              assert discovery['articleBacklinksInjected'] == canonical_article_count
              assert discovery['portalCardInjected'] is True
              assert discovery['rawQueryStored'] is False
              assert discovery['commercialRankingUsed'] is False
              hub=(root/'haberler/index.html').read_text(encoding='utf-8')
              assert hub.count('data-article-card') == canonical_article_count
              assert 'amazon.com.tr' not in hub.lower()
              portal=(root/'elektrik-portali/index.html').read_text(encoding='utf-8')
              assert portal.count('data-alo186-article-hub-card="true"') == 1
              expected=(prefix+'/haberler/') if prefix else '/haberler/'
              assert f'href="{expected}"' in portal
              manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
              assert any(item.get('url')==expected for item in manifest.get('shortcuts', []))
              sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
              assert 'https://alo186.com/haberler/' in sitemap or 'https://www.alo186.com/haberler/' in sitemap
          PY

      - name: Kullanıcı odaklı makale merkezi artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-article-discovery-v1
          path: /tmp/alo186-article-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
