name: ALO186 kaliteli ticari kategori genişlemesi v2

on:
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/**'
      - 'alo186/deployment/routing-overlays/commercial-category-pages-v42.json'
      - 'alo186/tests/test_commercial_category_pages.py'
      - 'alo186/tests/test_commercial_category_expansion.py'
      - '.github/workflows/alo186-commercial-expansion-v2.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/**'
      - 'alo186/deployment/routing-overlays/commercial-category-pages-v42.json'
      - 'alo186/tests/test_commercial_category_pages.py'
      - 'alo186/tests/test_commercial_category_expansion.py'
      - '.github/workflows/alo186-commercial-expansion-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-commercial-expansion-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ticari sayfa niyet, kalite ve güvenlik sözleşmeleri
        run: |
          python alo186/tests/test_commercial_category_pages.py
          python alo186/tests/test_commercial_category_expansion.py

      - name: Katalog ve ticari runtime regresyonları
        run: |
          node --check alo186/amazon-elektrik-urunleri/commercial.js
          node --check alo186/urun-eslestirme/catalog.js
          node --check alo186/urun-eslestirme/matcher-core.js
          node --check alo186/urun-eslestirme/app.js

      - name: Mevcut yayın, hukuk, canonical ve teknik arama güveni
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py
          python alo186/tests/test_content_intent_consolidation.py
          python alo186/tests/test_private_technical_search.py

      - name: Canonical production paketini oluştur
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-commercial-v2-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-commercial-v2-canonical

      - name: Custom-domain Pages artifactı
        run: |
          cp -a /tmp/alo186-commercial-v2-canonical /tmp/alo186-commercial-v2-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-commercial-v2-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-commercial-v2-custom \
            --base-path ''
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-commercial-v2-custom \
            --base-path '' \
            > /tmp/alo186-commercial-v2-custom-growth.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-commercial-v2-custom \
            --base-path ''

      - name: Project-path Pages artifactı
        run: |
          cp -a /tmp/alo186-commercial-v2-canonical /tmp/alo186-commercial-v2-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-commercial-v2-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-commercial-v2-project \
            --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-commercial-v2-project \
            --base-path '/chatgpt' \
            > /tmp/alo186-commercial-v2-project-growth.json
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-commercial-v2-project \
            --base-path '/chatgpt'

      - name: Canonical, base-path, sitemap, arama ve affiliate kabulü
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          routes = [
              '/amazon-elektrik-urunleri/tasinabilir-guc-istasyonu-secimi',
              '/amazon-elektrik-urunleri/akilli-priz-enerji-olcer-secimi',
              '/amazon-elektrik-urunleri/ges-malzemeleri-secimi',
          ]
          for root, prefix in [
              (Path('/tmp/alo186-commercial-v2-custom'), ''),
              (Path('/tmp/alo186-commercial-v2-project'), '/chatgpt'),
          ]:
              release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
              pages=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
              search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
              sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
              entries={item['canonicalPath']: item for item in search['entries']}
              assert release['routingVersion'] >= 42
              assert pages['routeCount'] == release['routeCount']
              for route in routes:
                  file=root/route.strip('/')/'index.html'
                  assert file.is_file(), file
                  html=file.read_text(encoding='utf-8')
                  canonical_hosts=(f'https://www.alo186.com{route}', f'https://alo186.com{route}')
                  assert any(value in html for value in canonical_hosts), (root, route, 'canonical')
                  assert any(value in sitemap for value in canonical_hosts), (root, route, 'sitemap')
                  assert route in entries, route
                  expected=(prefix+route) if prefix else route
                  assert entries[route]['url'] == expected
                  assert entries[route]['priority'] == 45
                  assert 'price' not in entries[route]
                  assert 'stock' not in entries[route]
                  assert 'rating' not in entries[route]
                  assert 'amazon.com.tr' not in html.lower()
              power=(root/routes[0].strip('/')/'index.html').read_text(encoding='utf-8')
              smart=(root/routes[1].strip('/')/'index.html').read_text(encoding='utf-8')
              ges=(root/routes[2].strip('/')/'index.html').read_text(encoding='utf-8')
              catalog=(prefix+'/akilli-urun-secimi/catalog.js') if prefix else '/akilli-urun-secimi/catalog.js'
              assert catalog in power
              assert catalog in smart
              assert 'data-category="power_station"' in power
              assert 'data-category="smart_plug"' in smart
              assert 'data-commercial-scope="professional-only"' in ges
              assert 'data-product-center' not in ges
              hub=(root/'amazon-elektrik-urunleri/index.html').read_text(encoding='utf-8')
              guide_links=set(re.findall(r'href="(/(?:chatgpt/)?amazon-elektrik-urunleri/[^"?#]+)"', hub))
              display=re.search(r'(\d+) özel rehber', hub)
              assert display, 'Görünür rehber sayacı bulunamadı'
              assert len(guide_links) == int(display.group(1)), guide_links
              assert len(guide_links) >= 7, guide_links
              assert hub.count('class="card route-card"') == len(guide_links)
          PY

      - name: Kaliteli ticari genişleme artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-commercial-expansion-v2-pages
          path: /tmp/alo186-commercial-v2-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
