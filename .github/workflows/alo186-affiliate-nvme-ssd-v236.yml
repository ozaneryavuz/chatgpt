name: ALO186 güvenli M.2 NVMe SSD affiliate v236

on:
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/**'
      - 'alo186/deployment/routing-overlays/236-affiliate-nvme-ssd.json'
      - 'alo186/tests/test_affiliate_nvme_ssd_v236.js'
      - '.github/workflows/alo186-affiliate-nvme-ssd-v236.yml'
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/**'
      - 'alo186/deployment/routing-overlays/236-affiliate-nvme-ssd.json'
      - 'alo186/tests/test_affiliate_nvme_ssd_v236.js'
      - '.github/workflows/alo186-affiliate-nvme-ssd-v236.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-nvme-ssd-v236-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ürün, Knowledge Graph ve affiliate güven regresyonu
        run: |
          node --check alo186/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/catalog-v236.js
          node --check alo186/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/app-v236.js
          node alo186/tests/test_affiliate_nvme_ssd_v236.js
      - name: Affiliate kapsam ve ticari yönetişim
        run: |
          printf '%s\n' \
            'alo186/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/index.html' \
            'alo186/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/catalog-v236.js' \
            'alo186/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/app-v236.js' \
            > /tmp/changed-affiliate-v236.txt
          python alo186/tests/test_affiliate_scope_policy_v229.py --changed-files /tmp/changed-affiliate-v236.txt
          node alo186/tests/test_release_manifest.js
      - name: Canonical production paketi
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-affiliate-v236 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-affiliate-v236
          test -f /tmp/alo186-affiliate-v236/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/index.html
          grep -Fq 'https://alo186.com/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/' /tmp/alo186-affiliate-v236/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/index.html
          test "$(grep -Fo 'rel=\"sponsored nofollow noopener\"' /tmp/alo186-affiliate-v236/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/index.html | wc -l)" -eq 3
          ! grep -Eqi '"@type"[[:space:]]*:[[:space:]]*"Offer"|priceCurrency|aggregateRating|availability|seller|review|warranty' /tmp/alo186-affiliate-v236/amazon-elektrik-urunleri/bilgisayar-m2-nvme-ssd-uyumluluk-secimi/index.html
      - name: Custom-domain ve project-path kabulü
        run: |
          cp -a /tmp/alo186-affiliate-v236 /tmp/alo186-affiliate-v236-custom
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-affiliate-v236-custom --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-affiliate-v236-custom --base-path ''
          cp -a /tmp/alo186-affiliate-v236 /tmp/alo186-affiliate-v236-project
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-affiliate-v236-project --base-path '/chatgpt' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-affiliate-v236-project --base-path '/chatgpt'
