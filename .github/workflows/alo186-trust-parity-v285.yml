name: ALO186 trust parity v285

on:
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/**'
      - 'alo186/tests/test_live_trust_parity_v285.py'
      - '.github/workflows/alo186-trust-parity-v285.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/**'
      - 'alo186/tests/test_live_trust_parity_v285.py'
      - '.github/workflows/alo186-trust-parity-v285.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-trust-parity-v285-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Source commercial trust contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source trust contract
        run: python alo186/tests/test_live_trust_parity_v285.py

  live-parity:
    name: Live trust and commercial parity
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify deployed HTML
        run: python alo186/tests/test_live_trust_parity_v285.py --live-base https://alo186.com
