name: ALO186 TV surge IPTV journey v329

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesintisi-televizyona-zarar-verir-mi/**'
      - 'alo186/hesaplama/televizyon-elektrik-kesintisi-koruma-hazirlik-plani/**'
      - 'alo186/sektor-rehberi/otel-iptv-televizyon-elektrik-kesintisi-surekliligi/**'
      - 'alo186/deployment/routing-overlays/tv-surge-iptv-journey-v329.json'
      - 'alo186/tests/test_tv_surge_iptv_journey_v329.py'
      - '.github/workflows/alo186-tv-surge-iptv-v329.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesintisi-televizyona-zarar-verir-mi/**'
      - 'alo186/hesaplama/televizyon-elektrik-kesintisi-koruma-hazirlik-plani/**'
      - 'alo186/sektor-rehberi/otel-iptv-televizyon-elektrik-kesintisi-surekliligi/**'
      - 'alo186/deployment/routing-overlays/tv-surge-iptv-journey-v329.json'
      - 'alo186/tests/test_tv_surge_iptv_journey_v329.py'
      - '.github/workflows/alo186-tv-surge-iptv-v329.yml'

permissions:
  contents: read

concurrency:
  group: alo186-tv-surge-iptv-v329-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Trust privacy affiliate reuse and professional-only checks
        run: python alo186/tests/test_tv_surge_iptv_journey_v329.py
      - name: Build canonical site bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-tv-v329
          python alo186/deployment/build_static_site.py --output /tmp/alo186-tv-v329 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-tv-v329
      - name: Verify routes sitemap and existing gated selector
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-tv-v329')
          routes = [
            '/haberler/elektrik-kesintisi-televizyona-zarar-verir-mi/',
            '/hesaplama/televizyon-elektrik-kesintisi-koruma-hazirlik-plani/',
            '/sektor-rehberi/otel-iptv-televizyon-elektrik-kesintisi-surekliligi/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 329
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              assert f'https://alo186.com{route}' in sitemap
          selector = root / 'amazon-elektrik-urunleri/akim-korumali-priz-yuk-uygunluk-secimi/index.html'
          assert selector.is_file(), selector
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes, 'selectorReused': True})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-tv-v329-${{ github.sha }}
          path: /tmp/alo186-tv-v329
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
