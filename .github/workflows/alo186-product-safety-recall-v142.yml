name: ALO186 product safety recall v142

on:
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/elektrikli-urun-satin-alma-guvenlik-kapisi/**'
      - 'alo186/hesaplama/elektrikli-urun-geri-cagirma-model-kontrolu/**'
      - 'alo186/sektor-rehberi/elektrikli-urun-guvenlik-ve-geri-cagirma-merkezi/**'
      - 'alo186/deployment/routing-overlays/142-product-safety-recall.json'
      - 'alo186/tests/test_product_safety_recall_growth_v142.py'
      - '.github/workflows/alo186-product-safety-recall-v142.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-product-safety-recall-v142-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-and-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate safety decisions, no-buy gates and published routes
        run: python alo186/tests/test_product_safety_recall_growth_v142.py
