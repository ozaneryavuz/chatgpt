name: ALO186 tatbikat panel köprüsü tek seferlik patch

on:
  push:
    branches: [fix/alo186-drill-panel-handoff-20260728]
    paths:
      - '.github/alo186-drill-panel-patch.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-drill-panel-handoff-20260728
          fetch-depth: 0
      - name: Panel script ve checkbox UX patchleri
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index_path=Path('alo186/sureklilik-paneli/index.html')
          index=index_path.read_text(encoding='utf-8')
          old='<script src="../hesaplama/common.js"></script><script src="./store.js"></script><script src="./app.js"></script>'
          new='<script src="../hesaplama/common.js"></script><script src="./store.js"></script><script src="./drill-handoff-bridge.js"></script><script src="./app.js"></script>'
          if new not in index:
              if old not in index:
                  raise SystemExit('Panel script marker bulunamadı.')
              index=index.replace(old,new,1)
              index_path.write_text(index,encoding='utf-8')

          app_path=Path('alo186/hesaplama/elektrik-kesintisi-tatbikati/app.js')
          app=app_path.read_text(encoding='utf-8')
          selected_marker='''  function selected(name) {\n    return [...form.querySelectorAll(`input[name="${name}"]:checked`)].map((item) => item.value);\n  }\n'''
          exclusive_block='''  function enforceNoneExclusivity(event) {\n    const target = event.target;\n    if (!target.matches('input[type="checkbox"]') || !target.checked) return;\n    const group = target.closest('.choice-grid');\n    if (!group) return;\n    const boxes = [...group.querySelectorAll('input[type="checkbox"]')];\n    if (target.value === "none") boxes.forEach((box) => { if (box !== target) box.checked = false; });\n    else boxes.forEach((box) => { if (box.value === "none") box.checked = false; });\n    results.hidden = true;\n    latestResult = null;\n  }\n'''
          if exclusive_block not in app:
              if selected_marker not in app:
                  raise SystemExit('Selected function marker bulunamadı.')
              app=app.replace(selected_marker,selected_marker+'\n'+exclusive_block,1)

          old_save='''  function saveHandoff() {\n    if (!latestResult) return;\n    try {\n      localStorage.setItem("alo186.continuity-drill-handoff.v1", JSON.stringify(latestResult.handoff));\n      panelBtn.textContent = "Panel aktarımı 7 günlüğüne hazır";\n      emit("continuity_drill_handoff_saved", { score_band: latestResult.classification.id, p0_count: latestResult.p0Count });\n    } catch (_error) {\n      panelBtn.textContent = "Tarayıcı aktarımı kaydedemedi";\n    }\n  }\n'''
          new_save='''  function saveHandoff() {\n    if (panelBtn.dataset.handoffReady === "true") {\n      window.location.href = "https://www.alo186.com/isletme-surekliligi";\n      return;\n    }\n    if (!latestResult) return;\n    try {\n      localStorage.setItem("alo186.continuity-drill-handoff.v1", JSON.stringify(latestResult.handoff));\n      panelBtn.dataset.handoffReady = "true";\n      panelBtn.textContent = "Panele git ve bulguları içe aktar";\n      emit("continuity_drill_handoff_saved", { score_band: latestResult.classification.id, p0_count: latestResult.p0Count });\n    } catch (_error) {\n      panelBtn.textContent = "Tarayıcı aktarımı kaydedemedi";\n    }\n  }\n'''
          if new_save not in app:
              if old_save not in app:
                  raise SystemExit('saveHandoff marker bulunamadı.')
              app=app.replace(old_save,new_save,1)

          old_reset='''    panelBtn.textContent = "7 günlük panel aktarımını hazırla";\n    window.scrollTo({ top: 0, behavior: "smooth" });'''
          new_reset='''    panelBtn.textContent = "7 günlük panel aktarımını hazırla";\n    delete panelBtn.dataset.handoffReady;\n    window.scrollTo({ top: 0, behavior: "smooth" });'''
          if new_reset not in app:
              if old_reset not in app:
                  raise SystemExit('Reset marker bulunamadı.')
              app=app.replace(old_reset,new_reset,1)

          old_render='''  renderChoices(criticalLoads, core.CRITICAL_LOADS, "criticalLoad");\n  renderChoices(backupSources, core.BACKUP_SOURCES, "backupSource");\n  renderTasks();'''
          new_render='''  renderChoices(criticalLoads, core.CRITICAL_LOADS, "criticalLoad");\n  renderChoices(backupSources, core.BACKUP_SOURCES, "backupSource");\n  criticalLoads.addEventListener("change", enforceNoneExclusivity);\n  backupSources.addEventListener("change", enforceNoneExclusivity);\n  renderTasks();'''
          if new_render not in app:
              if old_render not in app:
                  raise SystemExit('Render choices marker bulunamadı.')
              app=app.replace(old_render,new_render,1)
          app_path.write_text(app,encoding='utf-8')
          PY
          node --check alo186/hesaplama/elektrik-kesintisi-tatbikati/app.js
          grep -q 'drill-handoff-bridge.js' alo186/sureklilik-paneli/index.html
          grep -q 'enforceNoneExclusivity' alo186/hesaplama/elektrik-kesintisi-tatbikati/app.js
      - name: Patch ve yardımcı dosyaları kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alo186/sureklilik-paneli/index.html alo186/hesaplama/elektrik-kesintisi-tatbikati/app.js
          git rm .github/workflows/alo186-drill-panel-patch-once.yml .github/alo186-drill-panel-patch.trigger
          git commit -m 'fix(alo186): tatbikat panel köprüsünü etkinleştir ve none seçimlerini tekilleştir'
          git push origin HEAD:fix/alo186-drill-panel-handoff-20260728
