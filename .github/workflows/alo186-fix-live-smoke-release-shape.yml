name: ALO186 fix live smoke release marker shape

on:
  push:
    branches:
      - agent/alo186-live-smoke-release-shape
    paths:
      - '.github/workflows/alo186-fix-live-smoke-release-shape.yml'

permissions:
  contents: write

concurrency:
  group: alo186-fix-live-smoke-release-shape
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alo186-live-smoke-release-shape
          persist-credentials: true

      - name: Add fail-closed release marker validation and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checker = Path('alo186/deployment/check_live_english.py')
          text = checker.read_text(encoding='utf-8')
          anchor = '''def validate_english_page(route: str, html: str, origin: str, status: int = 200) -> RouteResult:
          '''
          helper = '''def parse_release_marker(release_text: str) -> str:
              release = json.loads(release_text)
              if not isinstance(release, dict):
                  raise LiveValidationError("pages-release.json kök nesnesi object değil")
              return str(release.get("commit", "")).strip()


          def validate_english_page(route: str, html: str, origin: str, status: int = 200) -> RouteResult:
          '''
          if anchor not in text:
              raise SystemExit('validate_english_page anchor not found')
          text = text.replace(anchor, helper, 1)

          old = '''            release = json.loads(release_text)
                      live_commit = str(release.get("commit", "")).strip()
          '''
          new = '''            live_commit = parse_release_marker(release_text)
          '''
          if old not in text:
              raise SystemExit('release marker parse block not found')
          checker.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('alo186/tests/test_live_english_smoke.py')
          text = test.read_text(encoding='utf-8')
          old = '''def main() -> None:
              for route in MODULE.LANGUAGE_PAIRS:
          '''
          new = '''def main() -> None:
              assert MODULE.parse_release_marker('{"commit":"abc123"}') == "abc123"
              for malformed_marker in ("null", "[]", '"text"', "42", "true"):
                  expect_error(
                      lambda marker=malformed_marker: MODULE.parse_release_marker(marker),
                      "kök nesnesi object değil",
                  )

              for route in MODULE.LANGUAGE_PAIRS:
          '''
          if old not in text:
              raise SystemExit('test main anchor not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python -m py_compile \
            alo186/deployment/check_live_english.py \
            alo186/tests/test_live_english_smoke.py
          python alo186/tests/test_live_english_smoke.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/alo186-fix-live-smoke-release-shape.yml'
          git add \
            alo186/deployment/check_live_english.py \
            alo186/tests/test_live_english_smoke.py
          git commit -m 'fix: validate pages release marker root shape'
          git push origin HEAD:agent/alo186-live-smoke-release-shape
