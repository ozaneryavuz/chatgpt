name: ALO186 teknik teklif kapsamı ve gelir ayrımı

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/teknik-teklif-kapsam-karsilastirma/**'
      - 'alo186/deployment/inject_proposal_scope_growth.py'
      - 'alo186/deployment/inject_handoff_growth.py'
      - 'alo186/deployment/inject_handoff_growth_base.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-overlays/growth-proposal-scope-run12.json'
      - 'alo186/tests/test_proposal_scope_growth.js'
      - '.github/workflows/alo186-proposal-scope-growth.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/teknik-teklif-kapsam-karsilastirma/**'
      - 'alo186/deployment/inject_proposal_scope_growth.py'
      - 'alo186/deployment/inject_handoff_growth.py'
      - 'alo186/deployment/inject_handoff_growth_base.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-overlays/growth-proposal-scope-run12.json'
      - 'alo186/tests/test_proposal_scope_growth.js'
      - '.github/workflows/alo186-proposal-scope-growth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-proposal-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Teklif kapsamı karar senaryoları
        run: node alo186/hesaplama/teknik-teklif-kapsam-karsilastirma/test.js

      - name: Teklif kapsamı routing ve site sözleşmeleri
        run: node alo186/tests/test_proposal_scope_growth.js

      - name: Teknik devir regresyonu
        run: node alo186/hesaplama/teknik-devir-kabul-paketi/test.js

      - name: Teknik kısa liste regresyonu
        run: node alo186/hesaplama/teknik-urun-karsilastirma/test.js

      - name: Sözdizimi
        run: |
          node --check alo186/hesaplama/teknik-teklif-kapsam-karsilastirma/core.js
          node --check alo186/hesaplama/teknik-teklif-kapsam-karsilastirma/app.js
          python -m py_compile alo186/deployment/inject_proposal_scope_growth.py
          python -m py_compile alo186/deployment/inject_handoff_growth.py
          python -m py_compile alo186/deployment/inject_handoff_growth_base.py

      - name: Mevcut güven ve canonical regresyonları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          node alo186/tests/test_technical_shortlist_growth.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical production bundle
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-proposal-canonical --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-proposal-canonical

      - name: Custom-domain artifact
        run: |
          cp -a /tmp/alo186-proposal-canonical /tmp/alo186-proposal-custom
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-proposal-custom --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-proposal-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-proposal-custom --base-path ''
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-proposal-custom --base-path ''

      - name: Project-path artifact
        run: |
          cp -a /tmp/alo186-proposal-canonical /tmp/alo186-proposal-project
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-proposal-project --base-path '/chatgpt' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-proposal-project --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-proposal-project --base-path '/chatgpt'
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-proposal-project --base-path '/chatgpt'

      - name: Artifact kabul sözleşmeleri
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          for root,prefix in [(Path('/tmp/alo186-proposal-custom'),''),(Path('/tmp/alo186-proposal-project'),'/chatgpt')]:
              route=root/'hesaplama/teknik-teklif-kapsam-karsilastirma/index.html'
              assert route.is_file()
              text=route.read_text(encoding='utf-8')
              assert 'Teknik Teklif Kapsam Karşılaştırma' in text
              assert 'Marka ve fiyat yok' in text
              assert 'amazon.com' not in text and 'amazon.com.tr' not in text
              assert 'type="email"' not in text and 'type="tel"' not in text and '<textarea' not in text
              hub=(root/'hesaplama/index.html').read_text(encoding='utf-8')
              tool_count=re.search(r'(\d+) çekirdek araç',hub)
              assert tool_count and int(tool_count.group(1)) >= 36
              assert 'data-alo186-proposal-hub="true"' in hub
              assert f'href="{prefix}/hesaplama/teknik-teklif-kapsam-karsilastirma/"' in hub
              assert 'data-alo186-proposal-card="true"' in (root/'elektrik-portali/index.html').read_text(encoding='utf-8')
              assert 'data-alo186-proposal-card="true"' in (root/'index.html').read_text(encoding='utf-8')
              assert 'data-alo186-proposal-section="true"' in (root/'hesaplama/teknik-devir-kabul-paketi/index.html').read_text(encoding='utf-8')
              assert 'data-alo186-proposal-section="true"' in (root/'kurumsal-elektrik-surekliligi-on-degerlendirme/index.html').read_text(encoding='utf-8')
              release=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
              assert release['proposalScopeReview']['candidateLimit']==3
              assert release['proposalScopeReview']['reviewDays']==14
              manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
              expected=f'{prefix}/hesaplama/teknik-teklif-kapsam-karsilastirma/'
              assert any(x.get('url')==expected for x in manifest.get('shortcuts',[]))
              assert expected in (root/'sw.js').read_text(encoding='utf-8')
          PY

      - name: Doğrulanmış teklif kapsamı artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-proposal-scope-pages
          path: /tmp/alo186-proposal-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
