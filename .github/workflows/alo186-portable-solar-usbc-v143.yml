name: ALO186 portable solar and USB-C growth v143

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/katlanabilir-gunes-paneli-power-station-uygunluk/**'
      - 'alo186/hesaplama/usb-c-hub-goruntu-pd-uygunluk/**'
      - 'alo186/sektor-rehberi/tasinabilir-enerji-ve-dijital-cihaz-uyumluluk-merkezi/**'
      - 'alo186/deployment/routing-overlays/143-portable-solar-usbc-growth.json'
      - 'alo186/tests/test_portable_solar_usbc_growth_v143.py'
      - '.github/workflows/alo186-portable-solar-usbc-v143.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-portable-solar-usbc-v143-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-and-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate compatibility decisions, affiliate gates and published routes
        run: python alo186/tests/test_portable_solar_usbc_growth_v143.py
