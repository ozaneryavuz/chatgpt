name: ALO186 kamp ve araç enerjisi büyümesi v190

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/tasinabilir-gunes-paneli-guc-istasyonu-uyumluluk/**'
      - 'alo186/hesaplama/12v-kamp-buzdolabi-guc-istasyonu-calisma-suresi/**'
      - 'alo186/amazon-elektrik-urunleri/kamp-arac-enerji-urun-secici/**'
      - 'alo186/deployment/routing-overlays/190-kamp-arac-enerji-growth.json'
      - 'alo186/audits/kamp-arac-enerji-growth-v190-2026-08-02.md'
      - 'alo186/tests/test_kamp_arac_enerji_growth_v190.py'
      - '.github/workflows/alo186-kamp-arac-enerji-v190.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/tasinabilir-gunes-paneli-guc-istasyonu-uyumluluk/**'
      - 'alo186/hesaplama/12v-kamp-buzdolabi-guc-istasyonu-calisma-suresi/**'
      - 'alo186/amazon-elektrik-urunleri/kamp-arac-enerji-urun-secici/**'
      - 'alo186/deployment/routing-overlays/190-kamp-arac-enerji-growth.json'
      - 'alo186/audits/kamp-arac-enerji-growth-v190-2026-08-02.md'
      - 'alo186/tests/test_kamp_arac_enerji_growth_v190.py'
      - '.github/workflows/alo186-kamp-arac-enerji-v190.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed kullanıcı güveni, JavaScript ve routing sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_kamp_arac_enerji_growth_v190.py
          python alo186/tests/test_kamp_arac_enerji_growth_v190.py
          python - <<'PY'
          import re
          from pathlib import Path
          files = [
              Path('alo186/hesaplama/tasinabilir-gunes-paneli-guc-istasyonu-uyumluluk/index.html'),
              Path('alo186/hesaplama/12v-kamp-buzdolabi-guc-istasyonu-calisma-suresi/index.html'),
              Path('alo186/amazon-elektrik-urunleri/kamp-arac-enerji-urun-secici/index.html'),
          ]
          for i, path in enumerate(files, 1):
              text = path.read_text(encoding='utf-8')
              scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
              assert scripts, path
              Path(f'/tmp/alo186-v190-{i}.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/alo186-v190-1.js
          node --check /tmp/alo186-v190-2.js
          node --check /tmp/alo186-v190-3.js
