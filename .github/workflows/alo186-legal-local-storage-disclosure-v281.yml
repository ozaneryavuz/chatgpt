name: ALO186 legal local storage disclosure v281

on:
  pull_request:
    paths:
      - 'alo186/gizlilik/index.html'
      - 'alo186/yasal/cerez/index.html'
      - 'alo186/hesaplama/outcome-bridge.js'
      - 'alo186/deployment/routing-overlays/english-core-run1.json'
      - 'alo186/deployment/routing-overlays/107-ga4-legal-pages.json'
      - 'alo186/tests/test_legal_local_storage_disclosure_v281.py'
      - '.github/workflows/alo186-legal-local-storage-disclosure-v281.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/gizlilik/index.html'
      - 'alo186/yasal/cerez/index.html'
      - 'alo186/hesaplama/outcome-bridge.js'
      - 'alo186/deployment/routing-overlays/english-core-run1.json'
      - 'alo186/deployment/routing-overlays/107-ga4-legal-pages.json'
      - 'alo186/tests/test_legal_local_storage_disclosure_v281.py'
      - '.github/workflows/alo186-legal-local-storage-disclosure-v281.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-legal-local-storage-v281-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Runtime ve hukukî açıklama sözleşmesi
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_legal_local_storage_disclosure_v281.py
          node --check alo186/hesaplama/outcome-bridge.js
          python alo186/tests/test_legal_local_storage_disclosure_v281.py

      - name: Mevcut gizlilik ve analitik regresyonları
        shell: bash
        run: |
          set -euo pipefail
          python alo186/tests/test_english_core.py
          python alo186/tests/test_ga4_consent_integration.py

      - name: Canonical production build ve static smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v281
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v281 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v281
          grep -q 'data-alo186-outcome-storage-disclosure-v281="true"' /tmp/alo186-v281/gizlilik/index.html
          grep -q 'data-alo186-outcome-storage-disclosure-v281="true"' /tmp/alo186-v281/yasal/cerez/index.html
          ! grep -Eq 'en fazla 7 gün|kalıcı depolama kullanmaz|yalnız sayfa açıkken bellekte' /tmp/alo186-v281/gizlilik/index.html /tmp/alo186-v281/yasal/cerez/index.html

      - name: Workflow yayın yetkisi taşımıyor
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'actions/(upload-pages-artifact|deploy-pages)' .github/workflows/alo186-legal-local-storage-disclosure-v281.yml
