name: Publish ALO186 Ürün Modülleri

on:
  push:
    branches: [main]
    paths:
      - "alo186/**"
      - ".github/workflows/alo186-fatura-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ALO186 testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          node alo186/tests/test_calc_core.js
          node alo186/tests/test_turkiye_search.js
          node alo186/tests/test_decision_rules.js
          node alo186/tests/test_product_matcher.js
          node alo186/tests/test_continuity_store.js
          node alo186/tests/test_release_manifest.js

      - name: Canonical rotalarla statik yayın paketini hazırla
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a alo186/. _site/

          copy_route() {
            source_path="$1"
            target_path="$2"
            rm -rf "_site/$target_path"
            mkdir -p "_site/$(dirname "$target_path")"
            cp -a "$source_path" "_site/$target_path"
          }

          mkdir -p _site/elektrik-portali
          cp alo186/index.html _site/elektrik-portali/index.html
          cp alo186/styles.css _site/elektrik-portali/styles.css

          copy_route alo186/turkiye-arama edas-bul
          copy_route alo186/urun-eslestirme akilli-urun-secimi
          copy_route alo186/sureklilik-paneli isletme-surekliligi
          copy_route alo186/yedek-guc-hesaplayici hesaplama/yedek-guc
          copy_route alo186/kesinti-maliyet-hesaplayici hesaplama/kesinti-maliyeti

          touch _site/.nojekyll

          test -f _site/elektrik-portali/index.html
          test -f _site/edas-bul/index.html
          test -f _site/karar-motoru/index.html
          test -f _site/hesaplama/index.html
          test -f _site/akilli-urun-secimi/index.html
          test -f _site/isletme-surekliligi/index.html
          test -f _site/fatura-analizi/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload ALO186 static modules
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
