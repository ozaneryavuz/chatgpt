name: Publish ALO186 Ürün Modülleri

on:
  push:
    branches: [main]
    paths:
      - "alo186/**"
      - ".github/workflows/alo186-fatura-pages.yml"
  pull_request:
    paths:
      - "alo186/**"
      - ".github/workflows/alo186-fatura-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ALO186 statik araç testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          node alo186/tests/test_calc_core.js
          node alo186/tests/test_turkiye_search.js
          node alo186/tests/test_decision_rules.js
          node alo186/tests/test_product_matcher.js
          node alo186/tests/test_continuity_store.js
          node alo186/tests/test_continuity_passport.js
          node alo186/tests/test_release_manifest.js

      - name: Preview ve üretim overlay paketlerini hazırla
        shell: bash
        run: |
          set -euo pipefail
          chmod +x alo186/deployment/build_static_site.sh
          alo186/deployment/build_static_site.sh _site preview
          alo186/deployment/build_static_site.sh _overlay overlay

          test -f _site/index.html
          test -f _site/elektrik-portali/index.html
          test -f _site/edas-bul/index.html
          test -f _site/karar-motoru/index.html
          test -f _site/hesaplama/index.html
          test -f _site/hesaplama/elektrik-surekliligi-pasaportu/index.html
          test -f _site/hesaplama/elektrik-surekliligi-pasaportu/passport.schema.json
          test -f _site/akilli-urun-secimi/index.html
          test -f _site/isletme-surekliligi/index.html
          test -f _site/fatura-analizi/index.html
          test -f _overlay/.htaccess
          test -f _overlay/tailwindcss
          test -f _overlay/SHA256SUMS
          test ! -s _overlay/tailwindcss || grep -q 'Temporary compatibility stylesheet' _overlay/tailwindcss
          grep -q 'Strict-Transport-Security' _overlay/.htaccess
          grep -q 'X-Content-Type-Options' _overlay/.htaccess
          grep -q 'Content-Security-Policy' _overlay/.htaccess
          grep -q 'ForceType text/css' _overlay/.htaccess
          grep -q 'tailwindcss' _overlay/SHA256SUMS
          test ! -e _site/sureklilik-api
          test ! -e _site/tests
          test ! -e _overlay/sureklilik-api
          test ! -e _overlay/tests

      - name: GitHub Pages ön izleme paketini sakla
        uses: actions/upload-artifact@v4
        with:
          name: alo186-pages-preview
          path: _site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Natro / mevcut hosting üretim overlay paketini sakla
        uses: actions/upload-artifact@v4
        with:
          name: alo186-production-overlay
          path: _overlay
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Configure Pages
        if: vars.ALO186_GITHUB_PAGES_ENABLED == 'true' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: vars.ALO186_GITHUB_PAGES_ENABLED == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: vars.ALO186_GITHUB_PAGES_ENABLED == 'true' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
