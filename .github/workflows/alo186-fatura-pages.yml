name: Build ALO186 legacy preview and rollback artifacts

on:
  push:
    branches: [main]
    paths:
      - "alo186/**"
      - ".github/workflows/alo186-fatura-pages.yml"
  pull_request:
    paths:
      - "alo186/**"
      - ".github/workflows/alo186-fatura-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-legacy-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ALO186 statik araç testlerini çalıştır
        shell: bash
        run: |
          set -euo pipefail
          node alo186/tests/test_calc_core.js
          node alo186/tests/test_turkiye_search.js
          node alo186/tests/test_decision_rules.js
          node alo186/tests/test_product_matcher.js
          node alo186/tests/test_continuity_store.js
          node alo186/tests/test_continuity_passport.js
          node alo186/tests/test_release_manifest.js

      - name: Eski hosting için yalnız rollback paketlerini hazırla
        shell: bash
        run: |
          set -euo pipefail
          chmod +x alo186/deployment/build_static_site.sh
          alo186/deployment/build_static_site.sh _site preview
          alo186/deployment/build_static_site.sh _overlay overlay

          test -f _site/index.html
          test -f _site/elektrik-portali/index.html
          test -f _site/edas-bul/index.html
          test -f _site/karar-motoru/index.html
          test -f _site/hesaplama/index.html
          test -f _site/akilli-urun-secimi/index.html
          test -f _site/isletme-surekliligi/index.html
          test -f _overlay/.htaccess
          test -f _overlay/SHA256SUMS
          test ! -e _site/tests
          test ! -e _overlay/tests

      - name: Eski preview paketini sakla
        uses: actions/upload-artifact@v4
        with:
          name: alo186-legacy-preview
          path: _site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Eski hosting rollback overlay paketini sakla
        uses: actions/upload-artifact@v4
        with:
          name: alo186-legacy-hosting-rollback
          path: _overlay
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Mimari not
        run: |
          {
            echo '## ALO186 eski hosting artifactı'
            echo
            echo 'Bu workflow yalnız geri dönüş/karşılaştırma paketi üretir.'
            echo 'Canlı birincil yayın `.github/workflows/alo186-github-pages.yml` üzerinden GitHub Pages’e yapılır.'
          } >> "$GITHUB_STEP_SUMMARY"
