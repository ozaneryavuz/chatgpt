name: ALO186 internet sürekliliği ve modem ONT yedekleme v197

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/fiber-internet-modem-ont-mini-ups-calisma-suresi/**'
      - 'alo186/amazon-elektrik-urunleri/modem-ont-mini-ups-yedekleme-secici/**'
      - 'alo186/sektor-rehberi/internet-kesintisi-elektrik-mi-operator-mu-test-merkezi/**'
      - 'alo186/audits/internet-continuity-growth-v197-2026-08-02.md'
      - 'alo186/deployment/routing-overlays/197-internet-continuity-growth.json'
      - 'alo186/tests/test_internet_continuity_growth_v197.py'
      - '.github/workflows/alo186-internet-continuity-v197.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/fiber-internet-modem-ont-mini-ups-calisma-suresi/**'
      - 'alo186/amazon-elektrik-urunleri/modem-ont-mini-ups-yedekleme-secici/**'
      - 'alo186/sektor-rehberi/internet-kesintisi-elektrik-mi-operator-mu-test-merkezi/**'
      - 'alo186/audits/internet-continuity-growth-v197-2026-08-02.md'
      - 'alo186/deployment/routing-overlays/197-internet-continuity-growth.json'
      - 'alo186/tests/test_internet_continuity_growth_v197.py'
      - '.github/workflows/alo186-internet-continuity-v197.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail-closed internet sürekliliği ve ticari güven sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_internet_continuity_growth_v197.py
          python alo186/tests/test_internet_continuity_growth_v197.py
      - name: Sayfa JavaScript sözdizimi
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          pages = [
              Path('alo186/hesaplama/fiber-internet-modem-ont-mini-ups-calisma-suresi/index.html'),
              Path('alo186/amazon-elektrik-urunleri/modem-ont-mini-ups-yedekleme-secici/index.html'),
              Path('alo186/sektor-rehberi/internet-kesintisi-elektrik-mi-operator-mu-test-merkezi/index.html'),
          ]
          for page in pages:
              html = page.read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?![^>]*application/ld\+json)[^>]*>(.*?)</script>', html, re.S | re.I)
              assert scripts, f'javascript missing: {page}'
              for index, script in enumerate(scripts):
                  target = Path(tempfile.gettempdir()) / f'{page.parent.name}-{index}.js'
                  target.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(target)], check=True)
          PY
      - name: Routing overlay JSON
        run: python -m json.tool alo186/deployment/routing-overlays/197-internet-continuity-growth.json >/dev/null
