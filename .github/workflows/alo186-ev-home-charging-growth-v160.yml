name: ALO186 EV home charging growth v160

on:
  pull_request:
    paths:
      - "alo186/hesaplama/elektrikli-arac-evde-sarj-priz-uzatma-kablosu-guvenligi/**"
      - "alo186/hesaplama/elektrikli-arac-tasinabilir-sarj-cihazi-ic-cpd-tip2-uygunluk/**"
      - "alo186/sektor-rehberi/elektrikli-arac-evde-sarj-guvenlik-test-merkezi/**"
      - "alo186/deployment/routing-overlays/160-ev-home-charging-growth.json"
      - "alo186/audits/ev-home-charging-growth-v160-2026-08-01.md"
      - "alo186/tests/test_ev_home_charging_growth_v160.py"
      - ".github/workflows/alo186-ev-home-charging-growth-v160.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/elektrikli-arac-evde-sarj-priz-uzatma-kablosu-guvenligi/**"
      - "alo186/hesaplama/elektrikli-arac-tasinabilir-sarj-cihazi-ic-cpd-tip2-uygunluk/**"
      - "alo186/sektor-rehberi/elektrikli-arac-evde-sarj-guvenlik-test-merkezi/**"
      - "alo186/deployment/routing-overlays/160-ev-home-charging-growth.json"
      - "alo186/tests/test_ev_home_charging_growth_v160.py"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python alo186/tests/test_ev_home_charging_growth_v160.py
