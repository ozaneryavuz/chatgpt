name: ALO186 subscription deposit refund v376

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-guvence-bedeli-iadesi-kac-gunde-nasil-alinir-2026/**'
      - 'alo186/hesaplama/elektrik-guvence-bedeli-iade-takibi/**'
      - 'alo186/abonelik-ve-guvence-bedeli-kontrol-merkezi/**'
      - 'alo186/content/commerce/subscription-deposit-refund-v376.json'
      - 'alo186/deployment/routing-overlays/subscription-deposit-refund-v376.json'
      - 'alo186/tests/test_subscription_deposit_refund_v376.py'
      - '.github/workflows/alo186-subscription-deposit-refund-v376.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-guvence-bedeli-iadesi-kac-gunde-nasil-alinir-2026/**'
      - 'alo186/hesaplama/elektrik-guvence-bedeli-iade-takibi/**'
      - 'alo186/abonelik-ve-guvence-bedeli-kontrol-merkezi/**'
      - 'alo186/content/commerce/subscription-deposit-refund-v376.json'
      - 'alo186/deployment/routing-overlays/subscription-deposit-refund-v376.json'
      - 'alo186/tests/test_subscription_deposit_refund_v376.py'
      - '.github/workflows/alo186-subscription-deposit-refund-v376.yml'

permissions:
  contents: read

concurrency:
  group: alo186-subscription-deposit-v376-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: v376 trust privacy no-buy and commerce checks
        run: python alo186/tests/test_subscription_deposit_refund_v376.py
      - name: Canonical production build and smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v376
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v376 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v376
      - name: Verify routes sitemap schema and zero merchant links
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-v376')
          routes = [
              '/haberler/elektrik-guvence-bedeli-iadesi-kac-gunde-nasil-alinir-2026/',
              '/hesaplama/elektrik-guvence-bedeli-iade-takibi/',
              '/abonelik-ve-guvence-bedeli-kontrol-merkezi/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 376, release['routingVersion']
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              html = page.read_text(encoding='utf-8')
              low = html.casefold()
              canonical = f'https://alo186.com{route}'
              assert canonical in sitemap or canonical.rstrip('/') in sitemap, canonical
              assert f'<link rel="canonical" href="{canonical}">' in html
              assert 'amazon.com.tr' not in low
              assert 'amzn.to' not in low
              assert 'pricecurrency' not in low
              assert '"@type":"product"' not in low
              assert '"@type":"offer"' not in low
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes, 'newMerchantLinks': 0})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-subscription-deposit-v376-${{ github.sha }}
          path: /tmp/alo186-v376
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
