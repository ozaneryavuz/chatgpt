name: ALO186 Live Technical Quality Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-live-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run static crawl, indexability, canonical, schema and link checks
        run: python3 .github/scripts/alo186_live_static_audit.py

      - name: Install browser audit dependencies
        run: npm install --no-save playwright-core@1.54.1 axe-core@4.10.3

      - name: Run mobile and desktop browser audits
        run: node .github/scripts/alo186_live_browser_audit.mjs

      - name: Run repeated root Lighthouse audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/lighthouse
          for profile in mobile desktop; do
            for run in 1 2 3; do
              extra=()
              if [[ "$profile" == "desktop" ]]; then extra+=(--preset=desktop); fi
              npx --yes lighthouse@latest https://www.alo186.com/ \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json \
                --output-path="artifacts/lighthouse/root-${profile}-${run}.json" \
                --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
                --throttling-method=simulate \
                --quiet "${extra[@]}"
            done
          done

      - name: Run representative mobile Lighthouse audits
        shell: bash
        run: |
          set -euo pipefail
          declare -A pages=(
            [kesinti]="https://www.alo186.com/elektrik-kesintisi"
            [il-mugla]="https://www.alo186.com/il/mugla"
            [rehber]="https://www.alo186.com/sektor-rehberi/planli-elektrik-kesintisi-sorgulama"
            [haberler]="https://www.alo186.com/haberler"
            [iletisim]="https://www.alo186.com/iletisim"
          )
          for name in "${!pages[@]}"; do
            npx --yes lighthouse@latest "${pages[$name]}" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="artifacts/lighthouse/${name}-mobile.json" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --throttling-method=simulate \
              --quiet
          done

      - name: Build Lighthouse summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'artifacts/lighthouse';
          const files = fs.readdirSync(dir).filter(n => n.endsWith('.json')).sort();
          const rows = files.map(file => {
            const report = JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
            const c = report.categories || {}, a = report.audits || {};
            const score = id => Math.round((c[id]?.score ?? 0)*100);
            const metric = id => a[id]?.numericValue ?? null;
            return { file, url: report.finalDisplayedUrl || report.finalUrl, performance: score('performance'), accessibility: score('accessibility'), bestPractices: score('best-practices'), seo: score('seo'), fcpMs: metric('first-contentful-paint'), lcpMs: metric('largest-contentful-paint'), tbtMs: metric('total-blocking-time'), cls: metric('cumulative-layout-shift'), speedIndexMs: metric('speed-index'), console: a['errors-in-console']?.details?.items ?? [], failedAudits: Object.values(a).filter(x => typeof x.score === 'number' && x.score < 1 && !['notApplicable','manual','informative'].includes(x.scoreDisplayMode)).map(x => ({id:x.id,title:x.title,score:x.score,displayValue:x.displayValue ?? null})).slice(0,40) };
          });
          const roots = rows.filter(r => r.file.startsWith('root-'));
          const medians = {};
          for (const profile of ['mobile','desktop']) {
            const group = roots.filter(r => r.file.includes(`-${profile}-`)).sort((a,b)=>a.performance-b.performance);
            if (group.length) medians[profile] = group[Math.floor(group.length/2)];
          }
          const summary = { generatedAt:new Date().toISOString(), rows, medians };
          fs.writeFileSync('artifacts/lighthouse-summary.json', JSON.stringify(summary,null,2));
          const ms = v => v == null ? '—' : `${Math.round(v)} ms`;
          const lines = ['# ALO186 Lighthouse özeti','','| Dosya | Perf | A11y | BP | SEO | FCP | LCP | TBT | CLS |','|---|---:|---:|---:|---:|---:|---:|---:|---:|',...rows.map(r=>`| ${r.file} | ${r.performance} | ${r.accessibility} | ${r.bestPractices} | ${r.seo} | ${ms(r.fcpMs)} | ${ms(r.lcpMs)} | ${ms(r.tbtMs)} | ${r.cls ?? '—'} |`)];
          fs.writeFileSync('artifacts/lighthouse-summary.md', lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          NODE

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-technical-quality
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
