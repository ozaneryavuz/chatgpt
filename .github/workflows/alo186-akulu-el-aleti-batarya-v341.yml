name: ALO186 akülü el aleti batarya ve şarj uygunluk testi

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/akulu-el-aleti-batarya-sarj-uygunluk/**'
      - 'alo186/deployment/routing-overlays/099-akulu-el-aleti-batarya-sarj-uygunluk.json'
      - 'alo186/tests/test_akulu_el_aleti_batarya_sarj_v340.py'
      - '.github/workflows/alo186-akulu-el-aleti-batarya-v341.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/akulu-el-aleti-batarya-sarj-uygunluk/**'
      - 'alo186/deployment/routing-overlays/099-akulu-el-aleti-batarya-sarj-uygunluk.json'
      - 'alo186/tests/test_akulu_el_aleti_batarya_sarj_v340.py'
      - '.github/workflows/alo186-akulu-el-aleti-batarya-v341.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-akulu-el-aleti-batarya-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Karar motoru, batarya güvenliği ve entegrasyon
        run: |
          set -euo pipefail
          node alo186/hesaplama/akulu-el-aleti-batarya-sarj-uygunluk/app.test.js
          node --check alo186/hesaplama/akulu-el-aleti-batarya-sarj-uygunluk/app.js
          python alo186/tests/test_akulu_el_aleti_batarya_sarj_v340.py

      - name: Mevcut yayın ve güven regresyonları
        run: |
          set -euo pipefail
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical üretim ve statik smoke
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py --output /tmp/alo186-tool-battery-canonical --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-tool-battery-canonical

      - name: Custom-domain ve project-path Pages kabulü
        run: |
          set -euo pipefail
          for target in custom project; do cp -a /tmp/alo186-tool-battery-canonical "/tmp/alo186-tool-battery-$target"; done
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-tool-battery-custom --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-tool-battery-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-tool-battery-custom --base-path '' > /tmp/alo186-tool-battery-custom.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-tool-battery-custom --base-path ''
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-tool-battery-project --base-path '/chatgpt' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-tool-battery-project --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-tool-battery-project --base-path '/chatgpt' > /tmp/alo186-tool-battery-project.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-tool-battery-project --base-path '/chatgpt'

      - name: Sitemap, Teknik Arama, affiliate ve gizlilik kabulü
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          canonical = '/hesaplama/akulu-el-aleti-batarya-sarj-uygunluk/'
          relative = 'hesaplama/akulu-el-aleti-batarya-sarj-uygunluk'
          for root, prefix in [(Path('/tmp/alo186-tool-battery-custom'), ''), (Path('/tmp/alo186-tool-battery-project'), '/chatgpt')]:
              page, app, css = root / relative / 'index.html', root / relative / 'app.js', root / relative / 'styles.css'
              assert all(path.is_file() for path in [page, app, css])
              html, js = page.read_text(encoding='utf-8'), app.read_text(encoding='utf-8')
              expected = f'{prefix}{canonical}' if prefix else canonical
              assert canonical in (root / 'sitemap.xml').read_text(encoding='utf-8')
              search = json.loads((root / 'arama/search-index.json').read_text(encoding='utf-8'))
              entry = next(item for item in search['entries'] if item['canonicalPath'] == canonical)
              assert entry['url'].endswith(canonical) and entry['url'] in {canonical, expected}
              assert 'Amazon Türkiye satış ortaklığı açıklaması' in html
              assert 'sponsored nofollow noopener' in html and 'alo186rehber-21' in js
              assert all(token not in js for token in ['localStorage', 'sessionStorage', 'fetch(', 'geolocation'])
              assert "baseResult('no_buy'" in js and "baseResult('emergency'" in js
              assert 'Üçüncü taraf batarya adaptörüyle şarj etmeyin' in js
              assert 'Geri çağrılmış ürünü kullanmayın' in js
              assert 'batteryWh' in js and 'chargeHours' in js
              assert '"@type":"Product"' not in html and '"@type":"Offer"' not in html
          print(json.dumps({'ok': True, 'route': canonical, 'scenarios': 38, 'affiliateTripleGate': True, 'noBuy': True, 'emergencyAffiliateBlocked': True, 'adapterBlocked': True, 'personalData': False, 'storage': False, 'searchIndexed': True, 'revisitDays': 120}, ensure_ascii=False))
          PY

      - name: Doğrulanmış site artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-akulu-el-aleti-batarya-v341-pages
          path: /tmp/alo186-tool-battery-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
