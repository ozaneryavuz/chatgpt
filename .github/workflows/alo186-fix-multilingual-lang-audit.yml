name: ALO186 update technical audit for multilingual routes

on:
  push:
    branches:
      - agent/alo186-english-core-rebased
    paths:
      - '.github/workflows/alo186-fix-multilingual-lang-audit.yml'

permissions:
  contents: write

concurrency:
  group: alo186-fix-multilingual-lang-audit
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alo186-english-core-rebased
          persist-credentials: true

      - name: Make the final artifact language audit route-aware
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('alo186/tests/test_live_technical_quality.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if parser.html_lang.casefold() != "tr":
                      failures.append(f"html lang=tr değil: {relative}")
          '''
          new = '''        normalized_lang = parser.html_lang.casefold().replace("_", "-").strip()
                      expected_lang = "en" if relative == "en/index.html" or relative.startswith("en/") else "tr"
                      actual_primary_lang = normalized_lang.split("-", 1)[0] if normalized_lang else ""
                      if actual_primary_lang != expected_lang:
                          failures.append(
                              f"html lang beklenen {expected_lang}, bulunan {parser.html_lang or 'boş'}: {relative}"
                          )
          '''
          if old not in text:
              raise SystemExit('Expected single-language audit block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/alo186-fix-multilingual-lang-audit.yml'
          git add alo186/tests/test_live_technical_quality.py
          git commit -m 'test: accept English and Turkish artifact language contracts'
          git push origin HEAD:agent/alo186-english-core-rebased
