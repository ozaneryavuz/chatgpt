name: ALO186 pelet sobası kesinti güvenliği v276

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-pelet-sobasi-calisir-mi/**'
      - 'alo186/hesaplama/pelet-sobasi-elektrik-kesintisi-guvenli-kapanma-plani/**'
      - 'alo186/deployment/routing-overlays/growth-v276-pellet-stove-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/pellet-stove-outage-v276.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v276_pellet_stove_outage.py'
      - '.github/workflows/alo186-growth-v276-pellet-stove-outage.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-pelet-sobasi-calisir-mi/**'
      - 'alo186/hesaplama/pelet-sobasi-elektrik-kesintisi-guvenli-kapanma-plani/**'
      - 'alo186/deployment/routing-overlays/growth-v276-pellet-stove-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/pellet-stove-outage-v276.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v276_pellet_stove_outage.py'
      - '.github/workflows/alo186-growth-v276-pellet-stove-outage.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v276-pellet-stove-outage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Pelet sobası güvenlik, gizlilik ve ticari sınır
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v276_pellet_stove_outage.py
          python alo186/tests/test_growth_v276_pellet_stove_outage.py
          python -m json.tool alo186/deployment/routing-overlays/growth-v276-pellet-stove-outage.json >/dev/null
          python -m json.tool alo186/deployment/affiliate-category-decisions/pellet-stove-outage-v276.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v276
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v276 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v276
          test -f /tmp/alo186-v276/haberler/elektrik-kesilince-pelet-sobasi-calisir-mi/index.html
          test -f /tmp/alo186-v276/hesaplama/pelet-sobasi-elektrik-kesintisi-guvenli-kapanma-plani/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v276
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v276 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-sites-v276')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-pelet-sobasi-calisir-mi/',
              '/hesaplama/pelet-sobasi-elektrik-kesintisi-guvenli-kapanma-plani/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for path in expected:
              assert not pages[path]['affiliate']['unsafeStaticLinks']
              assert pages[path]['affiliate']['hasAffiliateLinks'] is False
          print(json.dumps({
              'ok': True,
              'routes': sorted(expected),
              'consumerPelletStoveAffiliate': False,
              'unsafeStaticLinks': 0,
          }, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v276 pelet sobası kesinti güvenliği

          - Arama niyeti: elektrik kesilince pelet sobası çalışır mı / pelet sobası UPS ile çalışır mı
          - Ücretsiz araç: CO-duman sınırı, model kılavuzu, baca, üretici onayı ve gerçek test
          - Mevcut çözüm yeterliyse: yeni ürün almayın
          - Pelet sobası UPS/inverter/akü: consumer affiliate değil, professional-only
          - Güvenli gelir yolu: yetkili servis/profesyonel değerlendirme; yalnız gerçek CO alarmı eksiğinde mevcut açıklamalı CO alarmı rehberi
          - Fiyat, stok, puan, yorum, teslimat, garanti, Product, Offer ve AggregateRating: yok
          - 30/90/365 günlük tekrar ziyaret: yerel takvim dosyası
          EOF
