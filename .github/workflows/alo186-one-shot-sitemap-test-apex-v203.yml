name: ALO186 one-shot sitemap test apex v203

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/alo186-one-shot-sitemap-test-apex-v203.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  migrate-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/alo186-apex-canonical-contract-v203'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-apex-canonical-contract-v203
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Align only sitemap assertions to apex
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/alo186-one-shot-sitemap-test-apex-v203.yml')
          js_old = r'https:\/\/www\.alo186\.com'
          js_new = r'https:\/\/alo186\.com'
          plain_old = 'https://www.alo186.com'
          plain_new = 'https://alo186.com'
          changed = []

          candidates = []
          for pattern in ('**/test.js', 'tests/test*.js', 'tests/test*.py'):
              candidates.extend(Path('alo186').glob(pattern))

          for path in sorted(set(candidates)):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              output = []
              replacements = 0
              for line in lines:
                  updated = line
                  if 'sitemap' in line.lower():
                      updated = updated.replace(js_old, js_new).replace(plain_old, plain_new)
                  if updated != line:
                      replacements += 1
                  output.append(updated)
              if replacements:
                  path.write_text(''.join(output), encoding='utf-8')
                  changed.append((path.as_posix(), replacements))

          if not changed:
              raise SystemExit('No legacy www sitemap assertions were found.')
          for item in changed:
              print(item)
          helper.unlink()
          PY

      - name: Run changed JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -- 'alo186/**/test.js' | while read -r file; do
            [ -n "$file" ] || continue
            node "$file"
          done

      - name: Commit verified test migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(alo186): align sitemap assertions with apex canonical"
          git push origin HEAD:fix/alo186-apex-canonical-contract-v203
