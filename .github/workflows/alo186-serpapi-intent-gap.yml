name: ALO186 SerpApi niyet ve rakip boşluğu

on:
  workflow_dispatch:
  schedule:
    # Europe/Istanbul 08:40; 8 sorgu/gün yaklaşık 240 arama/30 gün.
    - cron: '40 5 * * *'
  pull_request:
    paths:
      - 'alo186/growth/serpapi/**'
      - 'alo186/hesaplama/kesinti-sonrasi-guvenli-yeniden-baslatma-plani/**'
      - 'alo186/hesaplama/kesinti-hazirlik-kontrolu/**'
      - 'alo186/deployment/routing-overlays/growth-run6-v257.json'
      - 'alo186/tests/test_growth_run6_serpapi_recovery.py'
      - '.github/workflows/alo186-serpapi-intent-gap.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/growth/serpapi/**'
      - 'alo186/hesaplama/kesinti-sonrasi-guvenli-yeniden-baslatma-plani/**'
      - 'alo186/hesaplama/kesinti-hazirlik-kontrolu/**'
      - 'alo186/deployment/routing-overlays/growth-run6-v257.json'
      - 'alo186/tests/test_growth_run6_serpapi_recovery.py'
      - '.github/workflows/alo186-serpapi-intent-gap.yml'

permissions:
  contents: read

concurrency:
  group: alo186-serpapi-intent-gap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kod, sayfa ve bütçe sözleşmesini doğrula
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/growth/serpapi/serpapi_intent_gap.py \
            alo186/tests/test_growth_run6_serpapi_recovery.py
          python -m json.tool alo186/growth/serpapi/intent-watch.json >/dev/null
          python -m json.tool alo186/deployment/routing-overlays/growth-run6-v257.json >/dev/null
          python alo186/tests/test_growth_run6_serpapi_recovery.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('alo186/growth/serpapi/intent-watch.json').read_text(encoding='utf-8'))
          queries=data['queries']
          assert 1 <= len(queries) <= 8
          assert len({item['query'] for item in queries}) == len(queries)
          assert all(item['commercialMode'] in {'closed','technical-gate'} for item in queries)
          assert all(item['targetRoute'].startswith('/') for item in queries)
          print({'ok': True, 'dailyQueries': len(queries), 'estimated30DaySearches': len(queries)*30})
          PY

  collect:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SerpApi anahtarı yoksa güvenli biçimde dur
        if: ${{ env.SERPAPI_API_KEY == '' }}
        run: |
          echo '## ALO186 SerpApi radarı' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '`SERPAPI_API_KEY` repository secret tanımlı olmadığı için arama yapılmadı.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Anahtar asla kaynak koda veya artifacta yazılmamalıdır.' >> "$GITHUB_STEP_SUMMARY"

      - name: Güncel Google SERP verisini topla
        if: ${{ env.SERPAPI_API_KEY != '' }}
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-serpapi
          python alo186/growth/serpapi/serpapi_intent_gap.py \
            --config alo186/growth/serpapi/intent-watch.json \
            --output /tmp/alo186-serpapi

      - name: Raporu artifact olarak yükle
        if: ${{ env.SERPAPI_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: alo186-serpapi-growth-${{ github.run_id }}
          path: /tmp/alo186-serpapi
          if-no-files-found: error
          retention-days: 90

      - name: İlk üç aksiyonu özetle
        if: ${{ env.SERPAPI_API_KEY != '' }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/alo186-serpapi/serpapi-growth-report.json').read_text(encoding='utf-8'))
          print('## ALO186 SerpApi niyet ve rakip boşluğu')
          print()
          print(f"- Başarılı sorgu: **{report['queryCount']}**")
          print(f"- Hata: **{len(report['errors'])}**")
          print()
          for item in report['topActions']:
              print(f"### {item['priority']}. {item['query']}")
              print(f"- Hedef: `{item['targetRoute']}`")
              print(f"- Gap: **{item['gapScore']}/100**")
              print(f"- Aksiyon: {item['recommendedAction']}")
              print(f"- Ticari mod: `{item['commercialMode']}`")
              print()
          PY
