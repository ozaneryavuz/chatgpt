name: Gulfstream history probe 2026-08-16

on:
  push:
    branches:
      - gulfstream-live-20260816-1806
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pandas
      - name: Fetch one historical Gulfstream program and result
        shell: bash
        run: |
          mkdir -p gulfstream_probe
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import requests, json
          from bs4 import BeautifulSoup
          import pandas as pd

          out=Path('gulfstream_probe')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'tr-TR,tr;q=0.9'})
          date='09/08/2026'; city='Gulfstream Park ABD'; city_id=85
          bases={
            'program_city':'https://www.tjk.org/TR/YarisSever/Info/Sehir/GunlukYarisProgrami',
            'program_page':'https://www.tjk.org/TR/YarisSever/Info/Page/GunlukYarisProgrami',
            'result_city':'https://www.tjk.org/TR/YarisSever/Info/Sehir/GunlukYarisSonuclari',
            'result_page':'https://www.tjk.org/TR/YarisSever/Info/Page/GunlukYarisSonuclari',
            'result_foreign':'https://www.tjk.org/TR/YarisSever/Info/Page/GunlukYurtdisiYarisSonuclari',
          }
          audit={}
          for key,base in bases.items():
            url=base+'?Era=lastMonth&QueryParameter_Tarih='+quote(date,safe='')+'&SehirAdi='+quote(city,safe='')+'&SehirId=85&sehir-id=85'
            r=s.get(url,timeout=45,allow_redirects=True)
            audit[key]={'url':url,'status':r.status_code,'bytes':len(r.content),'final':r.url}
            (out/(key+'.html')).write_bytes(r.content)
            soup=BeautifulSoup(r.content,'lxml')
            (out/(key+'.txt')).write_text('\n'.join(soup.stripped_strings),encoding='utf-8')
            tables=[]
            for i,t in enumerate(soup.find_all('table')):
              rows=[]
              for tr in t.find_all('tr'):
                cells=[c.get_text(' ',strip=True) for c in tr.find_all(['th','td'])]
                if cells: rows.append(cells)
              if rows:
                tables.append({'i':i,'rows':rows[:8]})
            audit[key]['tables']=len(tables)
            audit[key]['table_samples']=tables[:12]
          (out/'audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:{kk:v[kk] for kk in ('status','bytes','tables')} for k,v in audit.items()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gulfstream-history-probe
          path: gulfstream_probe
          if-no-files-found: error
          retention-days: 2
