name: ALO186 içerik otoritesi 84 rehber

on:
  pull_request:
    paths:
      - 'alo186/haberler/rcd-rccb-rcbo-farki/**'
      - 'alo186/haberler/dusuk-yuksek-voltaj-edas-teknik-kalite-olcumu/**'
      - 'alo186/haberler/lifepo4-dusuk-sicaklikta-sarj-edilir-mi/**'
      - 'alo186/deployment/routing-overlays/content-authority-84-run13.json'
      - 'alo186/deployment/build_static_site.py'
      - 'alo186/tests/test_authority_overlay_84.js'
      - '.github/workflows/alo186-authority-84.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/rcd-rccb-rcbo-farki/**'
      - 'alo186/haberler/dusuk-yuksek-voltaj-edas-teknik-kalite-olcumu/**'
      - 'alo186/haberler/lifepo4-dusuk-sicaklikta-sarj-edilir-mi/**'
      - 'alo186/deployment/routing-overlays/content-authority-84-run13.json'
      - 'alo186/deployment/build_static_site.py'
      - 'alo186/tests/test_authority_overlay_84.js'
      - '.github/workflows/alo186-authority-84.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-authority-84-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Önceki içerik otoritesi regresyonları
        run: |
          node alo186/tests/test_authority_content.js
          node alo186/tests/test_authority_overlay_78.js

      - name: Run 13 üç yeni içerik ve etkili routing
        run: node alo186/tests/test_authority_overlay_84.js

      - name: JSON XML ve Python sözdizimi
        shell: bash
        run: |
          python -m py_compile alo186/deployment/build_static_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          json.loads(Path('alo186/deployment/routing-overlays/content-authority-84-run13.json').read_text(encoding='utf-8'))
          ET.parse('alo186/sitemap.xml')
          PY

      - name: Canonical ve cihaz hasarı güvenlik regresyonları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Etkili production bundle ve sitemap
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-authority-84 \
            --commit "$GITHUB_SHA" \
            > /tmp/alo186-authority-84-release.json
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-authority-84
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/alo186-authority-84')
          release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
          # Run 13 tarihsel alt sınırını koru; daha yeni routing ve makale
          # genişlemelerini eski snapshot testi nedeniyle reddetme.
          assert release['routingVersion']>=38, release
          assert release['articleCount']>=84, release
          assert release['routeCount']>=127, release
          assert 'content-authority-84-run13.json' in release['routingOverlays']
          for slug in (
              'rcd-rccb-rcbo-farki',
              'dusuk-yuksek-voltaj-edas-teknik-kalite-olcumu',
              'lifepo4-dusuk-sicaklikta-sarj-edilir-mi',
          ):
              assert (root/'haberler'/slug/'index.html').is_file(), slug
              assert f'https://www.alo186.com/haberler/{slug}' in (root/'sitemap.xml').read_text(encoding='utf-8')
          PY

      - name: GitHub Pages custom-domain testi
        run: |
          cp -a /tmp/alo186-authority-84 /tmp/alo186-authority-84-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-authority-84-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-authority-84-custom \
            --base-path ''
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-authority-84-custom \
            --base-path ''
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-authority-84-custom \
            --base-path ''

      - name: GitHub Pages project-path testi
        run: |
          cp -a /tmp/alo186-authority-84 /tmp/alo186-authority-84-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-authority-84-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-authority-84-project \
            --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py \
            --site /tmp/alo186-authority-84-project \
            --base-path '/chatgpt'
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-authority-84-project \
            --base-path '/chatgpt'

      - name: Doğrulanmış 84 rehber artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-authority-84-pages
          path: /tmp/alo186-authority-84-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
