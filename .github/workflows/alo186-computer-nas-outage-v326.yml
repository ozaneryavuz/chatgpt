name: ALO186 computer NAS outage journey v326

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesintisi-bilgisayara-zarar-verir-mi/**'
      - 'alo186/hesaplama/bilgisayar-nas-elektrik-kesintisi-hazirlik-plani/**'
      - 'alo186/amazon-elektrik-urunleri/bilgisayar-nas-ups-secimi/**'
      - 'alo186/deployment/routing-overlays/computer-nas-outage-journey-v326.json'
      - 'alo186/tests/test_computer_nas_outage_journey_v326.py'
      - '.github/workflows/alo186-computer-nas-outage-v326.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesintisi-bilgisayara-zarar-verir-mi/**'
      - 'alo186/hesaplama/bilgisayar-nas-elektrik-kesintisi-hazirlik-plani/**'
      - 'alo186/amazon-elektrik-urunleri/bilgisayar-nas-ups-secimi/**'
      - 'alo186/deployment/routing-overlays/computer-nas-outage-journey-v326.json'
      - 'alo186/tests/test_computer_nas_outage_journey_v326.py'
      - '.github/workflows/alo186-computer-nas-outage-v326.yml'

permissions:
  contents: read

concurrency:
  group: alo186-computer-nas-v326-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Trust privacy affiliate and conversion checks
        run: python alo186/tests/test_computer_nas_outage_journey_v326.py
      - name: Build canonical site bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-computer-nas-v326
          python alo186/deployment/build_static_site.py --output /tmp/alo186-computer-nas-v326 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-computer-nas-v326
      - name: Verify routes and sitemap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-computer-nas-v326')
          routes = [
            '/haberler/elektrik-kesintisi-bilgisayara-zarar-verir-mi/',
            '/hesaplama/bilgisayar-nas-elektrik-kesintisi-hazirlik-plani/',
            '/amazon-elektrik-urunleri/bilgisayar-nas-ups-secimi/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 326
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              assert f'https://alo186.com{route}' in sitemap
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-computer-nas-v326-${{ github.sha }}
          path: /tmp/alo186-computer-nas-v326
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
