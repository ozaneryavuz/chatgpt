name: ALO186 mobil hotspot ve failover v199

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/mobil-hotspot-yedek-internet-veri-gb-batarya-sure-hesabi/**'
      - 'alo186/amazon-elektrik-urunleri/mobil-hotspot-4g-5g-yedek-internet-secici/**'
      - 'alo186/sektor-rehberi/mobil-internet-failover-30-90-gun-test-merkezi/**'
      - 'alo186/audits/mobile-hotspot-failover-growth-v199-2026-08-02.md'
      - 'alo186/deployment/routing-overlays/199-mobile-hotspot-failover-growth.json'
      - 'alo186/tests/test_mobile_hotspot_failover_growth_v199.py'
      - '.github/workflows/alo186-mobile-hotspot-failover-v199.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/mobil-hotspot-yedek-internet-veri-gb-batarya-sure-hesabi/**'
      - 'alo186/amazon-elektrik-urunleri/mobil-hotspot-4g-5g-yedek-internet-secici/**'
      - 'alo186/sektor-rehberi/mobil-internet-failover-30-90-gun-test-merkezi/**'
      - 'alo186/audits/mobile-hotspot-failover-growth-v199-2026-08-02.md'
      - 'alo186/deployment/routing-overlays/199-mobile-hotspot-failover-growth.json'
      - 'alo186/tests/test_mobile_hotspot_failover_growth_v199.py'
      - '.github/workflows/alo186-mobile-hotspot-failover-v199.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Fail-closed mobil internet ve ticari güven sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_mobile_hotspot_failover_growth_v199.py
          python alo186/tests/test_mobile_hotspot_failover_growth_v199.py
      - name: Sayfa JavaScript sözdizimi
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          pages = [
              Path('alo186/hesaplama/mobil-hotspot-yedek-internet-veri-gb-batarya-sure-hesabi/index.html'),
              Path('alo186/amazon-elektrik-urunleri/mobil-hotspot-4g-5g-yedek-internet-secici/index.html'),
              Path('alo186/sektor-rehberi/mobil-internet-failover-30-90-gun-test-merkezi/index.html'),
          ]
          for page in pages:
              html = page.read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?![^>]*application/ld\+json)[^>]*>(.*?)</script>', html, re.S | re.I)
              assert scripts, f'javascript missing: {page}'
              for index, script in enumerate(scripts):
                  target = Path(tempfile.gettempdir()) / f'{page.parent.name}-{index}.js'
                  target.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(target)], check=True)
          PY
      - name: Routing overlay JSON
        run: python -m json.tool alo186/deployment/routing-overlays/199-mobile-hotspot-failover-growth.json >/dev/null
