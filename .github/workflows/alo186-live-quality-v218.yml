name: ALO186 final artifact canlı kalite v218

on:
  pull_request:
    paths:
      - 'alo186/deployment/inject_live_quality_v218.py'
      - 'alo186/deployment/inject_live_quality_v218_compat.py'
      - 'alo186/deployment/guard_commerce_routes_v3.py'
      - 'alo186/tests/test_live_quality_v218.py'
      - '.github/workflows/alo186-live-quality-v218.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/deployment/inject_live_quality_v218.py'
      - 'alo186/deployment/inject_live_quality_v218_compat.py'
      - 'alo186/deployment/guard_commerce_routes_v3.py'
      - 'alo186/tests/test_live_quality_v218.py'
      - '.github/workflows/alo186-live-quality-v218.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-live-quality-v218-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Live quality tam artifact sözleşmesi
        run: python alo186/tests/test_live_quality_v218.py

      - name: Mevcut platform regresyonları
        run: |
          python alo186/tests/test_commerce_canonical_v217.py
          python alo186/tests/test_accessibility_v214.py
          python alo186/tests/test_content_intent_consolidation.py
          python alo186/tests/test_private_technical_search.py
          python alo186/tests/device_damage_deadline_guard.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js

      - name: Canonical production paketi
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-live-quality-v218-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-live-quality-v218-canonical

      - name: Custom-domain final artifact
        run: |
          cp -a /tmp/alo186-live-quality-v218-canonical /tmp/alo186-live-quality-v218-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-live-quality-v218-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/guard_commerce_routes_v3.py \
            --site /tmp/alo186-live-quality-v218-custom
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-live-quality-v218-custom \
            --base-path ''

      - name: Project-path final artifact
        run: |
          cp -a /tmp/alo186-live-quality-v218-canonical /tmp/alo186-live-quality-v218-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-live-quality-v218-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/guard_commerce_routes_v3.py \
            --site /tmp/alo186-live-quality-v218-project
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-live-quality-v218-project \
            --base-path '/chatgpt'

      - name: Final receipt kabulü
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for root, base in [
              (Path('/tmp/alo186-live-quality-v218-custom'), ''),
              (Path('/tmp/alo186-live-quality-v218-project'), '/chatgpt'),
          ]:
              receipt=json.loads((root/'live-quality-v218.json').read_text(encoding='utf-8'))
              assert receipt['version']==218
              assert receipt['basePath']==base
              assert receipt['finalArtifact'] is True
              assert receipt['personalDataCollectionAdded'] is False
              assert receipt['officialInstitutionClaimed'] is False
              assert receipt['newCommerceLinksAdded'] is False
              assert receipt['skipLinks']['missingMain']==0
              assert receipt['skipLinks']['injected'] + receipt['skipLinks']['targetRepaired'] + receipt['skipLinks']['alreadyValid']==9
              audit=receipt['audit']
              assert audit['criticalPageCount']==9
              assert audit['criticalBrokenInternalLinkCount']==0
              assert audit['canonicalViolations']==0
              assert audit['forbiddenVisibleCopyHits']==0
              assert audit['horizontalOverflowHidden'] is False
              assert audit['horizontalOverflowClipped'] is False
              pages=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
              assert pages['liveQualityV218']==receipt
          PY

      - name: Doğrulanmış live quality artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-quality-v218-pages
          path: /tmp/alo186-live-quality-v218-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
