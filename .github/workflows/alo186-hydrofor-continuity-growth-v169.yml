name: ALO186 hydrofor continuity growth v169

on:
  pull_request:
    paths:
      - "alo186/hesaplama/elektrik-kesintisi-hidrofor-su-yok-guvenlik-teshis/**"
      - "alo186/hesaplama/hidrofor-jenerator-ups-kalkis-w-kva-uygunlugu/**"
      - "alo186/sektor-rehberi/apartman-otel-hidrofor-elektrik-surekliligi-test-merkezi/**"
      - "alo186/deployment/routing-overlays/169-hydrofor-continuity-growth.json"
      - "alo186/audits/hydrofor-continuity-growth-v169-2026-08-01.md"
      - "alo186/tests/test_hydrofor_continuity_growth_v169.py"
      - ".github/workflows/alo186-hydrofor-continuity-growth-v169.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/elektrik-kesintisi-hidrofor-su-yok-guvenlik-teshis/**"
      - "alo186/hesaplama/hidrofor-jenerator-ups-kalkis-w-kva-uygunlugu/**"
      - "alo186/sektor-rehberi/apartman-otel-hidrofor-elektrik-surekliligi-test-merkezi/**"
      - "alo186/deployment/routing-overlays/169-hydrofor-continuity-growth.json"
      - "alo186/tests/test_hydrofor_continuity_growth_v169.py"
      - ".github/workflows/alo186-hydrofor-continuity-growth-v169.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python alo186/tests/test_hydrofor_continuity_growth_v169.py
