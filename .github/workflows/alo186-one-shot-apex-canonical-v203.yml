name: ALO186 one-shot apex canonical contract v203

on:
  push:
    branches:
      - fix/alo186-apex-canonical-contract-v203

permissions:
  contents: write

concurrency:
  group: alo186-one-shot-apex-canonical-v203
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-apex-canonical-contract-v203
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply atomic apex canonical migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          core_path = "alo186/deployment/build_static_site_core.py"
          core = read(core_path)
          core = replace_once(
              core,
              'CANONICAL_HOST = "https://www.alo186.com"\nLEGACY_HOST = "https://alo186.com"',
              'CANONICAL_HOST = "https://alo186.com"\nLEGACY_HOST = "https://www.alo186.com"',
              "builder host constants",
          )
          core = replace_once(
              core,
              '"RewriteRule ^ https://www.alo186.com%{REQUEST_URI}",',
              '"RewriteRule ^ https://alo186.com%{REQUEST_URI}",',
              "builder Apache token",
          )
          core = core.replace("Eski apex origin artifact'ta kaldı", "Eski www origin artifact'ta kaldı")
          core = core.replace("robots.txt www canonical sitemap adresini taşımıyor", "robots.txt apex canonical sitemap adresini taşımıyor")
          core = core.replace("sitemap.xml www canonical origin taşımıyor", "sitemap.xml apex canonical origin taşımıyor")
          core = core.replace("sitemap.xml eski apex origin taşıyor", "sitemap.xml eski www origin taşıyor")
          write(core_path, core)

          manifest_path = "alo186/deployment/routing-manifest.json"
          manifest = read(manifest_path)
          manifest = replace_once(
              manifest,
              '"canonicalHost":"https://www.alo186.com"',
              '"canonicalHost":"https://alo186.com"',
              "routing manifest canonicalHost",
          )
          write(manifest_path, manifest)

          apache_path = "alo186/deployment/apache-production.htaccess"
          apache = read(apache_path)
          old_redirect = '''# Tek canonical host: kök alan adındaki aynı path ve query tek yönlendirmeyle www'ye gider.
          RewriteCond %{HTTP_HOST} !^www\\.alo186\\.com$ [NC]
          RewriteRule ^ https://www.alo186.com%{REQUEST_URI} [R=301,L,NE]

          # www host üzerindeki doğrudan HTTP isteğini HTTPS'e taşı. CDN/proxy
          # X-Forwarded-Proto gönderiyorsa HTTPS isteğinde yönlendirme döngüsü oluşmaz.
          RewriteCond %{HTTPS} !=on
          RewriteCond %{HTTP:X-Forwarded-Proto} !https [NC]
          RewriteRule ^ https://www.alo186.com%{REQUEST_URI} [R=301,L,NE]

          # Eski/canlı uygulama manifesti apex origin ile çağırsa da canonical www üzerinde
          # aynı dosya ve doğru MIME türü sunulur. Dosya hesaplama rotasıyla artifact'a girer.'''
          new_redirect = '''# Tek canonical host: www veya başka bir Host aynı path ve query ile apex'e gider.
          RewriteCond %{HTTP_HOST} !^alo186\\.com$ [NC]
          RewriteRule ^ https://alo186.com%{REQUEST_URI} [R=301,L,NE]

          # Apex host üzerindeki doğrudan HTTP isteğini HTTPS'e taşı. CDN/proxy
          # X-Forwarded-Proto gönderiyorsa HTTPS isteğinde yönlendirme döngüsü oluşmaz.
          RewriteCond %{HTTPS} !=on
          RewriteCond %{HTTP:X-Forwarded-Proto} !https [NC]
          RewriteRule ^ https://alo186.com%{REQUEST_URI} [R=301,L,NE]

          # Eski/canlı uygulama manifesti www origin ile çağırsa da canonical apex üzerinde
          # aynı dosya ve doğru MIME türü sunulur. Dosya hesaplama rotasıyla artifact'a girer.'''
          apache = replace_once(apache, old_redirect, new_redirect, "Apache redirect block")
          apache = replace_once(
              apache,
              'Header always set Access-Control-Allow-Origin "https://www.alo186.com"',
              'Header always set Access-Control-Allow-Origin "https://alo186.com"',
              "manifest CORS origin",
          )
          write(apache_path, apache)

          wrapper_path = "alo186/deployment/build_static_site.py"
          wrapper = read(wrapper_path)
          wrapper = replace_once(
              wrapper,
              "https://www.alo186.com\nhttps://alo186.com\n'''",
              "https://alo186.com\nhttps://www.alo186.com\n'''",
              "wrapper source contract host order",
          )
          write(wrapper_path, wrapper)

          static_path = "alo186/deployment/smoke_static_site.py"
          static = read(static_path)
          static = replace_once(
              static,
              'CANONICAL_HOST = "https://www.alo186.com"\nLEGACY_HOST = "https://alo186.com"',
              'CANONICAL_HOST = "https://alo186.com"\nLEGACY_HOST = "https://www.alo186.com"',
              "static smoke host constants",
          )
          static = replace_once(
              static,
              '"RewriteRule ^ https://www.alo186.com%{REQUEST_URI}",',
              '"RewriteRule ^ https://alo186.com%{REQUEST_URI}",',
              "static smoke Apache token",
          )
          static = static.replace("Eski apex origin route HTML içinde kaldı", "Eski www origin route HTML içinde kaldı")
          write(static_path, static)

          live_path = "alo186/deployment/smoke_live_routes.py"
          live = read(live_path)
          live = replace_once(
              live,
              'CANONICAL_HOST = "https://www.alo186.com"',
              'CANONICAL_HOST = "https://alo186.com"\nLEGACY_HOST = "https://www.alo186.com"',
              "live smoke host constants",
          )
          live = live.replace('"https://www.alo186.com/', '"https://alo186.com/')
          old_probe = '''    # Apex URL'nin aynı path ile tek canonical www hostuna ulaşmasını doğrula.
              apex_url = base_url.replace("://www.", "://", 1) + "/"
              try:
                  status, final_url, _body, _headers, duration = fetch(apex_url)
                  results.append(
                      {
                          "path": "apex-redirect",
                          "status": status,
                          "requestedUrl": apex_url,
                          "finalUrl": final_url,
                          "durationMs": round(duration * 1000, 1),
                      }
                  )
                  if status != 200 or normalize_url(final_url) != normalize_url(f"{CANONICAL_HOST}/"):
                      failures.append(f"Apex canonical yönlendirme yanlış: {apex_url} → {final_url} (HTTP {status})")
              except (HTTPError, URLError, TimeoutError, ssl.SSLError) as exc:
                  failures.append(f"Apex canonical yönlendirme erişim hatası: {exc}")'''.replace("              ", "")
          new_probe = '''    # www URL'nin aynı path ile tek canonical apex hostuna ulaşmasını doğrula.
              www_url = LEGACY_HOST + "/"
              try:
                  status, final_url, _body, _headers, duration = fetch(www_url)
                  results.append(
                      {
                          "path": "www-redirect",
                          "status": status,
                          "requestedUrl": www_url,
                          "finalUrl": final_url,
                          "durationMs": round(duration * 1000, 1),
                      }
                  )
                  if status != 200 or normalize_url(final_url) != normalize_url(f"{CANONICAL_HOST}/"):
                      failures.append(f"www canonical yönlendirme yanlış: {www_url} → {final_url} (HTTP {status})")
              except (HTTPError, URLError, TimeoutError, ssl.SSLError) as exc:
                  failures.append(f"www canonical yönlendirme erişim hatası: {exc}")'''.replace("              ", "")
          live = replace_once(live, old_probe, new_probe, "live redirect probe")
          live = replace_once(
              live,
              '            if normalize_url(final_url).startswith("https://alo186.com"):\n                failures.append(f"{path}: www olmayan final URL: {final_url}")',
              '            if normalize_url(final_url).startswith(LEGACY_HOST):\n                failures.append(f"{path}: canonical olmayan www final URL: {final_url}")',
              "live final URL guard",
          )
          live = replace_once(
              live,
              '            if root_path == "/sitemap.xml" and "https://alo186.com" in body.decode("utf-8", errors="replace"):\n                failures.append("/sitemap.xml: eski apex origin içeriyor")',
              '            if root_path == "/sitemap.xml" and LEGACY_HOST in body.decode("utf-8", errors="replace"):\n                failures.append("/sitemap.xml: eski www origin içeriyor")',
              "live sitemap legacy guard",
          )
          write(live_path, live)

          contract_path = "alo186/tests/test_active_production_contract.py"
          contract = read(contract_path)
          contract = replace_once(
              contract,
              '''    # Canonical host policy is www everywhere and live smoke verifies apex redirect.
              assert "https://www.alo186.com" in apache
              assert "https://www.alo186.com" in builder
              assert "apex-redirect" in live_smoke
              assert "https://alo186.com" in builder'''.replace("              ", ""),
              '''    # Canonical host policy is apex everywhere and live smoke verifies www redirect.
              assert "https://alo186.com" in apache
              assert "https://alo186.com" in builder
              assert "www-redirect" in live_smoke
              assert "https://www.alo186.com" in builder'''.replace("              ", ""),
              "active production canonical contract",
          )
          write(contract_path, contract)

          regression = '''from __future__ import annotations

import json
import sys
from pathlib import Path

import pytest


ROOT = Path(__file__).resolve().parents[2]
DEPLOYMENT = ROOT / "alo186" / "deployment"
sys.path.insert(0, str(DEPLOYMENT))

import build_static_site  # noqa: E402
import smoke_live_routes  # noqa: E402
import smoke_static_site  # noqa: E402


CANONICAL = "https://alo186.com"
LEGACY = "https://www.alo186.com"


def test_source_contract_uses_apex_and_redirects_www() -> None:
    manifest = json.loads((DEPLOYMENT / "routing-manifest.json").read_text(encoding="utf-8"))
    apache = (DEPLOYMENT / "apache-production.htaccess").read_text(encoding="utf-8")

    assert manifest["canonicalHost"] == CANONICAL
    assert build_static_site.CANONICAL_HOST == CANONICAL
    assert build_static_site.LEGACY_HOST == LEGACY
    assert smoke_static_site.CANONICAL_HOST == CANONICAL
    assert smoke_static_site.LEGACY_HOST == LEGACY
    assert smoke_live_routes.CANONICAL_HOST == CANONICAL
    assert smoke_live_routes.LEGACY_HOST == LEGACY
    assert "RewriteCond %{HTTP_HOST} !^alo186\\.com$ [NC]" in apache
    assert "RewriteRule ^ https://alo186.com%{REQUEST_URI} [R=301,L,NE]" in apache
    assert "RewriteRule ^ https://www.alo186.com%{REQUEST_URI}" not in apache
    assert 'Access-Control-Allow-Origin "https://alo186.com"' in apache


def test_full_production_bundle_contains_only_apex_canonicals(tmp_path: Path) -> None:
    output = tmp_path / "site"
    release = build_static_site.build(ROOT, output, "apex-contract-test")
    smoke = smoke_static_site.smoke(output, ROOT)

    assert release["canonicalHost"] == CANONICAL
    assert smoke["ok"] is True
    assert f"Sitemap: {CANONICAL}/sitemap.xml" in (output / "robots.txt").read_text(encoding="utf-8")
    assert LEGACY not in (output / "sitemap.xml").read_text(encoding="utf-8")

    leaked: list[str] = []
    for path in output.rglob("*"):
        if not path.is_file() or path.name == "checksums.sha256":
            continue
        try:
            text = path.read_text(encoding="utf-8")
        except UnicodeDecodeError:
            continue
        if LEGACY in text:
            leaked.append(path.relative_to(output).as_posix())
    assert leaked == []


def test_live_smoke_probes_www_then_accepts_apex(monkeypatch: pytest.MonkeyPatch) -> None:
    calls: list[str] = []

    def fake_fetch(url: str, timeout: int = 20):
        calls.append(url)
        if url == LEGACY + "/":
            return 200, CANONICAL + "/", b"", {}, 0.01
        if url.endswith("/robots.txt"):
            return 200, url.replace(LEGACY, CANONICAL), f"Sitemap: {CANONICAL}/sitemap.xml".encode(), {"content-type": "text/plain"}, 0.01
        if url.endswith("/sitemap.xml"):
            return 200, url.replace(LEGACY, CANONICAL), f"<loc>{CANONICAL}/</loc>".encode(), {"content-type": "application/xml"}, 0.01
        if url.endswith("/tailwindcss"):
            return 200, url.replace(LEGACY, CANONICAL), b"", {"content-type": "text/css"}, 0.01
        if url.endswith("/404.html"):
            return 200, url.replace(LEGACY, CANONICAL), b"", {"content-type": "text/html"}, 0.01
        canonical = url.replace(LEGACY, CANONICAL)
        path = canonical.removeprefix(CANONICAL) or "/"
        route = next(item for item in smoke_live_routes.ROUTES if item[0] == path)
        html = (
            f"<html><head><title>{route[1]}</title><link rel=\"canonical\" href=\"{route[2]}\"></head>"
            "<body>Bağımsız bilgilendirme platformudur; EDAŞ veya kamu kurumu değildir. "
            "Cihaz hasarı başvurusu 30 gün içinde yapılır.</body></html>"
        ).encode()
        headers = {name: "present" for name in smoke_live_routes.REQUIRED_SECURITY_HEADERS}
        headers["content-type"] = "text/html"
        return 200, canonical, html, headers, 0.01

    monkeypatch.setattr(smoke_live_routes, "fetch", fake_fetch)
    result = smoke_live_routes.run(CANONICAL, check_assets=False)
    assert result["ok"] is True
    assert calls[0] == LEGACY + "/"
    assert result["results"][0]["path"] == "www-redirect"
'''
          write("alo186/tests/test_apex_canonical_contract_v203.py", regression)

          workflow = ROOT / ".github/workflows/alo186-one-shot-apex-canonical-v203.yml"
          workflow.unlink()
          PY

      - name: Run apex canonical regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q alo186/tests/test_apex_canonical_contract_v203.py
          python alo186/tests/test_active_production_contract.py
          python alo186/deployment/build_static_site.py --output /tmp/alo186-apex-canonical-v203 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-apex-canonical-v203

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(alo186): align production canonical host to apex"
          git push origin HEAD:fix/alo186-apex-canonical-contract-v203
