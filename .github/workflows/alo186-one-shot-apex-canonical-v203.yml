name: ALO186 one-shot apex canonical contract v203

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/alo186-one-shot-apex-canonical-v203.yml"
      - ".github/scripts/alo186_apex_canonical_v203.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alo186-one-shot-apex-canonical-v203-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/alo186-apex-canonical-contract-v203'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-apex-canonical-contract-v203
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply guarded apex canonical migration
        run: python .github/scripts/alo186_apex_canonical_v203.py

      - name: Run apex canonical regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q alo186/tests/test_apex_canonical_contract_v203.py
          python alo186/tests/test_active_production_contract.py
          python alo186/deployment/build_static_site.py --output /tmp/alo186-apex-canonical-v203 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-apex-canonical-v203

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(alo186): align production canonical host to apex"
          git push origin HEAD:fix/alo186-apex-canonical-contract-v203
