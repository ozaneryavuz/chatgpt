name: ALO186 GES outage backup journey v328

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-gunes-panelleri-calisir-mi/**'
      - 'alo186/hesaplama/ges-elektrik-kesintisi-yedekleme-hazirlik-plani/**'
      - 'alo186/sektor-rehberi/otel-isletme-ges-elektrik-kesintisi-yedekleme-surekliligi/**'
      - 'alo186/deployment/routing-overlays/ges-outage-backup-journey-v328.json'
      - 'alo186/tests/test_ges_outage_backup_journey_v328.py'
      - '.github/workflows/alo186-ges-outage-v328.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-gunes-panelleri-calisir-mi/**'
      - 'alo186/hesaplama/ges-elektrik-kesintisi-yedekleme-hazirlik-plani/**'
      - 'alo186/sektor-rehberi/otel-isletme-ges-elektrik-kesintisi-yedekleme-surekliligi/**'
      - 'alo186/deployment/routing-overlays/ges-outage-backup-journey-v328.json'
      - 'alo186/tests/test_ges_outage_backup_journey_v328.py'
      - '.github/workflows/alo186-ges-outage-v328.yml'

permissions:
  contents: read

concurrency:
  group: alo186-ges-outage-v328-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Trust privacy anti-islanding and professional-only checks
        run: python alo186/tests/test_ges_outage_backup_journey_v328.py
      - name: Build canonical site bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-ges-v328
          python alo186/deployment/build_static_site.py --output /tmp/alo186-ges-v328 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-ges-v328
      - name: Verify routes and sitemap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-ges-v328')
          routes = [
            '/haberler/elektrik-kesilince-gunes-panelleri-calisir-mi/',
            '/hesaplama/ges-elektrik-kesintisi-yedekleme-hazirlik-plani/',
            '/sektor-rehberi/otel-isletme-ges-elektrik-kesintisi-yedekleme-surekliligi/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 328
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              assert f'https://alo186.com{route}' in sitemap
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-ges-v328-${{ github.sha }}
          path: /tmp/alo186-ges-v328
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
