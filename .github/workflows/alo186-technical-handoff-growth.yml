name: ALO186 teknik devir ve kabul büyüme kalite kontrolü

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/teknik-devir-kabul-paketi/**'
      - 'alo186/deployment/routing-overlays/growth-technical-handoff-run11.json'
      - 'alo186/deployment/inject_handoff_growth.py'
      - 'alo186/deployment/inject_handoff_growth_base.py'
      - 'alo186/deployment/inject_proposal_scope_growth.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/build_static_site.py'
      - 'alo186/deployment/prepare_github_pages.py'
      - 'alo186/deployment/smoke_github_pages.py'
      - '.github/workflows/alo186-technical-handoff-growth.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/teknik-devir-kabul-paketi/**'
      - 'alo186/deployment/routing-overlays/growth-technical-handoff-run11.json'
      - 'alo186/deployment/inject_handoff_growth.py'
      - 'alo186/deployment/inject_handoff_growth_base.py'
      - 'alo186/deployment/inject_proposal_scope_growth.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - '.github/workflows/alo186-technical-handoff-growth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-technical-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Devir, kabul ve gelir kapısı senaryoları
        run: node alo186/hesaplama/teknik-devir-kabul-paketi/test.js

      - name: Sözdizimi
        run: |
          node --check alo186/hesaplama/teknik-devir-kabul-paketi/core.js
          node --check alo186/hesaplama/teknik-devir-kabul-paketi/app.js
          python -m py_compile alo186/deployment/inject_handoff_growth.py
          python -m py_compile alo186/deployment/inject_handoff_growth_base.py
          python -m py_compile alo186/deployment/inject_proposal_scope_growth.py
          python -m py_compile alo186/deployment/inject_shortlist_growth.py

      - name: Mevcut güvenlik regresyonları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          node alo186/hesaplama/teknik-urun-karsilastirma/test.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical production bundle
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-handoff-canonical --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-handoff-canonical
          test -f /tmp/alo186-handoff-canonical/hesaplama/teknik-devir-kabul-paketi/index.html
          test -f /tmp/alo186-handoff-canonical/hesaplama/teknik-devir-kabul-paketi/core.js
          test -f /tmp/alo186-handoff-canonical/hesaplama/teknik-devir-kabul-paketi/app.js
          test ! -f /tmp/alo186-handoff-canonical/hesaplama/teknik-devir-kabul-paketi/test.js
          grep -q 'teknik-devir-kabul-paketi' /tmp/alo186-handoff-canonical/sitemap.xml

      - name: Custom-domain Pages entegrasyonu
        run: |
          cp -a /tmp/alo186-handoff-canonical /tmp/alo186-handoff-custom
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-handoff-custom --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-handoff-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-handoff-custom --base-path ''
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-handoff-custom --base-path ''

      - name: Project-path Pages entegrasyonu
        run: |
          cp -a /tmp/alo186-handoff-canonical /tmp/alo186-handoff-project
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-handoff-project --base-path '/chatgpt' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-handoff-project --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-handoff-project --base-path '/chatgpt'
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-handoff-project --base-path '/chatgpt'

      - name: Artifact güven, görünürlük ve offline sözleşmeleri
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          for root,prefix in [(Path('/tmp/alo186-handoff-custom'),''),(Path('/tmp/alo186-handoff-project'),'/chatgpt')]:
              route=root/'hesaplama/teknik-devir-kabul-paketi/index.html'
              text=route.read_text(encoding='utf-8')
              assert 'Elektrik Teknik Devir ve Kabul Paketi' in text
              assert 'Satın almama geçerli sonuç' in text
              assert '<textarea' not in text
              assert 'type="email"' not in text and 'type="tel"' not in text and 'type="text"' not in text
              assert 'amazon.com' not in text and 'amazon.com.tr' not in text
              hub=(root/'hesaplama/index.html').read_text(encoding='utf-8')
              match=re.search(r'(\d+) çekirdek araç',hub)
              assert match and int(match.group(1))>=35
              assert 'data-alo186-handoff-hub="true"' in hub
              assert 'data-alo186-handoff-card="true"' in (root/'elektrik-portali/index.html').read_text(encoding='utf-8')
              assert 'data-alo186-handoff-card="true"' in (root/'index.html').read_text(encoding='utf-8')
              assert 'data-alo186-handoff-section="true"' in (root/'hesaplama/teknik-urun-karsilastirma/index.html').read_text(encoding='utf-8')
              release=json.loads((root/'pages-release.json').read_text(encoding='utf-8'))
              assert release['technicalHandoff']['recordLimit']==6
              assert release['technicalHandoff']['ttlDays']==180
              expected=f'{prefix}/hesaplama/teknik-devir-kabul-paketi/'
              assert release['technicalHandoff']['route']==expected
              assert expected in (root/'sw.js').read_text(encoding='utf-8')
              manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
              assert any(x.get('url')==expected for x in manifest.get('shortcuts',[]))
          PY

      - name: Doğrulanmış teknik devir artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-technical-handoff-pages
          path: /tmp/alo186-handoff-custom
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
