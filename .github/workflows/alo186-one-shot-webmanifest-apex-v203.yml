name: ALO186 one-shot web manifest apex CORS v203

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/alo186-one-shot-webmanifest-apex-v203.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  migrate-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/alo186-apex-canonical-contract-v203'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-apex-canonical-contract-v203
          fetch-depth: 0

      - name: Align web manifest CORS assertion to apex
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/alo186-one-shot-webmanifest-apex-v203.yml')
          old = "grep -Fq 'Access-Control-Allow-Origin \"https://www.alo186.com\"' alo186/deployment/apache-production.htaccess"
          new = "grep -Fq 'Access-Control-Allow-Origin \"https://alo186.com\"' alo186/deployment/apache-production.htaccess\n          ! grep -Fq 'Access-Control-Allow-Origin \"https://www.alo186.com\"' alo186/deployment/apache-production.htaccess"
          matches = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              if path == helper:
                  continue
              text = path.read_text(encoding='utf-8')
              if old in text:
                  matches.append(path)
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one legacy CORS assertion, found {len(matches)}: {matches}')
          target = matches[0]
          text = target.read_text(encoding='utf-8')
          target.write_text(text.replace(old, new, 1), encoding='utf-8')
          helper.unlink()
          print(f'Updated {target}')
          PY

      - name: Verify apex CORS source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Access-Control-Allow-Origin "https://alo186.com"' alo186/deployment/apache-production.htaccess
          ! grep -Fq 'Access-Control-Allow-Origin "https://www.alo186.com"' alo186/deployment/apache-production.htaccess

      - name: Commit verified workflow migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci(alo186): validate apex CORS in web manifest workflow"
          git push origin HEAD:fix/alo186-apex-canonical-contract-v203
