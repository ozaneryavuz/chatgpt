name: ALO186 TV konsol modem yedek güç uygunluğu v125

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/tv-oyun-konsolu-modem-yedek-guc-uygunluk/**'
      - 'alo186/deployment/routing-overlays/125-tv-console-entertainment-backup.json'
      - 'alo186/tests/test_tv_console_entertainment_backup_v125.js'
      - '.github/workflows/alo186-tv-console-entertainment-backup-v125.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/tv-oyun-konsolu-modem-yedek-guc-uygunluk/**'
      - 'alo186/deployment/routing-overlays/125-tv-console-entertainment-backup.json'
      - 'alo186/tests/test_tv_console_entertainment_backup_v125.js'
      - '.github/workflows/alo186-tv-console-entertainment-backup-v125.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-tv-console-entertainment-v125-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Karar motoru, hesap, güvenlik ve dual Pages kabulü
        run: node alo186/tests/test_tv_console_entertainment_backup_v125.js
      - name: Mevcut yayın ve kullanıcı regresyonları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py
