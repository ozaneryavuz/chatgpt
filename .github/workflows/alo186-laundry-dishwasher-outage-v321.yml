name: ALO186 çamaşır ve bulaşık makinesi kesinti güveni v321

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-camasir-bulasik-makinesi-programi-yarida-kalir-mi/**'
      - 'alo186/hesaplama/camasir-bulasik-makinesi-elektrik-kesintisi-guvenli-devam-plani/**'
      - 'alo186/sektor-rehberi/otel-camasirhane-mutfak-bulasik-makinesi-kesinti-surekliligi/**'
      - 'alo186/deployment/routing-overlays/laundry-dishwasher-outage-journey-v321.json'
      - 'alo186/deployment/affiliate-category-decisions/laundry-dishwasher-outage-v321.json'
      - 'alo186/tests/test_laundry_dishwasher_outage_journey_v321.py'
      - '.github/workflows/alo186-laundry-dishwasher-outage-v321.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-camasir-bulasik-makinesi-programi-yarida-kalir-mi/**'
      - 'alo186/hesaplama/camasir-bulasik-makinesi-elektrik-kesintisi-guvenli-devam-plani/**'
      - 'alo186/sektor-rehberi/otel-camasirhane-mutfak-bulasik-makinesi-kesinti-surekliligi/**'
      - 'alo186/deployment/routing-overlays/laundry-dishwasher-outage-journey-v321.json'
      - 'alo186/deployment/affiliate-category-decisions/laundry-dishwasher-outage-v321.json'
      - 'alo186/tests/test_laundry_dishwasher_outage_journey_v321.py'
      - '.github/workflows/alo186-laundry-dishwasher-outage-v321.yml'

permissions:
  contents: read

concurrency:
  group: alo186-laundry-dishwasher-v321-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Güven, gizlilik ve sıfır-affiliate sınırlarını doğrula
        run: |
          set -euo pipefail
          python alo186/tests/test_laundry_dishwasher_outage_journey_v321.py
      - name: Canonical site paketini oluştur
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-laundry-dishwasher-v321
          python alo186/deployment/build_static_site.py --output /tmp/alo186-laundry-dishwasher-v321 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-laundry-dishwasher-v321
      - name: Yeni rotalar, sitemap ve yerel takvim kabulü
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/alo186-laundry-dishwasher-v321')
          routes = [
              '/haberler/elektrik-kesilince-camasir-bulasik-makinesi-programi-yarida-kalir-mi/',
              '/hesaplama/camasir-bulasik-makinesi-elektrik-kesintisi-guvenli-devam-plani/',
              '/sektor-rehberi/otel-camasirhane-mutfak-bulasik-makinesi-kesinti-surekliligi/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 321, release['routingVersion']
          for route in routes:
              file = root / route.strip('/') / 'index.html'
              assert file.is_file(), file
              html = file.read_text(encoding='utf-8')
              folded = html.casefold()
              assert f'rel="canonical" href="https://alo186.com{route}"' in html
              assert f'https://alo186.com{route}' in sitemap
              assert '<meta name="viewport"' in html
              assert 'amazon.com.tr' not in folded and 'amzn.to' not in folded and 'alo186rehber-21' not in folded
              blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
              assert len(blocks) == 1
              serialized = json.dumps(json.loads(blocks[0]), ensure_ascii=False)
              for commercial in ('Product', 'Offer', 'AggregateRating', 'Review'):
                  assert f'"@type": "{commercial}"' not in serialized
          planner = (root / 'hesaplama/camasir-bulasik-makinesi-elektrik-kesintisi-guvenli-devam-plani/index.html').read_text(encoding='utf-8')
          assert 'new Blob' in planner and 'BEGIN:VCALENDAR' in planner
          assert 'localStorage' not in planner and 'sessionStorage' not in planner and 'fetch(' not in planner
          assert not re.search(r'<input[^>]+type=["\'](?:text|email|tel|file|hidden)["\']', planner, re.I)
          print(json.dumps({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes, 'merchantLinksAdded': 0, 'consumerAffiliateClasses': 0, 'calendarLocalOnly': True}, ensure_ascii=False, indent=2))
          PY
      - name: Doğrulanmış v321 site artifactı
        uses: actions/upload-artifact@v7
        with:
          name: alo186-laundry-dishwasher-v321-${{ github.sha }}
          path: /tmp/alo186-laundry-dishwasher-v321
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
