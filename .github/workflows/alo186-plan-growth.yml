name: ALO186 Elektrik Planım güvenli büyüme

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/elektrik-planim/**'
      - 'alo186/tests/test_plan_growth.js'
      - 'alo186/deployment/**'
      - '.github/workflows/alo186-plan-growth.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/elektrik-planim/**'
      - 'alo186/tests/test_plan_growth.js'
      - 'alo186/deployment/**'
      - '.github/workflows/alo186-plan-growth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-plan-growth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Elektrik Planım mevcut senaryoları
        run: node alo186/hesaplama/elektrik-planim/test.js

      - name: Mevsimsel, alım kartı ve paylaşım çekirdeği
        run: node alo186/hesaplama/elektrik-planim/growth-core.test.js

      - name: Site entegrasyon ve gizlilik sözleşmeleri
        run: node alo186/tests/test_plan_growth.js

      - name: JavaScript sözdizimi
        run: |
          node --check alo186/hesaplama/elektrik-planim/core.js
          node --check alo186/hesaplama/elektrik-planim/app.js
          node --check alo186/hesaplama/elektrik-planim/growth-core.js
          node --check alo186/hesaplama/elektrik-planim/growth.js

      - name: Canonical ve cihaz hasarı güvenlik regresyonları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical production bundle ve smoke
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-plan-growth-site \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-plan-growth-site

      - name: GitHub Pages custom-domain ve project-path smoke
        run: |
          cp -a /tmp/alo186-plan-growth-site /tmp/alo186-plan-growth-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-plan-growth-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-plan-growth-custom \
            --base-path ''
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-plan-growth-custom \
            --base-path ''

          cp -a /tmp/alo186-plan-growth-site /tmp/alo186-plan-growth-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-plan-growth-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-plan-growth-project \
            --base-path '/chatgpt'
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-plan-growth-project \
            --base-path '/chatgpt'

      - name: Production artifact büyüme sözleşmeleri
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/alo186-plan-growth-custom/hesaplama/elektrik-planim
          test -f "$root/index.html"
          test -f "$root/growth-core.js"
          test -f "$root/growth.js"
          test -f "$root/growth.css"
          grep -q 'Mevsimsel tekrar ziyaret' "$root/index.html"
          grep -q 'Marka bağımsız teknik alım kartı' "$root/index.html"
          grep -q 'Elektrik planını paylaş' "$root/index.html"
          grep -q 'navigator.share' "$root/growth.js"
          grep -q 'alo186:seasonal-readiness:v1' "$root/growth.js"
          ! grep -Eqi 'type="(email|tel|text)"|<textarea|amazon\.(com|com\.tr)/' "$root/index.html"

      - name: Doğrulanmış plan büyüme artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-plan-growth-pages
          path: /tmp/alo186-plan-growth-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
