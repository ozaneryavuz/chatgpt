name: ALO186 wastewater lift outage journey v324

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-atik-su-terfi-pompasi-calisir-mi/**'
      - 'alo186/hesaplama/atik-su-terfi-pompasi-elektrik-kesintisi-sureklilik-plani/**'
      - 'alo186/sektor-rehberi/apartman-otel-isletme-atik-su-terfi-pompasi-surekliligi/**'
      - 'alo186/deployment/routing-overlays/wastewater-lift-outage-journey-v324.json'
      - 'alo186/tests/test_wastewater_lift_outage_journey_v324.py'
      - '.github/workflows/alo186-wastewater-lift-v324.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-atik-su-terfi-pompasi-calisir-mi/**'
      - 'alo186/hesaplama/atik-su-terfi-pompasi-elektrik-kesintisi-sureklilik-plani/**'
      - 'alo186/sektor-rehberi/apartman-otel-isletme-atik-su-terfi-pompasi-surekliligi/**'
      - 'alo186/deployment/routing-overlays/wastewater-lift-outage-journey-v324.json'
      - 'alo186/tests/test_wastewater_lift_outage_journey_v324.py'
      - '.github/workflows/alo186-wastewater-lift-v324.yml'

permissions:
  contents: read

concurrency:
  group: alo186-wastewater-lift-v324-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Trust, privacy and professional-only checks
        run: python alo186/tests/test_wastewater_lift_outage_journey_v324.py
      - name: Build canonical site bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-wastewater-lift-v324
          python alo186/deployment/build_static_site.py --output /tmp/alo186-wastewater-lift-v324 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-wastewater-lift-v324
      - name: Verify routes and sitemap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-wastewater-lift-v324')
          routes = [
            '/haberler/elektrik-kesilince-atik-su-terfi-pompasi-calisir-mi/',
            '/hesaplama/atik-su-terfi-pompasi-elektrik-kesintisi-sureklilik-plani/',
            '/sektor-rehberi/apartman-otel-isletme-atik-su-terfi-pompasi-surekliligi/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 324
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              assert f'https://alo186.com{route}' in sitemap
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-wastewater-lift-v324-${{ github.sha }}
          path: /tmp/alo186-wastewater-lift-v324
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
