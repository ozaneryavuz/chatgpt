name: ALO186 kombi kesintisi ve yedek güç güveni v294

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-kombi-calisir-mi/**'
      - 'alo186/hesaplama/kombi-elektrik-kesintisi-ups-uygunluk-kontrolu/**'
      - 'alo186/amazon-elektrik-urunleri/kombi-ups-yedek-guc-secimi/**'
      - 'alo186/deployment/affiliate-category-decisions/boiler-outage-backup-v294.json'
      - 'alo186/deployment/routing-overlays/growth-v294-boiler-outage-trust.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v294_boiler_outage_trust.py'
      - 'alo186/tests/test_affiliate_route_risk_policy_v265.py'
      - '.github/workflows/alo186-growth-v294-boiler-outage-trust.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-kombi-calisir-mi/**'
      - 'alo186/hesaplama/kombi-elektrik-kesintisi-ups-uygunluk-kontrolu/**'
      - 'alo186/amazon-elektrik-urunleri/kombi-ups-yedek-guc-secimi/**'
      - 'alo186/deployment/affiliate-category-decisions/boiler-outage-backup-v294.json'
      - 'alo186/deployment/routing-overlays/growth-v294-boiler-outage-trust.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v294_boiler_outage_trust.py'
      - 'alo186/tests/test_affiliate_route_risk_policy_v265.py'
      - '.github/workflows/alo186-growth-v294-boiler-outage-trust.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v294-boiler-outage-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Kombi güveni ve affiliate yönetişimi
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/tests/test_growth_v294_boiler_outage_trust.py \
            alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v294_boiler_outage_trust.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/affiliate-category-decisions/boiler-outage-backup-v294.json >/dev/null
          python -m json.tool alo186/deployment/routing-overlays/growth-v294-boiler-outage-trust.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v294
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v294 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-v294
          test -f /tmp/alo186-v294/haberler/elektrik-kesilince-kombi-calisir-mi/index.html
          test -f /tmp/alo186-v294/hesaplama/kombi-elektrik-kesintisi-ups-uygunluk-kontrolu/index.html
          test -f /tmp/alo186-v294/amazon-elektrik-urunleri/kombi-ups-yedek-guc-secimi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v294
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py \
            --output /tmp/alo186-sites-v294 \
            --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-sites-v294')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          article = '/haberler/elektrik-kesilince-kombi-calisir-mi/'
          tool = '/hesaplama/kombi-elektrik-kesintisi-ups-uygunluk-kontrolu/'
          decision = '/amazon-elektrik-urunleri/kombi-ups-yedek-guc-secimi/'
          expected = {article, tool, decision}
          assert expected.issubset(pages), expected - set(pages)
          for route in expected:
              assert pages[route]['affiliate']['hasAffiliateLinks'] is False, route
              assert not pages[route]['affiliate']['unsafeStaticLinks'], route
          print(json.dumps({
              'ok': True,
              'routes': sorted(expected),
              'affiliateLinks': 0,
              'unsafeStaticLinks': 0,
          }, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v294 kombi kesintisi ve yedek güç paketi

          - “Elektrik kesilince kombi çalışır mı?” ve kesinti sonrası yeniden başlatma niyeti: model özelinde kaynak doğrulamalı canonical rehber
          - Gaz/CO/elektrik tehlikesi, enerji kararlılığı, hata kodu, reset sınırı, donma riski ve mevcut yedek güç testi: kişisel verisiz araç
          - Kombi, kazan, sabit UPS, inverter, akü, jeneratör ve topraklama-nötr değişikliği: professional-only
          - Eski ürün rotası: canonical korunarak sıfır affiliate profesyonel karar merkezine dönüştürüldü
          - Mevcut onaylı sistem gerçek testte yeterliyse: yeni ürün almayın
          - 30/90/365 günlük kontrol, görev testi ve bakım döngüsü: doğrulandı
          - Fiyat, stok, puan, yorum, teslimat, garanti, Product ve Offer: yok
          - Canonical build, static smoke ve ChatGPT Sites import kabulü: başarılı
          EOF
