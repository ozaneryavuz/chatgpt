name: ALO186 akvaryum kesinti güven ve dönüşüm v290
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-akvaryum-baligi-ne-yapilir/**'
      - 'alo186/hesaplama/akvaryum-elektrik-kesintisi-oksijen-sicaklik-plani/**'
      - 'alo186/amazon-elektrik-urunleri/akvaryum-kesinti-hava-pompasi-termometre-secici/**'
      - 'alo186/deployment/routing-overlays/growth-v290-aquarium-outage-trust.json'
      - 'alo186/deployment/affiliate-category-decisions/aquarium-outage-v290.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v290_aquarium_outage_trust.py'
      - '.github/workflows/alo186-growth-v290-aquarium-outage-trust.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-akvaryum-baligi-ne-yapilir/**'
      - 'alo186/hesaplama/akvaryum-elektrik-kesintisi-oksijen-sicaklik-plani/**'
      - 'alo186/amazon-elektrik-urunleri/akvaryum-kesinti-hava-pompasi-termometre-secici/**'
      - 'alo186/deployment/routing-overlays/growth-v290-aquarium-outage-trust.json'
      - 'alo186/deployment/affiliate-category-decisions/aquarium-outage-v290.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v290_aquarium_outage_trust.py'
      - '.github/workflows/alo186-growth-v290-aquarium-outage-trust.yml'
permissions:
  contents: read
concurrency:
  group: alo186-growth-v290-aquarium-outage-trust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Akvaryum arama niyeti gizlilik ve ticari güven
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v290_aquarium_outage_trust.py alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v290_aquarium_outage_trust.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/routing-overlays/growth-v290-aquarium-outage-trust.json >/dev/null
          python -m json.tool alo186/deployment/affiliate-category-decisions/aquarium-outage-v290.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null
      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v290
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v290 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v290
          test -f /tmp/alo186-v290/haberler/elektrik-kesilince-akvaryum-baligi-ne-yapilir/index.html
          test -f /tmp/alo186-v290/hesaplama/akvaryum-elektrik-kesintisi-oksijen-sicaklik-plani/index.html
          test -f /tmp/alo186-v290/amazon-elektrik-urunleri/akvaryum-kesinti-hava-pompasi-termometre-secici/index.html
      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v290
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v290 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/alo186-sites-v290')
          manifest=json.loads((root/'sites-import.json').read_text(encoding='utf-8'))
          pages={item['canonicalPath']:item for item in manifest['pages']}
          article='/haberler/elektrik-kesilince-akvaryum-baligi-ne-yapilir/'
          tool='/hesaplama/akvaryum-elektrik-kesintisi-oksijen-sicaklik-plani/'
          selector='/amazon-elektrik-urunleri/akvaryum-kesinti-hava-pompasi-termometre-secici/'
          expected={article,tool,selector}
          assert expected.issubset(pages), expected-set(pages)
          assert pages[article]['affiliate']['hasAffiliateLinks'] is False
          assert pages[tool]['affiliate']['hasAffiliateLinks'] is False
          for path in expected:
              assert not pages[path]['affiliate']['unsafeStaticLinks'], (path,pages[path]['affiliate']['unsafeStaticLinks'])
          print(json.dumps({'ok':True,'routes':sorted(expected),'unsafeStaticLinks':0},ensure_ascii=False))
          PY
      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v290 akvaryum kesinti güven zinciri
          - Arama niyeti: elektrik kesilince akvaryum balıkları için ne yapılır
          - Ücretsiz araç: solunum, yüzey hareketi, sıcaklık, su kalitesi, sistem kapsamı ve son prova
          - Mevcut düzen yeterliyse: yeni ürün almayın
          - Deniz/resif, sump, merkezi, ticari ve yüksek yoğunluklu sistem: professional-only
          - Düşük riskli ürün sınıfı: pilli hava motoru, üreticisi açık 5 V USB pompa, termometre
          - Amazon Türkiye bağlantıları: başlangıçta kilitli ve görünür satış ortaklığı açıklamasından sonra
          - Fiyat, stok, puan, yorum, teslimat, garanti, Offer ve AggregateRating: yok
          - 30/90/180 günlük tekrar ziyaret: yerel takvim dosyası
          EOF
