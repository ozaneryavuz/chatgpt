name: ALO186 kesinti sonrası cihaz yeniden başlatma v284

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-geldikten-sonra-cihazlar-nasil-guvenli-acilir/**'
      - 'alo186/hesaplama/elektrik-geldikten-sonra-cihaz-yeniden-baslatma-plani/**'
      - 'alo186/sektor-rehberi/elektrik-kesintisi-sonrasi-cihaz-koruma-karar-merkezi/**'
      - 'alo186/deployment/routing-overlays/growth-v284-post-outage-restart.json'
      - 'alo186/deployment/affiliate-category-decisions/post-outage-appliance-restart-v284.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v284_post_outage_restart.py'
      - '.github/workflows/alo186-growth-v284-post-outage-restart.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-geldikten-sonra-cihazlar-nasil-guvenli-acilir/**'
      - 'alo186/hesaplama/elektrik-geldikten-sonra-cihaz-yeniden-baslatma-plani/**'
      - 'alo186/sektor-rehberi/elektrik-kesintisi-sonrasi-cihaz-koruma-karar-merkezi/**'
      - 'alo186/deployment/routing-overlays/growth-v284-post-outage-restart.json'
      - 'alo186/deployment/affiliate-category-decisions/post-outage-appliance-restart-v284.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v284_post_outage_restart.py'
      - '.github/workflows/alo186-growth-v284-post-outage-restart.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v284-post-outage-restart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Arama niyeti gizlilik ve ticari sınır
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v284_post_outage_restart.py alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v284_post_outage_restart.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/routing-overlays/growth-v284-post-outage-restart.json >/dev/null
          python -m json.tool alo186/deployment/affiliate-category-decisions/post-outage-appliance-restart-v284.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v284
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v284 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v284
          test -f /tmp/alo186-v284/haberler/elektrik-geldikten-sonra-cihazlar-nasil-guvenli-acilir/index.html
          test -f /tmp/alo186-v284/hesaplama/elektrik-geldikten-sonra-cihaz-yeniden-baslatma-plani/index.html
          test -f /tmp/alo186-v284/sektor-rehberi/elektrik-kesintisi-sonrasi-cihaz-koruma-karar-merkezi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v284
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v284 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-sites-v284')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-geldikten-sonra-cihazlar-nasil-guvenli-acilir/',
              '/hesaplama/elektrik-geldikten-sonra-cihaz-yeniden-baslatma-plani/',
              '/sektor-rehberi/elektrik-kesintisi-sonrasi-cihaz-koruma-karar-merkezi/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for path in expected:
              assert not pages[path]['affiliate']['unsafeStaticLinks']
              assert pages[path]['affiliate']['hasAffiliateLinks'] is False
          print(json.dumps({'ok': True, 'routes': sorted(expected), 'newMerchantLinks': 0, 'unsafeStaticLinks': 0}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v284 kesinti sonrası cihaz yeniden başlatma

          - Arama niyeti: elektrik geldikten sonra cihazlar nasıl güvenli açılır
          - Ücretsiz araç: cihaz türü, koruma, hata, bağlantı ve model talimatı
          - Karar merkezi: no-buy, servis, elektrikçi, resmî EDAŞ kanalı veya mevcut güven kapılı araç
          - Yeni doğrudan Amazon veya mağaza bağlantısı: 0
          - Mevcut cihaz normal çalışıyorsa: yeni ürün almayın
          - Fiyat, stok, puan, yorum, teslimat, garanti, Offer ve AggregateRating: yok
          - 30/90/365 günlük tekrar ziyaret: yerel takvim dosyası
          - Modem/ONT eski migration kuyruğu: kapatıldı; güncel canonical politika envanterine alındı
          EOF
