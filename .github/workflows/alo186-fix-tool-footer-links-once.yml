name: ALO186 araç footer bağlantıları tek seferlik düzeltme

on:
  push:
    branches: [main]
    paths:
      - '.github/alo186-fix-tool-footer-links.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kırık parent-relative yasal bağlantıları canonical rotalara taşı
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('alo186/hesaplama/akulu-el-aleti-batarya-sarj-uygunluk/index.html'): {
                  'href="../../gizlilik/"': 'href="/yasal/gizlilik"',
                  'href="../../iletisim/"': 'href="/iletisim"',
              },
              Path('alo186/hesaplama/multimetre-pensampermetre-cat-uygunluk/index.html'): {
                  'href="../../gizlilik/"': 'href="/yasal/gizlilik"',
                  'href="../../iletisim/"': 'href="/iletisim"',
              },
              Path('alo186/hesaplama/sarjli-pil-sarj-cihazi-uygunluk/index.html'): {
                  'href="../../yasal/amazon-satis-ortakligi/"': 'href="/yasal/amazon-satis-ortakligi"',
                  'href="../../gizlilik/"': 'href="/yasal/gizlilik"',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: beklenen bağlantı tam bir kez bulunmalı: {old!r}; görülen={count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          test = Path('alo186/tests/test_tool_footer_canonical_links.py')
          test.write_text('''from __future__ import annotations

from pathlib import Path


ROOT = Path(__file__).resolve().parents[2]

PAGES = {
    "akulu-el-aleti-batarya-sarj-uygunluk": {
        "required": {"/yasal/gizlilik", "/iletisim"},
        "forbidden": {"../../gizlilik/", "../../iletisim/"},
    },
    "multimetre-pensampermetre-cat-uygunluk": {
        "required": {"/yasal/gizlilik", "/iletisim"},
        "forbidden": {"../../gizlilik/", "../../iletisim/"},
    },
    "sarjli-pil-sarj-cihazi-uygunluk": {
        "required": {"/yasal/gizlilik", "/yasal/amazon-satis-ortakligi"},
        "forbidden": {"../../gizlilik/", "../../yasal/amazon-satis-ortakligi/"},
    },
}


def main() -> None:
    for slug, contract in PAGES.items():
        path = ROOT / "alo186" / "hesaplama" / slug / "index.html"
        html = path.read_text(encoding="utf-8")
        for href in contract["required"]:
            assert f'href="{href}"' in html, (slug, href)
        for href in contract["forbidden"]:
            assert href not in html, (slug, href)
    print({"ok": True, "pages": len(PAGES), "policy": "root-relative canonical legal routes"})


if __name__ == "__main__":
    main()
''', encoding='utf-8')
          PY

      - name: Regresyon ve genel HTML doğrulaması
        shell: bash
        run: |
          set -euo pipefail
          python alo186/tests/test_tool_footer_canonical_links.py
          python .github/scripts/validate_alo186.py

      - name: Geçici workflow'u kaldır ve main dalına kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/alo186-fix-tool-footer-links-once.yml .github/alo186-fix-tool-footer-links.trigger
          git add \
            alo186/hesaplama/akulu-el-aleti-batarya-sarj-uygunluk/index.html \
            alo186/hesaplama/multimetre-pensampermetre-cat-uygunluk/index.html \
            alo186/hesaplama/sarjli-pil-sarj-cihazi-uygunluk/index.html \
            alo186/tests/test_tool_footer_canonical_links.py
          git commit -m 'fix(alo186): araç footer yasal rotalarını canonical bağlantılara taşı'
          git push origin HEAD:main
