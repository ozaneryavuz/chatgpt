name: ALO186 post-outage recovery journey v325

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesintisi-sonrasi-cihazlar-nasil-kontrol-edilir/**'
      - 'alo186/hesaplama/elektrik-kesintisi-sonrasi-guvenli-devreye-alma-plani/**'
      - 'alo186/sektor-rehberi/otel-isletme-elektrik-kesintisi-sonrasi-devreye-alma/**'
      - 'alo186/deployment/routing-overlays/post-outage-recovery-journey-v325.json'
      - 'alo186/tests/test_post_outage_recovery_journey_v325.py'
      - '.github/workflows/alo186-post-outage-recovery-v325.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesintisi-sonrasi-cihazlar-nasil-kontrol-edilir/**'
      - 'alo186/hesaplama/elektrik-kesintisi-sonrasi-guvenli-devreye-alma-plani/**'
      - 'alo186/sektor-rehberi/otel-isletme-elektrik-kesintisi-sonrasi-devreye-alma/**'
      - 'alo186/deployment/routing-overlays/post-outage-recovery-journey-v325.json'
      - 'alo186/tests/test_post_outage_recovery_journey_v325.py'
      - '.github/workflows/alo186-post-outage-recovery-v325.yml'

permissions:
  contents: read

concurrency:
  group: alo186-post-outage-v325-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Trust, privacy and conversion checks
        run: python alo186/tests/test_post_outage_recovery_journey_v325.py
      - name: Build canonical site bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-post-outage-v325
          python alo186/deployment/build_static_site.py --output /tmp/alo186-post-outage-v325 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-post-outage-v325
      - name: Verify routes and sitemap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-post-outage-v325')
          routes = [
            '/haberler/elektrik-kesintisi-sonrasi-cihazlar-nasil-kontrol-edilir/',
            '/hesaplama/elektrik-kesintisi-sonrasi-guvenli-devreye-alma-plani/',
            '/sektor-rehberi/otel-isletme-elektrik-kesintisi-sonrasi-devreye-alma/',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 325
          for route in routes:
              page = root / route.strip('/') / 'index.html'
              assert page.is_file(), page
              assert f'https://alo186.com{route}' in sitemap
          print({'ok': True, 'routingVersion': release['routingVersion'], 'routes': routes})
          PY
      - name: Upload verified bundle
        uses: actions/upload-artifact@v7
        with:
          name: alo186-post-outage-v325-${{ github.sha }}
          path: /tmp/alo186-post-outage-v325
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
