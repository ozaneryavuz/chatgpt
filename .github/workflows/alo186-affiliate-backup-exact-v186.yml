name: ALO186 affiliate backup exact products v186

on:
  pull_request:
    paths:
      - "alo186/amazon-elektrik-urunleri/harici-ssd-hdd-usb-yedekleme-urun-secici/**"
      - "alo186/tests/test_affiliate_backup_exact_v186.js"
      - ".github/workflows/alo186-affiliate-backup-exact-v186.yml"
  push:
    branches: [main]
    paths:
      - "alo186/amazon-elektrik-urunleri/harici-ssd-hdd-usb-yedekleme-urun-secici/**"
      - "alo186/tests/test_affiliate_backup_exact_v186.js"
      - ".github/workflows/alo186-affiliate-backup-exact-v186.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-backup-exact-v186-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exact model data and triple-gate contract
        run: |
          set -euo pipefail
          node --check alo186/amazon-elektrik-urunleri/harici-ssd-hdd-usb-yedekleme-urun-secici/exact-products-v186.js
          node --check alo186/amazon-elektrik-urunleri/harici-ssd-hdd-usb-yedekleme-urun-secici/exact-products-v186-app.js
          node alo186/tests/test_affiliate_backup_exact_v186.js

      - name: Existing backup, affiliate and legal regressions
        run: |
          set -euo pipefail
          python alo186/tests/test_data_backup_growth_v184.py
          node alo186/tests/test_affiliate_exact_products_v175.js
          python alo186/tests/test_affiliate_contextual_product_hubs_v174.py
          node alo186/tests/test_release_manifest.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical production package
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-backup-exact-v186 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-backup-exact-v186
          route=/tmp/alo186-backup-exact-v186/amazon-elektrik-urunleri/harici-ssd-hdd-usb-yedekleme-urun-secici
          test -f "$route/index.html"
          test -f "$route/exact-products-v186.js"
          test -f "$route/exact-products-v186-app.js"
          test -f "$route/exact-products-v186.css"

      - name: Custom-domain and project-path Pages acceptance
        run: |
          set -euo pipefail
          for target in custom project; do
            cp -a /tmp/alo186-backup-exact-v186 "/tmp/alo186-backup-exact-v186-$target"
          done
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-backup-exact-v186-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-backup-exact-v186-custom \
            --base-path ''
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-backup-exact-v186-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-backup-exact-v186-project \
            --base-path '/chatgpt'

      - name: Route, sitemap and commerce safety acceptance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          canonical='/amazon-elektrik-urunleri/harici-ssd-hdd-usb-yedekleme-urun-secici/'
          canonical_path=canonical.rstrip('/')
          relative='amazon-elektrik-urunleri/harici-ssd-hdd-usb-yedekleme-urun-secici'
          allowed_hosts={'alo186.com','www.alo186.com','ozaneryavuz.github.io'}
          for root,base_path in [
              (Path('/tmp/alo186-backup-exact-v186-custom'),''),
              (Path('/tmp/alo186-backup-exact-v186-project'),'/chatgpt'),
          ]:
              page=(root/relative/'index.html').read_text(encoding='utf-8')
              data=(root/relative/'exact-products-v186.js').read_text(encoding='utf-8')
              app=(root/relative/'exact-products-v186-app.js').read_text(encoding='utf-8')
              assert data.count("asin:")==4
              assert all(asin in data for asin in ('B09VLK9W3S','B06W55K9N6','B0B57T5G5L','B07YYJL21Z'))
              assert not re.search(r'href=["\']https://www\.amazon\.com\.tr/dp/',page,re.I)
              assert all(token in page for token in ('exactNeedConfirm','exactSpecConfirm','exactAffiliateConfirm'))
              assert 'sponsored nofollow noopener' in app
              assert '"@type":"Product"' not in page and '"@type":"Offer"' not in page
              release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
              routes={item.get('canonicalPath') if isinstance(item,dict) else item for item in release.get('routes',[])}
              assert canonical in routes
              sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
              locations=re.findall(r'<loc>([^<]+)</loc>',sitemap)
              expected_paths={canonical_path}
              if base_path:
                  expected_paths.add(f'{base_path}{canonical}'.rstrip('/'))
              assert any(
                  urlparse(location).hostname in allowed_hosts
                  and urlparse(location).path.rstrip('/') in expected_paths
                  for location in locations
              ), (canonical,base_path,sorted(expected_paths),locations[-10:])
          print(json.dumps({'ok':True,'route':canonical,'exactModels':4,'tripleGate':True,'staleFailClosed':True,'noUngatedExactLinks':True,'sitemapHosts':sorted(allowed_hosts)}))
          PY

      - name: Verified Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: alo186-affiliate-backup-exact-v186-pages
          path: /tmp/alo186-backup-exact-v186-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
