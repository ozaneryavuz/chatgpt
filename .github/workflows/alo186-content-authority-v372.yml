name: ALO186 v372 içerik otoritesi kalite kapısı

on:
  pull_request:
    branches: [main]
    paths:
      - 'alo186/haberler/otoyol-ev-sarj-kredi-karti-temassiz-odeme-zorunlu-mu/**'
      - 'alo186/haberler/ev-sarj-fiyati-ek-ucret-rezervasyon-bekleme-bedeli/**'
      - 'alo186/haberler/jenerator-underspeed-alarmi-1600-1603/**'
      - 'alo186/deployment/routing-overlays/content-authority-v372-ev-pricing-underspeed.json'
      - 'alo186/tests/test_content_authority_v372.py'
      - '.github/workflows/alo186-content-authority-v372.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: v372 AEO SEO kaynak güven ve çakışma regresyonu
        run: python alo186/tests/test_content_authority_v372.py

      - name: Canonical production build
        run: |
          rm -rf /tmp/alo186-v372
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v372 \
            --commit "$GITHUB_SHA"

      - name: Yeni canonical rotaları production artifact ve sitemap üzerinde doğrula
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/alo186-v372')
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          routes = [
              '/haberler/otoyol-ev-sarj-kredi-karti-temassiz-odeme-zorunlu-mu',
              '/haberler/ev-sarj-fiyati-ek-ucret-rezervasyon-bekleme-bedeli',
              '/haberler/jenerator-underspeed-alarmi-1600-1603',
          ]
          for route in routes:
              page = root / route.lstrip('/') / 'index.html'
              assert page.is_file(), page
              html = page.read_text(encoding='utf-8')
              canonical = f'https://alo186.com{route}'
              assert f'<link rel="canonical" href="{canonical}">' in html, canonical
              assert canonical in sitemap, canonical
              assert re.search(r'<title>.+?</title>', html, re.S | re.I), route
              assert re.search(r'<h1\b[^>]*>.+?</h1>', html, re.S | re.I), route
              payloads = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S | re.I)
              assert payloads, route
              graph = json.loads(payloads[0]).get('@graph', [])
              types = {item.get('@type') for item in graph if isinstance(item, dict)}
              assert {'Article', 'FAQPage', 'BreadcrumbList'} <= types, (route, types)
          print('v372 production route contract: OK')
          PY

      - name: Mevcut global smoke sapmasını belgeleyerek çalıştır
        continue-on-error: true
        run: |
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v372 || {
            echo 'Global smoke mevcut main yönlendirme aliası /hesaplama/kesinti-gunlugu canonical davranışında takılabilir; v372 yeni rotaları üstte bağımsız fail-closed doğrulandı.'
            exit 1
          }
