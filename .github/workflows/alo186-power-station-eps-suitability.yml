name: ALO186 Power Station EPS Suitability CI

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/power-station-kapasite-eps-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/urun-eslestirme/catalog.js'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - '.github/workflows/alo186-power-station-eps-suitability.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/power-station-kapasite-eps-uygunluk/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/urun-eslestirme/catalog.js'
      - 'alo186/deployment/routing-manifest.json'
      - 'alo186/sitemap.xml'
      - '.github/workflows/alo186-power-station-eps-suitability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-power-station-eps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JavaScript sözdizimi ve karar senaryoları
        run: |
          node --check alo186/hesaplama/power-station-kapasite-eps-uygunluk/core.js
          node --check alo186/hesaplama/power-station-kapasite-eps-uygunluk/app.js
          node --check alo186/hesaplama/power-station-kapasite-eps-uygunluk/test.js
          node alo186/hesaplama/power-station-kapasite-eps-uygunluk/test.js

      - name: HTML JSON-LD XML ve gizlilik sözleşmesi
        shell: bash
        run: |
          set -euo pipefail
          file='alo186/hesaplama/power-station-kapasite-eps-uygunluk/index.html'
          grep -q 'Power Station Kapasite ve EPS/UPS Uygunluk Testi' "$file"
          grep -q 'Reklam / satış ortaklığı açıklaması' "$file"
          grep -q 'Satın almama sonucu' "$file"
          grep -q 'Kişisel veri yok' "$file"
          grep -q '/akilli-urun-secimi?kategori=power_station' "$file"
          grep -Eq '2[8-9] çekirdek araç' alo186/hesaplama/index.html
          grep -q 'power-station-kapasite-eps-uygunluk' alo186/deployment/routing-manifest.json
          grep -q 'hesaplama/power-station-kapasite-eps-uygunluk/' alo186/sitemap.xml
          grep -q "nextStepUrl:'https://www.alo186.com/hesaplama/power-station-kapasite-eps-uygunluk/'" alo186/urun-eslestirme/catalog.js
          if grep -Eqi 'amazon\.(com\.tr|com)/' "$file"; then
            echo 'Yeni araçta doğrudan Amazon bağlantısı bulundu.' >&2
            exit 1
          fi
          if grep -Eqi 'type="(email|tel|text)"|name="(address|phone|email|subscription|plate|serial|note)' "$file"; then
            echo 'Yeni araçta kişisel veri veya serbest metin alanı bulundu.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import json,re,xml.etree.ElementTree as ET
          html=Path('alo186/hesaplama/power-station-kapasite-eps-uygunluk/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script type="application/ld\+json">(.*?)</script>',html,re.S)
          assert blocks
          for block in blocks: json.loads(block)
          ET.parse('alo186/sitemap.xml')
          json.loads(Path('alo186/deployment/routing-manifest.json').read_text(encoding='utf-8'))
          PY

      - name: Cihaz hasarı başvuru süresi güvenlik kapısı
        run: python alo186/tests/device_damage_deadline_guard.py

      - name: Production bundle ve smoke testi
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-power-station-site --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-power-station-site
          test -f /tmp/alo186-power-station-site/hesaplama/power-station-kapasite-eps-uygunluk/index.html
          test -f /tmp/alo186-power-station-site/hesaplama/power-station-kapasite-eps-uygunluk/core.js
          test -f /tmp/alo186-power-station-site/hesaplama/power-station-kapasite-eps-uygunluk/app.js
          test ! -f /tmp/alo186-power-station-site/hesaplama/power-station-kapasite-eps-uygunluk/test.js
          grep -Eq '2[8-9] çekirdek araç' /tmp/alo186-power-station-site/hesaplama/index.html

      - name: Doğrulanmış production artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-power-station-eps-production
          path: /tmp/alo186-power-station-site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
