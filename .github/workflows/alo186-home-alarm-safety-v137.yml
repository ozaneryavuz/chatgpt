name: ALO186 ev duman ve CO alarmı güvenli büyüme v137

on:
  pull_request:
    paths:
      - 'alo186/assets/home-alarm-safety-v137.css'
      - 'alo186/hesaplama/duman-alarmi-isi-alarmi-uygunluk/**'
      - 'alo186/hesaplama/karbonmonoksit-alarmi-uygunluk/**'
      - 'alo186/sektor-rehberi/ev-duman-karbonmonoksit-alarm-test-merkezi/**'
      - 'alo186/deployment/routing-overlays/137-home-alarm-safety.json'
      - 'alo186/tests/test_home_alarm_safety_v137.js'
      - 'alo186/audits/growth-home-alarm-safety-v137.md'
      - '.github/workflows/alo186-home-alarm-safety-v137.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/assets/home-alarm-safety-v137.css'
      - 'alo186/hesaplama/duman-alarmi-isi-alarmi-uygunluk/**'
      - 'alo186/hesaplama/karbonmonoksit-alarmi-uygunluk/**'
      - 'alo186/sektor-rehberi/ev-duman-karbonmonoksit-alarm-test-merkezi/**'
      - 'alo186/deployment/routing-overlays/137-home-alarm-safety.json'
      - 'alo186/tests/test_home_alarm_safety_v137.js'
      - 'alo186/audits/growth-home-alarm-safety-v137.md'
      - '.github/workflows/alo186-home-alarm-safety-v137.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-home-alarm-safety-v137-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Duman, ısı ve CO alarmı karar/yayın kabulü
        run: node alo186/tests/test_home_alarm_safety_v137.js

      - name: Mevcut kullanıcı güveni ve yayın regresyonları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Denetim özeti
        run: |
          printf '%s\n' \
            '3 canonical rota' \
            '112 ve 187 acil kapanışları' \
            'EN 14604 / EN 50291 görev ayrımı' \
            'mevcut alarm yeterliyse satın almama' \
            'üçlü affiliate onayı' \
            '30/90 günlük tekrar test' \
            'fiyat, stok, puan ve garanti yok'
