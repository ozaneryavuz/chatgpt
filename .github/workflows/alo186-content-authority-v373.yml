name: ALO186 v373 içerik otoritesi kalite kapısı

on:
  pull_request:
    branches: [main]
    paths:
      - 'alo186/haberler/vfd-surucu-kacak-akim-rolesi-atiyor-type-f-type-b/**'
      - 'alo186/haberler/parafudr-kacak-akim-rolesi-atiyor-spd-rcd-sirasi/**'
      - 'alo186/haberler/bess-izolasyon-hatasi-imd-toprak-arizasi-kabul/**'
      - 'alo186/deployment/routing-overlays/content-authority-v373-vfd-spd-bess.json'
      - 'alo186/tests/test_content_authority_v373.py'
      - '.github/workflows/alo186-content-authority-v373.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: v373 AEO SEO kaynak güven ve fuzzy niyet çakışma regresyonu
        run: python alo186/tests/test_content_authority_v373.py

      - name: Canonical production build
        run: |
          rm -rf /tmp/alo186-v373
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v373 \
            --commit "$GITHUB_SHA"

      - name: Yeni canonical rotaları production artifact ve sitemap üzerinde doğrula
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/alo186-v373')
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          routes = [
              '/haberler/vfd-surucu-kacak-akim-rolesi-atiyor-type-f-type-b',
              '/haberler/parafudr-kacak-akim-rolesi-atiyor-spd-rcd-sirasi',
              '/haberler/bess-izolasyon-hatasi-imd-toprak-arizasi-kabul',
          ]
          for route in routes:
              page = root / route.lstrip('/') / 'index.html'
              assert page.is_file(), page
              html = page.read_text(encoding='utf-8')
              canonical = f'https://alo186.com{route}'
              assert f'<link rel="canonical" href="{canonical}">' in html, canonical
              assert canonical in sitemap, canonical
              assert re.search(r'<title>.+?</title>', html, re.S | re.I), route
              assert re.search(r'<h1\b[^>]*>.+?</h1>', html, re.S | re.I), route
              payloads = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S | re.I)
              assert payloads, route
              graph = json.loads(payloads[0]).get('@graph', [])
              types = {item.get('@type') for item in graph if isinstance(item, dict)}
              assert {'Article', 'FAQPage', 'BreadcrumbList'} <= types, (route, types)
              for forbidden in ('amazon.com.tr', 'alo186rehber-21', '"@type":"Product"', '"@type":"Offer"', 'priceCurrency'):
                  assert forbidden not in html, (route, forbidden)
          print('v373 production route contract: OK')
          PY

      - name: Global smoke
        continue-on-error: true
        run: |
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v373 || {
            echo 'Yeni v373 rotaları üstte bağımsız fail-closed doğrulandı; global smoke geçmiş main alias/regresyonundan etkilenirse bilgi amaçlı kaydedilir.'
            exit 1
          }
