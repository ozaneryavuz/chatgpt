name: ALO186 güvenli USB-C görüntü affiliate v254

on:
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/**'
      - 'alo186/deployment/routing-overlays/254-affiliate-usbc-display.json'
      - 'alo186/tests/test_affiliate_usbc_display_v254.js'
      - '.github/workflows/alo186-affiliate-usbc-display-v254.yml'
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/**'
      - 'alo186/deployment/routing-overlays/254-affiliate-usbc-display.json'
      - 'alo186/tests/test_affiliate_usbc_display_v254.js'
      - '.github/workflows/alo186-affiliate-usbc-display-v254.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-usbc-display-v254-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ürün, Knowledge Graph ve affiliate güven regresyonu
        run: |
          node --check alo186/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/catalog-v254.js
          node --check alo186/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/app-v254.js
          node alo186/tests/test_affiliate_usbc_display_v254.js
      - name: Affiliate kapsam ve ticari yönetişim
        run: |
          printf '%s\n' \
            'alo186/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/index.html' \
            'alo186/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/catalog-v254.js' \
            'alo186/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/app-v254.js' \
            > /tmp/changed-affiliate-v254.txt
          python alo186/tests/test_affiliate_scope_policy_v229.py --changed-files /tmp/changed-affiliate-v254.txt
          node alo186/tests/test_release_manifest.js
      - name: Canonical production paketi
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-affiliate-v254 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-affiliate-v254
          test -f /tmp/alo186-affiliate-v254/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/index.html
          grep -Fq 'https://alo186.com/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/' /tmp/alo186-affiliate-v254/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/index.html
          grep -Fq 'rel="sponsored nofollow noopener"' /tmp/alo186-affiliate-v254/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/index.html
          ! grep -Eqi '"@type"[[:space:]]*:[[:space:]]*"Offer"|priceCurrency|aggregateRating|ratingValue|reviewCount' /tmp/alo186-affiliate-v254/amazon-elektrik-urunleri/usb-c-goruntu-cikisi-displayport-hdmi-uyumluluk-secimi/index.html
