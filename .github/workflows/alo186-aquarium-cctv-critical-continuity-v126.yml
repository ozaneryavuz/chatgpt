name: ALO186 akvaryum kamera ve kritik sistem sürekliliği v126

on:
  pull_request:
    paths:
      - 'alo186/assets/critical-continuity-v126.css'
      - 'alo186/hesaplama/akvaryum-elektrik-kesintisi-yedek-guc-uygunluk/**'
      - 'alo186/hesaplama/kamera-nvr-poe-ups-uygunluk/**'
      - 'alo186/sektor-rehberi/kritik-sistemler-yedek-guc-test-merkezi/**'
      - 'alo186/deployment/routing-overlays/126-aquarium-cctv-critical-continuity.json'
      - 'alo186/tests/test_aquarium_cctv_critical_continuity_v126.js'
      - '.github/workflows/alo186-aquarium-cctv-critical-continuity-v126.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/assets/critical-continuity-v126.css'
      - 'alo186/hesaplama/akvaryum-elektrik-kesintisi-yedek-guc-uygunluk/**'
      - 'alo186/hesaplama/kamera-nvr-poe-ups-uygunluk/**'
      - 'alo186/sektor-rehberi/kritik-sistemler-yedek-guc-test-merkezi/**'
      - 'alo186/deployment/routing-overlays/126-aquarium-cctv-critical-continuity.json'
      - 'alo186/tests/test_aquarium_cctv_critical_continuity_v126.js'
      - '.github/workflows/alo186-aquarium-cctv-critical-continuity-v126.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-aquarium-cctv-critical-continuity-v126-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Karar motorları, güvenlik, tekrar ziyaret ve dual Pages kabulü
        run: node alo186/tests/test_aquarium_cctv_critical_continuity_v126.js

      - name: Mevcut yayın ve kullanıcı güveni regresyonları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py
