name: ALO186 güvenli kesinti çalışma feneri affiliate v240

on:
  push:
    branches: [main]
    paths:
      - 'alo186/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/**'
      - 'alo186/deployment/routing-overlays/240-affiliate-portable-work-light.json'
      - 'alo186/tests/test_affiliate_portable_work_light_v240.js'
      - '.github/workflows/alo186-affiliate-portable-work-light-v240.yml'
  pull_request:
    paths:
      - 'alo186/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/**'
      - 'alo186/deployment/routing-overlays/240-affiliate-portable-work-light.json'
      - 'alo186/tests/test_affiliate_portable_work_light_v240.js'
      - '.github/workflows/alo186-affiliate-portable-work-light-v240.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-affiliate-portable-work-light-v240-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ürün, Knowledge Graph ve affiliate güven regresyonu
        run: |
          node --check alo186/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/catalog-v240.js
          node --check alo186/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/app-v240.js
          node alo186/tests/test_affiliate_portable_work_light_v240.js
      - name: Affiliate kapsam ve ticari yönetişim
        run: |
          printf '%s\n' \
            'alo186/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/index.html' \
            'alo186/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/catalog-v240.js' \
            'alo186/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/app-v240.js' \
            > /tmp/changed-affiliate-v240.txt
          python alo186/tests/test_affiliate_scope_policy_v229.py --changed-files /tmp/changed-affiliate-v240.txt
          node alo186/tests/test_release_manifest.js
      - name: Canonical production paketi
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-affiliate-v240 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-affiliate-v240
          test -f /tmp/alo186-affiliate-v240/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/index.html
          grep -Fq 'https://alo186.com/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/' /tmp/alo186-affiliate-v240/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/index.html
          grep -Fq 'rel="sponsored nofollow noopener"' /tmp/alo186-affiliate-v240/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/index.html
          ! grep -Eqi '"@type"[[:space:]]*:[[:space:]]*"Offer"|priceCurrency|aggregateRating|ratingValue' /tmp/alo186-affiliate-v240/amazon-elektrik-urunleri/elektrik-kesintisi-calisma-feneri-aydinlatma-secimi/index.html
