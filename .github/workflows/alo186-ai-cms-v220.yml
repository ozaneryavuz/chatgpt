name: ALO186 AI CMS v220

on:
  pull_request:
    paths:
      - 'alo186/cms/**'
      - 'alo186/deployment/ai_cms_v220.py'
      - 'alo186/deployment/routing-overlays/ai-cms-*-v220.json'
      - 'alo186/tests/test_ai_cms_v220.py'
      - '.github/workflows/alo186-ai-cms-v220.yml'
      - '.github/ISSUE_TEMPLATE/ai-cms-content-request.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/cms/**'
      - 'alo186/deployment/ai_cms_v220.py'
      - 'alo186/deployment/routing-overlays/ai-cms-*-v220.json'
      - 'alo186/tests/test_ai_cms_v220.py'
      - '.github/workflows/alo186-ai-cms-v220.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: CMS işlemi
        required: true
        type: choice
        default: validate
        options:
          - validate
          - audit
          - scaffold
          - generate
          - compile
      request_path:
        description: İstek JSON yolu
        required: false
        default: alo186/cms/requests/example.json
        type: string
      content_path:
        description: Compile için onaylı içerik JSON yolu
        required: false
        default: ''
        type: string
      model:
        description: OpenAI model adı
        required: false
        default: gpt-5-mini
        type: string
      create_draft_pr:
        description: Değişiklik varsa taslak PR aç
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: alo186-ai-cms-v220-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: CMS Python ve sözleşme testleri
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/deployment/ai_cms_v220.py \
            alo186/tests/test_ai_cms_v220.py
          python alo186/tests/test_ai_cms_v220.py
          python alo186/deployment/ai_cms_v220.py validate \
            --report /tmp/alo186-ai-cms-validate.json
          python alo186/deployment/ai_cms_v220.py audit \
            --report /tmp/alo186-ai-cms-audit.json

      - name: Canonical site derleme ve smoke
        shell: bash
        run: |
          set -euo pipefail
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-ai-cms-site \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-ai-cms-site

      - name: CMS kanıt özeti
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          validation = json.loads(Path('/tmp/alo186-ai-cms-validate.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('/tmp/alo186-ai-cms-audit.json').read_text(encoding='utf-8'))
          assert validation['ok'] is True, validation
          assert audit['ok'] is True, audit
          assert validation['autoPublish'] is False, validation
          assert validation['personalProfilesAllowed'] is False, validation
          assert audit['personalProfilePublished'] is False, audit
          summary = {
              'cmsVersion': validation['cmsVersion'],
              'requests': validation['counts']['requests'],
              'drafts': validation['counts']['drafts'],
              'approved': validation['counts']['approved'],
              'publishedRecords': validation['counts']['publishedRecords'],
              'autoPublish': validation['autoPublish'],
              'personalProfilePublished': audit['personalProfilePublished'],
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          Path('/tmp/alo186-ai-cms-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          {
            echo '## ALO186 AI CMS v220'
            echo '```json'
            cat /tmp/alo186-ai-cms-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  operate:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      CMS_OPERATION: ${{ inputs.operation }}
      CMS_REQUEST_PATH: ${{ inputs.request_path }}
      CMS_CONTENT_PATH: ${{ inputs.content_path }}
      CMS_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Seçilen CMS işlemini uygula
        shell: bash
        run: |
          set -euo pipefail
          case "$CMS_OPERATION" in
            validate)
              python alo186/deployment/ai_cms_v220.py validate
              ;;
            audit)
              python alo186/deployment/ai_cms_v220.py audit
              ;;
            scaffold)
              python alo186/deployment/ai_cms_v220.py generate \
                --request "$CMS_REQUEST_PATH" \
                --model "$CMS_MODEL" \
                --offline-scaffold
              ;;
            generate)
              test -n "$OPENAI_API_KEY" || {
                echo 'OPENAI_API_KEY repository secret tanımlı değil.' >&2
                exit 1
              }
              python alo186/deployment/ai_cms_v220.py generate \
                --request "$CMS_REQUEST_PATH" \
                --model "$CMS_MODEL"
              ;;
            compile)
              test -n "$CMS_CONTENT_PATH" || {
                echo 'compile için content_path zorunlu.' >&2
                exit 1
              }
              python alo186/deployment/ai_cms_v220.py compile \
                --article "$CMS_CONTENT_PATH"
              ;;
            *)
              echo "Bilinmeyen CMS işlemi: $CMS_OPERATION" >&2
              exit 1
              ;;
          esac

      - name: İşlem sonrası fail-closed doğrulama
        shell: bash
        run: |
          set -euo pipefail
          python alo186/deployment/ai_cms_v220.py validate \
            --report /tmp/alo186-ai-cms-operation-validate.json
          python alo186/deployment/ai_cms_v220.py audit \
            --report /tmp/alo186-ai-cms-operation-audit.json
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-ai-cms-operation-site \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-ai-cms-operation-site

      - name: Yalnız izinli CMS dosyalarını taslak PR'a taşı
        if: inputs.create_draft_pr
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            alo186/cms \
            alo186/haberler \
            alo186/deployment/routing-overlays; then
            echo 'CMS işlemi repository değişikliği üretmedi.'
            exit 0
          fi

          branch="ai-cms/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'alo186-ai-cms[bot]'
          git config user.email 'alo186-ai-cms[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- \
            alo186/cms \
            alo186/haberler \
            alo186/deployment/routing-overlays

          unexpected=$(git status --porcelain | grep -Ev '^.. (alo186/cms/|alo186/haberler/|alo186/deployment/routing-overlays/)' || true)
          if [ -n "$unexpected" ]; then
            echo 'İzinli CMS kökleri dışında değişiklik bulundu:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git commit -m "ALO186 AI CMS: ${CMS_OPERATION} çıktısı"
          git push --set-upstream origin "$branch"
          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "ALO186 AI CMS: ${CMS_OPERATION} taslağı" \
            --body "Bu PR ALO186 AI CMS v220 tarafından taslak olarak oluşturuldu. Otomatik yayın ve otomatik birleştirme yoktur. Kaynak, güvenlik, gizlilik, canonical, sitemap ve static build kapıları tamamlanmadan hazır durumuna getirilemez."
