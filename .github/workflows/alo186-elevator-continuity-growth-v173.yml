      - "alo186/tests/test_elevator_continuity_growth_v173.py"
      - ".github/workflows/alo186-elevator-continuity-growth-v173.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python alo186/tests/test_elevator_continuity_growth_v173.py
