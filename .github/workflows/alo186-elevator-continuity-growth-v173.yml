name: ALO186 elevator continuity growth v173

on:
  pull_request:
    paths:
      - "alo186/hesaplama/asansorde-elektrik-kesintisi-mahsur-kalma-guvenligi/**"
      - "alo186/hesaplama/asansor-otomatik-kurtarma-alarm-aku-jenerator-uygunluk-kontrolu/**"
      - "alo186/sektor-rehberi/apartman-otel-asansor-elektrik-kesintisi-test-merkezi/**"
      - "alo186/deployment/routing-overlays/173-elevator-continuity-growth.json"
      - "alo186/audits/elevator-continuity-growth-v173-2026-08-01.md"
      - "alo186/tests/test_elevator_continuity_growth_v173.py"
      - ".github/workflows/alo186-elevator-continuity-growth-v173.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/asansorde-elektrik-kesintisi-mahsur-kalma-guvenligi/**"
      - "alo186/hesaplama/asansor-otomatik-kurtarma-alarm-aku-jenerator-uygunluk-kontrolu/**"
