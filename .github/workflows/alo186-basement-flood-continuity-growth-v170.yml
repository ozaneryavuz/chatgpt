name: ALO186 basement flood continuity growth v170

on:
  pull_request:
    paths:
      - "alo186/hesaplama/elektrik-kesintisi-bodrum-su-baskini-elektrik-guvenligi/**"
      - "alo186/hesaplama/pilli-su-kacak-alarmi-yuksek-seviye-sensoru-uygunlugu/**"
      - "alo186/sektor-rehberi/ev-bodrum-su-baskini-elektrik-kesintisi-test-merkezi/**"
      - "alo186/deployment/routing-overlays/170-basement-flood-continuity-growth.json"
      - "alo186/audits/basement-flood-continuity-growth-v170-2026-08-01.md"
      - "alo186/tests/test_basement_flood_continuity_growth_v170.py"
      - ".github/workflows/alo186-basement-flood-continuity-growth-v170.yml"
  push:
    branches: [main]
    paths:
      - "alo186/hesaplama/elektrik-kesintisi-bodrum-su-baskini-elektrik-guvenligi/**"
      - "alo186/hesaplama/pilli-su-kacak-alarmi-yuksek-seviye-sensoru-uygunlugu/**"
      - "alo186/sektor-rehberi/ev-bodrum-su-baskini-elektrik-kesintisi-test-merkezi/**"
      - "alo186/deployment/routing-overlays/170-basement-flood-continuity-growth.json"
      - "alo186/tests/test_basement_flood_continuity_growth_v170.py"
      - ".github/workflows/alo186-basement-flood-continuity-growth-v170.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python alo186/tests/test_basement_flood_continuity_growth_v170.py
