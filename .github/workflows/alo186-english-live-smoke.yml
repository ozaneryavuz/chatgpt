name: ALO186 English live publication smoke

on:
  pull_request:
    paths:
      - 'alo186/deployment/check_live_english.py'
      - 'alo186/deployment/english-core-release.json'
      - 'alo186/tests/test_live_english_smoke.py'
      - '.github/workflows/alo186-english-live-smoke.yml'
  workflow_run:
    workflows:
      - 'ALO186 GitHub Pages — sunucusuz canlı yayın'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: alo186-english-live-smoke-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canlı yayın doğrulama sözleşmeleri
        run: |
          set -euo pipefail
          python alo186/tests/test_live_english_smoke.py
          python -m py_compile \
            alo186/deployment/check_live_english.py \
            alo186/tests/test_live_english_smoke.py
          python alo186/deployment/check_live_english.py --help >/dev/null

  live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      REPORT_PATH: /tmp/alo186-live-english-report.json
      ISSUE_NUMBER: '400'
      STATUS_MARKER: '<!-- alo186-english-live-smoke -->'
    steps:
      - name: Güncel ana dalı al
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Beklenen yayın commitini belirle
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            expected_sha="$WORKFLOW_HEAD_SHA"
            pages_conclusion="$WORKFLOW_CONCLUSION"
          else
            expected_sha="$(git rev-parse HEAD)"
            pages_conclusion='success'
          fi
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "pages_conclusion=$pages_conclusion" >> "$GITHUB_OUTPUT"

      - name: Canlı İngilizce rotaları ve sitemap'i doğrula
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          PAGES_CONCLUSION: ${{ steps.release.outputs.pages_conclusion }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$PAGES_CONCLUSION" != 'success' ]; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "ok": False,
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "origin": "https://alo186.com",
              "expected_commit": os.environ["EXPECTED_SHA"],
              "live_commit": "",
              "live_commit_relation": "pages-workflow-failed",
              "attempts": 0,
              "route_count": 0,
              "sitemap_url_count": 0,
              "routes": [],
              "errors": [f"GitHub Pages workflow sonucu: {os.environ['PAGES_CONCLUSION']}"],
          }
          Path(os.environ["REPORT_PATH"]).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
            exit 1
          fi

          python alo186/deployment/check_live_english.py \
            --origin https://alo186.com \
            --repository "$GITHUB_REPOSITORY" \
            --expected-commit "$EXPECTED_SHA" \
            --attempts 36 \
            --interval 15 \
            --timeout 25 \
            --report "$REPORT_PATH"

      - name: Canlı doğrulama raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-english-smoke-${{ steps.release.outputs.expected_sha }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 45

      - name: Issue 400 canlı durum kaydını güncelle
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          issue = os.environ["ISSUE_NUMBER"]
          marker = os.environ["STATUS_MARKER"]
          token = os.environ["GITHUB_TOKEN"]
          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          ok = bool(report.get("ok"))
          status = "✅ BAŞARILI" if ok else "❌ BAŞARISIZ"
          expected = str(report.get("expected_commit") or os.environ.get("EXPECTED_SHA", ""))
          live = str(report.get("live_commit", ""))
          relation = str(report.get("live_commit_relation", "unknown"))
          errors = report.get("errors") or []
          error_text = "\n".join(f"- `{item}`" for item in errors[:8]) if errors else "- Hata yok"
          route_count = int(report.get("route_count") or 0)
          sitemap_count = int(report.get("sitemap_url_count") or 0)
          checked_at = str(report.get("checked_at", ""))
          attempts = int(report.get("attempts") or 0)

          body = f"""{marker}
          ## İngilizce canlı yayın smoke testi — {status}

          - Beklenen Pages kaynağı: `{expected}`
          - Canlı release commit: `{live or 'okunamadı'}`
          - Commit ilişkisi: **{relation}**
          - Doğrulanan İngilizce rota: **{route_count}/10**
          - Sitemap URL sayısı: **{sitemap_count}**
          - Deneme sayısı: **{attempts}**
          - Kontrol zamanı: `{checked_at}`
          - [Workflow çalıştırmasını aç]({os.environ['RUN_URL']})

          ### Son hata özeti
          {error_text}

          Bu yorum yeni yayınlarda aynı kayıt üzerinde güncellenir; Issue #400 yorum akışını tekrarlarla doldurmaz.
          """

          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "alo186-english-live-smoke",
          }

          def request_json(url: str, *, method: str = "GET", payload: dict | None = None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          comment_id = None
          page = 1
          while page <= 10 and comment_id is None:
              query = urllib.parse.urlencode({"per_page": 100, "page": page})
              comments = request_json(f"{api}/issues/{issue}/comments?{query}")
              if not comments:
                  break
              for comment in comments:
                  if marker in str(comment.get("body", "")):
                      comment_id = comment.get("id")
                      break
              page += 1

          if comment_id:
              request_json(f"{api}/issues/comments/{comment_id}", method="PATCH", payload={"body": body})
              action = "updated"
          else:
              request_json(f"{api}/issues/{issue}/comments", method="POST", payload={"body": body})
              action = "created"
          print(json.dumps({"ok": ok, "comment": action, "issue": int(issue)}, ensure_ascii=False))
          PY

      - name: Canlı doğrulama başarısızsa workflow'u kır
        if: steps.smoke.outcome != 'success'
        run: exit 1
