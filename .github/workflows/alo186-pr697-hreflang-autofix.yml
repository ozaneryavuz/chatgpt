name: ALO186 PR697 hreflang recovery autofix

on:
  push:
    branches: [fix/alo186-sitemap-recovery-hreflang-v214]
    paths:
      - '.github/workflows/alo186-pr697-hreflang-autofix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alo186-sitemap-recovery-hreflang-v214
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve hreflang on malformed sitemap recovery
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('alo186/deployment/inject_shortlist_growth.py')
          text = path.read_text(encoding='utf-8')
          import_line = 'from sitemap_hreflang import write_effective_sitemap\n'
          anchor = 'from normalize_consolidated_release import run as normalize_consolidated_release\n'
          if import_line not in text:
              text = text.replace(anchor, anchor + import_line, 1)
          old = '''    except ET.ParseError:\n        # The release inventory is the fail-closed source of truth. A previous\n        # legacy growth injector may leave partially written XML; rebuild only\n        # from active canonical routes instead of publishing a broken sitemap.\n        namespace="http://www.sitemaps.org/schemas/sitemap/0.9"\n        root=ET.Element(f"{{{namespace}}}urlset")\n        tree=ET.ElementTree(root)\n        recovered_malformed=True\n'''
          new = '''    except ET.ParseError:\n        # Rebuild through the canonical bilingual sitemap writer so malformed\n        # legacy XML cannot erase XHTML hreflang alternates. The active release\n        # inventory remains the fail-closed source of routes and excludes aliases.\n        manifest={\n            "canonicalHost":str(release.get("canonicalHost") or "https://alo186.com"),\n            "routes":list(release.get("routes") or []),\n        }\n        write_effective_sitemap(site,manifest)\n        tree=ET.parse(sitemap_path)\n        root=tree.getroot()\n        namespace=root.tag.split("}")[0].strip("{") if "}" in root.tag else ""\n        recovered_malformed=True\n'''
          if old not in text:
              raise SystemExit('PR697 recovery block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('alo186/tests/test_shortlist_sitemap_recovery_hreflang.py')
          test.write_text('''from __future__ import annotations\n\nimport importlib.util\nimport json\nimport tempfile\nimport xml.etree.ElementTree as ET\nfrom pathlib import Path\nimport sys\n\nROOT = Path(__file__).resolve().parents[2]\nDEPLOY = ROOT / "alo186/deployment"\nsys.path.insert(0, str(DEPLOY))\nspec = importlib.util.spec_from_file_location("shortlist_growth", DEPLOY / "inject_shortlist_growth.py")\nmodule = importlib.util.module_from_spec(spec)\nassert spec and spec.loader\nspec.loader.exec_module(module)\n\nSITEMAP = "http://www.sitemaps.org/schemas/sitemap/0.9"\nXHTML = "http://www.w3.org/1999/xhtml"\n\ndef fake_writer(output: Path, manifest: dict) -> None:\n    ET.register_namespace("", SITEMAP)\n    ET.register_namespace("xhtml", XHTML)\n    root = ET.Element(f"{{{SITEMAP}}}urlset")\n    url = ET.SubElement(root, f"{{{SITEMAP}}}url")\n    ET.SubElement(url, f"{{{SITEMAP}}}loc").text = manifest["canonicalHost"] + manifest["routes"][0]["canonicalPath"]\n    ET.SubElement(url, f"{{{XHTML}}}link", {"rel":"alternate","hreflang":"en","href":manifest["canonicalHost"] + "/en/"})\n    ET.ElementTree(root).write(output / "sitemap.xml", encoding="utf-8", xml_declaration=True)\n\nwith tempfile.TemporaryDirectory() as tmp:\n    site = Path(tmp)\n    (site / "sitemap.xml").write_text("<urlset><url>", encoding="utf-8")\n    (site / "alo186-release.json").write_text(json.dumps({\n        "canonicalHost":"https://alo186.com",\n        "routes":[{"canonicalPath":"/active/","source":"alo186/active/index.html","type":"tool"}]\n    }), encoding="utf-8")\n    module.write_effective_sitemap = fake_writer\n    result = module.reconcile_sitemap_with_release(site)\n    assert result["recoveredMalformedSitemap"] is True\n    tree = ET.parse(site / "sitemap.xml")\n    assert len(tree.getroot().findall(f".//{{{XHTML}}}link")) == 1\n    locs = [node.text for node in tree.getroot().findall(f".//{{{SITEMAP}}}loc")]\n    assert locs == ["https://alo186.com/active/"]\nprint("Shortlist sitemap recovery hreflang: PASS")\n''', encoding='utf-8')
          PY
          python -m py_compile alo186/deployment/inject_shortlist_growth.py alo186/tests/test_shortlist_sitemap_recovery_hreflang.py
          python alo186/tests/test_shortlist_sitemap_recovery_hreflang.py
          rm .github/workflows/alo186-pr697-hreflang-autofix.yml
          git config user.name 'alo186-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add alo186/deployment/inject_shortlist_growth.py alo186/tests/test_shortlist_sitemap_recovery_hreflang.py .github/workflows/alo186-pr697-hreflang-autofix.yml
          git commit -m 'fix(alo186): preserve hreflang during sitemap recovery'
          git push origin HEAD:fix/alo186-sitemap-recovery-hreflang-v214
