name: ALO186 USB-C güç ve görüntü büyümesi run20

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/usb-c-guc-ve-goruntu-karar-merkezi/**'
      - 'alo186/deployment/inject_growth_run20.py'
      - 'alo186/deployment/inject_shortlist_growth.py'
      - 'alo186/deployment/routing-overlays/growth-trust-revenue-run20.json'
      - 'alo186/tests/test_growth_run20*.py'
      - '.github/workflows/alo186-growth-run20.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-growth-run20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kaynak güven ve routing sözleşmeleri
        run: python alo186/tests/test_growth_run20.py

      - name: Sözdizimi ve mevcut regresyonlar
        run: |
          python -m py_compile alo186/deployment/inject_growth_run20.py alo186/deployment/inject_shortlist_growth.py
          node alo186/tests/test_affiliate_knowledge_graph.js
          node alo186/tests/test_product_matcher.js
          node alo186/tests/test_trust_revenue_conversion.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical paket
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/run20-canonical --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/run20-canonical

      - name: Custom-domain kabulü
        run: |
          cp -a /tmp/run20-canonical /tmp/run20-custom
          python alo186/deployment/prepare_github_pages.py --site /tmp/run20-custom --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/run20-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/run20-custom --base-path ''
          python alo186/deployment/smoke_github_pages.py --site /tmp/run20-custom --base-path ''
          python alo186/tests/test_growth_run20_artifact.py --site /tmp/run20-custom --base-path ''

      - name: Project-path kabulü
        run: |
          cp -a /tmp/run20-canonical /tmp/run20-project
          python alo186/deployment/prepare_github_pages.py --site /tmp/run20-project --base-path '/chatgpt' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/run20-project --base-path '/chatgpt'
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/run20-project --base-path '/chatgpt'
          python alo186/deployment/smoke_github_pages.py --site /tmp/run20-project --base-path '/chatgpt'
          python alo186/tests/test_growth_run20_artifact.py --site /tmp/run20-project --base-path '/chatgpt'

      - uses: actions/upload-artifact@v4
        with:
          name: alo186-usbc-power-display-decision-center
          path: /tmp/run20-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
