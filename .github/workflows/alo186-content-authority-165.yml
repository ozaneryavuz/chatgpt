name: ALO186 içerik otoritesi 165 kaynak rehber kalite kontrolü

on:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-ark-hatasi-afdd-rcd-sigorta-farki/**'
      - 'alo186/haberler/ups-aku-string-blok-dengesizligi-ic-direnc/**'
      - 'alo186/haberler/ges-string-sigortasi-gpv-ne-zaman-gerekir/**'
      - 'alo186/deployment/routing-overlays/content-authority-165-run42.json'
      - 'alo186/deployment/content-consolidations.json'
      - 'alo186/deployment/apply_content_consolidation.py'
      - 'alo186/tests/test_authority_content_run42.py'
      - '.github/workflows/alo186-content-authority-165.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-ark-hatasi-afdd-rcd-sigorta-farki/**'
      - 'alo186/haberler/ups-aku-string-blok-dengesizligi-ic-direnc/**'
      - 'alo186/haberler/ges-string-sigortasi-gpv-ne-zaman-gerekir/**'
      - 'alo186/deployment/routing-overlays/content-authority-165-run42.json'
      - 'alo186/deployment/content-consolidations.json'
      - 'alo186/deployment/apply_content_consolidation.py'
      - 'alo186/tests/test_authority_content_run42.py'
      - '.github/workflows/alo186-content-authority-165.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-authority-165-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Yeni rehberlerin AEO SEO kaynak ve güven sözleşmeleri
        run: python alo186/tests/test_authority_content_run42.py
      - name: İçerik niyeti ve mevcut güven regresyonları
        run: |
          python alo186/tests/test_content_intent_consolidation.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py
      - name: Canonical üretim paketini oluştur
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-authority-165-canonical --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-authority-165-canonical
      - name: Custom-domain Pages artifactını doğrula
        run: |
          cp -a /tmp/alo186-authority-165-canonical /tmp/alo186-authority-165-custom
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-authority-165-custom --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/apply_content_consolidation.py --site /tmp/alo186-authority-165-custom --base-path ''
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-authority-165-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-authority-165-custom --base-path '' > /tmp/authority165.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-authority-165-custom --base-path ''
      - name: Canonical sitemap ve Teknik Arama kabulü
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/alo186-authority-165-custom')
          routes=[
            '/haberler/elektrik-ark-hatasi-afdd-rcd-sigorta-farki',
          ]
          aliases={
            '/haberler/ups-aku-string-blok-dengesizligi-ic-direnc':
              '/haberler/ups-aku-string-dengesizligi-zayif-aku-nasil-anlasilir',
            '/haberler/ges-string-sigortasi-gpv-ne-zaman-gerekir':
              '/haberler/ges-pv-string-sigortasi-ters-akim-nasil-secilir',
          }
          sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
          search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
          release=json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
          active={item['canonicalPath'] for item in search['entries']}
          assert release['routingVersion'] >= 73, release['routingVersion']
          # Üretim sayacı yalnız statik Article sayfalarını sayar; routing manifesti
          # ayrıca farklı teknik article rotaları taşıyabildiği için iki metrik eşit değildir.
          assert release['articleCount'] >= 161, release['articleCount']
          for route in routes:
              target=root/route.strip('/')/'index.html'
              assert target.is_file(), target
              assert f'https://www.alo186.com{route}' in sitemap, ('sitemap', route)
              assert route in active, ('search-index', route)
          for alias, canonical in aliases.items():
              target=root/alias.strip('/')/'index.html'
              html=target.read_text(encoding='utf-8')
              assert f'https://www.alo186.com{alias}' not in sitemap, ('sitemap-alias', alias)
              assert alias not in active, ('search-index-alias', alias)
              assert '<meta name="robots" content="noindex,follow">' in html, alias
              assert f'rel="canonical" href="https://www.alo186.com{canonical}"' in html, (alias, canonical)
          print(json.dumps({'routingVersion':release['routingVersion'],'articleCount':release['articleCount'],'routes':routes,'aliases':aliases},ensure_ascii=False))
          PY
      - name: Doğrulanmış içerik artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-authority-165-pages
          path: /tmp/alo186-authority-165-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
