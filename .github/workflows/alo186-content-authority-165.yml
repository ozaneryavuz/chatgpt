name: ALO186 içerik otoritesi ve kanonik niyet kalite kontrolü

on:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-ark-hatasi-afdd-rcd-sigorta-farki/**'
      - 'alo186/haberler/ups-aku-string-blok-dengesizligi-ic-direnc/**'
      - 'alo186/haberler/ges-string-sigortasi-gpv-ne-zaman-gerekir/**'
      - 'alo186/deployment/routing-overlays/content-authority-165-run42.json'
      - 'alo186/deployment/apache-production.htaccess'
      - 'alo186/tests/test_authority_content_run42.py'
      - '.github/workflows/alo186-content-authority-165.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-ark-hatasi-afdd-rcd-sigorta-farki/**'
      - 'alo186/haberler/ups-aku-string-blok-dengesizligi-ic-direnc/**'
      - 'alo186/haberler/ges-string-sigortasi-gpv-ne-zaman-gerekir/**'
      - 'alo186/deployment/routing-overlays/content-authority-165-run42.json'
      - 'alo186/deployment/apache-production.htaccess'
      - 'alo186/tests/test_authority_content_run42.py'
      - '.github/workflows/alo186-content-authority-165.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-authority-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: İçerik otoritesi ve kanonik birleştirme sözleşmeleri
        run: python alo186/tests/test_authority_content_run42.py
      - name: İçerik niyeti ve mevcut güven regresyonları
        run: |
          python alo186/tests/test_content_intent_consolidation.py
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py
      - name: Canonical üretim paketini oluştur
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-authority-canonical --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-authority-canonical
      - name: Custom-domain Pages artifactını doğrula
        run: |
          cp -a /tmp/alo186-authority-canonical /tmp/alo186-authority-custom
          python alo186/deployment/prepare_github_pages.py --site /tmp/alo186-authority-custom --base-path '' --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py --site /tmp/alo186-authority-custom --base-path ''
          python alo186/deployment/inject_shortlist_growth.py --site /tmp/alo186-authority-custom --base-path '' > /tmp/authority-canonical.json
          python alo186/deployment/smoke_github_pages.py --site /tmp/alo186-authority-custom --base-path ''
      - name: Sitemap, Teknik Arama ve 301 konsolidasyon kabulü
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-authority-custom')
          canonical = '/haberler/elektrik-ark-hatasi-afdd-rcd-sigorta-farki'
          consolidations = {
            '/haberler/ups-aku-string-blok-dengesizligi-ic-direnc': '/haberler/ups-aku-string-dengesizligi-zayif-aku-nasil-anlasilir',
            '/haberler/ges-string-sigortasi-gpv-ne-zaman-gerekir': '/haberler/ges-pv-string-sigortasi-ters-akim-nasil-secilir',
          }
          sitemap = (root/'sitemap.xml').read_text(encoding='utf-8')
          search = json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
          release = json.loads((root/'alo186-release.json').read_text(encoding='utf-8'))
          htaccess = (root/'.htaccess').read_text(encoding='utf-8')
          active = {item['canonicalPath'] for item in search['entries']}
          assert release['routingVersion'] >= 74, release['routingVersion']
          assert release['articleCount'] >= 163, release['articleCount']
          assert f'https://www.alo186.com{canonical}' in sitemap
          assert canonical in active
          for alias, target in consolidations.items():
              assert f'https://www.alo186.com{alias}' not in sitemap, ('duplicate sitemap', alias)
              assert alias not in active, ('duplicate search-index', alias)
              assert target in active, ('canonical search-index missing', target)
              rule = f'RewriteRule ^{alias.lstrip("/")}/?$ {target} [R=301,L,NE]'
              assert rule in htaccess, ('redirect missing', alias, target)
          print(json.dumps({'routingVersion': release['routingVersion'], 'articleCount': release['articleCount'], 'consolidations': consolidations}, ensure_ascii=False))
          PY
      - name: Doğrulanmış içerik artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-authority-canonical-pages
          path: /tmp/alo186-authority-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
