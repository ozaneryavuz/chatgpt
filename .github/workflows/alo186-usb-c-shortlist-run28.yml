name: ALO186 USB-C set kısa listesi ve güvenli affiliate dönüşümü

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/usb-c-set-kisa-listesi/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-overlays/usb-c-shortlist-run28.json'
      - 'alo186/tests/test_usb_c_shortlist_run28.py'
      - '.github/workflows/alo186-usb-c-shortlist-run28.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/usb-c-set-kisa-listesi/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/deployment/routing-overlays/usb-c-shortlist-run28.json'
      - 'alo186/tests/test_usb_c_shortlist_run28.py'
      - '.github/workflows/alo186-usb-c-shortlist-run28.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-usb-c-shortlist-run28-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: USB-C karar motoru ve kaynak güven sözleşmeleri
        run: |
          node alo186/hesaplama/usb-c-set-kisa-listesi/app.test.js
          python alo186/tests/test_usb_c_shortlist_run28.py
          node --check alo186/hesaplama/usb-c-set-kisa-listesi/app.js
          python -m py_compile alo186/tests/test_usb_c_shortlist_run28.py

      - name: Affiliate Knowledge Graph ve ürün regresyonları
        run: |
          node alo186/tests/test_affiliate_knowledge_graph.js
          node alo186/tests/test_product_matcher.js
          node alo186/urun-eslestirme/catalog-knowledge-extension.test.js
          python alo186/tests/test_affiliate_product_knowledge_graph.py

      - name: Canonical üretim paketi
        run: |
          python alo186/deployment/build_static_site.py --output /tmp/alo186-usbc-canonical --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-usbc-canonical

      - name: Custom-domain ve project-path kabulü
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'custom|' 'project|/chatgpt'; do
            name="${spec%%|*}"
            base="${spec#*|}"
            target="/tmp/alo186-usbc-${name}"
            cp -a /tmp/alo186-usbc-canonical "$target"
            python alo186/deployment/prepare_github_pages.py --site "$target" --base-path "$base" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
            python alo186/deployment/inject_outcome_runtime.py --site "$target" --base-path "$base"
            python alo186/deployment/inject_shortlist_growth.py --site "$target" --base-path "$base"
            python alo186/deployment/smoke_github_pages.py --site "$target" --base-path "$base"
            python - "$target" "$base" <<'PY'
          import json
          import sys
          from pathlib import Path
          root=Path(sys.argv[1]);base=sys.argv[2]
          route='/hesaplama/usb-c-set-kisa-listesi/'
          page=root/route.strip('/')/'index.html'
          app=page.with_name('app.js')
          styles=page.with_name('styles.css')
          assert page.is_file() and app.is_file() and styles.is_file()
          html=page.read_text(encoding='utf-8')
          assert 'USB-C Şarj Seti ve Teknik Kısa Liste' in html
          assert 'Amazon satış ortaklığı bağlantılarıdır' in html
          assert 'priceCurrency' not in html and 'aggregateRating' not in html and 'availability' not in html
          sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
          assert '<loc>https://alo186.com/hesaplama/usb-c-set-kisa-listesi/</loc>' in sitemap or '<loc>https://www.alo186.com/hesaplama/usb-c-set-kisa-listesi/</loc>' in sitemap
          search=json.loads((root/'arama/search-index.json').read_text(encoding='utf-8'))
          entry=next(item for item in search.get('entries',[]) if item.get('canonicalPath')==route)
          expected=(base+route) if base else route
          assert entry['url']==expected
          hub=(root/'hesaplama/index.html').read_text(encoding='utf-8')
          assert '35 çekirdek araç' in hub
          assert 'usb-c-set-kisa-listesi' in hub
          PY
          done

      - uses: actions/upload-artifact@v4
        with:
          name: alo186-usb-c-shortlist-production
          path: /tmp/alo186-usbc-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
