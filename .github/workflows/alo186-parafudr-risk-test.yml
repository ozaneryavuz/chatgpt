name: ALO186 Parafudr Risk Test

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/parafudr-risk-testi/**'
      - 'alo186/hesaplama/index.html'
      - 'alo186/index.html'
      - '.github/workflows/alo186-parafudr-risk-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run decision model tests
        run: node alo186/hesaplama/parafudr-risk-testi/test.js

      - name: Validate static page contract
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          page = Path('alo186/hesaplama/parafudr-risk-testi/index.html')
          html = page.read_text(encoding='utf-8')
          HTMLParser().feed(html)

          ids = re.findall(r'\bid="([^"]+)"', html)
          assert len(ids) == len(set(ids)), 'Duplicate HTML id found'
          required = {
              'riskForm', 'results', 'riskScore', 'riskLevel', 'riskBar',
              'layers', 'reasons', 'checks', 'warnings', 'productCategories',
              'resetBtn'
          }
          assert required.issubset(ids), f'Missing ids: {required.difference(ids)}'
          assert 'aria-live="polite"' in html
          assert 'Kişisel veri yok' in html
          assert 'Satış ortaklığı açıklaması' in html
          assert 'yetkili elektrikçi' in html
          assert '@type":"WebApplication"' in html
          assert '@type":"DefinedTermSet"' in html
          assert 'rel="noopener"' in html
          assert 'rel="nofollow sponsored"' not in html, 'No unverified direct affiliate links allowed'

          for script in re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S):
              json.loads(script)

          hub = Path('alo186/hesaplama/index.html').read_text(encoding='utf-8')
          portal = Path('alo186/index.html').read_text(encoding='utf-8')
          assert './parafudr-risk-testi/' in hub
          assert './hesaplama/parafudr-risk-testi/' in portal
          print('Static page, JSON-LD, accessibility and integration checks passed.')

      - name: Check local assets exist
        shell: bash
        run: |
          test -s alo186/hesaplama/parafudr-risk-testi/index.html
          test -s alo186/hesaplama/parafudr-risk-testi/styles.css
          test -s alo186/hesaplama/parafudr-risk-testi/app.js
          test -s alo186/hesaplama/styles.css
          test -s alo186/hesaplama/common.js
