name: ALO186 otomatik sulama kesinti güveni v291

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-otomatik-sulama-programi-silinir-mi/**'
      - 'alo186/hesaplama/otomatik-sulama-elektrik-kesintisi-plani/**'
      - 'alo186/amazon-elektrik-urunleri/pilli-sulama-zamanlayici-nem-sensoru-secimi/**'
      - 'alo186/deployment/affiliate-category-decisions/irrigation-outage-v291.json'
      - 'alo186/deployment/routing-overlays/growth-v291-irrigation-outage-trust.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v291_irrigation_outage_trust.py'
      - '.github/workflows/alo186-growth-v291-irrigation-outage-trust.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-otomatik-sulama-programi-silinir-mi/**'
      - 'alo186/hesaplama/otomatik-sulama-elektrik-kesintisi-plani/**'
      - 'alo186/amazon-elektrik-urunleri/pilli-sulama-zamanlayici-nem-sensoru-secimi/**'
      - 'alo186/deployment/affiliate-category-decisions/irrigation-outage-v291.json'
      - 'alo186/deployment/routing-overlays/growth-v291-irrigation-outage-trust.json'
      - 'alo186/deployment/affiliate_route_risk_policy_v265.json'
      - 'alo186/tests/test_growth_v291_irrigation_outage_trust.py'
      - '.github/workflows/alo186-growth-v291-irrigation-outage-trust.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v291-irrigation-outage-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Sulama kesinti güveni ve affiliate yönetişimi
        run: |
          set -euo pipefail
          python -m py_compile \
            alo186/tests/test_growth_v291_irrigation_outage_trust.py \
            alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v291_irrigation_outage_trust.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/affiliate-category-decisions/irrigation-outage-v291.json >/dev/null
          python -m json.tool alo186/deployment/routing-overlays/growth-v291-irrigation-outage-trust.json >/dev/null
          python -m json.tool alo186/deployment/affiliate_route_risk_policy_v265.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v291
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-v291 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-v291
          test -f /tmp/alo186-v291/haberler/elektrik-kesilince-otomatik-sulama-programi-silinir-mi/index.html
          test -f /tmp/alo186-v291/hesaplama/otomatik-sulama-elektrik-kesintisi-plani/index.html
          test -f /tmp/alo186-v291/amazon-elektrik-urunleri/pilli-sulama-zamanlayici-nem-sensoru-secimi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v291
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py \
            --output /tmp/alo186-sites-v291 \
            --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-sites-v291')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-otomatik-sulama-programi-silinir-mi/',
              '/hesaplama/otomatik-sulama-elektrik-kesintisi-plani/',
              '/amazon-elektrik-urunleri/pilli-sulama-zamanlayici-nem-sensoru-secimi/',
          }
          assert expected.issubset(pages), expected - set(pages)
          assert pages['/haberler/elektrik-kesilince-otomatik-sulama-programi-silinir-mi/']['affiliate']['hasAffiliateLinks'] is False
          assert pages['/hesaplama/otomatik-sulama-elektrik-kesintisi-plani/']['affiliate']['hasAffiliateLinks'] is False
          commerce = pages['/amazon-elektrik-urunleri/pilli-sulama-zamanlayici-nem-sensoru-secimi/']
          assert commerce['affiliate']['safe'] is True
          assert commerce['affiliate']['disclosureVisible'] is True
          assert commerce['affiliate']['noBuyOutcomeVisible'] is True
          assert not commerce['affiliate']['unsafeStaticLinks']
          print(json.dumps({'ok': True, 'routes': sorted(expected)}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v291 otomatik sulama kesinti güven paketi

          - “Elektrik kesilince otomatik sulama programı silinir mi?” niyeti: kaynak doğrulamalı canonical rehber
          - Program + saat + vana + pompa ayrımı: kişisel verisiz ücretsiz planlayıcı
          - Pilli tek musluk zamanlayıcısı, uyumlu nem sensörü ve üreticiye uygun pil: güven kapılı
          - Sabit kontrolör, solenoid vana, pompa, hidrofor, kuyu ve merkezi peyzaj: professional-only
          - Mevcut sistem gerçek görev testinde yeterliyse: satın almama sonucu
          - Amazon Türkiye bağlantıları: açıklama ve teknik kapı arkasında, başlangıçta statik href yok
          - 30/90/180 günlük bakım, görev testi ve mevsim döngüsü: doğrulandı
          - Fiyat, stok, puan, yorum, garanti, Offer ve AggregateRating: yok
          - Canonical build, static smoke ve ChatGPT Sites import kabulü: başarılı
          EOF
