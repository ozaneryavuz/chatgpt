name: ALO186 küçük işletme POS yazar kasa kesinti sürekliliği v289
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-pos-cihazi-yazar-kasa-calisir-mi/**'
      - 'alo186/hesaplama/kucuk-isletme-elektrik-kesintisi-satis-surekliligi-plani/**'
      - 'alo186/sektor-rehberi/market-kafe-magaza-pos-yazar-kasa-kesinti-surekliligi/**'
      - 'alo186/deployment/routing-overlays/growth-v289-small-business-pos-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/small-business-pos-outage-v289.json'
      - 'alo186/tests/test_growth_v289_small_business_pos_outage.py'
      - '.github/workflows/alo186-growth-v289-small-business-pos-outage.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-pos-cihazi-yazar-kasa-calisir-mi/**'
      - 'alo186/hesaplama/kucuk-isletme-elektrik-kesintisi-satis-surekliligi-plani/**'
      - 'alo186/sektor-rehberi/market-kafe-magaza-pos-yazar-kasa-kesinti-surekliligi/**'
      - 'alo186/deployment/routing-overlays/growth-v289-small-business-pos-outage.json'
      - 'alo186/deployment/affiliate-category-decisions/small-business-pos-outage-v289.json'
      - 'alo186/tests/test_growth_v289_small_business_pos_outage.py'
      - '.github/workflows/alo186-growth-v289-small-business-pos-outage.yml'
permissions:
  contents: read
concurrency:
  group: alo186-growth-v289-small-business-pos-outage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: POS yazar kasa arama niyeti gizlilik ve ticari sınır
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v289_small_business_pos_outage.py alo186/tests/test_affiliate_route_risk_policy_v265.py
          python alo186/tests/test_growth_v289_small_business_pos_outage.py
          python alo186/tests/test_affiliate_route_risk_policy_v265.py
          python -m json.tool alo186/deployment/routing-overlays/growth-v289-small-business-pos-outage.json >/dev/null
          python -m json.tool alo186/deployment/affiliate-category-decisions/small-business-pos-outage-v289.json >/dev/null
      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v289
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v289 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v289
          test -f /tmp/alo186-v289/haberler/elektrik-kesilince-pos-cihazi-yazar-kasa-calisir-mi/index.html
          test -f /tmp/alo186-v289/hesaplama/kucuk-isletme-elektrik-kesintisi-satis-surekliligi-plani/index.html
          test -f /tmp/alo186-v289/sektor-rehberi/market-kafe-magaza-pos-yazar-kasa-kesinti-surekliligi/index.html
      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v289
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v289 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/alo186-sites-v289')
          manifest=json.loads((root/'sites-import.json').read_text(encoding='utf-8'))
          pages={item['canonicalPath']:item for item in manifest['pages']}
          expected={'/haberler/elektrik-kesilince-pos-cihazi-yazar-kasa-calisir-mi/','/hesaplama/kucuk-isletme-elektrik-kesintisi-satis-surekliligi-plani/','/sektor-rehberi/market-kafe-magaza-pos-yazar-kasa-kesinti-surekliligi/'}
          assert expected.issubset(pages),expected-set(pages)
          for path in expected:
              assert pages[path]['affiliate']['hasAffiliateLinks'] is False
              assert not pages[path]['affiliate']['unsafeStaticLinks']
          print(json.dumps({'ok':True,'routes':sorted(expected),'affiliateLinks':0,'unsafeStaticLinks':0},ensure_ascii=False))
          PY
      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v289 küçük işletme satış sürekliliği
          - Arama niyeti: elektrik kesilince POS ve yeni nesil yazar kasa çalışır mı
          - Ücretsiz araç: terminal, YN ÖKC, ağ, yarım kalan işlem, alternatif süreç ve kayıtlı test
          - Mevcut sistem yeterliyse: yeni ürün almayın
          - YN ÖKC, sabit POS, mali yazıcı ve çoklu terminal: professional-led
          - Yeni Amazon veya başka mağaza bağlantısı: yok
          - Fiyat, stok, puan, yorum, teslimat, garanti, Offer ve AggregateRating: yok
          - 30/90/365 günlük tekrar ziyaret: yerel takvim dosyası
          EOF
