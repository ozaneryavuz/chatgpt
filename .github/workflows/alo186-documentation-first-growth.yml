name: ALO186 belge öncelikli güvenli büyüme kalite kontrolü

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/common.js'
      - 'alo186/urun-eslestirme/documentation-growth-core.js'
      - 'alo186/urun-eslestirme/documentation-growth.js'
      - 'alo186/urun-eslestirme/documentation-growth.test.js'
      - 'alo186/tedarikci-isbirligi/app.js'
      - 'alo186/tests/test_documentation_first_growth.js'
      - 'alo186/deployment/**'
      - '.github/workflows/alo186-documentation-first-growth.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/hesaplama/common.js'
      - 'alo186/urun-eslestirme/documentation-growth-core.js'
      - 'alo186/urun-eslestirme/documentation-growth.js'
      - 'alo186/tedarikci-isbirligi/app.js'
      - 'alo186/tests/test_documentation_first_growth.js'
      - 'alo186/deployment/**'
      - '.github/workflows/alo186-documentation-first-growth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-documentation-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Belge kapsamı, soru paketi ve tekrar kontrol senaryoları
        run: node alo186/urun-eslestirme/documentation-growth.test.js

      - name: Site ve B2B entegrasyon sözleşmeleri
        run: node alo186/tests/test_documentation_first_growth.js

      - name: JavaScript sözdizimi
        run: |
          node --check alo186/hesaplama/common.js
          node --check alo186/urun-eslestirme/documentation-growth-core.js
          node --check alo186/urun-eslestirme/documentation-growth.js
          node --check alo186/tedarikci-isbirligi/app.js

      - name: Ürün, güven ve tekrar ziyaret regresyonları
        run: |
          node alo186/tests/test_product_matcher.js
          node alo186/tests/test_intent_evidence_growth.js
          node alo186/tests/test_solution_outcome_loop.js
          node alo186/tests/test_unified_plan_growth.js

      - name: Canonical ve cihaz hasarı güvenlik kapıları
        run: |
          node alo186/tests/test_release_manifest.js
          node alo186/tests/test_portal_hardening.js
          python alo186/tests/device_damage_deadline_guard.py

      - name: Canonical production bundle
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-documentation-canonical \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-documentation-canonical

      - name: GitHub Pages custom-domain artifactı
        run: |
          cp -a /tmp/alo186-documentation-canonical /tmp/alo186-documentation-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-documentation-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-documentation-custom \
            --base-path ''
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-documentation-custom \
            --base-path ''

      - name: GitHub Pages project-path artifactı
        run: |
          cp -a /tmp/alo186-documentation-canonical /tmp/alo186-documentation-project
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-documentation-project \
            --base-path '/chatgpt' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/inject_outcome_runtime.py \
            --site /tmp/alo186-documentation-project \
            --base-path '/chatgpt'
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-documentation-project \
            --base-path '/chatgpt'

      - name: Production artifact güven, gelir ve gizlilik sözleşmeleri
        shell: bash
        run: |
          set -euo pipefail
          for root in /tmp/alo186-documentation-custom /tmp/alo186-documentation-project; do
            test -f "$root/akilli-urun-secimi/documentation-growth-core.js"
            test -f "$root/akilli-urun-secimi/documentation-growth.js"
            grep -q 'documentation-growth-core.js' "$root/hesaplama/common.js"
            grep -q 'documentation-growth.js' "$root/hesaplama/common.js"
            grep -q 'Teknik belge kapsamı ve satıcı soru paketi' "$root/akilli-urun-secimi/documentation-growth.js"
            grep -q 'documentation_gap' "$root/tedarikci-ve-uretici-isbirligi/app.js"
            grep -q '14 günlük yeniden kontrol oluştur' "$root/akilli-urun-secimi/documentation-growth.js"
            grep -q 'Teknik veri hazırlık skorunu aç' "$root/akilli-urun-secimi/documentation-growth.js"
            ! grep -Eqi 'type="(email|tel|text)"|<textarea' "$root/akilli-urun-secimi/documentation-growth.js"
            ! grep -Eqi 'amazon\.(com|com\.tr)/dp/' "$root/akilli-urun-secimi/documentation-growth.js"
          done

      - name: Doğrulanmış belge öncelikli büyüme artifactı
        uses: actions/upload-artifact@v4
        with:
          name: alo186-documentation-first-growth-pages
          path: /tmp/alo186-documentation-custom
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
