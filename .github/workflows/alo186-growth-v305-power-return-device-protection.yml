name: ALO186 elektrik geri dönüş cihaz koruma v305

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-gidip-gelince-cihazlar-bozulur-mu/**'
      - 'alo186/hesaplama/elektrik-gidip-gelince-cihaz-koruma-plani/**'
      - 'alo186/amazon-elektrik-urunleri/kesinti-sonrasi-elektronik-koruma-secimi/**'
      - 'alo186/deployment/affiliate-category-decisions/power-return-device-protection-v305.json'
      - 'alo186/deployment/routing-overlays/growth-v305-power-return-device-protection.json'
      - 'alo186/tests/test_growth_v305_power_return_device_protection.py'
      - '.github/workflows/alo186-growth-v305-power-return-device-protection.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-gidip-gelince-cihazlar-bozulur-mu/**'
      - 'alo186/hesaplama/elektrik-gidip-gelince-cihaz-koruma-plani/**'
      - 'alo186/amazon-elektrik-urunleri/kesinti-sonrasi-elektronik-koruma-secimi/**'
      - 'alo186/deployment/affiliate-category-decisions/power-return-device-protection-v305.json'
      - 'alo186/deployment/routing-overlays/growth-v305-power-return-device-protection.json'
      - 'alo186/tests/test_growth_v305_power_return_device_protection.py'
      - '.github/workflows/alo186-growth-v305-power-return-device-protection.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v305-power-return-device-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Elektrik geri dönüş güven ve affiliate sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v305_power_return_device_protection.py
          python alo186/tests/test_growth_v305_power_return_device_protection.py
          python -m json.tool alo186/deployment/affiliate-category-decisions/power-return-device-protection-v305.json >/dev/null
          python -m json.tool alo186/deployment/routing-overlays/growth-v305-power-return-device-protection.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v305
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v305 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v305
          test -f /tmp/alo186-v305/haberler/elektrik-gidip-gelince-cihazlar-bozulur-mu/index.html
          test -f /tmp/alo186-v305/hesaplama/elektrik-gidip-gelince-cihaz-koruma-plani/index.html
          test -f /tmp/alo186-v305/amazon-elektrik-urunleri/kesinti-sonrasi-elektronik-koruma-secimi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v305
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v305 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-sites-v305')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-gidip-gelince-cihazlar-bozulur-mu/',
              '/hesaplama/elektrik-gidip-gelince-cihaz-koruma-plani/',
              '/amazon-elektrik-urunleri/kesinti-sonrasi-elektronik-koruma-secimi/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for route in expected:
              assert not pages[route]['affiliate']['unsafeStaticLinks'], route
          assert pages['/haberler/elektrik-gidip-gelince-cihazlar-bozulur-mu/']['affiliate']['hasAffiliateLinks'] is False
          assert pages['/hesaplama/elektrik-gidip-gelince-cihaz-koruma-plani/']['affiliate']['hasAffiliateLinks'] is False
          print(json.dumps({'ok': True, 'routes': sorted(expected), 'unsafeStaticLinks': 0}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v305 elektrik geri dönüş ve cihaz koruma

          - Evrensel 5/10 dakika bekleme garantisi yok; üretici yeniden başlatma talimatı öncelikli
          - Transient, sürekli yüksek-düşük gerilim, nötr ve normal geri dönüş ayrı katmanlar
          - Aktif kesinti, tehlike, tekrarlı gidip gelme ve bütün ev sorunu: ticaret kapalı
          - EPDK on iş günlük cihaz hasarı başvuru bilgisi, tazmin garantisi olmadan görünür
          - Yalnız düşük güçlü kişisel elektronik için iki kilitli Amazon Türkiye kategori bağlantısı
          - Affiliate açıklaması bağlantılardan önce
          - Mevcut koruma yeterliyse: yeni ürün almayın
          - Fiyat, stok, satıcı, puan, yorum, teslimat ve garanti iddiası yok
          - 30/90/365 günlük kontrol ve profesyonel inceleme döngüsü
          EOF
