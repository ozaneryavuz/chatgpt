name: ALO186 elektrik proje içerikleri run 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/62-villa-22-kw-ac-2x180-kw-dc-arac-sarj-proje-tasarimi/**'
      - 'alo186/haberler/elektrik-odasi-safti-rezervasyon-koordinasyon-kontrol-listesi/**'
      - 'alo186/haberler/kisa-devre-secicilik-kablo-koruma-koordinasyon-raporu/**'
      - 'alo186/deployment/routing-overlays/electrical-project-content-run1-v256.json'
      - 'alo186/tests/test_electrical_project_content_run1.py'
      - '.github/workflows/alo186-electrical-project-content-run1.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/62-villa-22-kw-ac-2x180-kw-dc-arac-sarj-proje-tasarimi/**'
      - 'alo186/haberler/elektrik-odasi-safti-rezervasyon-koordinasyon-kontrol-listesi/**'
      - 'alo186/haberler/kisa-devre-secicilik-kablo-koruma-koordinasyon-raporu/**'
      - 'alo186/deployment/routing-overlays/electrical-project-content-run1-v256.json'
      - 'alo186/tests/test_electrical_project_content_run1.py'
      - '.github/workflows/alo186-electrical-project-content-run1.yml'

permissions:
  contents: read

concurrency:
  group: alo186-electrical-project-content-run1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: İçerik, schema, mobil ve çakışma kontrolleri
        run: |
          set -euo pipefail
          python alo186/tests/test_electrical_project_content_run1.py

      - name: Canonical site paketini oluştur
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-electrical-project-run1
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-electrical-project-run1 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-electrical-project-run1

      - name: Sitemap, canonical ve artifact kabulü
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/alo186-electrical-project-run1')
          routes = [
              '/haberler/62-villa-22-kw-ac-2x180-kw-dc-arac-sarj-proje-tasarimi',
              '/haberler/elektrik-odasi-safti-rezervasyon-koordinasyon-kontrol-listesi',
              '/haberler/kisa-devre-secicilik-kablo-koruma-koordinasyon-raporu',
          ]
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          release = json.loads((root / 'alo186-release.json').read_text(encoding='utf-8'))
          assert release['routingVersion'] >= 256, release['routingVersion']
          for route in routes:
              file = root / route.strip('/') / 'index.html'
              assert file.is_file(), file
              html = file.read_text(encoding='utf-8')
              assert f'rel="canonical" href="https://alo186.com{route}"' in html
              assert f'https://alo186.com{route}' in sitemap
              assert 'Article' in html and 'FAQPage' in html and 'BreadcrumbList' in html
              assert 'amazon.com.tr' not in html and 'amzn.to' not in html
          print(json.dumps({
              'ok': True,
              'routingVersion': release['routingVersion'],
              'routes': routes,
              'sitemap': True,
              'canonical': True,
              'affiliateBlocked': True,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Doğrulanmış içerik artifactı
        uses: actions/upload-artifact@v7
        with:
          name: alo186-electrical-project-content-run1-${{ github.sha }}
          path: /tmp/alo186-electrical-project-run1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
