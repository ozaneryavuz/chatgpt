name: ALO186 fridge food safety growth v146

on:
  pull_request:
    paths:
      - 'alo186/hesaplama/buzdolabi-dondurucu-kesinti-gida-guvenligi/**'
      - 'alo186/hesaplama/buzdolabi-dondurucu-termometre-alarm-uygunluk/**'
      - 'alo186/sektor-rehberi/elektrik-kesintisi-buzdolabi-gida-guvenligi-merkezi/**'
      - 'alo186/deployment/routing-overlays/146-fridge-food-safety-growth.json'
      - 'alo186/audits/fridge-food-safety-growth-v146-2026-07-31.md'
      - 'alo186/tests/test_fridge_food_safety_growth_v146.py'
      - '.github/workflows/alo186-fridge-food-safety-v146.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-fridge-food-safety-v146-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-and-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate food-safety decisions, affiliate gates and published routes
        run: python alo186/tests/test_fridge_food_safety_growth_v146.py
