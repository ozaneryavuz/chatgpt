name: ALO186 — gerekli canlı rotaları doğrula

on:
  push:
    branches: [main]
    paths:
      - 'alo186/deployment/live-verification-trigger.json'
      - '.github/workflows/alo186-live-required-routes.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: alo186-live-required-routes
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 21 &&
       github.event.comment.body == '/ops verify-live' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '21'
      LIVE_ORIGIN: https://alo186.com
    steps:
      - name: Güncel ana dalı al
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Trigger sözleşmesindeki bütün rotaları paralel ölç
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf /tmp/alo186-live-required-routes
          mkdir -p /tmp/alo186-live-required-routes
          python - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          from html import unescape
          from pathlib import Path
          from urllib.parse import urljoin

          origin = 'https://alo186.com'
          trigger = json.loads(Path('alo186/deployment/live-release-trigger.json').read_text(encoding='utf-8'))
          routes = trigger.get('requiredLiveRoutes', [])
          if not isinstance(routes, list) or not routes:
              raise SystemExit('requiredLiveRoutes boş veya geçersiz')

          canonical_re = re.compile(r'<link\b[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)', re.I)
          title_re = re.compile(r'<title>(.*?)</title>', re.I | re.S)

          def request(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'ALO186-Live-Required-Routes/2.0 (+https://alo186.com)',
                      'Accept': 'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
                      'Cache-Control': 'no-cache',
                  },
              )
              with urllib.request.urlopen(req, timeout=12) as response:
                  raw = response.read(2_000_000)
                  return response.status, response.geturl(), raw.decode('utf-8', errors='replace')

          def check(route: str):
              path = '/' + str(route).lstrip('/')
              expected = origin + (path if path != '/' else '')
              item = {
                  'route': path,
                  'expectedUrl': expected,
                  'httpStatus': None,
                  'finalUrl': None,
                  'canonical': None,
                  'canonicalMatched': False,
                  'title': None,
                  'ok': False,
                  'error': None,
              }
              try:
                  status, final_url, body = request(expected)
                  item['httpStatus'] = status
                  item['finalUrl'] = final_url
                  title_match = title_re.search(body)
                  if title_match:
                      item['title'] = unescape(re.sub(r'\s+', ' ', title_match.group(1))).strip()
                  canonical_match = canonical_re.search(body)
                  if canonical_match:
                      canonical = urljoin(final_url, unescape(canonical_match.group(1)).strip())
                      item['canonical'] = canonical
                      item['canonicalMatched'] = canonical.rstrip('/') == expected.rstrip('/')
                  item['ok'] = status == 200 and bool(item['title']) and item['canonicalMatched']
              except urllib.error.HTTPError as exc:
                  item['httpStatus'] = exc.code
                  item['finalUrl'] = exc.geturl()
                  item['error'] = f'HTTP {exc.code}'
              except Exception as exc:
                  item['error'] = f'{type(exc).__name__}: {exc}'
              return item

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as executor:
              results = list(executor.map(check, routes))
          results.sort(key=lambda item: item['route'])
          for item in results:
              print(f"{item['route']}: {'PASS' if item['ok'] else 'FAIL'}")

          release_item = {
              'url': origin + '/alo186-release.json',
              'httpStatus': None,
              'commit': None,
              'expectedMainThrough': trigger.get('includesMainThrough'),
              'exactMatch': False,
              'error': None,
          }
          try:
              status, final_url, body = request(release_item['url'])
              release_item['httpStatus'] = status
              payload = json.loads(body)
              release_item['commit'] = payload.get('commit') or payload.get('sourceCommit') or payload.get('gitCommit')
              release_item['exactMatch'] = release_item['commit'] == trigger.get('includesMainThrough')
          except Exception as exc:
              release_item['error'] = f'{type(exc).__name__}: {exc}'

          failed = [item for item in results if not item['ok']]
          receipt = {
              'schemaVersion': 2,
              'checkedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'origin': origin,
              'release': trigger.get('release'),
              'triggerCommit': trigger.get('includesMainThrough'),
              'routeCount': len(results),
              'passedCount': len(results) - len(failed),
              'failedCount': len(failed),
              'ok': not failed,
              'releaseReceipt': release_item,
              'routes': results,
          }
          root = Path('/tmp/alo186-live-required-routes')
          (root / 'receipt.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          lines = [
              '<!-- alo186-live-required-routes -->',
              '## ALO186 canlı toplu rota doğrulaması',
              '',
              f"- Release: `{receipt['release']}`",
              f"- Beklenen ana dal: `{receipt['triggerCommit']}`",
              f"- Canlı rota: **{receipt['passedCount']}/{receipt['routeCount']}**",
              f"- Sonuç: **{'BAŞARILI' if receipt['ok'] else 'BAŞARISIZ'}**",
              f"- Release makbuzu HTTP: **{release_item['httpStatus'] or 'yok'}**",
              f"- Canlı release commit: `{release_item['commit'] or 'okunamadı'}`",
              '',
          ]
          if failed:
              lines.extend(['### Geçmeyen rotalar', ''])
              for item in failed[:50]:
                  detail = item['error'] or f"HTTP={item['httpStatus']} canonical={item['canonical'] or 'yok'}"
                  lines.append(f"- `{item['route']}` — {detail}")
              if len(failed) > 50:
                  lines.append(f"- … ve {len(failed) - 50} rota daha")
          else:
              lines.append('Bütün zorunlu rotalar HTTP 200, title ve self-canonical kontrolünü geçti.')
          (root / 'comment.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          raise SystemExit(0 if receipt['ok'] else 1)
          PY
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Canlı makbuzu artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alo186-live-required-routes-${{ github.run_id }}
          path: /tmp/alo186-live-required-routes/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

      - name: Issue 21 durum kaydını güncelle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat /tmp/alo186-live-required-routes/comment.md)
          marker='<!-- alo186-live-required-routes -->'
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh issue comment "$ISSUE_NUMBER" --body "$body" >/dev/null
          fi

      - name: Başarısız canlı kabulü job sonucuna yansıt
        if: steps.verify.outputs.exit_code != '0'
        run: exit 1
