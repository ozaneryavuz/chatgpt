name: ALO186 hidrofor su sürekliliği v304

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-hidrofor-calisir-mi/**'
      - 'alo186/hesaplama/hidrofor-elektrik-kesintisi-su-surekliligi-plani/**'
      - 'alo186/sektor-rehberi/apartman-otel-hidrofor-su-surekliligi/**'
      - 'alo186/deployment/affiliate-category-decisions/hydrofor-water-continuity-v304.json'
      - 'alo186/deployment/routing-overlays/growth-v304-hydrofor-water-continuity.json'
      - 'alo186/tests/test_growth_v304_hydrofor_water_continuity.py'
      - '.github/workflows/alo186-growth-v304-hydrofor-water-continuity.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-hidrofor-calisir-mi/**'
      - 'alo186/hesaplama/hidrofor-elektrik-kesintisi-su-surekliligi-plani/**'
      - 'alo186/sektor-rehberi/apartman-otel-hidrofor-su-surekliligi/**'
      - 'alo186/deployment/affiliate-category-decisions/hydrofor-water-continuity-v304.json'
      - 'alo186/deployment/routing-overlays/growth-v304-hydrofor-water-continuity.json'
      - 'alo186/tests/test_growth_v304_hydrofor_water_continuity.py'
      - '.github/workflows/alo186-growth-v304-hydrofor-water-continuity.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v304-hydrofor-water-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Hidrofor kesinti güven ve dönüşüm sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v304_hydrofor_water_continuity.py
          python alo186/tests/test_growth_v304_hydrofor_water_continuity.py
          python -m json.tool alo186/deployment/affiliate-category-decisions/hydrofor-water-continuity-v304.json >/dev/null
          python -m json.tool alo186/deployment/routing-overlays/growth-v304-hydrofor-water-continuity.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v304
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v304 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v304
          test -f /tmp/alo186-v304/haberler/elektrik-kesilince-hidrofor-calisir-mi/index.html
          test -f /tmp/alo186-v304/hesaplama/hidrofor-elektrik-kesintisi-su-surekliligi-plani/index.html
          test -f /tmp/alo186-v304/sektor-rehberi/apartman-otel-hidrofor-su-surekliligi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v304
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v304 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-sites-v304')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-hidrofor-calisir-mi/',
              '/hesaplama/hidrofor-elektrik-kesintisi-su-surekliligi-plani/',
              '/sektor-rehberi/apartman-otel-hidrofor-su-surekliligi/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for route in expected:
              page = pages[route]
              assert page['affiliate']['hasAffiliateLinks'] is False
              assert not page['affiliate']['unsafeStaticLinks']
          print(json.dumps({'ok': True, 'routes': sorted(expected), 'merchantLinks': 0}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v304 hidrofor ve su sürekliliği

          - Şebeke suyu, depo, pompa, basınç tankı, kuru çalışma ve enerji dönüşü ayrı katmanlar
          - Su-elektrik, yangın ve kritik hizmet tehlikesinde test ve ticaret kapalı
          - Kuru çalışma korumasını resetleme veya köprüleme talimatı yok
          - Mevcut sistem görev testini geçiyorsa: yeni ürün almayın
          - Pompa, pano, sürücü, tank, jeneratör, ATS ve yangın suyu: professional-only
          - Yeni Amazon veya başka mağaza bağlantısı: 0
          - Fiyat, stok, puan, yorum, teslimat ve garanti: 0
          - 30/90/365 günlük alarm, görev testi ve yıllık inceleme döngüsü
          EOF
