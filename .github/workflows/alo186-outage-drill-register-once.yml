name: ALO186 kesinti tatbikatı tek seferlik entegrasyon

on:
  push:
    branches: [feature/alo186-elektrik-kesintisi-tatbikati-20260728]
    paths:
      - 'alo186/deployment/outage-drill-register.trigger'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alo186-elektrik-kesintisi-tatbikati-20260728
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Routing, sitemap ve hesaplama merkezini güncelle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          route_source = 'alo186/hesaplama/elektrik-kesintisi-tatbikati/index.html'
          route_path = '/hesaplama/elektrik-kesintisi-tatbikati/'

          manifest_path = Path('alo186/deployment/routing-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if not any(item.get('canonicalPath') == route_path for item in manifest['routes']):
              entry = {'source': route_source, 'canonicalPath': route_path, 'type': 'business-tool'}
              passport_index = next(
                  index for index, item in enumerate(manifest['routes'])
                  if item.get('canonicalPath') == '/hesaplama/elektrik-surekliligi-pasaportu/'
              )
              manifest['routes'].insert(passport_index + 1, entry)
              manifest['version'] = int(manifest.get('version', 0)) + 1
              manifest['generatedAt'] = '2026-07-28'
              manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sitemap_path = Path('alo186/sitemap.xml')
          sitemap = sitemap_path.read_text(encoding='utf-8')
          url_line = '  <url><loc>https://www.alo186.com/hesaplama/elektrik-kesintisi-tatbikati/</loc><lastmod>2026-07-28</lastmod><changefreq>monthly</changefreq><priority>0.9</priority></url>'
          if url_line not in sitemap:
              passport_line = '  <url><loc>https://www.alo186.com/hesaplama/elektrik-surekliligi-pasaportu/</loc><lastmod>2026-07-28</lastmod><changefreq>monthly</changefreq><priority>0.9</priority></url>'
              if passport_line not in sitemap:
                  raise SystemExit('Pasaport sitemap satırı bulunamadı.')
              sitemap = sitemap.replace(passport_line, passport_line + '\n' + url_line, 1)
              sitemap_path.write_text(sitemap, encoding='utf-8')

          hub_path = Path('alo186/hesaplama/index.html')
          hub = hub_path.read_text(encoding='utf-8')
          hub = hub.replace(
              'Elektrik sürekliliği pasaportu ve olgunluk skoru,',
              'Elektrik sürekliliği pasaportu, kesinti tatbikatı ve olgunluk skoru,',
              1,
          )
          hub = hub.replace(
              'Elektrik sürekliliği pasaportu ve olgunluğundan yedek güç',
              'Elektrik sürekliliği pasaportu, 5/15/60 dakika kesinti tatbikatı ve olgunluğundan yedek güç',
              1,
          )
          hub = hub.replace('23 çekirdek araç', '24 çekirdek araç', 1)
          passport_card = '<a class="tool-card" href="./elektrik-surekliligi-pasaportu/"><span class="eyebrow">Kanıt dosyası · P0/P1/P2 · JSON/PDF</span><h2>Elektrik Sürekliliği Pasaportu</h2><p>Kritik yük, yedek kaynak ve 10 teknik kanıt alanını tek makine-okunur dosyada toplayın; eksikleri önceliklendirin ve panel aktarımına hazırlayın.</p><b>Kanıt pasaportunu oluştur →</b></a>'
          drill_card = '<a class="tool-card" href="./elektrik-kesintisi-tatbikati/"><span class="eyebrow">İlk 5/15/60 dakika · tatbikat · SaaS handoff</span><h2>Elektrik Kesintisi Tatbikatı</h2><p>Şebeke, jeneratör, UPS, gerilim veya kritik yük kaybı senaryosunda ilk saat görevlerini skorlayın; P0/P1/P2 planı ve panel aktarımı oluşturun.</p><b>Tatbikatı başlat →</b></a>'
          if drill_card not in hub:
              if passport_card not in hub:
                  raise SystemExit('Pasaport kartı bulunamadı.')
              hub = hub.replace(passport_card, passport_card + '\n' + drill_card, 1)
          hub_path.write_text(hub, encoding='utf-8')
          PY
      - name: Regresyon ve yayın kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          node alo186/tests/test_outage_drill.js
          node alo186/tests/test_release_manifest.js
          python alo186/deployment/build_static_site.py --output /tmp/alo186-drill-site --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-drill-site
          test -f /tmp/alo186-drill-site/hesaplama/elektrik-kesintisi-tatbikati/index.html
          test -f /tmp/alo186-drill-site/hesaplama/elektrik-kesintisi-tatbikati/drill.schema.json
      - name: Entegrasyonu kaydet ve yardımcı workflow'u kaldır
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alo186/deployment/routing-manifest.json alo186/sitemap.xml alo186/hesaplama/index.html
          git rm .github/workflows/alo186-outage-drill-register-once.yml alo186/deployment/outage-drill-register.trigger
          git commit -m 'feat(alo186): kesinti tatbikatını hesaplama merkezi ve yayın hattına bağla'
          git push origin HEAD:feature/alo186-elektrik-kesintisi-tatbikati-20260728
