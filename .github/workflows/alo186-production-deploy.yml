name: ALO186 üretim yayın paketi ve opsiyonel deploy

on:
  push:
    branches: [main]
    paths:
      - "alo186/**"
      - ".github/workflows/alo186-production-deploy.yml"
  pull_request:
    paths:
      - "alo186/**"
      - ".github/workflows/alo186-production-deploy.yml"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Repository değişkeni kapalı olsa da onaylı production environment üzerinden deploy et"
        required: false
        type: boolean
        default: false
      deploy_reason:
        description: "Deploy gerekçesi / değişiklik kaydı"
        required: false
        type: string
        default: "manual production verification"

permissions:
  contents: read
  issues: write

concurrency:
  group: alo186-production-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Canonical production bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Test bağımlılıkları
        run: python -m pip install -q pytest
      - name: ALO186 statik ürün testleri
        shell: bash
        run: |
          set -euo pipefail
          node alo186/tests/test_calc_core.js
          node alo186/tests/test_turkiye_search.js
          node alo186/tests/test_decision_rules.js
          node alo186/tests/test_product_matcher.js
          node alo186/tests/test_continuity_store.js
          node alo186/tests/test_release_manifest.js
          python alo186/tests/device_damage_deadline_guard.py
          python alo186/tests/test_active_production_contract.py
          python -m pytest -q alo186/tests/test_live_release_verifier.py
          python -m py_compile \
            alo186/deployment/build_static_site.py \
            alo186/deployment/smoke_static_site.py \
            alo186/deployment/smoke_live_routes.py \
            alo186/deployment/verify_live_release.py
      - name: Üretim bundle oluştur
        run: |
          python alo186/deployment/build_static_site.py \
            --output _production_site \
            --commit "${GITHUB_SHA}"
      - name: Bundle smoke testi
        run: python alo186/deployment/smoke_static_site.py --bundle _production_site
      - name: Arşiv ve checksum
        shell: bash
        run: |
          set -euo pipefail
          tar -C _production_site -czf alo186-production-site.tar.gz .
          sha256sum alo186-production-site.tar.gz > alo186-production-site.tar.gz.sha256
      - name: Üretim paketini sakla
        uses: actions/upload-artifact@v4
        with:
          name: alo186-production-site
          path: |
            _production_site
            alo186-production-site.tar.gz
            alo186-production-site.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Onaylı production deploy
    if: >-
      github.event_name != 'pull_request' &&
      (
        vars.ALO186_PRODUCTION_DEPLOY_ENABLED == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy alo186]'))
      ) &&
      (
        vars.ALO186_DEPLOY_METHOD == 'ssh' ||
        vars.ALO186_DEPLOY_METHOD == 'ftps'
      )
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: alo186-production
      url: https://www.alo186.com/elektrik-portali
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: alo186-production-site
          path: release
      - name: Deploy kapsamını kaydet
        shell: bash
        run: |
          {
            echo "### ALO186 production deploy"
            echo "- Event: ${{ github.event_name }}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Reason: ${{ inputs.deploy_reason || 'main push / tagged hotfix' }}"
            echo "- Method: ${{ vars.ALO186_DEPLOY_METHOD }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy yapılandırması ön kontrolü
        env:
          DEPLOY_METHOD: ${{ vars.ALO186_DEPLOY_METHOD }}
          DEPLOY_HOST: ${{ secrets.ALO186_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ALO186_DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.ALO186_DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.ALO186_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALO186_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PASSWORD: ${{ secrets.ALO186_DEPLOY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ "$DEPLOY_METHOD" == "ssh" ]]; then
            [[ -n "${SSH_KEY:-}" ]] || missing+=("ALO186_DEPLOY_SSH_KEY")
            [[ -n "${KNOWN_HOSTS:-}" ]] || missing+=("ALO186_DEPLOY_KNOWN_HOSTS")
          elif [[ "$DEPLOY_METHOD" == "ftps" ]]; then
            [[ -n "${DEPLOY_PASSWORD:-}" ]] || missing+=("ALO186_DEPLOY_PASSWORD")
          fi
          if ((${#missing[@]})); then
            printf '::error title=ALO186 deploy configuration missing::Eksik alanlar: %s\n' "${missing[*]}"
            {
              echo "### Deploy durduruldu"
              echo "Eksik secret/variable adları: \`${missing[*]}\`"
              echo "Secret değerleri loglanmadı. GitHub Environment \`alo186-production\` içinde tamamlayın."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: SSH / rsync ile yayınla
        if: vars.ALO186_DEPLOY_METHOD == 'ssh'
        env:
          DEPLOY_HOST: ${{ secrets.ALO186_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ALO186_DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.ALO186_DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.ALO186_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALO186_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          rsync -rlvz --checksum --protect-args \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            release/_production_site/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH%/}/"
      - name: FTPS ile yayınla
        if: vars.ALO186_DEPLOY_METHOD == 'ftps'
        env:
          DEPLOY_HOST: ${{ secrets.ALO186_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ALO186_DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.ALO186_DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ vars.ALO186_DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$DEPLOY_USER,$DEPLOY_PASSWORD" "ftps://$DEPLOY_HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --overwrite --parallel=2 --verbose release/_production_site/ ${DEPLOY_PATH%/}/
          bye
          LFTP
      - name: CDN yayılımını bekle, canlı smoke ve release drift testi
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4 5 6; do
            echo "Canlı doğrulama denemesi: $attempt"
            smoke_ok=0
            drift_ok=0
            if python alo186/deployment/smoke_live_routes.py \
              --base-url https://www.alo186.com > live-smoke.json 2>&1; then
              smoke_ok=1
            fi
            if python alo186/deployment/verify_live_release.py \
              --base-url https://www.alo186.com \
              --bundle release/_production_site \
              --expected-commit "${GITHUB_SHA}" \
              --report live-release-drift.json > live-release-drift.stdout 2>&1; then
              drift_ok=1
            fi
            cat live-smoke.json || true
            cat live-release-drift.stdout || true
            if [[ "$smoke_ok" -eq 1 && "$drift_ok" -eq 1 ]]; then
              success=1
              break
            fi
            sleep 20
          done
          test "$success" -eq 1
      - name: Deploy hatasını P0 issue üzerinde görünür kıl
        if: failure()
        uses: actions/github-script@v7
        env:
          DEPLOY_METHOD: ${{ vars.ALO186_DEPLOY_METHOD }}
        with:
          script: |
            const marker = '<!-- alo186-production-deploy-failure -->';
            const issueNumber = 21;
            const body = `${marker}\n## Production deploy başarısız\n\n- Commit: \`${context.sha}\`\n- Yöntem: \`${process.env.DEPLOY_METHOD || 'tanımsız'}\`\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nSecret değerleri loglanmadı. GitHub Environment ve hosting erişimini kontrol edin.`;
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const existing = comments.find(item => item.body && item.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body});
            }
      - name: Canlı doğrulama raporlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-live-verification
          path: |
            live-smoke.json
            live-release-drift.json
            live-release-drift.stdout
          if-no-files-found: warn
          retention-days: 30

  deploy-config-blocked:
    name: Deploy yapılandırması eksik — yayın yapılmadı
    if: >-
      github.event_name != 'pull_request' &&
      (
        vars.ALO186_PRODUCTION_DEPLOY_ENABLED == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy alo186]'))
      ) &&
      vars.ALO186_DEPLOY_METHOD != 'ssh' &&
      vars.ALO186_DEPLOY_METHOD != 'ftps'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Yapılandırma engelini özetle
        run: |
          {
            echo "### ALO186 production deploy bloke edildi"
            echo "Canonical bundle başarıyla üretildi; canlı dosya aktarımı yapılmadı."
            echo "\`ALO186_DEPLOY_METHOD\` yalnız \`ssh\` veya \`ftps\` olmalıdır."
            echo "Gerekli hosting secret ve variable'ları GitHub Environment \`alo186-production\` içinde tanımlayın."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=ALO186 deploy blocked::ALO186_DEPLOY_METHOD ssh veya ftps olarak yapılandırılmadı; yayın yapılmadı."
      - name: P0 hosting issue yorumunu oluştur veya güncelle
        uses: actions/github-script@v7
        env:
          DEPLOY_METHOD: ${{ vars.ALO186_DEPLOY_METHOD }}
        with:
          script: |
            const marker = '<!-- alo186-production-deploy-blocked -->';
            const issueNumber = 21;
            const body = `${marker}\n## Production deploy yapılandırma nedeniyle bloke\n\n- Commit: \`${context.sha}\`\n- Tanımlı yöntem: \`${process.env.DEPLOY_METHOD || 'boş'}\`\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nBundle doğrulandı fakat canlı hosting aktarımı yapılmadı. \`ALO186_DEPLOY_METHOD=ssh|ftps\`, deploy path ve ilgili hosting secret'ları \`alo186-production\` Environment içinde tamamlanmalıdır.`;
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const existing = comments.find(item => item.body && item.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body});
            }
      - name: Manuel zorunlu deploy isteğini başarısız say
        if: github.event_name == 'workflow_dispatch' && inputs.force_deploy == true
        run: |
          echo "Manuel force_deploy istendi ancak deploy yöntemi tanımlı değil." >&2
          exit 1

  deploy-status:
    name: Deploy kapısı durumu
    if: >-
      github.event_name != 'pull_request' &&
      !(
        vars.ALO186_PRODUCTION_DEPLOY_ENABLED == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_deploy == true) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy alo186]'))
      )
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Skipped deploy'u görünür kıl
        run: |
          {
            echo "### ALO186 deploy çalıştırılmadı"
            echo "Production bundle doğrulandı ancak deploy kapısı kapalı."
            echo "Etkinleştirmek için ALO186_PRODUCTION_DEPLOY_ENABLED=true, workflow_dispatch force_deploy=true veya kontrollü [deploy alo186] commit etiketi gerekir."
          } >> "$GITHUB_STEP_SUMMARY"
