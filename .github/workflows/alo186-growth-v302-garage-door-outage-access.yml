name: ALO186 garaj kapısı kesinti erişimi v302

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'alo186/haberler/elektrik-kesilince-garaj-kapisi-nasil-acilir/**'
      - 'alo186/hesaplama/garaj-kapisi-elektrik-kesintisi-erisim-plani/**'
      - 'alo186/sektor-rehberi/apartman-otel-garaj-kapisi-kesinti-surekliligi/**'
      - 'alo186/deployment/affiliate-category-decisions/garage-door-outage-v302.json'
      - 'alo186/deployment/routing-overlays/growth-v302-garage-door-outage-access.json'
      - 'alo186/tests/test_growth_v302_garage_door_outage_access.py'
      - '.github/workflows/alo186-growth-v302-garage-door-outage-access.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/haberler/elektrik-kesilince-garaj-kapisi-nasil-acilir/**'
      - 'alo186/hesaplama/garaj-kapisi-elektrik-kesintisi-erisim-plani/**'
      - 'alo186/sektor-rehberi/apartman-otel-garaj-kapisi-kesinti-surekliligi/**'
      - 'alo186/deployment/affiliate-category-decisions/garage-door-outage-v302.json'
      - 'alo186/deployment/routing-overlays/growth-v302-garage-door-outage-access.json'
      - 'alo186/tests/test_growth_v302_garage_door_outage_access.py'
      - '.github/workflows/alo186-growth-v302-garage-door-outage-access.yml'

permissions:
  contents: read

concurrency:
  group: alo186-growth-v302-garage-door-outage-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Garaj kapısı kesinti güven ve dönüşüm sözleşmesi
        run: |
          set -euo pipefail
          python -m py_compile alo186/tests/test_growth_v302_garage_door_outage_access.py
          python alo186/tests/test_growth_v302_garage_door_outage_access.py
          python -m json.tool alo186/deployment/affiliate-category-decisions/garage-door-outage-v302.json >/dev/null
          python -m json.tool alo186/deployment/routing-overlays/growth-v302-garage-door-outage-access.json >/dev/null

      - name: Canonical production build ve static smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-v302
          python alo186/deployment/build_static_site.py --output /tmp/alo186-v302 --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py --bundle /tmp/alo186-v302
          test -f /tmp/alo186-v302/haberler/elektrik-kesilince-garaj-kapisi-nasil-acilir/index.html
          test -f /tmp/alo186-v302/hesaplama/garaj-kapisi-elektrik-kesintisi-erisim-plani/index.html
          test -f /tmp/alo186-v302/sektor-rehberi/apartman-otel-garaj-kapisi-kesinti-surekliligi/index.html

      - name: ChatGPT Sites aktarım paketi kabulü
        run: |
          set -euo pipefail
          rm -rf /tmp/alo186-sites-v302
          python alo186/deployment/export_chatgpt_sites_bundle_v2.py --output /tmp/alo186-sites-v302 --commit "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/alo186-sites-v302')
          manifest = json.loads((root / 'sites-import.json').read_text(encoding='utf-8'))
          pages = {item['canonicalPath']: item for item in manifest['pages']}
          expected = {
              '/haberler/elektrik-kesilince-garaj-kapisi-nasil-acilir/',
              '/hesaplama/garaj-kapisi-elektrik-kesintisi-erisim-plani/',
              '/sektor-rehberi/apartman-otel-garaj-kapisi-kesinti-surekliligi/',
          }
          assert expected.issubset(pages), expected - set(pages)
          for route in expected:
              page = pages[route]
              assert page['affiliate']['hasAffiliateLinks'] is False
              assert not page['affiliate']['unsafeStaticLinks']
          print(json.dumps({'ok': True, 'routes': sorted(expected), 'merchantLinks': 0}, ensure_ascii=False))
          PY

      - name: Özet
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 v302 garaj kapısı kesinti erişimi

          - Kapı türü, mekanik denge, manuel ayırma, batarya ve alternatif çıkış ayrı katmanlar
          - Aktif sıkışma, yangın, mekanik veya elektrik tehlikesinde test ve ticaret kapalı
          - Kırık yay/kablo/ray şüphesinde manuel ayırma talimatı yok
          - Mevcut plan görev testini geçiyorsa: yeni ürün almayın
          - Sabit motor, batarya, yay, kablo, sensör ve erişim kontrolü: professional-only
          - Yeni Amazon veya başka mağaza bağlantısı: 0
          - Fiyat, stok, puan, yorum, teslimat ve garanti: 0
          - 30/90/180 günlük anahtar, prova ve mekanik inceleme döngüsü
          EOF
