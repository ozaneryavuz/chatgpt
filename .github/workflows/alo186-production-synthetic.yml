name: ALO186 production synthetic monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: alo186-production-synthetic
  cancel-in-progress: true

jobs:
  synthetic:
    if: github.event_name == 'workflow_dispatch' || vars.ALO186_SYNTHETIC_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DNS aracı
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils
      - name: Web, API, DNS, TLS ve e-posta DNS kontrolleri
        id: probe
        continue-on-error: true
        env:
          WEB_BASE: ${{ vars.ALO186_SYNTHETIC_WEB_BASE || 'https://www.alo186.com' }}
          API_BASE: ${{ vars.ALO186_SYNTHETIC_API_BASE || 'https://api.alo186.com' }}
        run: |
          python alo186/infra/observability/synthetic_check.py \
            --web-base "$WEB_BASE" \
            --api-base "$API_BASE" \
            --check-email-dns \
            --output synthetic-report.json
      - name: GitHub main ile canlı release/checksum drift kontrolü
        id: drift
        continue-on-error: true
        env:
          WEB_BASE: ${{ vars.ALO186_SYNTHETIC_WEB_BASE || 'https://www.alo186.com' }}
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-production-expected \
            --commit "${GITHUB_SHA}"
          python alo186/deployment/verify_live_release.py \
            --base-url "$WEB_BASE" \
            --bundle /tmp/alo186-production-expected \
            --expected-commit "${GITHUB_SHA}" \
            --report release-drift-report.json
      - name: Raporları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-production-synthetic-${{ github.run_id }}
          path: |
            synthetic-report.json
            release-drift-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Monitoring sonucunu job özetine yaz
        if: always()
        shell: bash
        run: |
          {
            echo "### ALO186 production synthetic"
            echo "- Event: ${{ github.event_name }}"
            echo "- Web/API/TLS: ${{ steps.probe.outcome }}"
            echo "- Release/checksum drift: ${{ steps.drift.outcome }}"
            if [[ "${{ steps.probe.outcome }}" == "failure" || "${{ steps.drift.outcome }}" == "failure" ]]; then
              echo "- Durum: incident issue üzerinden izleniyor; scheduled koşu e-posta gürültüsü üretmez."
            else
              echo "- Durum: sağlıklı"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Başarısızlık issue oluştur veya yalnız durum değişince güncelle
        if: steps.probe.outcome == 'failure' || steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const title = '[ALERT] ALO186 production synthetic check failed';
            const marker = '<!-- alo186-production-synthetic-incident -->';

            function readJson(path, fallback) {
              if (!fs.existsSync(path)) return fallback;
              try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
              catch (error) { return {...fallback, parseError: String(error)}; }
            }

            const synthetic = readJson('synthetic-report.json', {ok: false, error: 'synthetic-report.json oluşturulamadı'});
            const drift = readJson('release-drift-report.json', {ok: false, error: 'release-drift-report.json oluşturulamadı'});
            const failedChecks = (synthetic.checks || [])
              .filter(item => item.ok === false)
              .map(item => ({
                kind: item.kind || null,
                path: item.path || null,
                hostname: item.hostname || null,
                status: item.status || null,
                error: item.error || null,
                daysRemaining: item.daysRemaining ?? null,
                knowledgeGraphScore: item.knowledgeGraphScore ?? null
              }));
            const failedTls = (synthetic.tls || [])
              .filter(item => item.ok === false)
              .map(item => ({hostname: item.hostname || null, error: item.error || null, daysRemaining: item.daysRemaining ?? null}));
            const driftFailures = Array.isArray(drift.failures) ? drift.failures : (drift.error ? [drift.error] : []);
            const incident = {
              syntheticOk: synthetic.ok === true,
              failureCount: synthetic.failureCount ?? failedChecks.length + failedTls.length,
              failedChecks,
              failedTls,
              driftOk: drift.ok === true,
              driftFailures
            };
            const signature = crypto.createHash('sha256').update(JSON.stringify(incident)).digest('hex').slice(0, 20);
            const signatureMarker = `<!-- signature:${signature} -->`;
            const body = `${marker}\n${signatureMarker}\n# ALO186 production incident\n\nAynı hata imzası tekrarlandığında issue/comment gürültüsü üretilmez; bu kayıt yalnız durum değişince güncellenir.\n\n- Son farklı durum runı: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- Commit: \`${context.sha}\`\n- Web/API/TLS sonucu: \`${incident.syntheticOk ? 'ok' : 'failed'}\`\n- Release/checksum sonucu: \`${incident.driftOk ? 'ok' : 'failed'}\`\n- İmza: \`${signature}\`\n\n## Stabil hata özeti\n\n\`\`\`json\n${JSON.stringify(incident, null, 2).slice(0, 14000)}\n\`\`\`\n\nCanlı hosting aktarımı ve canonical release eşleşmesi için #21; cihaz hasarı süresi için #74 izlenir.`;

            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (!existing) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            } else if (!(existing.body || '').includes(signatureMarker)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              core.info(`Aynı incident imzası sürüyor (${signature}); GitHub bildirimi üretilmedi.`);
            }
      - name: İyileşince açık alert issue kapat
        if: steps.probe.outcome == 'success' && steps.drift.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[ALERT] ALO186 production synthetic check failed';
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Servis ve GitHub release eşleşmesi yeniden sağlıklı. Recovery run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
      - name: Manuel doğrulamada hatayı workflow sonucuna yansıt
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (steps.probe.outcome == 'failure' || steps.drift.outcome == 'failure')
        run: |
          echo "Manuel production doğrulaması başarısız; artifact ve incident issue'yu inceleyin." >&2
          exit 1
