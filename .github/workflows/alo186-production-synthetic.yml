name: ALO186 production sentetik izleme

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      check_email_dns:
        description: SPF ve DMARC kontrollerini de çalıştır
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ALO186_PRODUCTION_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production probe
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          args=(--base-url https://api.alo186.com --minimum-tls-days 21 --json-out artifacts/production-probe.json)
          if [[ "${{ github.event_name == 'schedule' || inputs.check_email_dns }}" == "true" ]]; then
            args+=(--check-email-dns)
          fi
          python alo186/infrastructure/monitoring/production_probe.py "${args[@]}" | tee artifacts/production-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alo186-production-probe-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
      - name: Başarısızlık issue oluştur veya güncelle
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[ALERT] ALO186 production synthetic check failed';
            const report = fs.readFileSync('artifacts/production-probe.json', 'utf8');
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            const body = `Sentetik kontrol başarısız.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`json\n${report.slice(0, 12000)}\n\`\`\``;
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }
      - name: İyileşince açık alert issue kapat
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[ALERT] ALO186 production synthetic check failed';
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Servis tekrar sağlıklı. Recovery run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed'});
            }
      - name: Probe sonucunu job sonucuna yansıt
        if: steps.probe.outcome == 'failure'
        run: exit 1
