name: ALO186 production synthetic monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  synthetic:
    if: github.event_name == 'workflow_dispatch' || vars.ALO186_SYNTHETIC_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DNS aracı
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils
      - name: Web, API, DNS, TLS ve e-posta DNS kontrolleri
        id: probe
        continue-on-error: true
        env:
          WEB_BASE: ${{ vars.ALO186_SYNTHETIC_WEB_BASE || 'https://www.alo186.com' }}
          API_BASE: ${{ vars.ALO186_SYNTHETIC_API_BASE || 'https://api.alo186.com' }}
        run: |
          python alo186/infra/observability/synthetic_check.py \
            --web-base "$WEB_BASE" \
            --api-base "$API_BASE" \
            --check-email-dns \
            --output synthetic-report.json
      - name: GitHub main ile canlı release/checksum drift kontrolü
        id: drift
        continue-on-error: true
        env:
          WEB_BASE: ${{ vars.ALO186_SYNTHETIC_WEB_BASE || 'https://www.alo186.com' }}
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-production-expected \
            --commit "${GITHUB_SHA}"
          python alo186/deployment/verify_live_release.py \
            --base-url "$WEB_BASE" \
            --bundle /tmp/alo186-production-expected \
            --expected-commit "${GITHUB_SHA}" \
            --report release-drift-report.json
      - name: Raporları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alo186-production-synthetic-${{ github.run_id }}
          path: |
            synthetic-report.json
            release-drift-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Başarısızlık issue oluştur veya güncelle
        if: steps.probe.outcome == 'failure' || steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[ALERT] ALO186 production synthetic check failed';
            const synthetic = fs.existsSync('synthetic-report.json')
              ? fs.readFileSync('synthetic-report.json', 'utf8')
              : '{"error":"synthetic-report.json oluşturulamadı"}';
            const drift = fs.existsSync('release-drift-report.json')
              ? fs.readFileSync('release-drift-report.json', 'utf8')
              : '{"error":"release-drift-report.json oluşturulamadı"}';
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            const body = `Production kontrol başarısız.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n## Web/API/TLS\n\`\`\`json\n${synthetic.slice(0, 9000)}\n\`\`\`\n\n## GitHub release drift\n\`\`\`json\n${drift.slice(0, 9000)}\n\`\`\``;
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }
      - name: İyileşince açık alert issue kapat
        if: steps.probe.outcome == 'success' && steps.drift.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[ALERT] ALO186 production synthetic check failed';
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Servis ve GitHub release eşleşmesi yeniden sağlıklı. Recovery run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
      - name: Kontrol sonucunu workflow sonucuna yansıt
        if: steps.probe.outcome == 'failure' || steps.drift.outcome == 'failure'
        run: exit 1
