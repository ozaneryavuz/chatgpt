name: ALO186 electrical project design content v165
# Updated against the current publication routing base.

on:
  pull_request:
    paths:
      - 'alo186/sektor-rehberi/62-villa-22-kw-ac-2x180-kw-dc-sarj-altyapisi-projesi/**'
      - 'alo186/sektor-rehberi/otel-elektrik-odalari-saftlar-pano-yerlesim-projesi/**'
      - 'alo186/sektor-rehberi/otel-trafo-jenerator-ups-kritik-yuk-tek-hat-projesi/**'
      - 'alo186/deployment/routing-overlays/165-electrical-project-design-content.json'
      - 'alo186/audits/electrical-project-design-content-v165-2026-08-01.md'
      - 'alo186/tests/test_electrical_project_design_content_v165.py'
      - '.github/workflows/alo186-electrical-project-design-v165.yml'
  push:
    branches: [main]
    paths:
      - 'alo186/sektor-rehberi/62-villa-22-kw-ac-2x180-kw-dc-sarj-altyapisi-projesi/**'
      - 'alo186/sektor-rehberi/otel-elektrik-odalari-saftlar-pano-yerlesim-projesi/**'
      - 'alo186/sektor-rehberi/otel-trafo-jenerator-ups-kritik-yuk-tek-hat-projesi/**'
      - 'alo186/deployment/routing-overlays/165-electrical-project-design-content.json'
      - 'alo186/tests/test_electrical_project_design_content_v165.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alo186-electrical-project-design-v165-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: İçerik, canonical, schema ve sitemap sözleşmesi
        run: python alo186/tests/test_electrical_project_design_content_v165.py

      - name: Canonical üretim paketini oluştur
        run: |
          python alo186/deployment/build_static_site.py \
            --output /tmp/alo186-project-v165 \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_static_site.py \
            --bundle /tmp/alo186-project-v165

      - name: Üç proje rehberinin yayın kabulü
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            'sektor-rehberi/62-villa-22-kw-ac-2x180-kw-dc-sarj-altyapisi-projesi'
            'sektor-rehberi/otel-elektrik-odalari-saftlar-pano-yerlesim-projesi'
            'sektor-rehberi/otel-trafo-jenerator-ups-kritik-yuk-tek-hat-projesi'
          )
          for route in "${routes[@]}"; do
            page="/tmp/alo186-project-v165/$route/index.html"
            test -f "$page"
            grep -Fq '"@type":"Article"' "$page"
            grep -Fq '"@type":"FAQPage"' "$page"
            grep -Fq '"@type":"BreadcrumbList"' "$page"
            grep -Fq 'Bağımsızlık ve sorumluluk sınırı' "$page"
            ! grep -Fqi 'amazon.com' "$page"
            ! grep -Fq '"@type":"Product"' "$page"
            ! grep -Fq '"@type":"Offer"' "$page"
          done
          grep -Fq 'https://www.alo186.com/sektor-rehberi/62-villa-22-kw-ac-2x180-kw-dc-sarj-altyapisi-projesi/' /tmp/alo186-project-v165/sitemap.xml
          grep -Fq 'https://www.alo186.com/sektor-rehberi/otel-elektrik-odalari-saftlar-pano-yerlesim-projesi/' /tmp/alo186-project-v165/sitemap.xml
          grep -Fq 'https://www.alo186.com/sektor-rehberi/otel-trafo-jenerator-ups-kritik-yuk-tek-hat-projesi/' /tmp/alo186-project-v165/sitemap.xml

      - name: GitHub Pages paketlerini doğrula
        run: |
          cp -a /tmp/alo186-project-v165 /tmp/alo186-project-v165-custom
          python alo186/deployment/prepare_github_pages.py \
            --site /tmp/alo186-project-v165-custom \
            --base-path '' \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
          python alo186/deployment/smoke_github_pages.py \
            --site /tmp/alo186-project-v165-custom \
            --base-path ''

      - name: Kalite özeti
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ALO186 elektrik proje tasarım içerikleri v165

          - 62 villa 22 kW AC + 2×180 kW DC şarj altyapısı proje rehberi
          - Otel elektrik odaları, şaftlar ve pano yerleşim proje rehberi
          - Otel trafo, jeneratör ve UPS kritik yük tek hat proje rehberi
          - Canonical, Article, FAQPage, BreadcrumbList ve sitemap kabulü
          - Mobil okunabilirlik ve karşılıklı iç bağlantı
          - Affiliate, fiyat, stok, puan, garanti ve Product/Offer şeması yok
          - ALO186 bağımsızlık ve proje onayı vermeme sınırı görünür
          EOF
