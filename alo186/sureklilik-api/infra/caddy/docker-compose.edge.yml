services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - alo186_caddy_data:/data
      - alo186_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

volumes:
  alo186_caddy_data:
  alo186_caddy_config:
