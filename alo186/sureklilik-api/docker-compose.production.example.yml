services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alo186
      POSTGRES_USER: alo186
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - alo186_pgdata:/var/lib/postgresql/data
      - alo186_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alo186 -d alo186"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  migrate:
    build: .
    restart: "no"
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: &api_environment
      ALO186_ENV: production
      ALO186_DATABASE_URL_FILE: /run/secrets/database_url
      ALO186_TOKEN_SECRET_FILE: /run/secrets/token_secret
      ALO186_ALLOWED_ORIGINS: https://www.alo186.com
      ALO186_ALLOWED_HOSTS: api.alo186.com
      ALO186_AUTO_CREATE_SCHEMA: "false"
      ALO186_MAX_REQUEST_BODY_BYTES: "1048576"
      ALO186_API_RATE_LIMIT_PER_MINUTE: "120"
      ALO186_AUTH_RATE_LIMIT_PER_MINUTE: "12"
      ALO186_METRICS_ENABLED: "true"
      ALO186_TRUST_PROXY_HEADERS: "true"
      ALO186_LOG_LEVEL: INFO
    secrets:
      - database_url
      - token_secret
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  api:
    build: .
    restart: unless-stopped
    environment: *api_environment
    secrets:
      - database_url
      - token_secret
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  alo186_pgdata:
  alo186_backups:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  database_url:
    file: ./secrets/database_url.txt
  token_secret:
    file: ./secrets/token_secret.txt
