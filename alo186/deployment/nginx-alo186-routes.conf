# HTTP server yalnız HTTPS + www canonical'a yönlenir.
server {
    listen 80;
    listen [::]:80;
    server_name alo186.com www.alo186.com;
    return 301 https://www.alo186.com$request_uri;
}

# Kök alan adının HTTPS isteği aynı path ile tek yönlendirmeyle www'ye gider.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alo186.com;
    # ssl_certificate /etc/letsencrypt/live/alo186.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/alo186.com/privkey.pem;
    return 301 https://www.alo186.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.alo186.com;
    root /var/www/alo186;
    index index.html;

    # ssl_certificate /etc/letsencrypt/live/alo186.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/alo186.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /elektrik-portali { try_files /elektrik-portali/index.html =404; }
    location = /edas-bul { try_files /edas-bul/index.html =404; }
    location = /karar-motoru { try_files /karar-motoru/index.html =404; }
    location = /hesaplama { try_files /hesaplama/index.html =404; }
    location = /akilli-urun-secimi { try_files /akilli-urun-secimi/index.html =404; }
    location = /isletme-surekliligi { try_files /isletme-surekliligi/index.html =404; }
    location = /fatura-analizi { try_files /fatura-analizi/index.html =404; }
    location = /hesaplama/yedek-guc { try_files /hesaplama/yedek-guc/index.html =404; }
    location = /hesaplama/kesinti-maliyeti { try_files /hesaplama/kesinti-maliyeti/index.html =404; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(?:svg|webp|png|jpg|jpeg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
