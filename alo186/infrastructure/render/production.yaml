# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# ALO186 Managed Core: Frankfurt API + worker + cron + managed PostgreSQL.
# Blueprint oluştururken dosya yolu olarak bu dosyayı seçin.

services:
  - type: web
    name: alo186-continuity-api
    runtime: docker
    plan: starter
    region: frankfurt
    repo: https://github.com/ozaneryavuz/chatgpt
    branch: main
    rootDir: alo186/sureklilik-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c 'export ALO186_RELEASE="${RENDER_GIT_COMMIT:-render-production}" &&
      exec uvicorn app.application:app --host 0.0.0.0 --port "${PORT:-10000}"
      --proxy-headers --forwarded-allow-ips=*'
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    domains:
      - api.alo186.com
    renderSubdomainPolicy: enabled
    envVars:
      - key: ALO186_ENV
        value: production
      - key: ALO186_DATABASE_URL
        fromDatabase:
          name: alo186-prod-db
          property: connectionString
      - key: ALO186_TOKEN_SECRET
        generateValue: true
      - key: ALO186_DATA_ENCRYPTION_KEY
        sync: false
      - key: ALO186_METRICS_TOKEN
        generateValue: true
      - key: ALO186_ALLOWED_ORIGINS
        value: https://www.alo186.com
      - key: ALO186_ALLOWED_HOSTS
        value: api.alo186.com,alo186-continuity-api.onrender.com
      - key: ALO186_PUBLIC_BASE_URL
        value: https://www.alo186.com
      - key: ALO186_AUTO_CREATE_SCHEMA
        value: "false"
      - key: ALO186_RUN_MIGRATIONS
        value: "false"
      - key: ALO186_EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: ALO186_EXPOSE_TEST_TOKENS
        value: "false"
      - key: ALO186_EMAIL_BACKEND
        value: smtp
      - key: ALO186_SMTP_HOST
        value: smtp.postmarkapp.com
      - key: ALO186_SMTP_PORT
        value: "587"
      - key: ALO186_SMTP_USERNAME
        sync: false
      - key: ALO186_SMTP_PASSWORD
        sync: false
      - key: ALO186_SMTP_FROM_EMAIL
        value: noreply@alo186.com
      - key: ALO186_SMTP_USE_TLS
        value: "true"
      - key: ALO186_TRUST_PROXY_HEADERS
        value: "true"
      - key: ALO186_GLOBAL_RATE_LIMIT
        value: "240"
      - key: ALO186_AUTH_RATE_LIMIT
        value: "10"
      - key: ALO186_RATE_LIMIT_WINDOW_SECONDS
        value: "900"
      - key: ALO186_MAX_REQUEST_BYTES
        value: "1048576"
      - key: ALO186_DELETION_GRACE_DAYS
        value: "30"
      - key: ALO186_AUDIT_RETENTION_DAYS
        value: "730"
      - key: ALO186_OUTBOX_RETENTION_DAYS
        value: "30"
      - key: ALO186_SENTRY_DSN
        sync: false
      - key: ALO186_SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"

  - type: worker
    name: alo186-email-worker
    runtime: docker
    plan: starter
    region: frankfurt
    repo: https://github.com/ozaneryavuz/chatgpt
    branch: main
    rootDir: alo186/sureklilik-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c 'export ALO186_RELEASE="${RENDER_GIT_COMMIT:-render-production}" &&
      exec python -m app.worker email-loop --interval 15 --limit 50'
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - key: ALO186_ENV
        value: production
      - key: ALO186_DATABASE_URL
        fromDatabase:
          name: alo186-prod-db
          property: connectionString
      - key: ALO186_TOKEN_SECRET
        fromService:
          type: web
          name: alo186-continuity-api
          envVarKey: ALO186_TOKEN_SECRET
      - key: ALO186_DATA_ENCRYPTION_KEY
        fromService:
          type: web
          name: alo186-continuity-api
          envVarKey: ALO186_DATA_ENCRYPTION_KEY
      - key: ALO186_ALLOWED_ORIGINS
        value: https://www.alo186.com
      - key: ALO186_ALLOWED_HOSTS
        value: api.alo186.com,localhost,127.0.0.1
      - key: ALO186_PUBLIC_BASE_URL
        value: https://www.alo186.com
      - key: ALO186_AUTO_CREATE_SCHEMA
        value: "false"
      - key: ALO186_RUN_MIGRATIONS
        value: "false"
      - key: ALO186_EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: ALO186_EMAIL_BACKEND
        value: smtp
      - key: ALO186_SMTP_HOST
        value: smtp.postmarkapp.com
      - key: ALO186_SMTP_PORT
        value: "587"
      - key: ALO186_SMTP_USERNAME
        fromService:
          type: web
          name: alo186-continuity-api
          envVarKey: ALO186_SMTP_USERNAME
      - key: ALO186_SMTP_PASSWORD
        fromService:
          type: web
          name: alo186-continuity-api
          envVarKey: ALO186_SMTP_PASSWORD
      - key: ALO186_SMTP_FROM_EMAIL
        value: noreply@alo186.com
      - key: ALO186_SMTP_USE_TLS
        value: "true"
      - key: ALO186_SENTRY_DSN
        fromService:
          type: web
          name: alo186-continuity-api
          envVarKey: ALO186_SENTRY_DSN
      - key: ALO186_SENTRY_TRACES_SAMPLE_RATE
        value: "0.01"

  - type: cron
    name: alo186-retention-cron
    runtime: docker
    plan: starter
    region: frankfurt
    repo: https://github.com/ozaneryavuz/chatgpt
    branch: main
    rootDir: alo186/sureklilik-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker retention-once
    schedule: "17 2 * * *"
    autoDeployTrigger: checksPass
    envVars:
      - key: ALO186_ENV
        value: production
      - key: ALO186_DATABASE_URL
        fromDatabase:
          name: alo186-prod-db
          property: connectionString
      - key: ALO186_TOKEN_SECRET
        fromService:
          type: web
          name: alo186-continuity-api
          envVarKey: ALO186_TOKEN_SECRET
      - key: ALO186_DATA_ENCRYPTION_KEY
        fromService:
          type: web
          name: alo186-continuity-api
          envVarKey: ALO186_DATA_ENCRYPTION_KEY
      - key: ALO186_ALLOWED_ORIGINS
        value: https://www.alo186.com
      - key: ALO186_ALLOWED_HOSTS
        value: api.alo186.com,localhost,127.0.0.1
      - key: ALO186_PUBLIC_BASE_URL
        value: https://www.alo186.com
      - key: ALO186_AUTO_CREATE_SCHEMA
        value: "false"
      - key: ALO186_RUN_MIGRATIONS
        value: "false"
      - key: ALO186_EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: ALO186_EMAIL_BACKEND
        value: smtp
      - key: ALO186_SMTP_HOST
        value: smtp.postmarkapp.com
      - key: ALO186_SMTP_FROM_EMAIL
        value: noreply@alo186.com
      - key: ALO186_DELETION_GRACE_DAYS
        value: "30"
      - key: ALO186_AUDIT_RETENTION_DAYS
        value: "730"
      - key: ALO186_OUTBOX_RETENTION_DAYS
        value: "30"
      - key: ALO186_SENTRY_DSN
        fromService:
          type: web
          name: alo186-continuity-api
          envVarKey: ALO186_SENTRY_DSN
      - key: ALO186_SENTRY_TRACES_SAMPLE_RATE
        value: "0"

  - type: cron
    name: alo186-r2-backup-cron
    runtime: docker
    plan: starter
    region: frankfurt
    repo: https://github.com/ozaneryavuz/chatgpt
    branch: main
    rootDir: alo186/sureklilik-api
    dockerfilePath: ./infra/backup/Dockerfile
    dockerContext: .
    dockerCommand: /opt/alo186/run_backup.sh
    schedule: "37 2 * * *"
    autoDeployTrigger: checksPass
    envVars:
      - key: ALO186_DATABASE_URL
        fromDatabase:
          name: alo186-prod-db
          property: connectionString
      - key: ALO186_R2_ENDPOINT
        sync: false
      - key: ALO186_R2_RESTIC_BUCKET
        sync: false
      - key: ALO186_R2_VAULT_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RESTIC_PASSWORD
        sync: false
      - key: ALO186_VAULT_ENCRYPTION_KEY
        sync: false
      - key: ALO186_BACKUP_HEARTBEAT_URL
        sync: false
      - key: ALO186_BACKUP_KEEP_DAILY
        value: "14"
      - key: ALO186_BACKUP_KEEP_WEEKLY
        value: "8"
      - key: ALO186_BACKUP_KEEP_MONTHLY
        value: "12"
      - key: ALO186_BACKUP_KEEP_YEARLY
        value: "3"

  - type: worker
    name: alo186-grafana-alloy
    runtime: docker
    plan: starter
    region: frankfurt
    repo: https://github.com/ozaneryavuz/chatgpt
    branch: main
    rootDir: alo186/sureklilik-api
    dockerfilePath: ./infra/monitoring/Dockerfile
    dockerContext: .
    dockerCommand: >-
      run /etc/alloy/config.alloy --storage.path=/tmp/alloy
    autoDeployTrigger: checksPass
    envVars:
      - key: ALO186_API_PRIVATE_HOSTPORT
        fromService:
          type: web
          name: alo186-continuity-api
          property: hostport
      - key: ALO186_METRICS_TOKEN
        fromService:
          type: web
          name: alo186-continuity-api
          envVarKey: ALO186_METRICS_TOKEN
      - key: GRAFANA_CLOUD_PROMETHEUS_URL
        sync: false
      - key: GRAFANA_CLOUD_PROMETHEUS_USER
        sync: false
      - key: GRAFANA_CLOUD_API_KEY
        sync: false


databases:
  - name: alo186-prod-db
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: alo186
    user: alo186
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    connectionPool: none
    ipAllowList: []
