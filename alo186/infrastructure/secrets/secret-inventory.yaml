version: 1
owner: ANS Enerji / ALO186
classification: production-secrets-metadata-only

secrets:
  - key: ALO186_TOKEN_SECRET
    systems: [render-api, render-workers]
    purpose: Oturum ve tek kullanımlık token imzası
    rotation_days: 180
    rotation_effect: Tüm aktif oturumlar geçersiz olur
    storage: Render secret environment variable

  - key: ALO186_DATA_ENCRYPTION_KEY
    systems: [render-api, render-workers]
    purpose: MFA ve e-posta outbox payload şifreleme
    rotation_days: null
    rotation_effect: Önce veri yeniden şifreleme migration'ı gerekir
    storage: Render secret environment variable + çevrimdışı kurtarma kasası

  - key: ALO186_METRICS_TOKEN
    systems: [render-api, grafana-alloy]
    purpose: Prometheus metrics endpoint erişimi
    rotation_days: 90
    storage: Render secret environment variable

  - key: ALO186_SMTP_USERNAME
    systems: [render-api, render-email-worker]
    purpose: Postmark SMTP kullanıcı adı / server token
    rotation_days: 90
    storage: Render secret environment variable

  - key: ALO186_SMTP_PASSWORD
    systems: [render-api, render-email-worker]
    purpose: Postmark SMTP parolası / server token
    rotation_days: 90
    storage: Render secret environment variable

  - key: ALO186_SENTRY_DSN
    systems: [render-api, render-workers]
    purpose: Sentry hata ve performans akışı
    rotation_days: 180
    storage: Render secret environment variable

  - key: GRAFANA_CLOUD_API_KEY
    systems: [grafana-alloy]
    purpose: Grafana Cloud Prometheus remote write
    rotation_days: 90
    storage: Render secret environment variable

  - key: AWS_ACCESS_KEY_ID
    systems: [render-backup-cron]
    purpose: Cloudflare R2 yalnız backup bucket erişimi
    rotation_days: 90
    storage: Render secret environment variable

  - key: AWS_SECRET_ACCESS_KEY
    systems: [render-backup-cron]
    purpose: Cloudflare R2 yalnız backup bucket erişimi
    rotation_days: 90
    storage: Render secret environment variable

  - key: RESTIC_PASSWORD
    systems: [render-backup-cron, restore-operator]
    purpose: Restic client-side yedek şifreleme
    rotation_days: 365
    rotation_effect: Eski snapshot erişimi için parola geçmişi güvenli kasada korunmalı
    storage: Render secret environment variable + çevrimdışı kurtarma kasası

  - key: CLOUDFLARE_API_TOKEN
    systems: [github-environment-alo186-production]
    purpose: Yalnız alo186.com DNS kayıtlarını yönetmek
    rotation_days: 90
    storage: GitHub Environment secret

  - key: RENDER_API_KEY
    systems: [github-environment-alo186-production]
    purpose: Kontrollü üretim deploy ve durum sorgusu
    rotation_days: 90
    storage: GitHub Environment secret

  - key: ALO186_BACKUP_HEARTBEAT_URL
    systems: [render-backup-cron]
    purpose: Yedek cron başarı/başarısızlık sinyali
    rotation_days: 180
    storage: Render secret environment variable
