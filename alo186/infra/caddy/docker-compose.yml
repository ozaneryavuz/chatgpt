services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${ALO186_API_IMAGE:-ghcr.io/example/alo186-continuity-api:latest}
    restart: unless-stopped
    env_file: ${ALO186_ENV_FILE:-.env.production.example}
    expose:
      - "8000"
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
